    function hasPast(tk) { var td = U.today(); return Object.keys(tk.done).some(function (k) { return k !== 'once' && k < td; }); }
    /* 반복 끝내기: 오늘까지만 뜨고 지난 기록은 달력에 남음 */
    function endRepeat() {
      S.commit(function (d) { T.endRepeat(d, id, U.today()); }, { undo: true });
      draw();

    }

    /* 지우기: 반복이면 '반복 끝내기(기록 남김)'와 '기록까지 지우기'를 고르게 (점검원 1호 2번) */
    function remove() {
      var tk = cur();
      if (tk.repeat && !(tk.repeat.until && (tk.repeat.ended || tk.repeat.until < U.today()))) {
        var s = App.sheet.open({ title: t('detail.deleteRepeatQ'), content: function (body) {
          body.appendChild(P.opt(t('detail.endRepeat'), t('detail.endRepeatSub'), false, function () { s.close(true); endRepeat(); }));
          body.appendChild(P.opt(t('detail.deleteAll'), t('detail.deleteAllSub'), false, function () { s.close(true); hardRemove(); }));
        } });
        return;
      }
      hardRemove();
    }
    function hardRemove() {
      S.commit(function (d) { T.remove(d, id); }, { undo: true });
      sheet.close(true);
      App.toast.show(t('detail.deleted'), { action: t('common.undo'), onAction: S.undo });
    }

    draw();
  }

  return { open: open };
})();

</script>
<script>
/* 빠른 추가 — + 한 번 → 입력 칸이 바로 열림 → 적고 엔터(창은 열린 채 다음 할 일).
   "내일 3시 병원"처럼 적으면 날짜 · 시간이 칩으로 잡히고, 칩의 ×로 바로 뺄 수 있다. 칩을 누르면 직접 고를 수도 있다. */
App.quickadd = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, S = App.store, P = App.pickers, ic = App.icons.svg;

  function open(preset) {
    preset = preset || {};
    var ignore = [], man = {}, parsed = null;
    var input = h('input.qa-input', { type: 'text', placeholder: t('qa.placeholder'), enterkeyhint: 'send', autocomplete: 'off', 'aria-label': t('qa.placeholder'), maxlength: 300 });
    var send = h('button.qa-send', { type: 'button', disabled: true }, t('qa.add'));  /* '→' 대신 글자 '추가' — 채팅 입력창처럼 안 보이게 */
    var chips = h('div.chips.qa-chips');
    var hint = h('p.qa-hint', { hidden: true });
    var tip = h('p.qa-tip', t('qa.tip'));  /* 비어 있을 때만: 날짜 · 시간은 그냥 적어도 된다는 것을 알려 줌 */
    var last = h('p.qa-last', { hidden: true });

    var sheet = App.sheet.open({ className: 'qa-sheet', title: preset.listId ? (T.list(S.data, preset.listId) || {}).name : '', focus: input, content: function (body) {
      body.appendChild(h('div.qa-row', input, send));
      body.appendChild(tip);
      body.appendChild(chips);
      body.appendChild(hint);
      body.appendChild(last);
    } });

    /* 저녁에 '밤 12시 · 새벽 2시'처럼 날짜 없이 이미 지난 새벽 시각을 적으면 내일로 — 오늘 00:00(지난 시각 · 알림 안 울림)이 되지 않게 (6호 9번).
       캘린더에서 고른 날(soft 아님)이나 글에 날짜가 있으면 건드리지 않음 */
    function nextDay() {
      if (!parsed || !parsed.time || parsed.date || parsed.due || parsed.repeat || man.time !== undefined) return false;
      if (preset.date && (!preset.soft || preset.date !== U.today())) return false;
      var n = new Date(U.now()), now = U.hm(n.getHours(), n.getMinutes());
      return parsed.time < '06:00' && parsed.time <= now;
    }

    function val(k) {
      if (man[k] !== undefined) return man[k];
      if (parsed && parsed[k] != null && parsed[k] !== 0) return parsed[k];
      /* 글에 '금요일까지'가 있으면 오늘 화면이 미리 채운 '오늘'은 쓰지 않는다 — 날짜(오늘)가 잡히면 내일부터 '지난 일'로 가 버림 (1호 8번 재확인).
         캘린더에서 사용자가 직접 고른 날(soft 아님)은 남긴다 */
      if (k === 'date' && preset.soft && parsed && parsed.due && !parsed.repeat) return null;
      if (k === 'date' && nextDay()) return U.addDays(U.today(), 1);
      return preset[k] != null ? preset[k] : (k === 'priority' ? 0 : null);
    }

    /* 칩 한 줄: 넣은 것(직접 고름 · 글에서 알아들음)이 앞, 빈 것이 뒤.
       글에서 알아들은 칩 · 미리 채운 칩(오늘 화면의 '오늘' · 캘린더의 그날)에는 ×가 붙어 한 번에 뺄 수 있다 */
    function chip(key, tokType, icon, label, value, onClick) {
      var tok = man[key] === undefined && parsed.tokens.filter(function (tk) { return tk.type === tokType; })[0];
      var pre = !tok && value && man[key] === undefined && preset[key] != null && val(key) === preset[key];
      var lead = key === 'listId' && value ? h('span.list-dot.c-' + (T.list(S.data, val('listId')) || {}).color) : h('span', { html: ic(icon, 16) });  /* 목록은 화면 어디서나 색 점 */
      var x = tok ? h('span.x', { role: 'button', 'aria-label': t('qa.ignore', { text: tok.text }), html: ic('x', 14), onclick: function (e) {
          e.stopPropagation(); ignore.push(tok.text.toLowerCase()); draw(); refocus();
        } })
        : pre ? h('span.x', { role: 'button', 'aria-label': t('detail.clear', { what: label.toLowerCase() }), html: ic('x', 14), onclick: function (e) {
          e.stopPropagation(); man[key] = null; draw(); refocus();
        } }) : null;
      var el = h('button.chip' + (tok ? '.is-parsed' : value ? '.is-on' : ''), { type: 'button', onclick: onClick }, lead, value || label, x);
      el._set = !!value;
      return el;
    }

    /* '모레' · '금요일'처럼 말로 된 날은 날짜를 덧붙여 맞게 잡혔는지 보이게 ("다음 주 월요일" → "모레 · 11월 2일") */
    function dayLabel(s) {
      var r = I.relDay(s), n = U.diffDays(U.today(), s);
      return (r === I.dateShort(s) || (n >= -1 && n <= 1)) ? r : r + ' · ' + I.dateNoWeek(s);  /* 오늘 · 내일 · 어제는 그대로 */
    }

    function draw() {
      parsed = App.parse.run(input.value, S.data.lists.filter(T.alive), ignore);
      send.disabled = !(parsed.title || input.value.trim());
      tip.hidden = !!input.value.trim();

      var date = val('date'), time = val('time'), rep = val('repeat'), list = val('listId'), prio = val('priority'), due = val('due');
      var l = list && T.list(S.data, list);
      var all = [
        chip('date', 'date', 'calendar', t('prop.date'), date ? (rep ? t('qa.from', { date: I.dateShort(date) }) : dayLabel(date)) : null, function () { P.date({ value: date, onPick: function (v) { man.date = v; if (!v) man.time = null; draw(); refocus(); } }); }),
        chip('time', 'time', 'clock', t('prop.time'), time ? I.time(time) : null, function () { P.time({ value: time, onPick: function (v) { man.time = v; draw(); refocus(); } }); }),
        chip('repeat', 'repeat', 'repeat', t('prop.repeat'), rep ? App.repeat.describe(rep, date || U.today()) : null, function () { P.repeat({ value: rep, anchor: date || U.today(), onPick: function (v) { man.repeat = v; draw(); refocus(); } }); }),
        chip('listId', 'list', 'folder', t('prop.list'), l ? l.name : null, function () { P.list({ value: list, onPick: function (v) { man.listId = v; draw(); refocus(); } }); }),
        /* 반복과 같이 적은 '까지'는 반복 끝나는 날 — 칩 이름도 그렇게 (6호 재확인 1번) */
        /* 값이 있어도 반복이면 '반복 · 11월 10일까지'로 — 그날 반복이 끝난다는 게 보이게 (6호 재확인 2차) */
        chip('due', 'due', 'target', rep ? t('prop.repeatUntil') : t('prop.due'), due ? (rep ? t('prop.repeat') + ' · ' : '') + t('due.untilShort', { date: I.relDayIn(due) }) : null, function () { P.date({ title: rep ? t('prop.repeatUntil') : t('prop.due'), value: due, onPick: function (v) { man.due = v; draw(); refocus(); } }); }),
        chip('priority', '-', 'flag', t('prop.priority'), prio ? t('prio.' + prio) : null, function () { P.priority({ value: prio, onPick: function (v) { man.priority = v; draw(); refocus(); } }); })
      ];
      App.dom.clear(chips);
      all.filter(function (c) { return c._set; }).concat(all.filter(function (c) { return !c._set; })).forEach(function (c) { chips.appendChild(c); });

      /* 새벽 확인 한 줄: 새벽에 '내일'이라 적으면 몇 일로 잡히는지 알려 준다 */
      var hr = new Date().getHours();
      if (hr < 4 && parsed.dateKind === 'rel' && (parsed.date || parsed.due)) {

      } else if (man.date === undefined && nextDay()) {

    }

    function refocus() { if (!sheet.closed) try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); } }

    function submit() {
      draw();
      var title = parsed.title || input.value.trim();
      if (!title) { refocus(); return; }
      var f = { title: title, date: val('date'), time: val('time'), repeat: val('repeat'), listId: val('listId'), priority: val('priority') || 0, due: val('due') };
      var task = S.commit(function (d) { return T.add(d, f); });

      if (task.date) bits.push(I.relDay(task.date) + (task.time ? ' ' + I.time(task.time) : ''));
      last.hidden = false; last.textContent = t('qa.added', { what: bits.join(' · ') });

    input.addEventListener('input', draw);
    /* 여러 줄을 붙여 넣으면 줄마다 할 일 하나 (메모장 목록을 한 번에 옮기기 · Todoist 사례) */
    input.addEventListener('paste', function (e) {
      var text = (e.clipboardData || window.clipboardData || { getData: function () { return ''; } }).getData('text');
      var lines = String(text || '').split(/\r?\n/).map(function (s) { return s.replace(/^\s*([-*•·]|\d+[.)])\s*/, '').trim(); }).filter(Boolean);
      if (lines.length < 2) return;
      e.preventDefault();
      var lists = S.data.lists.filter(T.alive);
      S.commit(function (d) {
        lines.forEach(function (line) {
          var p = App.parse.run(line, lists, []);
          T.add(d, { title: p.title || line, date: p.date || (preset.soft && p.due && !p.repeat ? null : preset.date) || null, time: p.time, repeat: p.repeat, listId: p.listId || preset.listId || null, due: p.due });
        });
      }, { undo: true });
      App.toast.show(t('qa.pastedN', { n: lines.length }), { action: t('common.undo'), onAction: S.undo });

    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); } });
    send.addEventListener('click', submit);
    send.addEventListener('pointerdown', function (e) { e.preventDefault(); });  /* 눌러도 입력 칸 포커스 유지 → 키보드가 내려갔다 올라오지 않음 */
    send.addEventListener('mousedown', function (e) { e.preventDefault(); });
    draw();
  }

  return { open: open };
})();

<script>

        h('span.prop-label', t('backup.export'), S.data.settings.lastExport ? h('span.prop-sub', t('backup.last', { date: I.dateNoWeek(S.data.settings.lastExport) })) : null),
        h('span.prop-chev', { html: ic('chevR', 18) })),
      h('button.prop', { type: 'button', onclick: function () {
        F.importFile().then(function (text) {

      /* 파일 불러오기 · 처음 상태로 한 뒤 7일 동안만 보이는 줄 — 5초 띠를 놓쳐도 그 전 할 일로 (6호 6번) */
      S.keeping() ? h('button.prop', { type: 'button', onclick: function () {

        h('span.prop-label', t('backup.revert'), h('span.prop-sub', t('backup.revertSub', { date: I.dateNoWeek(App.util.ymd(new Date(S.data.settings.keepBackupUntil))) }))),
        h('span.prop-chev', { html: ic('chevR', 18) })) : null
    /* 아이폰 사파리 탭에서 쓰는 중이면 '오래 안 열면 지워질 수 있음'도 — 설치 안내 띠를 닫아도 여기 남음 (5호 3번) */
    ], App.platform.info.isIOS && !App.platform.info.standalone ? t('backup.note') + ' ' + t('backup.safari') : t('backup.note'));
  }

  function trash() {
    var s = App.sheet.open({ title: t('trash.row'), content: function (body) {

        /* 지운 목록도 30일 동안 — 되살리면 안에 있던 할 일이 다시 그 목록으로 (6호 6번) */
        var goneLists = S.data.lists.filter(function (l) { return l.deletedAt; });
        if (!gone.length && !goneLists.length) { body.appendChild(h('p.day-empty', t('trash.empty'))); return; }
        body.appendChild(h('div.card', goneLists.map(function (l) {

            h('span.prop-label', t('trash.listRow', { name: l.name }), h('span.prop-sub', t('trash.left', { n: days }))),

<script>
/* 첫 실행 — 한 장. "보기 편하게 맞춰요": 글자 크기 · 화면 색을 고르면 위의 '내 오늘 화면' 미리보기가 바로 바뀐다.
   미리보기 머리말은 진짜 오늘 날짜 → '시작하기'를 누르면 같은 머리말의 진짜 오늘 화면으로 이어진다(미리보기가 그대로 내 화면이 됨).
   미리보기의 동그라미는 눌러 볼 수 있다 — 체크하면 지워지지 않고 초록으로 남는 것을 글 없이 손으로 겪게(저장은 안 함).
   묻지 않는 것: 목록 · 이름 · 첫 할 일 · 한 주 시작 · 끝낸 일 방식 · 알림 권한(시간을 처음 넣을 때 물음) — 설정에 다 있다.
   근거: 첫 실행 설계(오푸스 10-31) · 기획서 0-1절. 다시 보려면 설정의 '처음 상태로 되돌리기'(시험판). */
App.onboarding = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, S = App.store, ic = App.icons.svg;
  var el = null, tried = false;   /* tried = 미리보기 동그라미를 눌러 봤는지(화면 안에만) */

  function setting(k, v) { S.commit(function (d) { d.settings[k] = v; }, { keepUndo: true }); }

  /* 내 오늘 화면을 줄인 모양 — 진짜 오늘 날짜 + 이 앱을 쓸 사람의 하루 같은 두 줄 */
  function sample() {
    var today = U.today();
    var check = h('button.check' + (tried ? '.is-on' : ''), { type: 'button', 'aria-label': t('ob.sample1'), html: App.icons.CHECK });
    var row1 = h('div.task' + (tried ? '.is-done' : ''), check,
      h('div.task-body', h('div.task-title', t('ob.sample1')), h('div.task-meta', h('span.meta', { html: ic('clock', 13) }, I.time('18:00')))));
    check.addEventListener('click', function () {
      tried = !tried; row1.classList.toggle('is-done', tried); check.classList.toggle('is-on', tried);
      if (tried) App.platform.haptic.success();
    });
    return h('div.ob-preview', { 'aria-label': t('ob.previewLabel') },
      h('div.ob-preview-head', I.dateNoWeek(today), h('span.title-sub', I.weekday(U.dow(today)))),
      h('div.card.ob-sample', row1,
        h('div.task.is-done', h('span.check.is-on', { html: App.icons.CHECK }),
          h('div.task-body', h('div.task-title', t('ob.sample2')), h('div.task-meta', h('span.meta', { html: ic('clock', 13) }, I.time('07:30')))))));
  }

  function choices(opts, cur, onPick, label) {
    return h('div.ob-choices', { role: 'radiogroup', 'aria-label': label }, opts.map(function (o) {
      return h('button.ob-choice' + (o[0] === cur ? '.is-on' : ''), { type: 'button', role: 'radio', 'aria-checked': o[0] === cur ? 'true' : 'false', onclick: function () { onPick(o[0]); } },
        o[2] || null, h('span.ob-choice-label', o[1]));
    }));
  }

  function panel() {
    var st = S.data.settings;
    return h('div.ob-panel',
      h('div.ob-top', h('span'), h('button.text-btn.ob-skip', { type: 'button', onclick: finish }, t('ob.skip'))),
      h('div.ob-body',
        h('h1.ob-title', t('ob.title')),
        h('p.ob-text', t('ob.identity')),   /* 이 앱이 왜 다른지 사실 한 줄 (UI 채점 3 ①) — 기능 소개 여러 장은 두지 않음 */
        sample(),
        h('div.ob-label', t('ob.sizeLabel')),
        choices([['sm', t('ob.size.sm'), h('span.ob-ga.s1', '가')], ['md', t('ob.size.md'), h('span.ob-ga.s2', '가')],
                 ['lg', t('ob.size.lg'), h('span.ob-ga.s3', '가')], ['xl', t('ob.size.xl'), h('span.ob-ga.s4', '가')]],
          st.textSize, function (v) { setting('textSize', v); draw(); }, t('ob.sizeLabel')),
        h('div.ob-label', t('ob.themeLabel')),
        choices([['light', t('set.theme.light'), h('span.ob-swatch.is-light')], ['dark', t('set.theme.dark'), h('span.ob-swatch.is-dark')],
                 ['system', t('set.theme.system'), h('span.ob-swatch.is-system')]],
          st.theme, function (v) { setting('theme', v); draw(); }, t('ob.themeLabel'))),
      h('div.ob-bottom',
        h('p.ob-later', t('ob.later')),
        h('button.btn.primary.ob-next', { type: 'button', onclick: finish }, t('ob.start'))));
  }

  function draw() { var y = el.scrollTop; App.dom.clear(el); el.appendChild(panel()); el.scrollTop = y; }

  /* 시작하기 · 건너뛰기 = 지금까지 고른 것은 그대로 두고 끝내기 (안 고른 것은 이미 기본값 · 확인 창 없음) */
  function finish() {
    S.commit(function (d) { d.settings.onboarded = true; }, { keepUndo: true });
    close();
  }
  function close() {
    if (!el) return;
    var x = el; el = null;
    x.classList.add('is-out');
    setTimeout(function () { x.remove(); }, 260);
  }

  /* o.instant: 앱을 처음 켤 때는 서서히 띄우지 않고 처음부터 덮은 채로 — 뒤의 빈 오늘 화면이 한순간 비치지 않게 */
  function open(o) {
    if (el) return;
    tried = false;
    el = h('div.onboarding' + (o && o.instant ? '.is-instant' : ''), { role: 'dialog', 'aria-modal': 'true', 'aria-label': t('ob.label') });
    document.getElementById('layer').appendChild(el);
    draw();
  }

  return { open: open, close: close, get isOpen() { return !!el; } };
})();

</script>
<script>
/* 시작 · 길 찾기 · 큰 틀(아래 탭 / 왼쪽 메뉴 / + 단추) · 테마 · 날 바뀜 · 앱 돌아옴. 화면 그리기는 screens/*가 맡는다. */
(function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, S = App.store, Q = App.query, T = App.tasks, ic = App.icons.svg;
  var route = { name: 'today', arg: null }, stack = [];
  /* 브라우저 '뒤로' 기록은 주소창이 있는 일반 브라우저에서만 쓴다. 홈 화면 웹앱 · 안드로이드 · 다른 페이지 안(미리보기)에서는
     앱 자체 기록(stack)만 쓴다 — 안에 끼워진 페이지에서는 기록이 바깥과 엇갈려 화면이 한 박자 늦게 바뀌는 일이 있었다(10-31 점검). */
  var useHistory = (function () { try { return window.top === window && App.platform.name === 'web' && !App.platform.info.standalone; } catch (e) { return false; } })();
  var main = document.getElementById('main'), tabbar = document.getElementById('tabbar'), sidebar = document.getElementById('sidebar'), fab = document.getElementById('fab');

  /* 진동 설정을 기기 어댑터 앞에서 한 번에 거른다 */
  ['tap', 'success'].forEach(function (k) { var f = App.platform.haptic[k]; App.platform.haptic[k] = function () { if (S.data.settings.haptic) f(); }; });

  /* ── 길 찾기 ── */
  function hashOf(r) { return '#/' + r.name + (r.arg ? '/' + r.arg : ''); }
  function fromHash() {
    var p = (location.hash || '').replace(/^#\/?/, '').split('/');
    var name = ['today', 'calendar', 'lists', 'list', 'settings'].indexOf(p[0]) >= 0 ? p[0] : 'today';
    return { name: name, arg: p[1] || null };
  }
  App.go = function (name, arg) {
    if (route.name === name && route.arg === (arg || null)) { window.scrollTo(0, 0); return; }
    if (['today', 'calendar', 'lists', 'settings'].indexOf(name) >= 0 && !useHistory) stack = []; else stack.push(route);  /* 탭 이동은 쌓지 않음: 뒤로 = 오늘 */
    route = { name: name, arg: arg || null };
    if (useHistory) try { history.pushState(route, '', hashOf(route)); } catch (e) {}
    App.render(true);
  };
  /* 뒤로: 창이 열려 있으면 창부터 → 온 길을 거슬러 → 없으면 오늘로 → 오늘이면 앱 밖으로(안드로이드) */
  App.back = function () {
    if (App.onboarding.isOpen) return true;   /* 첫 실행 안내 중에는 뒤로 단추로 빠지지 않음 (건너뛰기 단추가 있음) */
    if (App.sheet.closeTop()) return true;
    if (stack.length) {
      if (useHistory) { history.back(); return true; }
      route = stack.pop(); App.render(true); return true;
    }
    if (route.name === 'today') return false;
    route = route.name === 'list' ? { name: 'lists', arg: null } : { name: 'today', arg: null };
    if (useHistory) try { history.replaceState(route, '', hashOf(route)); } catch (e) {}
    App.render(true);
    return true;
  };
  window.onBack = App.back;  /* 안드로이드 뒤로 단추 */
  window.addEventListener('popstate', function (e) {
    if (!useHistory) return;
    stack.pop();
    if (App.sheet.count) App.sheet.closeAll();
    route = e.state && e.state.name ? e.state : fromHash();
    App.render(true);
  });

  /* ── 그리기 (한 프레임에 한 번으로 모음) ── */
  var queued = false;
  App.render = function (top) {
    if (top) { draw(true); return; }
    if (queued) return; queued = true;
    requestAnimationFrame(function () { queued = false; draw(false); });
  };
  function draw(top) {
    var y = window.scrollY;
    App.dom.clear(main);
    var r = route;
    if (r.name === 'calendar') App.screens.calendar.render(main);
    else if (r.name === 'lists') App.screens.lists.overview(main);
    else if (r.name === 'list') App.screens.lists.single(main, r.arg);
    else if (r.name === 'settings') App.screens.settings.render(main);
    else App.screens.today.render(main);
    drawNav();
    fab.classList.toggle('is-hidden', r.name === 'settings');  /* 넓은 화면의 떠 있는 + (휴대폰은 아래 탭 가운데 +) */
    window.scrollTo(0, top ? 0 : y);
  }

  function navItem(cls, name, icon, label, count, arg) {
    var on = route.name === name && (arg === undefined || route.arg === arg) || (name === 'lists' && route.name === 'list' && cls === 'tab');
    return h('button.' + cls, { type: 'button', 'aria-current': on ? 'page' : null, onclick: function () { App.go(name, arg); } },
      h('span', { html: ic(icon, cls === 'tab' ? 24 : 20) }), h('span.nav-label', label), count ? h('span.nav-count.num', String(count)) : null);
  }
  function drawNav() {
    App.dom.clear(tabbar);
    /* 휴대폰 아래 탭: 오늘 · 캘린더 · (+) · 목록 · 설정 — + 가 탭 가운데에 있어 내용을 가리지 않는다 (오푸스 조수 2차) */
    tabbar.appendChild(navItem('tab', 'today', 'today', t('nav.today')));
    tabbar.appendChild(navItem('tab', 'calendar', 'calendar', t('nav.calendar')));
    tabbar.appendChild(h('button.tab-add', { type: 'button', 'aria-label': t('qa.add'), html: ic('plus', 26), onclick: quickAdd }));
    tabbar.appendChild(navItem('tab', 'lists', 'lists', t('nav.lists')));
    tabbar.appendChild(navItem('tab', 'settings', 'gear', t('nav.settings')));

    if (!window.matchMedia('(min-width: 768px) and (min-height: 560px)').matches) { App.dom.clear(sidebar); return; }
    App.dom.clear(sidebar);
    var d = S.data;
    sidebar.appendChild(h('div.side-brand', t('app.name')));
    sidebar.appendChild(h('button.side-add', { type: 'button', onclick: quickAdd }, h('span.side-add-plus', { html: ic('plus', 18) }), t('qa.addTask'), h('kbd.side-kbd', 'N')));
    sidebar.appendChild(navItem('side-item', 'today', 'today', t('nav.today')));  /* 쌓인 숫자 압박 없게 — 오늘에는 개수를 안 붙임 */
    sidebar.appendChild(navItem('side-item', 'calendar', 'calendar', t('nav.calendar')));
    sidebar.appendChild(navItem('side-item', 'lists', 'lists', t('nav.lists')));
    sidebar.appendChild(h('button.side-item', { type: 'button', onclick: App.screens.lists.search },   /* 넓은 화면 찾기 + 단축키 / (2호 10번) */
      h('span', { html: ic('search', 20) }), h('span.nav-label', t('search.title')), h('kbd.side-kbd', '/')));
    var lists = d.lists.filter(T.alive);
    if (lists.length) {
      sidebar.appendChild(h('div.side-label', t('nav.myLists')));
      lists.forEach(function (l) {
        var on = route.name === 'list' && route.arg === l.id;
        sidebar.appendChild(h('button.side-item.side-list', { type: 'button', 'aria-current': on ? 'page' : null, onclick: function () { App.go('list', l.id); } },
          h('span.list-dot.c-' + l.color), h('span.nav-label', l.name), h('span.nav-count.num', String(Q.remaining(d, l.id) || ''))));
      });
    }
    sidebar.appendChild(h('div.side-spacer'));
    sidebar.appendChild(navItem('side-item', 'settings', 'gear', t('nav.settings')));
  }

  /* + 단추: 지금 보는 곳에 맞춰 미리 채운다 (캘린더 = 고른 날 · 목록 = 그 목록) */
  function quickAdd() {
    var preset = {};
    if (route.name === 'today') { preset.date = U.today(); preset.soft = true; }   /* 오늘 화면에서 적으면 '오늘' (칩 ×로 빼면 날짜 없는 일 · 글에 '언제까지'가 있으면 안 붙음 · 점검원 1호 8번) */
    if (route.name === 'calendar') preset.date = App.screens.calendar.selected;
    if (route.name === 'list') preset.listId = route.arg;
    App.quickadd.open(preset);
  }
  fab.innerHTML = ic('plus', 28);
  fab.addEventListener('click', quickAdd);
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (App.onboarding.isOpen || App.sheet.count || tag === 'input' || tag === 'textarea') return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); App.screens.lists.search(); return; }   /* 찾기: Ctrl/⌘+K 또는 / */
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); App.screens.lists.search(); return; }
    if (e.key === 'n' || e.key === '+' || e.key === 'ㅜ') { e.preventDefault(); quickAdd(); }
  });

  /* ── 테마 ── */
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    var s = S.data.settings.theme, dark = s === 'dark' || (s === 'system' && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.style.setProperty('--text-scale', App.model.TEXT_SCALE[S.data.settings.textSize] || 1);
    document.documentElement.setAttribute('data-text', S.data.settings.textSize || 'md');   /* 글자 크기별 배치(빠른 추가 칩 줄바꿈 등) */
    /* 다음에 켤 때 첫 그림부터 이 색 · 크기로 — index.html 머리의 짧은 스크립트가 읽는다(어두운 테마인데 밝게 번쩍이지 않게) */
    try { localStorage.setItem('todo02:look', (dark ? 'dark' : 'light') + '|' + (App.model.TEXT_SCALE[S.data.settings.textSize] || 1)); } catch (e) {}
    App.platform.setBars(dark ? '#121314' : '#F7F7F5', dark);
  }
  if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);

  /* ── 알림 권한: 시간을 처음 넣는 그 순간(손가락으로 누른 때)에만 묻는다 ── */
  var hinted = false, askedExact = false;
  App.ensureNotify = function () {
    var N = App.platform.notify, s = N.status();
    if (s === 'default') { N.request().then(function () { S.flush(); App.render(); }); return; }
    if (s === 'needs-install' && !hinted && !S.data.settings.installHintShown) {   /* 한 번만 (껐다 켜도 다시 안 뜸 · 점검원 1호 29번) */
      hinted = true; S.commit(function (d) { d.settings.installHintShown = true; }, { keepUndo: true });
      App.toast.show(t('notify.needsInstallToast'), { duration: 4500 }); return;
    }
    if (App.platform.name === 'android' && s === 'granted' && N.exactOk && !N.exactOk() && !askedExact) {
      askedExact = true;
      App.pickers.confirm({ title: t('notify.exactTitle'), text: t('notify.exactText'), ok: t('notify.openSettings'), cancel: t('common.later'), onOk: function () { N.openExact(); } });
    }
  };

  /* 알림을 눌러 앱을 열었을 때 (안드로이드) */
  App.openTask = function (id, key) { if (T.find(S.data, id)) App.detail.open(id, key); };

  /* ── 시작 ── */
  S.load();
  applyTheme();
  route = useHistory ? fromHash() : { name: 'today', arg: null };
  if (useHistory) try { history.replaceState(route, '', hashOf(route)); } catch (e) {}
  /* 처음 켜면 첫 실행 화면을 처음부터 덮은 채로 그린다 — 빈 오늘 화면이 한순간 비치지 않게 (첫 실행 설계 10-31) */
  if (!S.data.settings.onboarded) App.onboarding.open({ instant: true });
  App.render(true);
  if (window.__openTask) { App.openTask(window.__openTask.id, window.__openTask.key); window.__openTask = null; }

  App.bus.on('change', function (o) {
    applyTheme(); App.render();
    if (o && o.reset) { route = { name: 'today', arg: null }; stack = []; App.sheet.closeAll(); App.onboarding.open(); }
    else if (App.onboarding.isOpen && S.data.settings.onboarded) App.onboarding.close();  /* 초기화를 되돌렸을 때 */
  });
  /* 앱을 보는 중에 온 알림(아이폰 웹앱) — '열기'로 바로 그 할 일로, 10초 (4호 8번) */
  App.bus.on('reminder', function (r) { if (!document.hidden) App.toast.show(t('notif.inApp', { title: r.title }), { duration: 10000, action: r.taskId ? t('notif.open') : null, onAction: function () { App.openTask(r.taskId, r.key); } }); });
  App.bus.on('undo-expired', function () { App.toast.hide(); });
  App.bus.on('storage-error', function () { App.toast.show(t('error.storage'), { duration: 5000 }); });

  /* 앱이 뒤로 갈 때 저장 · 돌아오면 위젯/알림 쪽지 반영 + 날짜가 바뀌었으면 다시 그림 */
  /* 앱이 뒤로 갈 때: 쓰고 있던 칸을 먼저 저장(blur) → 저장 (점검원 1호 3번) */
  function saveNow() { var a = document.activeElement; if (a && /INPUT|TEXTAREA/.test(a.tagName)) a.blur(); S.flush(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveNow(); });
  window.addEventListener('pagehide', saveNow);
  window.onPauseApp = saveNow;
  document.documentElement.lang = I.lang;   /* 화면 읽기 프로그램이 기기 언어로 읽게 */
  tabbar.setAttribute('aria-label', t('nav.menu')); sidebar.setAttribute('aria-label', t('nav.menu')); fab.setAttribute('aria-label', t('qa.addTask'));
  var day = U.today();
  function newDay() { if (day !== U.today()) { App.screens.calendar.dayChanged(day); day = U.today(); } }
  App.platform.onResume(function () { S.resume(); newDay(); App.render(); });
  (function midnight() {
    var n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
    setTimeout(function () { newDay(); S.resume(); App.render(); midnight(); }, next - n);
  })();
  window.addEventListener('resize', U.debounce(function () { App.render(); }, 150));

  /* 아래로 넘기는 동안 + 단추를 살짝 숨겨 줄 끝을 가리지 않게, 위로 올리면 다시 */
  var lastY = 0;
  window.addEventListener('scroll', function () {
    var y = window.scrollY, down = y > lastY + 4, up = y < lastY - 4;
    if (down && y > 80) fab.classList.add('is-tucked'); else if (up || y < 80) fab.classList.remove('is-tucked');
    if (down || up) lastY = y;
  }, { passive: true });
})();

</script>
