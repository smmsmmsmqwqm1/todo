<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 검색 엔진에 안 나오게 (공개 저장소라도 링크를 받은 사람만 찾게 · 사용자 10-31) -->
<meta name="robots" content="noindex, nofollow">
<!-- 확대 막기: 안드로이드 크롬 · 웹뷰는 maximum-scale · user-scalable을 따른다. 아이폰 사파리는 iOS 10부터 이것만으로는 두 손가락 확대를 막지 않아(접근성) web.js의 gesturestart로 막는다. 글자를 키우고 싶으면 앱 설정 '글자 크기'(최대 1.4배) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ToDo"><!-- 임시 이름 (사용자 10-31: 지금은 ToDo 예명) -->
<meta name="format-detection" content="telephone=no">
<title>ToDo</title>
<script>/* 첫 그림부터 지난번 색 · 글자 크기로 — 켤 때 번쩍임 없게 (app.js applyTheme이 저장) */
try { var l = (localStorage.getItem('todo02:look') || '').split('|'); if (l[0]) { document.documentElement.setAttribute('data-theme', l[0]); document.documentElement.style.background = l[0] === 'dark' ? '#121314' : '#F7F7F5'; } if (l[1]) document.documentElement.style.setProperty('--text-scale', l[1]); } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<!-- 화면 모양: 토큰(색 · 간격) → 바탕 → 부품 → 화면 -->
<style>
/* 색 · 간격 · 둥글기 · 그림자 — 화면 코드는 이 이름만 쓴다. 값의 근거 = 디자인/색과 글꼴.md */
:root {
  /* 10-31 'AI 티' 진단 반영: 크림 바탕 + 테라코타(클로드 색과 같은 짝) → 중립 바탕 + 귤색. 회베이지 겹을 2겹으로 */
  --bg: #F7F7F5;
  --surface: #FFFFFF;
  --surface-2: #EFEFEC;
  --press: #E8E8E4;
  --line: #E8E8E4;
  --ink: #191C20;
  --ink-2: #626870;          /* 바탕 위 5.24 */
  --ink-3: #8B9097;          /* 체크 동그라미 테두리 · 흐린 글 — 흰 바탕 위 3.2 (점검원 1호 9번: 햇빛 아래 안 보임) */
  --on-accent: #FFFFFF;

  /* 글자 대비(10-31 다시 잼): 작은 글자 4.5 이상 · 아이콘 3 이상 */
  --accent: #F2622E;         /* 귤색 — 면 · 아이콘 (흰 아이콘 3.2) */
  --accent-strong: #CC4510;  /* 흰 글자가 올라가는 단추 (4.74) */
  --accent-ink: #C2410C;     /* 주 색 글자 (바탕 위 4.83) */
  --accent-soft: #FFF0E8;

  --done: #1F9D62;
  --done-ink: #1B7A4C;       /* 끝낸 일 글자 (초록 바탕 위 4.80) */
  --done-soft: #E9F6EF;

  --p1: #8A9097;   /* 중요도 낮음 — 주 색(주황)과 다른 계열로 (오푸스 조수 1차) */
  --p2: #1E9EA6;   /* 보통 */
  --p3: #7457CF;   /* 높음 (흰 카드 위 5.24) */

  --c-orange: #F2622E; --c-yellow: #F2A23A; --c-green: #2FA36B; --c-teal: #1E9EA6;
  --c-blue: #4C8DF6;   --c-violet: #8B6CE0; --c-pink: #E5679A;  --c-gray: #8A9097;

  --scrim: rgba(0, 0, 0, .18);  /* 뒤 화면이 '흐려지기'보다 '살짝 물러나는' 정도 */
  --shadow-float: 0 8px 24px rgba(30, 33, 36, .10), 0 2px 6px rgba(30, 33, 36, .06);
  --shadow-sheet: 0 -8px 32px rgba(30, 33, 36, .12);

  --r-card: 14px;
  --r-sheet: 24px;
  --r-field: 10px;
  --r-pill: 999px;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;

  --fs-title: 1.75rem;
  --fs-head: 1.25rem;
  --fs-body: 1.0625rem;
  --fs-sub: 0.875rem;
  --fs-small: 0.8125rem;   /* 13px — 시간 · '언제까지'가 이 크기라 상용 앱 부제 수준으로 (UI 채점 6차 ⑤) */

  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --fast: 120ms;
  --mid: 240ms;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #121314;
  --surface: #1C1D1F;
  --surface-2: #26282B;
  --press: #2E3134;
  --line: #2F3236;
  --ink: #EEEFF0;
  --ink-2: #A3A8AE;
  --ink-3: #80858B;
  --on-accent: #2A1510;      /* 어둡게: 밝은 주황 위에는 어두운 글자 · 아이콘 (7.21) */

  --accent: #FF8A55;
  --accent-strong: #FF8A55;
  --accent-ink: #FF9B6E;
  --accent-soft: #3A2520;

  --done: #4CC38A;
  --done-ink: #7FD8AB;
  --done-soft: #173326;

  --p1: #9AA0A7; --p2: #3CC0C8; --p3: #A58BF0;

  --c-orange: #FF8467; --c-yellow: #F5B357; --c-green: #4CC38A; --c-teal: #3CC0C8;
  --c-blue: #6FA4FF;   --c-violet: #A58BF0; --c-pink: #F383B0;  --c-gray: #9AA0A7;

  --scrim: rgba(0, 0, 0, .55);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, .45);
  --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
</style>
<style>
/* 바탕 · 큰 배치(휴대폰 = 아래 탭 / 넓은 화면 = 왼쪽 메뉴) */
*, *::before, *::after { box-sizing: border-box; }
/* 두 번 톡 확대 막기 — touch-action은 물려받지 않아 모든 요소에 둔다(클래스에 따로 정한 pan-y · none이 이김). 확대 없이 빠른 탭 · 스크롤만 (사용자 10-31 '앱이 확대 축소되면 말이 안 됨') */
* { touch-action: manipulation; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; font-size: calc(16px * var(--text-scale, 1)); } /* 글자 크기 설정 = 이 한 줄 (모든 글자가 rem) */
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--fs-body)/1.42 var(--font);
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
input, textarea { -webkit-appearance: none; appearance: none; }
/* 아이폰은 글자가 16px보다 작은 입력 칸을 누르면 화면을 저절로 확대한다 → 입력 칸 글자는 늘 16px 이상(글자 크기 '작게'에서도). 클래스로 크기를 정한 칸도 max(16px, …)로 */
input, textarea, select { font-size: max(16px, 1rem); }
svg { display: block; flex: none; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  min-height: 100%;
  display: flex;
}
.main {
  flex: 1;
  min-width: 0;
  padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 20px) calc(var(--safe-b) + 96px) calc(var(--safe-l) + 20px);
}
.screen { max-width: 720px; margin: 0 auto; }

/* 아래 탭 (휴대폰) */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around;
  padding: 6px calc(var(--safe-r) + 8px) calc(var(--safe-b) + 6px) calc(var(--safe-l) + 8px);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(16px);
  backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1; min-width: 0; max-width: 96px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0 4px; border-radius: 12px;
  color: var(--ink-2); font-size: 0.7188rem; font-weight: 600;  /* 안 고른 탭도 '꺼진 것'처럼 보이지 않게 */
  transition: color var(--fast), transform var(--fast) var(--ease);
}
.tab:active { transform: scale(.94); }
.tab[aria-current="page"] { color: var(--ink); }

/* 아래 탭 가운데 + (휴대폰) */
.tab-add {
  flex: none; align-self: center; width: 52px; height: 44px; margin: 0 4px; border-radius: 16px;
  display: grid; place-items: center; background: var(--accent); color: var(--on-accent);
  transition: transform var(--fast) var(--ease);
}
.tab-add:active { transform: scale(.92); }

/* 떠 있는 + 단추 (넓은 화면만) */
.fab {
  display: none;
  position: fixed; z-index: 21;
  right: calc(var(--safe-r) + 20px);
  bottom: calc(var(--safe-b) + 76px);
  width: 58px; height: 58px; border-radius: 50%;
  place-items: center;
  background: var(--accent); color: var(--on-accent);
  box-shadow: var(--shadow-float);
  transition: transform var(--fast) var(--ease), opacity var(--mid);
}
.fab:active { transform: scale(.92); }
.fab.is-hidden { opacity: 0; pointer-events: none; transform: scale(.8); }
.fab.is-tucked { transform: translateY(calc(100% + 96px)); }

/* 왼쪽 메뉴 (넓은 화면) */
.sidebar { display: none; }

@media (min-width: 768px) and (min-height: 560px) {  /* 넓고 충분히 높을 때만 (가로로 돌린 휴대폰은 휴대폰 배치 · 점검원 1호 19번) */
  .tabbar { display: none; }
  .sidebar {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh; height: 100dvh;
    width: 248px; flex: none; overflow-y: auto;
    padding: calc(var(--safe-t) + 20px) 12px 24px calc(var(--safe-l) + 12px);
    border-right: 1px solid var(--line);
  }
  .main { padding: calc(var(--safe-t) + 20px) calc(var(--safe-r) + 40px) 120px 40px; }
  /* 넓은 화면은 떠 있는 + 대신 왼쪽 메뉴 맨 위 '할 일 추가' (떠 있는 단추가 줄 끝을 가리지 않게 · 조수 3차) */
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
<style>
/* 부품 — 여러 화면이 같이 쓰는 것 */

/* 화면 머리 */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 20px; }
.page-head.is-stack { flex-direction: column; align-items: flex-start; gap: 6px; }
.page-head.is-top { align-items: flex-start; }
.head-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.eyebrow { font-size: var(--fs-sub); font-weight: 600; color: var(--ink-2); margin: 0 0 2px; }
.title { font-size: var(--fs-title); font-weight: 700; letter-spacing: -.03em; margin: 0; line-height: 1.2; }
.title-sub { margin-left: 8px; font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; color: var(--ink-2); }
.head-actions { display: flex; align-items: center; gap: 4px; }
.progress { margin: 0; font-size: 0.875rem; font-weight: 600; color: var(--ink-2); }
.progress b { color: var(--done-ink); font-weight: 700; }
.progress.is-full { color: var(--done-ink); }
/* 머리말 앞 작은 네모 = 오늘 칸이 캘린더에서 칠해질 색 그대로(아직 · 조금 · 거의 다). 누르면 캘린더 오늘로 — 정체성 '채워지는 달력'을 오늘 화면에 비춤 (UI 채점 8차 3번) */
.progress-row { display: flex; align-items: center; gap: 8px; }
.day-mark { width: 18px; height: 18px; border-radius: 5px; flex: none; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--surface); padding: 0; }
.day-mark.is-some { background: var(--done-soft); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--done) 30%, transparent); }
.day-mark.is-full { background: color-mix(in srgb, var(--done) 36%, var(--surface)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--done) 45%, transparent); }

.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; color: var(--ink-2);
  transition: background var(--fast), transform var(--fast) var(--ease);
}
.icon-btn:active { background: var(--press); transform: scale(.94); }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-2); } }

/* 오늘 한 비율 고리 */
.ring { position: relative; width: 44px; height: 44px; flex: none; }
.ring svg { width: 44px; height: 44px; transform: rotate(-90deg); }
.ring .ring-track { stroke: var(--surface-2); }
.ring .ring-fill { stroke: var(--done); transition: stroke-dashoffset 500ms var(--ease); }
.ring-label { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; color: var(--ink-2); }
.ring.is-full .ring-label { color: var(--done-ink); }

/* 묶음 */
.section { margin: 0 0 28px; }  /* 묶음은 카드가 아니라 여백으로 나눈다 */
.section-head { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 4px 8px; }
.section-label { font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); }
.section-count { font-size: var(--fs-sub); color: var(--ink-3); }
.section-action { margin-left: auto; font-size: var(--fs-sub); font-weight: 600; color: var(--accent-ink); padding: 6px 8px; border-radius: 8px; }
.section-action:active { background: var(--accent-soft); }

.card { background: var(--surface); border-radius: var(--r-card); overflow: hidden; }
.card > * + * { border-top: 1px solid var(--line); }

/* 할 일 한 줄 */
.task { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px 10px 16px; background: var(--surface); transition: background var(--mid) 120ms; } /* 동그라미가 먼저 차고, 줄 바탕은 한 박자 늦게 */
.task-body { flex: 1; min-width: 0; padding-top: 1px; cursor: pointer; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }   /* 길게 누르기 = 날짜 메뉴 (글자 선택 말풍선이 먼저 뜨지 않게) */
.task-title { font-size: var(--fs-body); font-weight: 500; line-height: 1.3; transition: color var(--mid); }
.task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; font-size: var(--fs-small); color: var(--ink-2); }
.meta { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.meta .dot { width: 7px; height: 7px; border-radius: 50%; }
.meta.is-late { color: var(--ink-2); }
.task-expand { width: 32px; height: 32px; margin: -4px -6px -4px 0; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); transition: transform var(--mid) var(--ease); }
.task-expand.is-open { transform: rotate(180deg); }
.task:active .task-body { opacity: .7; }

.task.is-done { background: color-mix(in srgb, var(--done-soft) 50%, var(--surface)); }   /* 15개 넘게 끝내도 '초록 벽'이 되지 않게 옅게 — '했다'는 동그라미와 글자 초록이 말함 (점검원 2호 3번) */
.task.is-done .task-title { color: var(--done-ink); }
.task.is-done .task-meta { color: color-mix(in srgb, var(--done-ink) 70%, var(--ink-3)); }
.task.is-leaving { animation: leave 320ms var(--ease) 380ms forwards; }
@keyframes leave { to { opacity: 0; transform: translateX(12px); } }

/* 체크 동그라미 */
.check {
  --ring: var(--ink-3);
  position: relative; flex: none;
  width: calc(26px * var(--text-scale, 1)); height: calc(26px * var(--text-scale, 1)); border-radius: 50%;   /* 글자를 키우면 같이 커짐 (2호 12번) */
  border: 2px solid var(--ring);
  display: grid; place-items: center;
  transition: background var(--mid) var(--ease), border-color var(--mid), transform var(--fast) var(--ease);
}
.check::before { content: ""; position: absolute; inset: -9px; } /* 손가락 닿는 넓이 44 */
.check svg { width: 15px; height: 15px; }
.check path { stroke: var(--on-accent); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 260ms var(--ease) 60ms; }
.check:active { transform: scale(.88); }
.meta.prio { font-weight: 500; }   /* 회색 정보들 사이에서 혼자 소리치지 않게 (UI 채점 8차 4번) */
.meta.prio.p1 { color: var(--p1); } .meta.prio.p2 { color: var(--p2); } .meta.prio.p3 { color: var(--p3); }
.task.is-done .meta.prio { color: inherit; }
.is-done > .check, .check.is-on { background: var(--done); border-color: var(--done); }
.is-done > .check path, .check.is-on path { stroke-dashoffset: 0; }
.is-checking > .check { animation: pop 360ms var(--ease); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.check.sm { width: calc(20px * var(--text-scale, 1)); height: calc(20px * var(--text-scale, 1)); border-width: 1.8px; }
.check.sm svg { width: 12px; height: 12px; }
.check.lg { width: 30px; height: 30px; }

/* 세부 할 일 (목록에서 펼침) */
.subs { padding: 0 14px 10px 54px; background: inherit; }
.task.is-done + .subs { background: color-mix(in srgb, var(--done-soft) 50%, var(--surface)); }   /* 끝낸 줄 바탕과 같은 옅기 */
.sub { display: flex; align-items: center; gap: 10px; min-height: 38px; }
.sub-title { flex: 1; font-size: 0.9688rem; color: var(--ink); }
.sub.is-done .sub-title { color: var(--done-ink); }

/* 작은 표 */
.badge { display: inline-flex; align-items: center; font-size: 0.75rem; font-weight: 600; color: var(--ink-2); } /* 회색 상자 없이 글자만 (먹먹함 줄이기) */
.badge.is-soon { color: var(--accent-ink); }

/* 칩 */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;

<script>
/* 날짜 · id · 작은 도구. 날짜는 늘 'YYYY-MM-DD' 글자(기기 시간대 기준)로 다룬다. */
window.App = window.App || {};
App.util = (function () {
  'use strict';
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  /* '지금' — 평소엔 기기 시계. 자동 시험(소스/시험/)이 날짜를 옮겨 1년을 돌려 볼 때만 setNow로 바꾼다 */
  var fixedNow = null;
  function now() { return fixedNow != null ? fixedNow : Date.now(); }
  function setNow(ms) { fixedNow = ms; }

  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return ymd(new Date(now())); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); } /* b - a */
  function dow(s) { return parse(s).getDay(); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function addMonths(s, n) {

    t.setDate(Math.min(day, daysInMonth(t.getFullYear(), t.getMonth())));

  }
  function monthKey(s) { return s.slice(0, 7); }
  function startOfWeek(s, weekStart) { var k = (dow(s) - weekStart + 7) % 7; return addDays(s, -k); }

  function hm(h, m) { return pad(h) + ':' + pad(m); }
  function toMin(t) { var p = t.split(':'); return (+p[0]) * 60 + (+p[1]); }

  function at(dateStr, timeStr) { var d = parse(dateStr); var m = toMin(timeStr || '00:00'); d.setHours(Math.floor(m / 60), m % 60, 0, 0); return d.getTime(); }

</script>

<script>
/* 언어 — 기기 언어가 한국어면 한국어, 아니면 영어. 날짜 · 시간 표기는 Intl에 맡긴다(손으로 만들지 않는다).
   문구는 js/lang/*.js 에만 있다. 화면 코드는 t('열쇠')로만 부른다. 새 언어 = lang 파일 하나 + 아래 DICTS 한 줄. */
App.i18n = (function () {
  'use strict';
  var U = App.util;
  var DICTS = { ko: App.lang && App.lang.ko, en: App.lang && App.lang.en };

  var raw = (navigator.languages && navigator.languages[0]) || navigator.language || 'ko';
  var lang = /^ko/i.test(raw) ? 'ko' : 'en';
  var locale = lang === 'ko' ? 'ko-KR' : (/^en/i.test(raw) ? raw : 'en-US');
  var rules = (window.Intl && Intl.PluralRules) ? new Intl.PluralRules(locale) : null;

  function t(key, p) {
    var v = DICTS[lang][key];
    if (v == null) v = DICTS.ko[key];
    if (v == null) return key;
    if (typeof v === 'object') v = v[rules ? rules.select(p && p.n != null ? p.n : 0) : 'other'] || v.other;
    if (typeof v === 'function') return v(p || {});
    if (!p) return v;
    return v.replace(/\{(\w+)\}/g, function (m, k) { return p[k] != null ? p[k] : m; });
  }

  var cache = {};
  function fmt(opts) { var k = JSON.stringify(opts); return cache[k] || (cache[k] = new Intl.DateTimeFormat(locale, opts)); }

  function dateLong(s) { return fmt({ month: 'long', day: 'numeric', weekday: 'long' }).format(U.parse(s)); }
  function dateShort(s) {
    var d = U.parse(s), sameYear = d.getFullYear() === U.parse(U.today()).getFullYear();
    return fmt(sameYear ? { month: 'short', day: 'numeric', weekday: 'short' } : { year: 'numeric', month: 'short', day: 'numeric' }).format(d);
  }
  function dateNoWeek(s) { return fmt({ month: 'short', day: 'numeric' }).format(U.parse(s)); }
  function monthTitle(y, m) { return fmt({ year: 'numeric', month: 'long' }).format(new Date(y, m, 1)); }
  function time(hhmm) { var p = hhmm.split(':'); return fmt({ hour: 'numeric', minute: '2-digit' }).format(new Date(2000, 0, 1, +p[0], +p[1])); }
  function weekday(i, style) { return fmt({ weekday: style || 'short' }).format(new Date(2023, 0, 1 + i)); } /* 2023-01-01 = 일요일 */
  function weekdayLong(i) { return weekday(i, 'long'); }

  /* 오늘 · 내일 · 어제 · 이번 주 요일 · 날짜 */
  function relDay(s) {
    var n = U.diffDays(U.today(), s);
    if (n === 0) return t('day.today');
    if (n === 1) return t('day.tomorrow');
    if (n === -1) return t('day.yesterday');
    if (n === 2 && lang === 'ko') return t('day.dayAfter');
    if (n > 1 && n < 7) return weekdayLong(U.dow(s));
    return dateShort(s);
  }

  /* 문장 안에 끼울 때: 영어는 'Today' → 'today' ('Due today'처럼 첫 글자만 대문자 규칙 지키기) */
  function relDayIn(s) {
    var r = relDay(s), n = U.diffDays(U.today(), s);
    return lang === 'en' && n >= -1 && n <= 2 ? r.charAt(0).toLowerCase() + r.slice(1) : r;
  }

  return { t: t, lang: lang, locale: locale, relDayIn: relDayIn, dateLong: dateLong, dateShort: dateShort, dateNoWeek: dateNoWeek,
    monthTitle: monthTitle, time: time, weekday: weekday, weekdayLong: weekdayLong, relDay: relDay };
})();

</script>
<script>
/* 데이터 형식 — 처음부터 '나중에 동기화를 붙일 수 있는' 모양으로 저장한다.
   모든 할 일 · 목록: id(기기마다 겹치지 않음) · updatedAt · deletedAt(지운 표시, 30일 뒤 정리).
   형식이 바뀌면 VERSION을 올리고 migrate()에 옛 형식 → 새 형식 한 단계를 더한다. */
App.model = (function () {
  'use strict';
  var U = App.util;
  var VERSION = 1;
  var PURGE_DAYS = 30;
  /* 초록은 '했다'의 색이라 목록 색에서 뺀다 (목록 점 초록이 끝낸 일과 헷갈림 · 디자인 조수 5차 6번). 옛 데이터의 green은 migrate가 teal로 */
  /* 새 목록은 이 순서로 색을 받는다 — 주 색(귤색)과 비슷한 orange는 뒤로 (목록 점이 단추처럼 보이지 않게 · UI 채점 6차 ⑧) */
  var LIST_COLORS = ['blue', 'teal', 'violet', 'pink', 'yellow', 'orange', 'gray'];

  function defaultSettings() {
    return {
      doneMode: 'keep',     /* keep = 그 자리에 두기(기본 · 사용자 요구) · bottom = 아래로 모으기 · hide = 끝내면 숨기기 */
      theme: 'system',      /* system · light · dark */
      weekStart: 0,         /* 0 = 일요일 · 1 = 월요일 */
      haptic: true,
      textSize: 'md',       /* sm · md · lg · xl — 첫 실행 안내 · 설정에서 고름 */
      onboarded: false,     /* 첫 실행 안내를 마쳤거나 건너뛰었나 */
      installTipClosed: false,
      installHintShown: false   /* 아이폰 '홈 화면에 추가해야 알림' 안내를 한 번 보였나 */
    };
  }

  function empty() { return { v: VERSION, tasks: [], lists: [], settings: defaultSettings(), meta: { createdAt: U.now() } }; }

  function newTask(f) {
    var now = U.now();
    var t = {
      id: U.uid(), title: '', note: '', listId: null,
      date: null,     /* 할 날 'YYYY-MM-DD' — 반복이면 시작 날 */
      time: null,     /* 'HH:MM' */
      due: null,      /* 언제까지 */
      remind: null,   /* 몇 분 전에 알릴지 · null = 안 알림 (시간을 넣으면 0 = 정시가 기본) */
      priority: 0,    /* 0 없음 · 1 낮음 · 2 보통 · 3 높음 */
      repeat: null,   /* { freq: 'day'|'week'|'month', every: n, days: [0~6] } — repeat.js */
      subtasks: [],   /* [{ id, title }] */
      done: {},       /* { 날짜열쇠: 끝낸 시각 } — 반복 없으면 열쇠는 'once' */
      subDone: {},    /* { 날짜열쇠: [세부 id] } */
      skip: {},       /* 반복에서 '이번만 건너뛰기' 한 날 { 날짜: 1 } */
      order: now, createdAt: now, updatedAt: now, deletedAt: null
    };
    for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) t[k] = f[k];
    return t;
  }

  function newList(f) {
    var now = U.now();
    var l = { id: U.uid(), name: '', color: 'orange', order: now, createdAt: now, updatedAt: now, deletedAt: null };
    for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) l[k] = f[k];
    return l;
  }

  /* 읽은 데이터를 지금 형식으로 맞춘다. 모르는 값은 버리지 않고 기본값만 채운다. */
  function migrate(d) {
    if (!d || typeof d !== 'object' || !Array.isArray(d.tasks)) return empty();
    /* if (d.v === 1) { …2판으로 바꾸기…; d.v = 2; } ← 형식이 바뀌면 여기에 한 단계씩 */
    var base = empty();
    d.v = VERSION;
    d.lists = Array.isArray(d.lists) ? d.lists : [];
    d.lists.forEach(function (l) { if (LIST_COLORS.indexOf(l.color) < 0) l.color = l.color === 'green' ? 'teal' : 'gray'; });
    d.settings = Object.assign(base.settings, d.settings || {});
    d.meta = d.meta || base.meta;
    d.tasks = d.tasks.filter(function (t) { return t && t.id; }).map(function (t) {
      var n = newTask({});
      Object.keys(n).forEach(function (k) { if (t[k] === undefined) t[k] = n[k]; });
      /* 옛 데이터의 반복에 붙은 '언제까지'는 버린다 — 대부분 '있던 일에 반복을 켜서 남은 것'이라 반복 끝으로 옮기면 반복이 지난 날에 끝나 사라짐 (6호 재확인 새 문제) */
      if (t.repeat && t.due) t.due = null;
      return t;
    });
    purge(d);
    return d;
  }

  function purge(d) {
    var limit = U.now() - PURGE_DAYS * 86400000;
    d.tasks = d.tasks.filter(function (t) { return !t.deletedAt || t.deletedAt > limit; });
    d.lists = d.lists.filter(function (l) { return !l.deletedAt || l.deletedAt > limit; });
    /* 정리된(없는) 목록을 가리키는 할 일은 연결만 푼다 */
    var ids = {}; d.lists.forEach(function (l) { ids[l.id] = 1; });
    d.tasks.forEach(function (t) { if (t.listId && !ids[t.listId]) t.listId = null; });
  }

  var TEXT_SCALE = { sm: 0.9, md: 1, lg: 1.15, xl: 1.4 };  /* 아주 크게 1.4 — 60대 기준 (점검원 1호 10번) */

  return { VERSION: VERSION, LIST_COLORS: LIST_COLORS, TEXT_SCALE: TEXT_SCALE, empty: empty, newTask: newTask, newList: newList, migrate: migrate, defaultSettings: defaultSettings };
})();

</script>
<script>
/* 반복 규칙 — { freq: 'day'|'week'|'month'|'year', every: n(1 이상), days: [0~6](주 반복의 요일), until?: 'YYYY-MM-DD'(반복 끝낸 날), day?: 29~31(매달 · 매년의 '몇 일' — 시작 날을 옮겼을 때만) }
   시작 날 = 할 일의 date. 달 반복은 시작 날의 '일'에 뜨고, 그 달에 그 날이 없으면 그 달 마지막 날. */
App.repeat = (function () {
  'use strict';
  var U = App.util;

  var PRESETS = {
    daily: function () { return { freq: 'day', every: 1, days: [] }; },
    weekdays: function () { return { freq: 'week', every: 1, days: [1, 2, 3, 4, 5] }; },
    weekly: function (anchor) { return { freq: 'week', every: 1, days: [U.dow(anchor)] }; },
    monthly: function () { return { freq: 'month', every: 1, days: [] }; },
    yearly: function () { return { freq: 'year', every: 1, days: [] }; }
  };

  function occursOn(rule, anchor, s) {
    if (!rule || !anchor || s < anchor) return false;
    var every = Math.max(1, rule.every || 1);
    if (rule.freq === 'day') return U.diffDays(anchor, s) % every === 0;
    if (rule.freq === 'week') {
      var days = rule.days && rule.days.length ? rule.days : [U.dow(anchor)];
      if (days.indexOf(U.dow(s)) < 0) return false;
      var weeks = Math.floor(U.diffDays(U.startOfWeek(anchor, 0), U.startOfWeek(s, 0)) / 7);
      return weeks % every === 0;
    }
    if (rule.freq === 'month' || rule.freq === 'year') {
      var a = U.parse(anchor), d = U.parse(s);
      var months = (d.getFullYear() - a.getFullYear()) * 12 + d.getMonth() - a.getMonth();
      if (months % (rule.freq === 'year' ? 12 * every : every) !== 0) return false;
      /* 31일 → 그 달 말일 · 2월 29일 → 평년 28일. day = 규칙이 지닌 '몇 일'(시작 날이 11월 30일로 옮겨져도 12월엔 31일 · 5호 8번) */
      var want = Math.min(rule.day || a.getDate(), U.daysInMonth(d.getFullYear(), d.getMonth()));
      return d.getDate() === want;
    }
    return false;
  }

  /* from(포함)부터 다음에 뜨는 날. 없으면 null. '반복 끝내기'(until) 뒤로는 찾지 않는다(점검원 1호 2번 재확인) */
  function next(rule, anchor, from) {
    var s = from < anchor ? anchor : from;
    for (var i = 0; i < 1500; i++) {
      if (rule.until && s > rule.until) return null;
      if (occursOn(rule, anchor, s)) return s; s = U.addDays(s, 1);
    }
    return null;
  }

  /* 사람 말로: 매일 · 평일마다 · 매주 화요일 · 3일마다 · 매달 15일 */
  function describe(rule, anchor) {
    var t = App.i18n.t, I = App.i18n;
    if (!rule) return '';
    var n = Math.max(1, rule.every || 1);
    if (rule.freq === 'day') return n === 1 ? t('rep.daily') : t('rep.everyNDays', { n: n });
    if (rule.freq === 'week') {
      var days = (rule.days && rule.days.length ? rule.days : [U.dow(anchor || U.today())]).slice().sort();
      if (n === 1 && days.join() === '1,2,3,4,5') return t('rep.weekdays');
      if (n === 1 && days.join() === '0,6') return t('rep.weekends');
      if (n === 1 && days.length === 7) return t('rep.daily');
      var names = days.length === 1 ? I.weekdayLong(days[0]) : days.map(function (d) { return I.weekday(d); }).join(t('rep.join'));
      return n === 1 ? t('rep.weeklyOn', { days: names }) : t('rep.everyNWeeksOn', { n: n, days: names });
    }
    if (rule.freq === 'month') {
      var day = rule.day || (anchor ? U.parse(anchor).getDate() : 1);
      return n === 1 ? t('rep.monthlyOn', { d: day }) : t('rep.everyNMonthsOn', { n: n, d: day });
    }
    if (rule.freq === 'year') {
      var an = anchor || U.today();
      /* 매년 2월 29일이 평년(2월 28일)에 옮겨져 있어도 '2월 29일'로 — 윤년 2000년에 맞춰 적음 */
      var md = I.dateNoWeek(rule.day ? '2000-' + an.slice(5, 7) + '-' + U.pad(rule.day) : an);
      return n === 1 ? t('rep.yearlyOn', { date: md }) : t('rep.everyNYearsOn', { n: n, date: md });
    }
    return '';
  }

  /* 같은 규칙인가 (끝낸 날 until은 비교에서 뺌) */
  /* day는 비교에서 뺀다 — 같은 규칙을 다시 골라도 '바뀜'으로 보지 않게(day는 tasks.update가 이어 줌) */
  function strip(r) { if (!r) return null; return { freq: r.freq, every: r.every || 1, days: (r.days || []).slice().sort() }; }
  function same(a, b) { return JSON.stringify(strip(a)) === JSON.stringify(strip(b)); }

  return { PRESETS: PRESETS, occursOn: occursOn, next: next, describe: describe, same: same };
})();

</script>
<script>
/* 할 일 규칙 — 만들기 · 고치기 · 체크 · 세부 할 일 · 목록. 화면도 기기도 모른다(데이터만 바꾼다). */
App.tasks = (function () {
  'use strict';
  var U = App.util, M = App.model, R = App.repeat;

  function find(d, id) { for (var i = 0; i < d.tasks.length; i++) if (d.tasks[i].id === id) return d.tasks[i]; return null; }
  function touch(t) { t.updatedAt = U.now(); }

  /* 반복이면 그날 날짜, 아니면 'once' */
  function keyFor(t, day) { return t.repeat ? day : 'once'; }
  function isDone(t, key) { return !!t.done[key]; }
  function doneDay(t) { return t.done.once ? U.ymd(new Date(t.done.once)) : null; }

  function add(d, f) {
    var t = M.newTask(f);
    t.title = (t.title || '').trim();
    if (t.time && !('remind' in f)) t.remind = 0;
    /* "매일 항생제 11월 10일까지" = 11월 10일까지 반복 (6호 1번) */
    if (t.repeat && t.due) t.repeat = Object.assign({}, t.repeat, { until: t.due });
    normalize(t);
    if (!t.repeat && t.date && t.due && t.due < t.date) t.due = t.date;   /* 할 날이 언제까지보다 뒤면 언제까지도 그날로 — update와 같은 규칙 (6호 재확인 4번) */
    d.tasks.push(t);
    return t;

/* 고르기 창 — 날짜 · 시간 · 알림 · 반복 · 중요도 · 목록 · 글 입력 · 확인. 고르면 onPick(값)을 부르고 닫힌다. */
App.pickers = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, ic = App.icons.svg;

  function opt(label, sub, on, click, lead) {
    return h('button.opt', { type: 'button', onclick: click, 'aria-pressed': on ? 'true' : 'false' },
      lead || null, h('span.opt-label', label), sub ? h('span.opt-sub', sub) : null,
      on ? h('span.tick', { html: ic('check', 20) }) : null);
  }

  /* 달 칸 (고르기용) */
  function monthGrid(state, selected, onPick) {
    var wrap = h('div.mini-cal');
    function draw() {
      App.dom.clear(wrap);
      var y = state.y, m = state.m, ws = App.store.data.settings.weekStart;
      var first = new Date(y, m, 1).getDay(), lead = (first - ws + 7) % 7, n = U.daysInMonth(y, m), today = U.today();
      wrap.appendChild(h('div.mini-head',
        h('button.icon-btn', { type: 'button', 'aria-label': t('cal.prev'), html: ic('chevL', 20), onclick: function () { state.m--; if (state.m < 0) { state.m = 11; state.y--; } draw(); } }),
        h('div.mini-title', I.monthTitle(y, m)),
        h('button.icon-btn', { type: 'button', 'aria-label': t('cal.next'), html: ic('chevR', 20), onclick: function () { state.m++; if (state.m > 11) { state.m = 0; state.y++; } draw(); } })));
      var grid = h('div.mini-grid');
      for (var i = 0; i < 7; i++) grid.appendChild(h('div.mini-dow', I.weekday((i + ws) % 7, 'narrow')));
      for (var k = 0; k < lead; k++) grid.appendChild(h('div'));
      for (var d = 1; d <= n; d++) (function (d) {
        var s = y + '-' + U.pad(m + 1) + '-' + U.pad(d);
        grid.appendChild(h('button.mini-day' + (s === today ? '.is-today' : '') + (s === selected ? '.is-sel' : '') + (s < today ? '.is-past' : ''),
          { type: 'button', 'aria-label': I.dateLong(s), onclick: function () { onPick(s); } }, String(d)));
      })(d);
      wrap.appendChild(grid);
    }
    draw();
    return wrap;
  }

  function date(o) {
    var today = U.today(), sel = o.value;
    var base = U.parse(sel || today), state = { y: base.getFullYear(), m: base.getMonth() };
    /* 늘 이번 달(또는 고른 날의 달)부터 — 달 끝에 다음 달을 먼저 보이면 '이번 달 남은 날'이 안 보여 헷갈림 (점검원 2호 7번) */
    var s = App.sheet.open({ title: o.title || t('prop.date'), content: function (body) {
      var quick = [
        [t('day.today'), today], [t('day.tomorrow'), U.addDays(today, 1)],
        [t('pick.weekend'), U.addDays(today, (6 - U.dow(today) + 7) % 7)],
        [t('pick.nextWeek'), U.addDays(U.startOfWeek(today, 1), 7)]
      ].filter(function (q, i, all) { return i < 2 || (q[1] !== all[0][1] && q[1] !== all[1][1]); }); /* 토요일엔 '주말' = 오늘이라 빼기 */
      body.appendChild(h('div.chips.pick-chips', quick.map(function (q) {
        return h('button.chip' + (q[1] === sel ? '.is-on' : ''), { type: 'button', onclick: function () { pick(q[1]); } }, q[0], h('span.chip-sub', I.dateNoWeek(q[1])));
      })));
      body.appendChild(monthGrid(state, sel, pick));
      if (sel && o.allowNone !== false) body.appendChild(h('button.btn.soft.block.mt', { type: 'button', onclick: function () { pick(null); } }, t('pick.none')));
    } });
    function pick(v) { s.close(true); o.onPick(v); }
  }

  function time(o) {
    var presets = ['09:00', '12:00', '18:00', '21:00'];
    var input = h('input.field.time-input', { type: 'time', value: o.value || '09:00', step: 300 });
    var s = App.sheet.open({ title: t('prop.time'), content: function (body) {
      body.appendChild(h('div.chips.pick-chips', presets.map(function (p) {
        return h('button.chip' + (p === o.value ? '.is-on' : ''), { type: 'button', onclick: function () { pick(p); } }, t('pick.time.' + p.slice(0, 2)), h('span.chip-sub', I.time(p)));
      })));
      body.appendChild(h('label.pick-label', { text: t('pick.otherTime') }));
      body.appendChild(input);
      body.appendChild(h('div.pick-actions',
        o.value ? h('button.btn.soft', { type: 'button', onclick: function () { pick(null); } }, t('pick.removeTime')) : null,
        h('button.btn.primary', { type: 'button', onclick: function () { if (input.value) pick(input.value); } }, t('common.done'))));
    } });
    function pick(v) { s.close(true); o.onPick(v); }
  }

  function remind(o) {
    var s = App.sheet.open({ title: t('prop.remind'), content: function (body) {
      var hasTime = o.hasTime !== false;
      (hasTime ? App.reminders.OPTIONS : App.reminders.OPTIONS_NO_TIME).concat([null]).forEach(function (m) {
        body.appendChild(opt(App.reminders.label(m, hasTime), null, m === o.value, function () { s.close(true); o.onPick(m); }));
      });
      if (App.platform.notify.kind === 'foreground') body.appendChild(h('p.prop-note', { text: t('notify.foregroundNote') }));
    } });
  }

  function repeat(o) {
    var R = App.repeat, anchor = o.anchor || U.today(), cur = o.value;
    /* 지금 규칙이 '몇 일'(31일 · 2월 29일)을 지니면 같은 종류 칸도 그 날로 — 시작 날이 11월 30일로 옮겨져도 '매달 31일'에 체크 (5호 재확인) */
    function keepDay(r) { return cur && cur.day && cur.freq === r.freq ? Object.assign(r, { day: cur.day }) : r; }
    var monthly = keepDay(R.PRESETS.monthly()), yearly = keepDay(R.PRESETS.yearly());
    var presets = [
      [t('rep.none'), null],
      [t('rep.daily'), R.PRESETS.daily()],
      [t('rep.weekdays'), R.PRESETS.weekdays()],
      [R.describe(R.PRESETS.weekly(anchor), anchor), R.PRESETS.weekly(anchor)],
      [R.describe(monthly, anchor), monthly],
      [R.describe(yearly, anchor), yearly]   /* 생일 · 기념일 (점검원 1호 7번) */
    ];
    var s = App.sheet.open({ title: t('prop.repeat'), content: function (body) {
      var isPreset = false;
      presets.forEach(function (p) {
        var on = R.same(p[1], cur); if (on) isPreset = true;
        body.appendChild(opt(p[0], null, on, function () { s.close(true); o.onPick(p[1]); }));
      });
      body.appendChild(opt(t('rep.custom'), !isPreset && cur ? R.describe(cur, anchor) : null, !isPreset && !!cur, function () { s.close(true); custom(o, anchor); }));
    } });
  }

  function custom(o, anchor) {
    var R = App.repeat, cur = o.value || { freq: 'week', every: 1, days: [U.dow(anchor)] };
    var st = { freq: cur.freq, every: cur.every || 1, days: (cur.days && cur.days.length ? cur.days : [U.dow(anchor)]).slice() };
    App.sheet.open({ title: t('rep.custom'), content: function (body, api) {
      var preview = h('p.rep-preview');
      var num = h('input.field.num-input', { type: 'number', inputmode: 'numeric', min: 1, max: 99, value: st.every, 'aria-label': t('rep.every') });
      num.addEventListener('input', function () { st.every = Math.max(1, Math.min(99, parseInt(num.value, 10) || 1)); draw(); });
      var seg = h('div.seg');
      var days = h('div.dow-row');
      function draw() {
        App.dom.clear(seg);
        ['day', 'week', 'month', 'year'].forEach(function (f) {
          seg.appendChild(h('button', { type: 'button', 'aria-pressed': st.freq === f ? 'true' : 'false', onclick: function () { st.freq = f; draw(); } }, t('rep.unit.' + f, { n: st.every })));
        });
        App.dom.clear(days);
        days.hidden = st.freq !== 'week';
        var ws = App.store.data.settings.weekStart;
        for (var i = 0; i < 7; i++) (function (d) {
          days.appendChild(h('button.dow' + (st.days.indexOf(d) >= 0 ? '.is-on' : ''), { type: 'button', 'aria-pressed': st.days.indexOf(d) >= 0 ? 'true' : 'false',
            onclick: function () { var k = st.days.indexOf(d); if (k >= 0 && st.days.length > 1) st.days.splice(k, 1); else if (k < 0) st.days.push(d); draw(); } }, I.weekday(d, 'narrow')));
        })((i + ws) % 7);
        preview.textContent = R.describe(rule(), anchor);
      }
      function rule() { return { freq: st.freq, every: st.every, days: st.freq === 'week' ? st.days.slice().sort() : [] }; }
      body.appendChild(h('div.rep-every', h('span', { text: t('rep.everyLabel') }), num, seg));
      body.appendChild(days);
      body.appendChild(preview);
      body.appendChild(h('button.btn.primary.block.mt', { type: 'button', onclick: function () { api.close(true); o.onPick(rule()); } }, t('common.done')));
      draw();
    } });
  }

  function priority(o) {
    var s = App.sheet.open({ title: t('prop.priority'), content: function (body) {
      [3, 2, 1, 0].forEach(function (p) {
        body.appendChild(opt(t('prio.' + p), null, p === o.value, function () { s.close(true); o.onPick(p); },
          h('span.prio-dot.p' + p, { 'aria-hidden': 'true' })));
      });
    } });
  }

  function list(o) {
    var d = App.store.data;
    var s = App.sheet.open({ title: t('prop.list'), content: function (body) {
      body.appendChild(opt(t('list.none'), null, !o.value, function () { s.close(true); o.onPick(null); }, h('span.list-dot.c-none')));
      d.lists.filter(App.tasks.alive).forEach(function (l) {
        body.appendChild(opt(l.name, null, l.id === o.value, function () { s.close(true); o.onPick(l.id); }, h('span.list-dot.c-' + l.color)));
      });
      body.appendChild(h('button.opt.opt-add', { type: 'button', onclick: function () {
        s.close(true);
        text({ title: t('list.new'), placeholder: t('list.namePh'), onDone: function (name) {
          var l = App.store.commit(function (dd) { return App.tasks.addList(dd, name); });
          o.onPick(l.id);
        } });
      } }, h('span', { html: ic('plus', 20) }), h('span.opt-label', t('list.new'))));
    } });
  }

  function text(o) {
    var input = h('input.field', { type: 'text', value: o.value || '', placeholder: o.placeholder || '', enterkeyhint: 'done', maxlength: 40 });
    var s = App.sheet.open({ title: o.title, focus: input, content: function (body) {
      body.appendChild(input);
      body.appendChild(h('button.btn.primary.block.mt', { type: 'button', onclick: done }, t('common.done')));
    } });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); done(); } });
    function done() { var v = input.value.trim(); if (!v) { input.focus(); return; } s.close(true); o.onDone(v); }
  }

  function confirm(o) {
    var s = App.sheet.open({ title: o.title, content: function (body) {
      if (o.text) body.appendChild(h('p.confirm-text', { text: o.text }));
      body.appendChild(h('div.pick-actions',
        h('button.btn.soft', { type: 'button', onclick: function () { s.close(true); } }, o.cancel || t('common.cancel')),
        h('button.btn.primary', { type: 'button', onclick: function () { s.close(true); o.onOk(); } }, o.ok || t('common.ok'))));
    } });
  }

  return { date: date, time: time, remind: remind, repeat: repeat, priority: priority, list: list, text: text, confirm: confirm, opt: opt };
})();

<script>
/* 할 일 한 줄 — 모든 화면(오늘 · 캘린더 · 목록)이 같이 쓴다.
   체크: 동그라미가 초록으로 차고 체크가 그려진 뒤(약 0.2초) 저장 → 줄 긋기 없이 색으로 '했다'. */
App.row = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, S = App.store, ic = App.icons.svg;
  var open = {};  /* 펼친 세부 할 일: 'id|key' → true */

  function dueBadge(due) {
    var n = U.diffDays(U.today(), due);
    if (n < 0) {
      /* 해가 바뀐 지난 언제까지는 연도까지 — '12월 28일까지'가 앞으로 올 날로 읽히지 않게 (3호 작은 것) */
      var dd = U.parse(due), other = dd.getFullYear() !== U.parse(U.today()).getFullYear();
      var label = other ? new Intl.DateTimeFormat(I.lang, { year: 'numeric', month: 'long', day: 'numeric' }).format(dd) : I.dateNoWeek(due);
      return h('span.badge', t('due.until', { date: label }));
    }   /* '지남' 도장 대신 날짜만 — 날짜를 보면 지난 줄 앎 (감성 검토 10-31) */
    if (n === 0) return h('span.badge.is-soon', t('due.today'));
    if (n === 1) return h('span.badge.is-soon', t('due.tomorrow'));
    return h('span.badge', t('due.until', { date: I.dateNoWeek(due) }));
  }

  function meta(it, o) {
    var task = it.task, out = [], d = S.data;
    if (it.ended) out.push(h('span.meta', t('rep.endedOn', { date: I.dateNoWeek(task.repeat.until) })));   /* 목록 '끝낸 일'의 끝낸 반복 */
    else if (o.showDay && !it.noDay) out.push(h('span.meta', I.relDay(it.day)));
    else if (o.late && task.date) out.push(h('span.meta.is-late', I.relDay(task.date)));
    /* 중요도: 동그라미 색이 아니라 작은 글자로(주 색과 헷갈리지 않게 · 오푸스 조수 1차) */
    if (task.priority === 3) out.push(h('span.meta.prio.p3', { html: ic('flag', 13) }, t('prio.3')));  /* 줄에는 '높음'만 — 보통 · 낮음은 자세히에서 (조수 2차) */
    if (task.time) out.push(h('span.meta', { html: ic('clock', 13) }, I.time(task.time)));
    if (task.repeat) {
      /* '반복' 묶음 안에서는 '매일'을 적지 않는다 — 묶음 이름이 이미 말해 줌, 8번 되풀이되면 시끄러움. 매주 화목 · 3일마다처럼 정보가 되는 것만 (디자인 조수 5차 · 2호 2번) */
      var desc = App.repeat.describe(task.repeat, task.date);
      if (o.inRepeat && desc === t('rep.daily')) { /* 묶음 이름이 이미 말함 */ }
      else if (o.dayView && desc === t('rep.daily')) out.push(h('span.meta', { html: ic('repeat', 13), 'aria-label': desc, title: desc }));   /* 하루 흐름 속 매일 반복은 아이콘만 */
      else out.push(h('span.meta', { html: ic('repeat', 13), 'aria-label': t('prop.repeat') }, desc));
    }
    if (task.subtasks.length) out.push(h('span.meta', t('row.subCount', { done: T.subDoneCount(task, it.key), total: task.subtasks.length })));
    if (task.note) out.push(h('span.meta', { html: ic('note', 13), 'aria-label': t('prop.note') }));
    if (task.listId && !o.hideList) {
      var l = T.list(d, task.listId);
      if (l) out.push(h('span.meta', h('span.dot.bg-' + l.color), l.name));
    }
    if (task.due && !(task.date === task.due)) out.push(dueBadge(task.due));
    /* 끝나는 날이 정해진 반복: '11월 10일까지' (6호 1번) */
    if (task.repeat && task.repeat.until && !task.repeat.ended && task.repeat.until >= U.today() && !it.ended) out.push(h('span.badge', t('due.until', { date: I.dateNoWeek(task.repeat.until) })));
    return out.length ? h('div.task-meta', out) : null;
  }

  function render(it, o) {
    o = o || {};
    var task = it.task, key = it.key, done = T.isDone(task, key), id = task.id + '|' + key;
    var hideMode = S.data.settings.doneMode === 'hide';
    var check = h('button.check', { type: 'button', role: 'checkbox', 'aria-checked': done ? 'true' : 'false', 'aria-label': task.title, html: App.icons.CHECK });
    var expand = task.subtasks.length ? h('button.task-expand' + (open[id] ? '.is-open' : ''), { type: 'button', 'aria-label': t('row.subtasks'), 'aria-expanded': open[id] ? 'true' : 'false', html: ic('chevD', 18) }) : null;
    var body = h('div.task-body', { tabindex: 0, role: 'button', onclick: function () { if (Date.now() < menuAt) return; App.detail.open(task.id, key); },
        onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); App.detail.open(task.id, key); } } },  /* 노트북: 탭 · 엔터로 열기 */
        h('div.task-title', task.title || t('row.untitled')), meta(it, o));
    longPress(body, function () { menu(it); });
    var row = h('div.task' + (done ? '.is-done' : ''), check, body, expand);
    var subs = h('div.subs', { hidden: !open[id] });
    var box = h('div.task-wrap', row, subs);
    if (open[id]) drawSubs(subs, task, key);

    check.addEventListener('click', function (e) {
      e.stopPropagation();
      var willDone = !row.classList.contains('is-done');
      row.classList.toggle('is-done', willDone);
      check.setAttribute('aria-checked', willDone ? 'true' : 'false');
      if (willDone) { row.classList.add('is-checking'); App.platform.haptic.success(); } else App.platform.haptic.tap();
      if (willDone && hideMode) row.classList.add('is-leaving');
      setTimeout(function () {
        var leave = willDone && hideMode;
        S.commit(function (d) { T.toggle(d, task.id, key); }, leave ? { undo: true } : undefined);
        /* '끝낸 일 숨기기'에서는 줄이 사라지니 실수 체크를 바로 되돌릴 수 있게 (점검원 2호 11번) */
        if (leave) App.toast.show(t('row.doneHidden'), { action: t('common.undo'), onAction: S.undo });
      }, willDone && hideMode ? 680 : 220);
    });
    if (expand) expand.addEventListener('click', function (e) {
      e.stopPropagation();
      open[id] = !open[id];
      expand.classList.toggle('is-open', !!open[id]); expand.setAttribute('aria-expanded', open[id] ? 'true' : 'false');
      subs.hidden = !open[id];
      if (open[id]) drawSubs(subs, task, key);
    });
    return box;
  }

  /* 길게 누르기(휴대폰) · 오른쪽 클릭(노트북) → 빠른 날짜 메뉴. 자세히 창을 열지 않고 '내일로 미루기'가 한 번에 (사용자 10-31 '날짜 연장 · 축소 등 실제 관리 편의') */
  /* menuAt = 이 시각까지는 누르기(click)를 삼킴. 메뉴가 뜬 누름에서는 손을 뗄 때(pointerup) 시각을 정한다 —
     손을 늦게 떼도(1초 넘게) 뒤따르는 누르기가 자세히 창을 또 열지 않게 (2호 재확인 새 2번) */
  var menuAt = 0;
  function longPress(el, fn) {
    var timer = null, x0 = 0, y0 = 0, fired = false, firedAt = 0, touching = false;
    /* fn()이 false면(열 메뉴가 없음 — 끝낸 반복 회차) 진동 · 누르기 막기 없이 그냥 둔다 → 손을 떼면 평소처럼 자세히 창이 열림 (4호 재확인 새 문제) */
    function fire() { timer = null; if (Date.now() - firedAt < 700) return; if (fn() === false) return; fired = true; firedAt = Date.now(); menuAt = Date.now() + 2000;   /* 손 뗌 신호가 안 와도(누른 채 줄이 다시 그려짐) 2초 뒤엔 풀림 (2호 재확인) */ App.platform.haptic.tap(); }
    function stop() { clearTimeout(timer); timer = null; }
    function release() { stop(); touching = false; if (fired) { fired = false; menuAt = Date.now() + 450; } }
    el.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse') return;
      touching = true; x0 = e.clientX; y0 = e.clientY; stop(); timer = setTimeout(fire, 480);
    });
    el.addEventListener('pointermove', function (e) { if (timer && (Math.abs(e.clientX - x0) > 8 || Math.abs(e.clientY - y0) > 8)) stop(); });
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release);
    /* 오른쪽 클릭(마우스)은 바로 열고 바로 풀어 줌. 안드로이드 길게 누르기도 contextmenu를 보내지만 그때는 손을 뗄 때 풀림 */
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); stop(); fire(); if (!touching) release(); });
  }

  function menu(it) {
    if (it.task.repeat && T.isDone(it.task, it.key)) return false;   /* 끝낸 회차는 건너뛸 것이 없음 — 기록을 지우지 않게 (4호 2번) */
    var task = it.task, P = App.pickers, today = U.today(), tomorrow = U.addDays(today, 1), nextMon = U.addDays(U.startOfWeek(today, 1), 7);
    function move(day) {
      S.commit(function (d) {
        var patch = { date: day };
        if (!day) patch.time = null;   /* '날짜 빼기'면 시간도 (시간만 남으면 날짜가 다시 생김) */
        if (day && task.due && task.due < day) patch.due = day;   /* 할 날을 언제까지 뒤로 미루면 언제까지도 같이 (어긋나지 않게) */
        T.update(d, task.id, patch);
      }, { undo: true });
      App.toast.show(day ? t('menu.movedTo', { date: I.relDayIn(day) }) : t('menu.unscheduled'), { action: t('common.undo'), onAction: S.undo });
    }
    var s = App.sheet.open({ title: task.title, content: function (b) {
      function opt(label, sub, fn) { b.appendChild(P.opt(label, sub, false, function () { s.close(true); fn(); })); }
      if (task.repeat) {
        opt(t('menu.skip'), I.dateNoWeek(it.day), function () {
          S.commit(function (d) { T.skip(d, task.id, it.day); }, { undo: true });
          App.toast.show(t('detail.skipped', { date: I.dateNoWeek(it.day) }), { action: t('common.undo'), onAction: S.undo });
        });
      } else {
        if (!task.date || task.date < today) opt(t('menu.today'), I.dateNoWeek(today), function () { move(today); });
        if (task.date !== tomorrow) opt(t('menu.tomorrow'), I.dateNoWeek(tomorrow), function () { move(tomorrow); });
        /* 일요일엔 다음 주 월요일 = 내일 → 같은 날 두 줄이 되지 않게 (5호 6번) */
        if (task.date !== nextMon && nextMon !== tomorrow) opt(t('menu.nextWeek'), I.dateNoWeek(nextMon), function () { move(nextMon); });
        opt(t('menu.pick'), null, function () { P.date({ value: task.date, onPick: function (v) { move(v); } }); });
      }
      /* 맨 아래 '자세히 보기' — 천천히 누르다 메뉴가 떠도 닫고 다시 누르지 않게 (5호 5번) */
      opt(t('menu.open'), null, function () { App.detail.open(task.id, it.key); });
    } });
  }

  function drawSubs(box, task, key) {
    App.dom.clear(box);
    task.subtasks.forEach(function (s) {
      var on = T.isSubDone(task, key, s.id);
      var c = h('button.check.sm' + (on ? '.is-on' : ''), { type: 'button', role: 'checkbox', 'aria-checked': on ? 'true' : 'false', 'aria-label': s.title, html: App.icons.CHECK });
      var line = h('div.sub' + (on ? '.is-done' : ''), c, h('span.sub-title', s.title));
      c.addEventListener('click', function () {
        var will = !c.classList.contains('is-on');
        c.classList.toggle('is-on', will); line.classList.toggle('is-done', will);
        App.platform.haptic.tap();
        setTimeout(function () {
          var r = S.commit(function (d) { return T.toggleSub(d, task.id, s.id, key); }, { undo: true });
          if (r && r.parentDone) App.toast.show(t('row.allSubsDone'), { action: t('common.undo'), onAction: S.undo });
        }, 200);
      });
      box.appendChild(line);
    });
  }

  /* 묶음(제목 + 카드) */
  function section(label, items, o) {
    o = o || {};
    if (!items.length && !o.keepEmpty) return null;
    return h('section.section',
      label ? h('div.section-head', h('span.section-label', label), o.count != null ? h('span.section-count.num', String(o.count)) : null, o.action || null) : null,
      items.length ? h('div.card', items.map(function (it) { return render(it, o); })) : (o.empty || null),
      o.after || null);
  }

  /* 하루 묶기 — 오늘 화면 · 캘린더 고른 날이 같이 쓴다: 그날만의 일(이름표 없이 맨 위) → '반복'(끝낸 수/전체).
     반복이 그날 일정을 묻지 않게 (TickTick 습관 · Things 묶음 사례 · 디자인 조수 5차). 끝낸 반복도 그 자리에 초록으로 남음(접지 않음) */
  function dayGroups(items, o) {
    o = o || {};
    /* 시간이 정해진 반복(오전 7:30 스킨케어 등)은 그날 일에 시간 순서로 섞는다 — 하루가 한 줄로 읽히게. '반복' 묶음엔 시간 없는 반복만 (UI 채점 8차 2번) */
    var once = items.filter(function (it) { return !it.task.repeat || it.task.time; }), rep = items.filter(function (it) { return it.task.repeat && !it.task.time; });
    /* (되돌림) 반복 묶음에서 끝낸 것을 아래로 내리던 것은 뺐다 — 설정 '끝낸 일: 그 자리에'와 어긋나고, 체크한 자리에 다음 줄이 올라와 손이 느린 사람이 잘못 누름 (3호 5번).
       아래로 모으고 싶으면 설정 '아래로' (query.sort가 처리) */
    /* 머리에 '3/8' 같은 분수는 두지 않는다 — 끝낸 것이 아래로 초록으로 모이는 모양이 이미 진행을 보여 줌(사용자 10-31 '너무 이과적이면 거부감').
       다 했을 때만 '반복 · 다 했어요'. 다 했는지는 거르기 전 목록(o.all)으로 본다(숨기기 모드 · 2호 재확인) */
    var repAll = (o.all || items).filter(function (it) { return it.task.repeat && !it.task.time; });   /* 묶음에 있는 것(시간 없는 반복)만으로 '다 했어요' 판정 */
    var allDone = repAll.length && repAll.every(function (it) { return T.isDone(it.task, it.key); });
    return [
      section(o.onceLabel || '', once, Object.assign({}, o, { dayView: true })),
      section(allDone ? t('sec.repeat') + ' · ' + t('sec.repeatAllDone') : t('sec.repeat'), rep, Object.assign({}, o, { inRepeat: true, hideList: true }))
    ].filter(Boolean);
  }

  /* 지난 일 — 오늘 화면 · 목록 화면이 같이 쓰는 접힌 한 줄 (맨 아래 · 빨간색 없음 · 한 번에 오늘로).
     숫자는 '안 끝낸 것'만, 언제까지가 지난 일이 있으면 보조 글로 알려 줌 (점검원 1호 14 · 16번) */
  function lateFold(items, state, o) {
    if (!items.length) return null;
    var open = items.filter(function (it) { return !T.isDone(it.task, it.key); });
    /* '언제까지 지남 n' 보조 글은 뺐다(숫자 줄이기 · 10-31) — 펼치면 줄마다 '지남' 표시가 이미 있음 */
    return h('section.section.late-sec',
      h('div.section-head',
        h('button.fold-btn', { type: 'button', 'aria-expanded': state.open ? 'true' : 'false', onclick: function () { state.open = !state.open; App.render(); } },
          /* 접혀 있을 때는 '지난 일'만 — 매일 아침 쌓인 개수가 먼저 보이면 다그침 (감성 검토 10-31). 개수는 펼치면 단추에 */
          h('span.section-label', t('sec.overdue')),
          h('span.fold-chev' + (state.open ? '.is-open' : ''), { html: ic('chevD', 16) })),
        /* '다 오늘로 옮기기'는 펼쳤을 때만 — 접힌 채 맨 위에 늘 떠 있으면 아침마다 재촉처럼 느껴짐 (사용자 10-31 '혼내듯 압박 X') */
        open.length && state.open ? h('button.section-action.is-quiet', { type: 'button', onclick: function () {
          S.commit(function (d) { T.moveToDay(d, open.map(function (it) { return it.task.id; }), U.today()); }, { undo: true });
          App.toast.show(t('today.movedAll', { n: open.length }), { action: t('common.undo'), onAction: S.undo });
        } }, t('today.moveAllN', { n: open.length })) : null),
      state.open ? h('div.card', items.map(function (it) { return render(it, Object.assign({ late: true }, o || {})); })) : null,
      /* 오래 쌓인 지난 일은 '날짜 빼고 언제든으로'도 — 다 오늘로 옮기면 오늘 화면이 넘칠 때 (4호 7번 · 되돌리기 있음) */
      state.open && open.length > 1 ? h('div.late-more', h('button.text-btn.sm', { type: 'button', onclick: function () {
        S.commit(function (d) { T.clearDates(d, open.map(function (it) { return it.task.id; })); }, { undo: true });
        App.toast.show(t('today.clearedN', { n: open.length }), { action: t('common.undo'), onAction: S.undo });
      } }, t('today.clearAll'))) : null);
  }

  /* 그날 건너뛴 반복 — 흐린 한 줄 '{이름} 건너뜀 · 다시 넣기' (되돌리기 띠를 놓쳐도 되살릴 수 있게 · 4호 2번) */
  function skipped(day) {
    var list = S.data.tasks.filter(function (k) { return !k.deletedAt && k.repeat && k.skip[day]; });
    if (!list.length) return null;
    return h('div.skipped', list.map(function (k) {
      return h('div.skipped-row', h('span.skipped-title', t('row.skippedOn', { title: k.title })),
        h('button.text-btn.sm', { type: 'button', onclick: function () { S.commit(function (d) { T.unskip(d, k.id, day); }); } }, t('row.unskip')));
    }));
  }

  return { render: render, section: section, dayGroups: dayGroups, dueBadge: dueBadge, lateFold: lateFold, skipped: skipped };
})();

</script>
<script>
/* 오늘 (첫 화면) — 오늘 날짜 · 오늘 한 비율 · [지난 일 · 오늘 · 언제든]. 지난 일은 빨간색 없이, 한 번에 오늘로. */
App.screens = App.screens || {};
App.screens.today = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, Q = App.query, S = App.store, ic = App.icons.svg;
  var showDone = false, lateState = { open: false };

  /* 오늘 한 만큼 — 고리 그림 대신 사람 말 한 줄 ("3개 중 1개 했어요", 끝낸 수만 초록) · AI 티 진단 10-31 */
  function progress(done, total, allDone) {
    if (!total && !done) return null;
    if (allDone) return h('p.progress.is-full', t('today.allDoneN', { n: total }));
    if (!done) return h('p.progress', t('today.planned', { n: total }));   /* 아침: "15개 중 0개 했어요" 대신 "오늘 할 일 15개" — 빈칸 실패감 없이 (정체성 설계 10-31) */
    /* 분모 없이 '한 것'만: "3개 했어요" — 15개 중 몇 개라는 계산기 인상 대신 진전만 (사용자 10-31 '너무 이과적이면 거부감') */
    var parts = t('today.progressText').split('{done}');
    return h('p.progress', parts[0], h('b.num', String(done)), parts[1] || '');
  }

  /* 그날 칸 색 단계 — 캘린더 칠하기와 같은 셈(Q.dayStats: 그날 자리의 일 + 그날 끝낸 다른 날 일 · 80% 이상 = 거의 다).
     밀린 일을 오늘 몰아서 끝내도 오늘 네모가 물든다 (5호 1번) */
  function markLevel(day) {
    var s = Q.dayStats(S.data, day);
    return s.total && s.done / s.total >= 0.8 ? '.is-full' : s.done ? '.is-some' : '';
  }

  /* 머리말 한 줄 = [오늘 칸 색 네모] + 문장 */
  function progressRow(done, total, allDone) {
    var p = progress(done, total, allDone); if (!p) return null;
    /* 누르는 단추가 아니라 표시만 — 단추인 줄 알 수 없고 잘못 누르면 화면이 넘어가서 (4호 재확인) */
    var mark = h('span.day-mark' + markLevel(U.today()), { 'aria-hidden': 'true' });
    return h('div.progress-row', mark, p);
  }

  function installTip(d) {
    var info = App.platform.info;
    if (!info.isIOS || info.standalone || d.settings.installTipClosed) return null;
    return h('div.banner',
      h('span', { html: ic('share', 22), style: { color: 'var(--accent-ink)' } }),
      h('div.banner-body', h('b', t('install.title')), h('br'), t('install.text')),
      h('button.icon-btn', { type: 'button', 'aria-label': t('common.close'), html: ic('x', 18), onclick: function () { S.commit(function (dd) { dd.settings.installTipClosed = true; }); } }));
  }

  function render(main) {
    var d = S.data, v = Q.todayView(d), st = d.settings, today = U.today();
    var all = v.overdue.concat(v.today, v.anytime);
    /* '했어요' = 오늘 끝낸 것 전부(지난 일 · 언제든 · 앞날 일 미리 포함) — '오늘 한 일' 창 · 오늘 네모와 같은 셈 (3호 10번 · 5호 1번).
       '다 했어요'는 오늘 칸을 다 끝냈을 때 */
    var doneN = doneLog(today).length, total = v.today.length;
    var todayAllDone = total > 0 && v.today.every(Q.done);

    var screen = h('div.screen');
    /* 머리: 작은 머리말 없이 "10월 31일 토" — 요일은 보조 색 (아래 탭이 이미 '오늘'을 말함) */
    /* 오른쪽 위 돋보기: 휴대폰에서 찾기가 목록 탭에만 숨어 있지 않게 (점검원 2호 10번) */
    screen.appendChild(h('header.page-head.is-top',
      h('div.head-main',
        h('h1.title', I.dateNoWeek(today), h('span.title-sub', I.weekday(U.dow(today)))),
        progressRow(doneN, total, todayAllDone)),
      h('div.head-actions', h('button.icon-btn', { type: 'button', 'aria-label': t('search.title'), html: ic('search', 22), onclick: App.screens.lists.search }))));

    var tip = installTip(d); if (tip) screen.appendChild(tip);

    if (!all.length) {
      screen.appendChild(h('div.empty',
        h('div.empty-mark', { html: ic('check', 30) }),
        h('p.empty-title', t('today.emptyTitle')), h('p.empty-text', t('today.emptyText'))));
      main.appendChild(screen);
      return;
    }

    var hiddenTotal = 0;
    function part(items, newest) { var r = Q.visible(Q.sort(items, st, newest), st, showDone); hiddenTotal += r.hidden; return r.items; }

    /* 시간 없는 일끼리는 새것이 위 (방금 적은 '은행 서류'가 오래된 일 아래로 묻히지 않게 · 점검원 1호 8번 · 2호 1번) */
    var late = part(v.overdue), now = part(v.today, true), anytime = part(v.anytime, true);
    if (!late.length && !now.length && !anytime.length) {
      screen.appendChild(h('div.empty',
        h('div.empty-mark', { html: ic('check', 30) }),
        h('p.empty-title', t('today.allDoneTitle')), h('p.empty-text', t('today.allDoneText'))));
    }
    /* 순서: (새벽 4시 전이면 '어제') → 지난 일(머리말 아래 접힌 띠) → 오늘 그날만의 일(시간 순) → 반복 → 언제든 → 하루 닫기 */
    /* 지난 일은 머리말 바로 아래 접힌 회색 한 줄 — 반복 8줄 아래에 묻혀 '앱을 못 믿겠다'가 되지 않게 (빨강 · 펼침 없이 · UI 채점 6차 ①) */
    /* 새벽 4시 전에는 어제 일을 접지 않고 '어제' 묶음으로 펼쳐 둔다 — 자정을 넘겨 정리하던 일이 0시에 접힌 '지난 일' 속으로 사라지지 않게 (6호 2번).
       하루 경계는 바꾸지 않는다(자정 = 새 날짜). 정리 창도 같은 4시 기준('어제 정리하기') */
    if (new Date(U.now()).getHours() < 4) {
      var yd = U.addDays(today, -1);
      var isY = function (it) { return it.task.date === yd || (!it.task.date && it.task.due === yd); };
      late = late.filter(function (it) { return !isY(it); });
      /* 어제 칸 전체(끝낸 일 · 어제 반복 포함) — 0시에 반복 · 끝낸 일만 빠져 화면이 반쯤 바뀌지 않게 (6호 재확인 2번). 체크는 어제 회차에 */
      /* 어제 시작 · 오늘까지 이어지는 기간 일은 오늘 묶음에만 (두 번 안 나오게 · 6호 재확인 2차) */
      var inToday = {}; v.today.forEach(function (it) { inToday[it.task.id] = 1; });
      var ySec = App.row.section(t('day.yesterday'), part(Q.forDay(d, yd).filter(function (it) { return !inToday[it.task.id]; })), {}); if (ySec) screen.appendChild(ySec);
    }
    var fold = App.row.lateFold(late, lateState); if (fold) screen.appendChild(fold);
    App.row.dayGroups(now, { all: v.today }).forEach(function (sec) { screen.appendChild(sec); });
    var sk = App.row.skipped(today); if (sk) screen.appendChild(sk);
    var any = App.row.section(t('sec.anytime'), anytime); if (any) screen.appendChild(any);   /* 빈 묶음은 null */

    if (hiddenTotal || (showDone && st.doneMode === 'hide')) {
      screen.appendChild(h('button.show-done', { type: 'button', onclick: function () { showDone = !showDone; App.render(); } },
        showDone ? t('done.hide') : t('done.show', { n: hiddenTotal })));
    }
    var close = dayClose(d, v); if (close) screen.appendChild(close);
    main.appendChild(screen);
  }

  /* 하루 닫기 — 맨 아래 조용한 한 줄. 묻지도 알리지도 않는다(안 눌러도 아무 일 없음).
     왼쪽 '오늘 한 일': 끝낸 것을 끝낸 시각 순서로 — 그날의 한 장 (다꾸 '다시 보는 시간' · 진전 원리).
     오른쪽 '남은 일 내일로'(저녁 6시부터): 못 끝낸 일을 '언제 할지' 정해 머리에서 내려놓기. 반복은 옮기지 않음(놓친 반복은 쌓지 않음).
     근거: 정체성 설계 10-31 · 기획서 10절 */
  /* 그날 한 일 — 끝낸 시각 순서(그날의 한 장). 그날 자리의 일 + 그날 끝낸 다른 날 일 */
  function doneLog(day) {
    return Q.forDay(S.data, day).filter(Q.done).concat(Q.doneOn(S.data, day))
      .sort(function (a, b) { return (a.task.done[a.key] || 0) - (b.task.done[b.key] || 0); });
  }

  /* 정리할 날: 보통은 오늘, 새벽 4시 전에는 어제 — 자정을 넘겨 하루를 닫는 사람도 '어제 정리하기'를 쓸 수 있게 (5호 4번).
     남은 일 = 그날의 반복 아닌 일 중 안 끝낸 것. 오늘이면 저녁 6시부터, 어제면 바로. 옮길 곳 = 오늘이면 내일, 어제면 오늘 */
  function closeTarget() {
    var hr = new Date(U.now()).getHours(), today = U.today();
    if (hr < 4) {
      var yd = U.addDays(today, -1), v = Q.todayView(S.data);
      var leftY = v.overdue.filter(function (it) { return !it.task.repeat && !Q.done(it) && (it.task.date === yd || (!it.task.date && it.task.due === yd)); });
      if (doneLog(yd).length || leftY.length) return { day: yd, left: leftY, to: today, yesterday: true };
    }
    var vt = Q.todayView(S.data);
    return { day: today, left: hr >= 18 ? vt.today.filter(function (it) { return !it.task.repeat && !Q.done(it); }) : [], to: U.addDays(today, 1) };
  }

  function dayClose() {
    var c = closeTarget(), doneN = doneLog(c.day).length, leftN = c.left.length;
    if (!doneN && !leftN) return null;
    var label = c.yesterday ? (leftN ? t('today.closeYesterday') : t('today.doneYesterday')) : (leftN ? t('today.closeDay') : t('today.doneToday'));
    return h('div.day-close', h('button.day-close-btn', { type: 'button', onclick: closeSheet },
      h('span', { html: ic(leftN ? 'moon' : 'check', 16) }), label));

<script>
/* 캘린더 — 달 보기. 칸마다 점 하나(다 함 · 일부 함 · 아직). 날을 누르면 그날 목록 · 그날에 바로 추가.

  function reset() { var n = U.parse(U.today()); st = { y: n.getFullYear(), m: n.getMonth(), sel: U.today() }; }

  /* 달을 넘기면 아래 목록도 그 달로: 이번 달이면 오늘, 아니면 1일 (점검원 1호 25번) */
  function move(n) {

         (정체성 '체크한 만큼 내 달력이 채워져요' · 다꾸 '다시 보는 시간' · 스트릭 대신 누적 · 10-31) */

    /* 다른 날 일을 이날 끝낸 것 — 칸이 물든 까닭이 아래에도 보이게, 원래 날짜를 달고 따로 한 묶음 (5호 1번) */

      h('h2.day-title', Math.abs(U.diffDays(U.today(), st.sel)) <= 1 ? h('span.day-rel' + (st.sel === U.today() ? '.is-today' : ''), I.relDay(st.sel)) : null, I.dateLong(st.sel)),

    var past = st.sel < U.today(), body;
    if (past && (vis.length || also)) {
      /* 지난 날 = 그날 한 일이 먼저, 남은 일은 접힌 한 줄 — 하나도 못 한 날도 펼쳐 두지 않음(실패 기록처럼 보이지 않게 · 3호 6번).

        missed.length ? h('button.fold-btn.missed-fold', { type: 'button', 'aria-expanded': missedOpen ? 'true' : 'false', onclick: function () { missedOpen = !missedOpen; App.render(); } },
          h('span.section-label', missedOpen ? t('cal.missedHide') : t('cal.missedShow')), h('span.fold-chev' + (missedOpen ? '.is-open' : ''), { html: ic('chevD', 16) })) : null,
        missed.length && missedOpen ? h('div.card', missed.map(function (it) { return App.row.render(it, {}); })) : null);
    } else {
      /* 오늘 · 앞날: 오늘 화면과 같은 묶음 — 그날만의 일 → 반복 (조수 5차 5번) */

      h('span', { html: ic('plus', 20) }), /* "내일 할 일 추가" · "11월 5일에 할 일 추가" — 오늘 · 내일 · 어제 · 모레에는 '에'를 붙이지 않음 (점검원 2호 8번) */

<script>

      screen.appendChild(h('button.show-done', { type: 'button', onclick: function () { showDoneFor[id] = !showDoneFor[id]; App.render(); } },
        showDoneFor[id] ? t('done.hide') : t('done.show', { n: hidden })));
    }
    if (v.history.length) {
      var open = !!showHistory[id];
      screen.appendChild(h('button.show-done', { type: 'button', onclick: function () { showHistory[id] = !open; App.render(); } },
        open ? t('done.hide') : t('list.history', { n: v.history.length })));
      if (open) add(App.row.section(t('sec.history'), v.history.slice(0, 100), Object.assign({ showDay: true }, o)));
    }
    main.appendChild(screen);
  }

  return { overview: overview, single: single, search: search };
})();

<script>
/* 할 일 자세히 — 고치면 바로 저장(저장 단추 없음). 세부 할 일 · 날짜 · 시간 · 알림 · 반복 · 언제까지 · 중요도 · 목록 · 메모 · 지우기.
   비어 있는 칸은 흐린 '추가'로만 보이고, 넣은 칸만 진하게 — 기본값으로 화면을 채우지 않는다. */
App.detail = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, S = App.store, P = App.pickers, ic = App.icons.svg;

  function open(id, key) {
    var task = T.find(S.data, id); if (!task) return;
    /* 체크 열쇠는 그릴 때마다 다시 정한다 (창 안에서 반복을 켜고 끄면 열쇠가 'once' ↔ 날짜로 바뀜) */
    var day = key && key !== 'once' ? key : U.today();
    key = T.keyFor(task, day);
    var props = h('div.card.props'), subsBox = h('div.subs-edit'), headBox = h('div');
    var title = h('textarea.detail-title', { rows: 1, 'aria-label': t('detail.titleLabel'), enterkeyhint: 'done', maxlength: 300 });
    title.value = task.title;
    var note = h('textarea.field.note', { rows: 3, placeholder: t('prop.notePh'), 'aria-label': t('prop.note') });
    note.value = task.note || '';

    function cur() { return T.find(S.data, id); }
    function set(patch) { S.commit(function (d) { T.update(d, id, patch); }); draw(); }
    /* 줄 끝 ×로 뺄 때는 되돌리기 띠 — 줄을 누르려다 ×를 누른 사람이 소리 없이 값을 잃지 않게 (6호 5번) */
    function clear(patch, label) {
      S.commit(function (d) { T.update(d, id, patch); }, { undo: true }); draw();
      App.toast.show(t('detail.cleared', { what: label }), { action: t('common.undo'), onAction: function () { S.undo(); draw(); } });
    }

    var sheet = App.sheet.open({ className: 'detail-sheet', title: '', content: function (body) {
      body.appendChild(headBox);
      body.appendChild(h('section.detail-block', h('div.block-label', t('prop.subtasks')), subsBox));
      body.appendChild(props);
      body.appendChild(h('section.detail-block', h('div.block-label', t('prop.note')), note));
      body.appendChild(h('button.delete-btn', { type: 'button', onclick: remove }, h('span', { html: ic('trash', 18) }), t('detail.delete')));
    } });

    /* 글은 치는 동안 0.5초마다 저장 — 칸에서 안 나가고 앱을 닫아도 잃지 않게 (점검원 1호 3번) */
    function saveTitle() {
      var v = title.value.replace(/\s+/g, ' ').trim();
      if (v && cur() && v !== cur().title) S.commit(function (d) { T.update(d, id, { title: v }); }, { keepUndo: true });
    }
    function saveNote() { if (cur() && note.value !== (cur().note || '')) S.commit(function (d) { T.update(d, id, { note: note.value }); }, { keepUndo: true }); }
    var titleSoon = U.debounce(saveTitle, 500), noteSoon = U.debounce(saveNote, 500);
    title.addEventListener('input', function () { App.dom.autosize(title); titleSoon(); });
    title.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); title.blur(); } });
    title.addEventListener('blur', function () { if (!title.value.trim() && cur()) title.value = cur().title; saveTitle(); });
    note.addEventListener('blur', saveNote);
    note.addEventListener('input', function () { App.dom.autosize(note); noteSoon(); });

    function drawHead() {
      var tk = cur(), done = T.isDone(tk, key);
      var check = h('button.check.lg' + (done ? '.is-on' : ''), { type: 'button', role: 'checkbox', 'aria-checked': done ? 'true' : 'false', 'aria-label': t('detail.check'), html: App.icons.CHECK });
      check.addEventListener('click', function () {
        var will = !check.classList.contains('is-on');
        check.classList.toggle('is-on', will); if (will) App.platform.haptic.success(); else App.platform.haptic.tap();
        setTimeout(function () { S.commit(function (d) { T.toggle(d, id, key); }); draw(); }, 200);
      });
      App.dom.clear(headBox);
      headBox.appendChild(h('div.detail-head' + (done ? '.is-done' : ''), check, title));
      if (tk.repeat) {
        headBox.appendChild(h('div.occ-line',
          h('span', { html: ic('repeat', 15) }), h('span', t('detail.occurrence', { date: I.dateShort(key) })),
          done ? null : h('button.text-btn.sm', { type: 'button', onclick: function () {   /* 끝낸 회차는 건너뛰기 없음 (4호 2번) */
            S.commit(function (d) { T.skip(d, id, key); }, { undo: true });
            sheet.close();
            App.toast.show(t('detail.skipped', { date: I.dateNoWeek(key) }), { action: t('common.undo'), onAction: S.undo });
          } }, t('detail.skip'))));
      }
      requestAnimationFrame(function () { App.dom.autosize(title); App.dom.autosize(note); });
    }

    function drawSubs() {
      var tk = cur();
      App.dom.clear(subsBox);
      tk.subtasks.forEach(function (s) {
        var on = T.isSubDone(tk, key, s.id);
        var c = h('button.check.sm' + (on ? '.is-on' : ''), { type: 'button', role: 'checkbox', 'aria-checked': on ? 'true' : 'false', 'aria-label': s.title, html: App.icons.CHECK });
        var input = h('input.sub-input', { type: 'text', value: s.title, enterkeyhint: 'done', 'aria-label': t('prop.subtasks') });
        c.addEventListener('click', function () {
          var will = !c.classList.contains('is-on'); c.classList.toggle('is-on', will); App.platform.haptic.tap();
          setTimeout(function () {
            var r = S.commit(function (d) { return T.toggleSub(d, id, s.id, key); }, { undo: true });
            if (r && r.parentDone) App.toast.show(t('row.allSubsDone'), { action: t('common.undo'), onAction: function () { S.undo(); draw(); } });
            draw();
          }, 180);
        });
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); input.blur(); } });
        var renameSoon = U.debounce(function () { var v = input.value.trim(); if (v && v !== s.title) S.commit(function (d) { T.renameSub(d, id, s.id, v); }, { keepUndo: true }); }, 500);
        input.addEventListener('input', renameSoon);
        input.addEventListener('blur', function () {
          var v = input.value.trim();
          if (!v) { removeSub(s); return; }
          if (v !== s.title) S.commit(function (d) { T.renameSub(d, id, s.id, v); });
        });
        subsBox.appendChild(h('div.sub-edit' + (on ? '.is-done' : ''), c, input,
          h('button.prop-clear', { type: 'button', 'aria-label': t('common.delete'), html: ic('x', 16), onclick: function () { removeSub(s); } })));
      });
      var add = h('input.sub-input.is-new', { type: 'text', placeholder: t('detail.addSub'), enterkeyhint: 'next', 'aria-label': t('detail.addSub') });
      add.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing) {

          var v = add.value.trim(); if (!v) return;

          drawSubs();

        }
      });
      add.addEventListener('blur', function () { var v = add.value.trim(); if (v) { add.value = ''; S.commit(function (d) { T.addSub(d, id, v); }); drawSubs(); } });
      /* 여러 줄을 붙여 넣으면 줄마다 세부 할 일 (레시피 재료 · 준비물 목록) */
      add.addEventListener('paste', function (e) {
        var text = (e.clipboardData || { getData: function () { return ''; } }).getData('text');
        var lines = String(text || '').split(/\r?\n/).map(function (x) { return x.replace(/^\s*([-*•·]|\d+[.)])\s*/, '').trim(); }).filter(Boolean);
        if (lines.length < 2) return;
        e.preventDefault();
        S.commit(function (d) { lines.forEach(function (x) { T.addSub(d, id, x); }); }, { undo: true });
        drawSubs();
        App.toast.show(t('detail.subsPasted', { n: lines.length }), { action: t('common.undo'), onAction: function () { S.undo(); draw(); } });
      });
      subsBox.appendChild(h('div.sub-edit.is-add', h('span.sub-plus', { html: ic('plus', 18) }), add));
    }

    function removeSub(s) {
      S.commit(function (d) { T.removeSub(d, id, s.id); }, { undo: true });
      drawSubs();
      App.toast.show(t('detail.subDeleted'), { action: t('common.undo'), onAction: function () { S.undo(); draw(); } });
    }

    function prop(icon, label, value, onOpen, onClear, sub, step) {
      var setV = value != null && value !== '';
      return h('div.prop-wrap',
        h('button.prop' + (setV ? '.is-set' : ''), { type: 'button', onclick: onOpen },
          h('span.prop-icon', { html: ic(icon, 20) }), h('span.prop-label', label, sub ? h('span.prop-sub', sub) : null),
          /* 빈 칸은 '추가' 글자 대신 › 만 — '추가'가 여섯 줄 겹쳐 서류 양식처럼 보이던 것 (애플 미리 알림 방식 · 감성 검토 10-31) */
          setV ? h('span.prop-value', value) : h('span.prop-value.is-empty', { html: ic('chevR', 16), 'aria-label': t('detail.add') })),
        setV && step ? stepper(step, step === shiftDue && cur().date && !cur().repeat && cur().due <= cur().date) : null,
        /* ‹ › 가 있는 줄(날짜 · 언제까지)에는 ×를 두지 않는다 — 한 줄이 촘촘해지지 않게. 빼기는 날짜 고르는 창의 '날짜 빼기' (10-31) */
        setV && onClear && !step ? h('button.prop-clear', { type: 'button', 'aria-label': t('detail.clear', { what: label.toLowerCase() }), html: ic('x', 16), onclick: onClear }) : null);
    }

    /* 하루 앞 · 뒤 단추 ‹ › — 날짜 · 언제까지를 창을 열지 않고 하루씩 늘리고 줄인다 (사용자 10-31 '날짜 연장 · 축소') */
    function stepper(fn, noBack) {
      return h('div.prop-step',
        h('button.step-btn', { type: 'button', disabled: !!noBack, 'aria-label': t('detail.earlier'), html: ic('chevL', 18), onclick: function () { fn(-1); } }),   /* 더 못 가면 흐리게 (2호 재확인 새 3번) */
        h('button.step-btn', { type: 'button', 'aria-label': t('detail.later'), html: ic('chevR', 18), onclick: function () { fn(1); } }));
    }
    function shiftDate(n) {
      var tk = cur(), nd = U.addDays(tk.date, n), patch = { date: nd };
      if (tk.due && tk.due < nd) patch.due = nd;   /* 할 날이 언제까지를 넘으면 언제까지도 같이 */
      set(patch);
    }
    function shiftDue(n) {
      var tk = cur(), nd = U.addDays(tk.due, n);
      if (tk.date && !tk.repeat && nd < tk.date) return;   /* 언제까지가 할 날보다 앞으로 가지 않게 */
      set({ due: nd });
    }

    function drawProps() {
      var tk = cur(), d = S.data;
      App.dom.clear(props);
      props.appendChild(prop('calendar', tk.repeat ? t('prop.start') : t('prop.date'), tk.date ? I.relDay(tk.date) : null,
        /* 반복의 '반복 시작'에는 '날짜 빼기'를 두지 않는다 — 누르면 시간 · 알림이 소리 없이 지워지고 시작 날만 오늘로 돌아오던 문제 (3호 3번) */
        function () { P.date({ value: tk.date, allowNone: !tk.repeat, onPick: function (v) { set({ date: v, time: v ? tk.time : null }); } }); },
        tk.repeat ? null : function () { set({ date: null, time: null }); }, null, tk.repeat ? null : shiftDate));
      props.appendChild(prop('clock', t('prop.time'), tk.time ? I.time(tk.time) : null,
        function () { P.time({ value: tk.time, onPick: function (v) { set({ time: v }); if (v) App.ensureNotify(); } }); },
        function () { clear({ time: null }, t('prop.time')); }));
      /* 알림: 시간이 있으면 '몇 분 전', 날짜만 있으면 '그날 아침 9시'. 아이폰 · 웹은 '앱을 열어 둔 동안'이라고 사실대로 (점검원 1호 5 · 22번) */
      if (tk.time || tk.date || tk.due) props.appendChild(prop('bell', t('prop.remind'), tk.remind == null ? null : App.reminders.label(tk.remind, !!tk.time),
        function () { P.remind({ value: tk.remind, hasTime: !!tk.time, onPick: function (v) { set({ remind: v }); if (v != null) App.ensureNotify(); } }); },
        tk.remind == null ? null : function () { clear({ remind: null }, t('prop.remind')); },
        tk.remind != null && App.platform.notify.kind === 'foreground' ? t('notify.whileOpen') : null));
      /* 끝낸 반복 = 사용자가 끝냈거나(ended) 끝나는 날이 지남. 앞으로 끝날 날(until)만 있으면 아직 반복 중 */
      var ended = !!(tk.repeat && tk.repeat.until && (tk.repeat.ended || tk.repeat.until < U.today()));
      props.appendChild(prop('repeat', t('prop.repeat'), tk.repeat ? App.repeat.describe(tk.repeat, tk.date) : null,
        /* 고르기 창 이름의 기준 날(anchor)과 저장되는 시작 날을 같게 (4호 6번 · 재확인):
           - 반복 중인 일 = 지금 시작 날 기준(이름 · ✓가 지금 규칙과 맞음). 규칙을 바꾸면 update()가 그 '일'을 지켜 오늘 이후로 다시 잡음
           - 반복이 없거나 끝낸 일 = 시작 날이 지났으면 오늘 기준으로 보이고, 고르면 그 날을 시작 날로 같이 저장 */
        function () {
          var live = tk.repeat && !ended, anchor = live ? tk.date : (tk.date && tk.date >= U.today() ? tk.date : U.today());
          P.repeat({ value: live ? tk.repeat : null, anchor: anchor, onPick: function (v) {
            if (!v && ended) return;                                  /* 이미 끝낸 반복 */
            if (!v && tk.repeat && hasPast(tk)) { endRepeat(); return; }   /* 지난 기록이 있으면 '반복 안 함' = 반복 끝내기(기록 남김 · 1호 2번 재확인) */
            set(!live && v && anchor !== tk.date ? { repeat: v, date: anchor } : { repeat: v });
          } });
        },
        tk.repeat && !ended ? function () { endRepeat(); } : null,
        ended ? t('rep.endedOn', { date: I.dateNoWeek(tk.repeat.until) }) : null));
      /* 반복하는 일에는 '언제까지' 대신 '반복 끝나는 날' — 반복은 언제까지를 안 보므로 같은 칸이 오해를 만듦 (6호 1번) */
      if (tk.repeat && !ended) {
        var until = tk.repeat.until || null;
        props.appendChild(prop('target', t('prop.repeatUntil'), until ? I.relDay(until) : null,
          function () { P.date({ title: t('prop.repeatUntil'), value: until, onPick: function (v) {
            if (v && v < tk.date) v = tk.date;   /* 시작 날보다 앞으로는 못 감 */
            var r = Object.assign({}, tk.repeat, { until: v || null }); delete r.ended; set({ repeat: r });
          } }); },
          until ? function () { var r = Object.assign({}, tk.repeat, { until: null }); clear({ repeat: r }, t('prop.repeatUntil')); } : null));
      } else if (!tk.repeat) props.appendChild(prop('target', t('prop.due'), tk.due ? I.relDay(tk.due) : null,
        function () { P.date({ title: t('prop.due'), value: tk.due, onPick: function (v) { set({ due: v }); } }); },
        function () { set({ due: null }); }, null, shiftDue));
      props.appendChild(prop('flag', t('prop.priority'), tk.priority ? t('prio.' + tk.priority) : null,
        function () { P.priority({ value: tk.priority, onPick: function (v) { set({ priority: v }); } }); },
        function () { clear({ priority: 0 }, t('prop.priority')); }));
      var l = tk.listId && T.list(d, tk.listId);
      props.appendChild(prop('folder', t('prop.list'), l ? l.name : null,
        function () { P.list({ value: tk.listId, onPick: function (v) { set({ listId: v }); } }); },
        function () { clear({ listId: null }, t('prop.list')); }));
    }

    function draw() {
      if (!cur() || cur().deletedAt) { sheet.close(true); return; }
      if (cur().repeat && !App.query.showsOn(cur(), day)) day = App.repeat.next(cur().repeat, cur().date, U.today()) || day;
      key = T.keyFor(cur(), day);
