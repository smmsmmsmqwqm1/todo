<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 검색 엔진에 안 나오게 (공개 저장소라도 링크를 받은 사람만 찾게 · 사용자 10-31) -->
<meta name="robots" content="noindex, nofollow">
<!-- 확대 막기: 안드로이드 크롬 · 웹뷰는 maximum-scale · user-scalable을 따른다. 아이폰 사파리는 iOS 10부터 이것만으로는 두 손가락 확대를 막지 않아(접근성) web.js의 gesturestart로 막는다. 글자를 키우고 싶으면 앱 설정 '글자 크기'(최대 1.4배) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ToDo"><!-- 임시 이름 (사용자 10-31: 지금은 ToDo 예명) -->
<meta name="format-detection" content="telephone=no">
<title>ToDo</title>
<script>/* 첫 그림부터 지난번 색 · 글자 크기로 — 켤 때 번쩍임 없게 (app.js applyTheme이 저장) */
try { var l = (localStorage.getItem('todo02:look') || 'graphite').split('|'); if (l[0]) {   /* 처음 켜는 사람도 첫 그림부터 기본 색(그라파이트) */ document.documentElement.setAttribute('data-theme', l[0]); document.documentElement.style.background = l[0] === 'dark' ? '#121314' : l[0] === 'graphite' ? '#2B2B2D' : '#F2F2EF'; } if (l[1]) document.documentElement.style.setProperty('--text-scale', l[1]); if (l[2] && l[2] !== 'tangerine' && /^(blue|green|violet)$/.test(l[2])) document.documentElement.setAttribute('data-accent', l[2]); } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<!-- 화면 모양: 토큰(색 · 간격) → 바탕 → 부품 → 화면 -->
<style>
/* 색 · 간격 · 둥글기 · 그림자 — 화면 코드는 이 이름만 쓴다. 값의 근거 = 디자인/색과 글꼴.md */
:root {
  /* 10-31 'AI 티' 진단 반영: 크림 바탕 + 테라코타(클로드 색과 같은 짝) → 중립 바탕 + 귤색. 회베이지 겹을 2겹으로 */
  --bg: #F2F2EF;             /* F7 → F2: 흰 카드가 바탕 위에 한 겹 떠 보이게 (8호 4번 · 미리 알림 수준 대비 1.12) */
  --surface: #FFFFFF;
  --surface-2: #EFEFEC;
  --press: #E8E8E4;
  --line: #E8E8E4;
  --ink: #191C20;
  --ink-2: #626870;          /* 바탕 위 5.24 */
  --ink-3: #8B9097;          /* 체크 동그라미 테두리 · 흐린 글 — 흰 바탕 위 3.2 (점검원 1호 9번: 햇빛 아래 안 보임) */
  --on-accent: #FFFFFF;

  /* 글자 대비(10-31 다시 잼): 작은 글자 4.5 이상 · 아이콘 3 이상 */
  --accent: #F2622E;         /* 귤색 — 면 · 아이콘 (흰 아이콘 3.2) */
  --accent-strong: #C2410C;  /* 흰 글자가 올라가는 단추 (5.18) — 글자색(ink)과 한 값: '오늘' 글씨와 단추가 미세하게 달라 실수처럼 보이던 것 (주 색 조수 D) */
  --accent-ink: #C2410C;     /* 주 색 글자 (바탕 위 4.83) */
  --accent-soft: #FFF0E8;

  /* 끝낸 일 = 앱의 귤색으로 '내 색이 채워짐' — 초록이 글자 · 동그라미 · 줄 바탕 · 달력 칸을 다 덮어 어두운 화면에서 으스스하던 것을 바꿈 (사용자 10-31).
     애플 미리 알림 · Things처럼 색은 체크 동그라미와 달력 칸에만, 끝낸 글자는 조용한 회색 */
  --done: #F2622E;
  --done-ink: #C2410C;
  --done-soft: #FFF0E8;
  --toast-action: #FFB4A3;   /* 어두운 띠 위 '되돌리기' 글자 — 주 색을 따라감 */

  /* '중요' 깃발 하나 — 색은 목록이 쓰고(어느 칸의 일인가), 중요는 깃발 모양 + 이 빨강 하나로만 (옛 중요도 3색이 목록 회색 · 청록 · 보라와 똑같던 문제 · 색 검증 조수 10-31) */
  --flag: #D93A3F;   /* 흰 카드 위 4.6 */
  --sun: #C9504A;    /* 일요일 숫자 — 종이 플래너처럼 부드러운 붉은 기 (깃발보다 연하게) */

  --c-orange: #F2622E; --c-yellow: #F2A23A; --c-green: #2FA36B; --c-teal: #1E9EA6;
  --c-blue: #4C8DF6;   --c-violet: #8B6CE0; --c-pink: #E5679A;  --c-gray: #8A9097;

  --scrim: rgba(0, 0, 0, .18);  /* 뒤 화면이 '흐려지기'보다 '살짝 물러나는' 정도 */
  --shadow-float: 0 8px 24px rgba(30, 33, 36, .10), 0 2px 6px rgba(30, 33, 36, .06);
  --shadow-sheet: 0 -8px 32px rgba(30, 33, 36, .12);

  --r-card: 14px;
  --r-sheet: 24px;
  --r-field: 10px;
  --r-pill: 999px;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;

  --fs-title: 1.75rem;
  --fs-head: 1.25rem;
  --fs-body: 1.0625rem;
  --fs-sub: 0.875rem;
  --fs-small: 0.8125rem;   /* 13px — 시간 · '언제까지'가 이 크기라 상용 앱 부제 수준으로 (UI 채점 6차 ⑤) */

  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --fast: 120ms;
  --mid: 240ms;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #121314;
  --surface: #1C1D1F;
  --surface-2: #26282B;
  --press: #2E3134;
  --line: #2F3236;
  --ink: #EEEFF0;
  --ink-2: #A3A8AE;
  --ink-3: #80858B;
  --on-accent: #2A1510;      /* 어둡게: 밝은 주황 위에는 어두운 글자 · 아이콘 (7.21) */

  --accent: #FF8A55;
  --accent-strong: #FF8A55;
  --accent-ink: #FF9B6E;
  --accent-soft: var(--surface-2);   /* 어두운 바탕에 귤색을 옅게 섞으면 밤색이 됨 → 중립 회색 + 귤색 테두리 · 글자로 (처음 요구 '짙은 브라운 · 찝찝한 색 배제' · 원문 점검 10-31) */

  --done: #FF8A55;
  --done-ink: #FFA27A;
  --done-soft: var(--surface-2);

  --flag: #FF6B6F;
  --sun: #E88A82;

  --c-orange: #FF8467; --c-yellow: #F5B357; --c-green: #4CC38A; --c-teal: #3CC0C8;
  --c-blue: #6FA4FF;   --c-violet: #A58BF0; --c-pink: #F383B0;  --c-gray: #9AA0A7;

  --scrim: rgba(0, 0, 0, .55);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, .45);
  --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}


/* 그라파이트 — 너무 밝지도(흰 종이) 너무 어둡지도(먹색) 않은 가운데. 연필심 같은 차분한 회색 바탕 + 한 겹 밝은 카드 + 따뜻한 미색 글자.
   흰색 · 먹색이 서로 정반대라, 그 사이에서 눈이 편한 세 번째 결 (사용자 10-31 '그라파이트 · 고급지게 · 감각적으로') */
:root[data-theme="graphite"] {
  /* 파랑기를 뺀 중립 회색(애플 다크의 '높인 겹' 결) — 따뜻한 미색 글자 · 귤색과 온도가 맞게 (8호 1번: 옛 #2C2E33은 개발 도구 회색) */
  --bg: #2B2B2D;
  --surface: #363638;
  --surface-2: #414143;
  --press: #48484B;
  --line: #3F3F42;
  --ink: #F2F0EB;            /* 따뜻한 미색 — 새하얀 글자가 회색 바탕에서 번쩍이지 않게 */
  --ink-2: #C2C3C7;          /* 바탕 위 7.9 */
  --ink-3: #9A9DA3;          /* 카드 위 4.5 */
  --on-accent: #2A1510;

  --accent: #FF9466;
  --accent-strong: #FF9466;
  --accent-ink: #FFAD88;
  --accent-soft: var(--surface-2);   /* 회색에 귤색을 섞으면 밤색 → 중립 회색 + 귤색 테두리 · 글자로 (원문 점검 10-31) */

  --done: #FF9466;
  --done-ink: #FFB291;
  --done-soft: var(--surface-2);

  --flag: #FF7B7E;
  --sun: #EE958D;

  --c-orange: #FF8F74; --c-yellow: #F5BC64; --c-green: #5CCB95; --c-teal: #4CC7CE;
  --c-blue: #7DADFF;   --c-violet: #B19AF3; --c-pink: #F58FB8;  --c-gray: #A6ABB1;

  --scrim: rgba(10, 11, 13, .5);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, .32), 0 2px 6px rgba(0, 0, 0, .18);
  --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

/* 주 색 고르기 (설정 › 보기 · 사용자 10-31 22:4x '귤색 말고도 겹치지 않는 선택지 몇 개') — 귤색(기본 · 위 값) · 파랑 · 초록 · 보라.
   주 색 = 체크 동그라미 · 주요 단추 · '오늘' 글씨 · 고른 날 — 하나의 개념이라 체크도 같이 바뀐다 (주 색 조수 C).
   면(accent) / 글자 · 단추(ink = strong) 두 단계. 빨강 · 분홍은 깃발 · 일요일과, 노랑은 흰 체크 대비로, 네이비 · 먹 · 모카는 사용자가 이미 거절해서 뺌.
   대비(메인이 잰 값 10-31): 체크 표시 ≥ 4.45 · 글자 ≥ 4.76 — 12조합 모두 기준(체크 3 · 글자 4.5) 넘음 */
:root[data-accent="blue"]   { --accent: #3B6EE0; --accent-strong: #2F5FD0; --accent-ink: #2F5FD0; --accent-soft: #EEF2FF; --on-accent: #FFFFFF; }
:root[data-accent="green"]  { --accent: #13875F; --accent-strong: #0F7A55; --accent-ink: #0F7A55; --accent-soft: #E7F5EE; --on-accent: #FFFFFF; }
:root[data-accent="violet"] { --accent: #7A52D6; --accent-strong: #6E45CC; --accent-ink: #6E45CC; --accent-soft: #F2EEFF; --on-accent: #FFFFFF; }
:root[data-theme="dark"][data-accent="blue"]       { --accent: #5B8CFF; --accent-strong: #5B8CFF; --accent-ink: #8FB0FF; --on-accent: #0B1530; --accent-soft: var(--surface-2); }
:root[data-theme="dark"][data-accent="green"]      { --accent: #2FB67E; --accent-strong: #2FB67E; --accent-ink: #5CD39C; --on-accent: #06231A; --accent-soft: var(--surface-2); }
:root[data-theme="dark"][data-accent="violet"]     { --accent: #9A7BFF; --accent-strong: #9A7BFF; --accent-ink: #B9A3FF; --on-accent: #1A1033; --accent-soft: var(--surface-2); }
:root[data-theme="graphite"][data-accent="blue"]   { --accent: #6E9BFF; --accent-strong: #6E9BFF; --accent-ink: #9DBBFF; --on-accent: #0B1530; --accent-soft: var(--surface-2); }
:root[data-theme="graphite"][data-accent="green"]  { --accent: #3DC28A; --accent-strong: #3DC28A; --accent-ink: #6FDCA8; --on-accent: #06231A; --accent-soft: var(--surface-2); }
:root[data-theme="graphite"][data-accent="violet"] { --accent: #A68BFF; --accent-strong: #A68BFF; --accent-ink: #BFA9FF; --on-accent: #1A1033; --accent-soft: var(--surface-2); }
/* 끝낸 일(체크) = 주 색 그대로 */
:root[data-accent="blue"] { --toast-action: #AFC6FF; } :root[data-accent="green"] { --toast-action: #8FE0B9; } :root[data-accent="violet"] { --toast-action: #CDBBFF; }
:root[data-accent] { --done: var(--accent); --done-ink: var(--accent-ink); --done-soft: var(--accent-soft); }
</style>
<style>
/* 바탕 · 큰 배치(휴대폰 = 아래 탭 / 넓은 화면 = 왼쪽 메뉴) */
*, *::before, *::after { box-sizing: border-box; }
/* 두 번 톡 확대 막기 — touch-action은 물려받지 않아 모든 요소에 둔다(클래스에 따로 정한 pan-y · none이 이김). 확대 없이 빠른 탭 · 스크롤만 (사용자 10-31 '앱이 확대 축소되면 말이 안 됨') */
* { touch-action: manipulation; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; font-size: calc(16px * var(--text-scale, 1)); } /* 글자 크기 설정 = 이 한 줄 (모든 글자가 rem) */
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--fs-body)/1.42 var(--font);
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
  /* 앱처럼: 글자를 꾹 눌러도 '선택(복사) 상태'로 열리지 않게 — 웹 페이지 티 (사용자 10-31 22:5x 안드로이드 APK '문구 꾹 누르니 포커스(복사 가능한 상태)로 열려 버려 · 너무 후진 앱 같아').
     글을 쓰는 칸(입력 · 메모)만 선택 · 붙여넣기 가능 */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
img { -webkit-user-drag: none; user-drag: none; }   /* 목록 사진 등을 꾹 눌러 끌면 '이미지 끌기'가 되던 것 */
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
input, textarea { -webkit-appearance: none; appearance: none; }
/* 아이폰은 글자가 16px보다 작은 입력 칸을 누르면 화면을 저절로 확대한다 → 입력 칸 글자는 늘 16px 이상(글자 크기 '작게'에서도). 클래스로 크기를 정한 칸도 max(16px, …)로 */
input, textarea, select { font-size: max(16px, 1rem); }
svg { display: block; flex: none; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  min-height: 100%;
  display: flex;
}
.main {
  flex: 1;
  min-width: 0;
  padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 20px) calc(var(--safe-b) + 96px) calc(var(--safe-l) + 20px);
}
.screen { max-width: 720px; margin: 0 auto; }

/* 아래 탭 (휴대폰) */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around;
  padding: 6px calc(var(--safe-r) + 8px) calc(var(--safe-b) + 6px) calc(var(--safe-l) + 8px);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(16px);
  backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1; min-width: 0; max-width: 96px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0 4px; border-radius: 12px;
  color: var(--ink-2); font-size: 0.7188rem; font-weight: 600;  /* 안 고른 탭도 '꺼진 것'처럼 보이지 않게 */
  transition: color var(--fast), transform var(--fast) var(--ease);
}
.tab:active { transform: scale(.94); }
.tab[aria-current="page"] { color: var(--ink); }

/* 아래 탭 가운데 + (휴대폰) */
.tab-add {
  flex: none; align-self: center; width: 52px; height: 44px; margin: 0 4px; border-radius: 16px;
  display: grid; place-items: center; background: var(--accent); color: var(--on-accent);
  transition: transform var(--fast) var(--ease);
}
.tab-add:active { transform: scale(.92); }

/* 떠 있는 + 단추 (넓은 화면만) */
.fab {
  display: none;
  position: fixed; z-index: 21;
  right: calc(var(--safe-r) + 20px);
  bottom: calc(var(--safe-b) + 76px);
  width: 58px; height: 58px; border-radius: 50%;
  place-items: center;
  background: var(--accent); color: var(--on-accent);
  box-shadow: var(--shadow-float);
  transition: transform var(--fast) var(--ease), opacity var(--mid);
}
.fab:active { transform: scale(.92); }
.fab.is-hidden { opacity: 0; pointer-events: none; transform: scale(.8); }
.fab.is-tucked { transform: translateY(calc(100% + 96px)); }

/* 왼쪽 메뉴 (넓은 화면) */
.sidebar { display: none; }

@media (min-width: 768px) and (min-height: 560px) {  /* 넓고 충분히 높을 때만 (가로로 돌린 휴대폰은 휴대폰 배치 · 점검원 1호 19번) */
  .tabbar { display: none; }
  .sidebar {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh; height: 100dvh;
    width: 248px; flex: none; overflow-y: auto;
    padding: calc(var(--safe-t) + 20px) 12px 24px calc(var(--safe-l) + 12px);

.dow-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
.dow { aspect-ratio: 1; max-height: 48px; border-radius: 50%; background: var(--surface-2); font-weight: 700; color: var(--ink-2); }
.dow.is-on { background: var(--accent); color: var(--on-accent); }
.rep-preview { margin: 16px 4px 0; font-weight: 700; color: var(--accent-ink); }

/* 캘린더 */
/* 달력은 카드에 담지 않고 바탕 위에 바로 (각진 표 · AI 티 진단 10-31) */
.cal-card { touch-action: pan-y; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }   /* minmax(0) — 칸 속 긴 제목이 열을 밀어 넓히지 않게 (크게 보기에서 4열만 보이던 것) */
.cal-cell { min-width: 0; overflow: hidden; }
.cal-dow { text-align: center; font-size: 0.75rem; font-weight: 600; color: var(--ink-2); padding: 6px 0 8px; }
.cal-cell { position: relative; height: calc(46px * var(--text-scale, 1)); /* 낮은 칸: 고른 날 목록이 더 보이게 (UI 채점 6차 ⑥) */ display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; transition: background var(--fast); }
.cal-cell:active { background: var(--press); }
.cal-num { width: 32px; height: 32px; display: grid; place-items: center; font-size: 0.9688rem; font-weight: 600; border-radius: 50%; }
/* 지난 날을 흐리게 하면 '지나간 · 버린 날' 느낌 → 색은 그대로, 무게만 살짝 낮춤. 흐린 색은 앞뒤 달 날짜에만 (플래너 감성 조수) */
.cal-cell.is-past .cal-num { color: var(--ink); font-weight: 500; }
/* 종이 플래너 문법: 일요일만 부드러운 붉은 기 (토요일은 색 없음 — 색 = 목록 규칙 5와 겹치지 않게) */
.cal-dow.is-sun, .cal-cell.is-sun:not(.is-today):not(.is-other) .cal-num { color: var(--sun); }
/* 칸 속 제목 — 휴대폰 작은 보기는 숨김(점 · 깃발만) · 넓은 화면은 첫 줄 하나 · 휴대폰 '크게 보기'는 세 줄 + '+n' */
.cal-peeks { display: none; width: 100%; min-width: 0; flex-direction: column; gap: 2px; padding: 0 3px; }
.cal-peek { display: block; min-width: 0; font-size: 0.6875rem; line-height: 1.25; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: clip; text-align: left; }
.cal-peek.is-done { color: var(--ink-3); }
.cal-more { font-size: 0.625rem; color: var(--ink-3); text-align: left; padding-left: 1px; }
@media (min-width: 1100px) {
  .cal-cell { height: 64px; justify-content: flex-start; padding-top: 6px; }
  .cal-peeks { display: flex; align-items: center; }
  .cal-peek { max-width: 92%; text-overflow: ellipsis; }
  .cal-peek ~ .cal-peek, .cal-more { display: none; }
  .cal-grab { display: none !important; }
}

/* 달 넘기기 — 격자 띠(지금 달 + 옆 달 유령)를 손가락 따라 옆으로. 카드 밖은 잘라 냄 */
.cal-card { overflow: hidden; padding: 2px; margin: -2px; }
.cal-track { position: relative; }
.cal-grid.is-ghost { position: absolute; top: 0; width: 100%; pointer-events: none; }
.page-head .title.is-swap { animation: title-swap 220ms var(--ease); }
@keyframes title-swap { from { opacity: .15; } }
.day-panel.is-leaving { opacity: 0; transition: opacity 120ms var(--ease); }
.day-panel.is-enter { animation: panel-in 220ms var(--ease); }
@keyframes panel-in { from { opacity: 0; transform: translateY(6px); } }

/* 달력 크게 보기 — 손잡이를 끌어 내리면 목록이 내려가고 칸이 화면 끝까지 커지며 제목이 보임 */
.cal-grab { display: flex; justify-content: center; width: 100%; padding: 12px 0 6px; touch-action: none; cursor: grab; }
.cal-grab-bar { width: 38px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink-3) 55%, transparent); transition: width var(--mid) var(--ease), background var(--fast); }
.cal-grab:active .cal-grab-bar { width: 46px; background: var(--ink-3); }
.screen-cal.is-big .cal-cell { height: var(--cal-big-h, 96px); justify-content: flex-start; padding-top: 4px; gap: 3px; }
.screen-cal.is-big .cal-num { width: 28px; height: 28px; flex: none; }
.screen-cal.is-big .cal-peeks { display: flex; }
.screen-cal.is-big .cal-peek { -webkit-mask-image: linear-gradient(90deg, #000 78%, transparent); mask-image: linear-gradient(90deg, #000 78%, transparent); }   /* 잘리는 끝을 부드럽게 흐림 */
.screen-cal.is-big .cal-dot { display: none; }   /* 큰 보기는 제목이 '일이 있음'을 말함 — 깃발은 남김 */
.screen-cal.is-big .cal-dots { height: auto; }
.screen-cal.is-big .cal-dots:empty { display: none; }
.screen-cal.is-big .cal-cell.is-sel:not(.is-today) { background: none; box-shadow: none; }   /* 큰 보기엔 '고른 날' 상자 없음(누르면 그날로 내려감) */
.screen-cal.is-big .day-panel { opacity: 0; transform: translateY(40px); pointer-events: none; }
.screen-cal.is-big:not(.is-morph) .day-panel { display: none; }
.screen-cal.is-morph .cal-cell { transition: height 340ms var(--ease), background var(--fast); }
.screen-cal.is-morph .cal-peeks { animation: peeks-in 340ms var(--ease); }
.screen-cal.is-morph .day-panel { transition: opacity 260ms var(--ease), transform 340ms var(--ease); }
@keyframes peeks-in { from { opacity: 0; } }
.cal-cell.is-today .cal-num { background: var(--accent-strong); color: var(--on-accent); font-weight: 700; } /* 흰 숫자 4.74 */
.cal-cell.is-sel { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.cal-cell.is-sel.is-today { background: none; box-shadow: none; }   /* 오늘 동그라미가 이미 표시 — 상자를 겹치지 않음 */
.cal-cell.is-sel .cal-num { font-weight: 700; }
/* 점 = 그날 일정 수(최대 3 · 매일 같은 잦은 반복은 세지 않음) — 지난 날도 같은 점. 한 일 · 못 한 일을 칸에 칠하지 않음 (사용자 10-31 '혼내는 느낌 · 미션 앱 아님 · 바쁜 날이 보이게') */
.cal-dots { display: flex; gap: 3px; height: calc(5px * var(--text-scale, 1)); }
.cal-dot { width: calc(5px * var(--text-scale, 1)); height: calc(5px * var(--text-scale, 1)); border-radius: 50%; background: var(--ink-3); }
.cal-dots { align-items: center; }
.cal-flag { display: inline-flex; align-items: center; gap: 1px; color: var(--flag); height: calc(11px * var(--text-scale, 1)); margin-top: -3px; }
.cal-flag svg { width: calc(11px * var(--text-scale, 1)); height: calc(11px * var(--text-scale, 1)); stroke-width: 2.4; }
.cal-flag-n { font-size: calc(9.5px * var(--text-scale, 1)); font-weight: 700; line-height: 1; }
.cal-cell.is-other .cal-flag { opacity: .5; }
.cal-cell.is-other .cal-num { color: var(--ink-3); font-weight: 500; }   /* 앞뒤 달 날짜는 흐리게 */

/* 하루 닫기 — 맨 아래 조용한 한 줄 */
.day-close { display: flex; justify-content: center; margin: 4px 0 8px; }
.day-close-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; color: var(--done-ink); font-weight: 650; font-size: 0.9375rem; background: color-mix(in srgb, var(--done-soft) 70%, transparent); }
.day-close-btn:active { transform: scale(.97); }
/* 오늘 한 일 — 끝낸 시각 순서로 한 장 (세로 줄 하나로 이어진 하루) */
.close-head { display: flex; align-items: center; gap: 10px; font-size: 1.125rem; font-weight: 750; margin: 2px 2px 8px; }
.close-head .day-mark { width: 22px; height: 22px; border-radius: 6px; }
.done-log { position: relative; padding: 4px 0 4px; }
.done-log-row { display: grid; grid-template-columns: 4.6rem 14px 1fr; align-items: baseline; gap: 8px; padding: 9px 2px; }
.done-log-time { color: var(--ink-3); font-size: var(--fs-small); text-align: right; white-space: nowrap; }
.done-log-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); justify-self: center; align-self: center; }
.done-log-title { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.left-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; }
.left-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.missed-fold { margin: 6px 0 0; padding: 8px 4px; display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.day-groups > .section:first-child { margin-top: 0; }
.day-panel { margin-top: 8px; }   /* 위 손잡이가 간격을 냄 */
/* 고른 날 = 다이어리 한 장: 큰 날짜 숫자 + 옆에 두 줄(관계말 · 월 / 요일) + 아래 가는 선 (호보니치 · 미도리 결 · 플래너 감성 조수 10-31) */
.day-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.day-title { display: flex; align-items: flex-end; gap: 10px; margin: 0; font-weight: 400; }
.day-big { font-size: 2.5rem; font-weight: 700; letter-spacing: -.03em; line-height: .9; color: var(--ink); font-variant-numeric: tabular-nums; }
.day-sub { display: flex; flex-direction: column; gap: 2px; padding-bottom: 2px; }
.day-sub-1 { font-size: 0.8125rem; color: var(--ink-2); font-weight: 500; }
.day-sub-2 { font-size: 0.9375rem; color: var(--ink-2); font-weight: 600; }
.day-big.is-sun { color: var(--sun); }
.day-count { font-size: var(--fs-sub); color: var(--done-ink); font-weight: 700; white-space: nowrap; }
.day-empty { margin: 0; padding: 22px 16px; text-align: center; color: var(--ink-3); background: var(--surface); border-radius: var(--r-card); font-size: 0.9375rem; }
.add-line { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 14px; color: var(--accent-ink); font-weight: 650; font-size: 0.9688rem; }
.add-line:active { background: var(--accent-soft); }
@media (min-width: 1100px) {
  .screen-cal { max-width: 1100px; }
  .cal-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .day-panel { margin-top: 0; position: sticky; top: 20px; }
}

/* 자세히 */
.detail-sheet .sheet-head { min-height: 36px; padding-bottom: 0; }
.detail-head { display: flex; align-items: flex-start; gap: 12px; padding: 0 0 10px; }
.detail-head .check { margin-top: 2px; }
.detail-title { flex: 1; border: 0; background: none; padding: 0; resize: none; overflow: hidden; font-size: 1.3125rem; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; }
.detail-head.is-done .detail-title { color: var(--ink-2); }
.occ-line { display: flex; align-items: center; gap: 6px; margin: -2px 0 12px 42px; font-size: 0.875rem; color: var(--ink-2); }
.occ-line .text-btn { margin-left: auto; }
.detail-block { margin: 14px 0; }
.block-label { font-size: var(--fs-sub); font-weight: 700; color: var(--ink-2); padding: 0 4px 6px; }
.subs-edit { background: var(--surface); border-radius: var(--r-card); padding: 4px 6px 4px 14px; }
.sub-edit { display: flex; align-items: center; gap: 10px; min-height: 46px; }
.sub-edit + .sub-edit { border-top: 1px solid var(--line); }
.sub-edit .prop-clear { opacity: .45; } .sub-edit:focus-within .prop-clear { opacity: 1; }   /* 지우기 ×는 흐리게, 그 줄을 고칠 때만 또렷하게 (UI 채점 6차 ⑦) */
.sub-input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; font-size: max(16px, 1rem); }
.sub-input::placeholder { color: var(--ink-3); }
.sub-edit.is-done .sub-input { color: var(--ink-2); }
.sub-plus { width: 20px; display: grid; place-items: center; color: var(--ink-3); }
.props { margin-top: 14px; }
.prop-wrap { display: flex; align-items: center; background: var(--surface); }
.prop-wrap .prop { flex: 1; min-width: 0; }
.prop-wrap .prop-clear { margin-right: 8px; }
/* 하루 앞 · 뒤 ‹ › : 값 옆에 작게, 회색 면 하나로 묶어 '단추 둘'로 보이지 않게 */
.prop-step { display: flex; flex: none; margin-right: 4px; border-radius: 10px; background: var(--surface-2); }
.step-btn { width: 34px; height: 32px; display: grid; place-items: center; color: var(--ink-2); border-radius: 10px; }
.step-btn:active { background: var(--press); }
.step-btn:disabled { opacity: .35; }
.note { min-height: 84px; background: var(--surface); border-color: transparent; }
.note:focus { box-shadow: inset 0 0 0 1.5px var(--accent); border-color: transparent; }
.delete-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin: 18px 0 4px; padding: 14px; border-radius: 14px; color: var(--ink-2); font-weight: 650; font-size: 0.9375rem; }
.delete-btn:active { background: var(--press); }

/* 빠른 추가 */
.qa-sheet .sheet-head { min-height: 32px; padding-bottom: 2px; }
.qa-sheet .sheet-title { font-size: 0.9375rem; color: var(--ink-2); font-weight: 700; }
/* 빠른 추가 맨 위 '중요' — 꾹 누르기 메뉴 깃발 단추와 같은 말 · 같은 모양(빨간 테두리 + 깃발 톡) */
.qa-top { display: flex; margin: 0 0 10px; }
.qa-flag { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 11px; border-radius: var(--r-pill); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); font-size: var(--fs-sub); font-weight: 600; transition: box-shadow var(--fast), color var(--fast); }
.qa-flag .flag-ico { display: grid; color: var(--ink-3); transition: color var(--fast); }
.qa-flag:active { background: var(--press); }
.qa-flag.is-on { color: var(--flag); box-shadow: inset 0 0 0 1.5px var(--flag); }
.qa-flag.is-on .flag-ico { color: var(--flag); animation: flag-pop 320ms var(--ease); }
.qa-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 6px 6px 6px 16px; box-shadow: inset 0 0 0 1px var(--line); }
.qa-input { flex: 1; min-width: 0; border: 0; background: none; font-size: max(16px, 1.0938rem); min-height: 44px; padding: 0; }
.qa-input::placeholder { color: var(--ink-3); }
.qa-input:focus-visible, .sub-input:focus-visible, .detail-title:focus-visible, .field:focus-visible { outline: none; } /* 칸 테두리가 이미 포커스를 보여 줌 */
.qa-tip { margin: 10px 4px 0; font-size: 0.8438rem; color: var(--ink-2); }
.qa-send { flex: none; height: 40px; padding: 0 16px; border-radius: 10px; font-size: 0.9375rem; font-weight: 700; background: var(--accent-strong); color: var(--on-accent); transition: background var(--fast), transform var(--fast) var(--ease); }
.qa-send:active { transform: scale(.95); }
.qa-send[disabled] { background: var(--surface-2); color: var(--ink-3); }
.qa-tokens { margin-top: 10px; }
.qa-chips { margin: 12px -20px 0; padding: 2px 20px; -webkit-mask-image: linear-gradient(90deg, #000 86%, transparent); mask-image: linear-gradient(90deg, #000 86%, transparent); }
@media (min-width: 768px) and (min-height: 560px) { .qa-chips { flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; } } /* 넓은 화면은 칩 줄바꿈 (마우스로 옆 넘기기 불편) */
html[data-text="lg"] .qa-chips, html[data-text="xl"] .qa-chips { flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; } /* 글자 크게 이상은 휴대폰도 줄바꿈 — 뒤쪽 칩이 화면 밖에 숨지 않게 (2호 13번) */
@media (hover: hover) { .side-add:hover { background: var(--accent); } }
.occ-line .text-btn { color: var(--ink-2); }
.screen-settings .seg-wrap { margin: 0 0 4px; }

/* 주 색 고르기 — 위: 작은 예시(지금 고른 색으로 바로 그려짐) · 아래: 견본 4개(그 화면 색에서 실제로 보일 값) */
:root { --sw-tangerine: #F2622E; --sw-blue: #3B6EE0; --sw-green: #13875F; --sw-violet: #7A52D6; }
:root[data-theme="dark"] { --sw-tangerine: #FF8A55; --sw-blue: #5B8CFF; --sw-green: #2FB67E; --sw-violet: #9A7BFF; }
:root[data-theme="graphite"] { --sw-tangerine: #FF9466; --sw-blue: #6E9BFF; --sw-green: #3DC28A; --sw-violet: #A68BFF; }
.accent-pick { background: var(--surface); border-radius: var(--r-card); padding: 14px 14px 12px; display: grid; gap: 14px; }
.accent-sample { border-radius: 12px; background: var(--bg); padding: 10px 4px 4px; }
.accent-sample-head { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 6px 12px; }
.accent-sample-today { font-size: var(--fs-sub); font-weight: 700; color: var(--accent-ink); }
.accent-sample-plus { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.accent-sample .task { background: none; padding: 7px 10px 7px 12px; pointer-events: none; }
.accent-sample .task + .task { border-top: 1px solid var(--line); }
.accent-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.accent-swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0 4px; border-radius: 12px; color: var(--ink-2); font-size: var(--fs-small); font-weight: 500; }
.accent-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--sw); box-shadow: 0 0 0 2px var(--surface), 0 0 0 2px transparent; transition: box-shadow var(--mid) var(--ease), transform var(--fast) var(--ease); }
.accent-swatch:active .accent-dot { transform: scale(.92); }
.accent-swatch.is-on { color: var(--ink); font-weight: 650; }
.accent-swatch.is-on .accent-dot { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--sw); }
.sw-tangerine { --sw: var(--sw-tangerine); } .sw-blue { --sw: var(--sw-blue); } .sw-green { --sw: var(--sw-green); } .sw-violet { --sw: var(--sw-violet); }
.qa-hint { margin: 10px 4px 0; font-size: 0.8438rem; color: var(--accent-ink); font-weight: 600; }
.qa-last { margin: 12px 4px 0; font-size: 0.8438rem; color: var(--done-ink); font-weight: 600; }

.search-results { margin-top: 14px; }
.day-rel { margin-right: 8px; color: var(--ink-2); }   /* 어제 · 내일은 보조 색 — 지난 날에 경고색을 쓰지 않음 (감성 검토 10-31) */
.day-rel.is-today { color: var(--accent-ink); }
.day-count { color: var(--ink-2) !important; font-weight: 600; }   /* '3개 했어요'는 귤색 강조 없이 조용히 (플래너 감성 조수) */
.fold-sub { margin-left: 6px; font-size: 0.75rem; font-weight: 600; color: var(--accent-ink); }

/* 안으로 들어가는 화면(목록 하나 · 설정 묶음)은 옆에서, 나올 때는 반대쪽에서 — 어디로 들어왔는지 손에 남게. 탭 이동은 움직임 없음 */
#main { overflow-x: clip; }   /* 밀려 들어오는 동안 옆으로 삐져나온 몇 px 때문에 화면이 좌우로 흔들리지 않게 (clip = 붙는 머리 sticky는 그대로) */
.screen.is-in-fwd { animation: nav-fwd 260ms var(--ease); }
.screen.is-in-back { animation: nav-back 260ms var(--ease); }
@keyframes nav-fwd { from { opacity: 0; transform: translateX(24px); } }
@keyframes nav-back { from { opacity: 0; transform: translateX(-24px); } }

/* 설정 첫 화면의 묶음 줄 — 오른쪽 요약값은 한 줄로 줄이고, 길면 말줄임 */

<script>window.APP_VERSION = "0.1.0 \u00b7 91e91dc9";</script>
<script>
/* 날짜 · id · 작은 도구. 날짜는 늘 'YYYY-MM-DD' 글자(기기 시간대 기준)로 다룬다. */
window.App = window.App || {};
App.util = (function () {
  'use strict';
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  /* '지금' — 평소엔 기기 시계. 자동 시험(소스/시험/)이 날짜를 옮겨 1년을 돌려 볼 때만 setNow로 바꾼다 */
  var fixedNow = null;
  function now() { return fixedNow != null ? fixedNow : Date.now(); }
  function setNow(ms) { fixedNow = ms; }

  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return ymd(new Date(now())); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); } /* b - a */
  function dow(s) { return parse(s).getDay(); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function addMonths(s, n) {
    var d = parse(s), day = d.getDate();
    var t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    t.setDate(Math.min(day, daysInMonth(t.getFullYear(), t.getMonth())));
    return ymd(t);
  }
  function monthKey(s) { return s.slice(0, 7); }
  function startOfWeek(s, weekStart) { var k = (dow(s) - weekStart + 7) % 7; return addDays(s, -k); }

  function hm(h, m) { return pad(h) + ':' + pad(m); }
  function toMin(t) { var p = t.split(':'); return (+p[0]) * 60 + (+p[1]); }
  /* 날짜 + 시간 → 기기 시각(ms) */
  function at(dateStr, timeStr) { var d = parse(dateStr); var m = toMin(timeStr || '00:00'); d.setHours(Math.floor(m / 60), m % 60, 0, 0); return d.getTime(); }

  var seq = 0;
  function uid() { seq = (seq + 1) % 1296; return Date.now().toString(36) + seq.toString(36) + Math.random().toString(36).slice(2, 7); }

  function debounce(fn, ms) { var t; return function () { var a = arguments, self = this; clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms); }; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  return { now: now, setNow: setNow, pad: pad, ymd: ymd, parse: parse, today: today, addDays: addDays, diffDays: diffDays, dow: dow,
    daysInMonth: daysInMonth, addMonths: addMonths, monthKey: monthKey, startOfWeek: startOfWeek,
    hm: hm, toMin: toMin, at: at, uid: uid, debounce: debounce, clone: clone };
})();

</script>

<script>
/* 언어 — 기기 언어가 한국어면 한국어, 아니면 영어. 날짜 · 시간 표기는 Intl에 맡긴다(손으로 만들지 않는다).

App.i18n = (function () {
  'use strict';
  var U = App.util;
  var DICTS = { ko: App.lang && App.lang.ko, en: App.lang && App.lang.en };

  var raw = (navigator.languages && navigator.languages[0]) || navigator.language || 'ko';
  var lang = /^ko/i.test(raw) ? 'ko' : 'en';

  var rules = (window.Intl && Intl.PluralRules) ? new Intl.PluralRules(locale) : null;

    if (v == null) return key;

  }
  function dateNoWeek(s) { return fmt({ month: 'short', day: 'numeric' }).format(U.parse(s)); }
  function monthTitle(y, m) { return fmt({ year: 'numeric', month: 'long' }).format(new Date(y, m, 1)); }
  function time(hhmm) { var p = hhmm.split(':'); return fmt({ hour: 'numeric', minute: '2-digit' }).format(new Date(2000, 0, 1, +p[0], +p[1])); }
  /* 일정 묶음 왼쪽 시각 열 — '오후'(작게) / '3:00'(크게) 두 줄. 24시간 표기 언어면 period는 빈 글 */
  function timeParts(hhmm) {
    var p = hhmm.split(':'), d = new Date(2000, 0, 1, +p[0], +p[1]), f = fmt({ hour: 'numeric', minute: '2-digit' });
    if (!f.formatToParts) return { period: '', hm: f.format(d) };

    f.formatToParts(d).forEach(function (x) { if (x.type === 'dayPeriod') period = x.value; else if (x.type === 'hour' || x.type === 'minute' || (x.type === 'literal' && x.value.trim() === ':')) hm += x.value.trim(); });
    return { period: period, hm: hm };

  function weekday(i, style) { return fmt({ weekday: style || 'short' }).format(new Date(2023, 0, 1 + i)); } /* 2023-01-01 = 일요일 */
  function weekdayLong(i) { return weekday(i, 'long'); }

  /* 오늘 · 내일 · 어제 · 이번 주 요일 · 날짜 */
  function relDay(s) {
    var n = U.diffDays(U.today(), s);
    if (n === 0) return t('day.today');
    if (n === 1) return t('day.tomorrow');
    if (n === -1) return t('day.yesterday');
    if (n === 2 && lang === 'ko') return t('day.dayAfter');
    if (n > 1 && n < 7) return weekdayLong(U.dow(s));

  }

  }

  return { t: t, lang: lang, locale: locale, relDayIn: relDayIn, dateLong: dateLong, dateShort: dateShort, dateNoWeek: dateNoWeek,

<script>
/* 데이터 형식 — 처음부터 '나중에 동기화를 붙일 수 있는' 모양으로 저장한다.
   모든 할 일 · 목록: id(기기마다 겹치지 않음) · updatedAt · deletedAt(지운 표시, 30일 뒤 정리).
   형식이 바뀌면 VERSION을 올리고 migrate()에 옛 형식 → 새 형식 한 단계를 더한다. */
App.model = (function () {
  'use strict';
  var U = App.util;
  var VERSION = 1;
  var PURGE_DAYS = 30;
  /* 초록은 '했다'의 색이라 목록 색에서 뺀다 (목록 점 초록이 끝낸 일과 헷갈림 · 디자인 조수 5차 6번). 옛 데이터의 green은 migrate가 teal로 */
  /* 새 목록은 이 순서로 색을 받는다 — 주 색(귤색)과 비슷한 orange는 뒤로 (목록 점이 단추처럼 보이지 않게 · UI 채점 6차 ⑧) */

  /* 주 색(체크 · 주요 단추) 고르기 — 귤색 기본 + 파랑 · 초록 · 보라 (사용자 10-31 22:4x · tokens.css data-accent) */

  function defaultSettings() {
    return {
      doneMode: 'bottom',   /* bottom = 아래로(기본 · 방금 체크한 줄은 잠시 그 자리) · keep = 그 자리에 · hide = 끝내면 숨기기.
                               10-31 22:3x 사용자 '체크된 게 위에 있으면 안 한 일이 안 보임' → keep에서 bottom으로 (옛 keep은 migrate가 한 번 옮김) */
      orderV: 2,            /* 2 = 손 순서 판(시간 순 뼈대 + 끌어서 순서) — migrate가 옛 데이터를 한 번만 바꾸는 표시 */
      dragLearned: false,   /* 끌어서 순서 바꾸기를 한 번 해 봤나 — 빠른 메뉴의 안내 한 줄을 그만 보임 */
      theme: 'graphite',    /* light · graphite · dark — 기본 그라파이트 (사용자 10-31 '색상은 그라파이트 기본값이 좋은 거 같은데') · 옛 system은 migrate가 그라파이트로 */
      weekStart: 0,         /* 0 = 일요일 · 1 = 월요일 */
      haptic: true,
      accent: 'tangerine',  /* 주 색: tangerine · blue · green · violet (설정 › 보기 '주 색') */
      textSize: 1,          /* 글자 배율 0.85 ~ 1.4 — 첫 실행 안내 · 설정의 막대 (옛 sm · md · lg · xl도 읽음 · scale()) */
      onboarded: false,     /* 첫 실행 안내를 마쳤거나 건너뛰었나 */
      installTipClosed: false,
      installHintShown: false   /* 아이폰 '홈 화면에 추가해야 알림' 안내를 한 번 보였나 */
    };
  }

  function empty() { return { v: VERSION, tasks: [], lists: [], settings: defaultSettings(), meta: { createdAt: U.now() } }; }

  function newTask(f) {
    var now = U.now();
    var t = {
      id: U.uid(), title: '', note: '', listId: null,
      date: null,     /* 할 날 'YYYY-MM-DD' — 반복이면 시작 날 */
      time: null,     /* 'HH:MM' */
      due: null,      /* 언제까지 */
      remind: null,   /* 몇 분 전에 알릴지 · null = 안 알림 (시간을 넣으면 0 = 정시가 기본) */
      priority: 0,    /* 0 = 표시 없음 · 3 = '중요' 깃발 (옛 1 · 2는 migrate가 0 · 3으로) */
      repeat: null,   /* { freq: 'day'|'week'|'month', every: n, days: [0~6] } — repeat.js */
      subtasks: [],   /* [{ id, title }] */
      done: {},       /* { 날짜열쇠: 끝낸 시각 } — 반복 없으면 열쇠는 'once' */
      subDone: {},    /* { 날짜열쇠: [세부 id] } */
      skip: {},       /* 반복에서 '이번만 건너뛰기' 한 날 { 날짜: 1 } */
      order: now, createdAt: now, updatedAt: now, deletedAt: null

    for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) t[k] = f[k];

  }

    var l = { id: U.uid(), name: '', color: 'blue', emoji: null, photo: null,   /* emoji · photo(192px 동그랗게 보일 JPEG data URL) = 색 점 대신 쓰는 표시(설정한 목록만) */ order: now, createdAt: now, updatedAt: now, deletedAt: null };

    if (['light', 'graphite', 'dark'].indexOf(d.settings.theme) < 0) d.settings.theme = base.settings.theme;   /* 옛 '기기 따라' → 기본 그라파이트 (10-31 세 가지로) */
    if (ACCENTS.indexOf(d.settings.accent) < 0) d.settings.accent = 'tangerine';   /* 옛 '채우는 색'(fill)은 쓰지 않음 — 남아 있어도 무시 */
    d.meta = d.meta || base.meta;
    d.tasks = d.tasks.filter(function (t) { return t && t.id; }).map(function (t) {
      var n = newTask({});
      Object.keys(n).forEach(function (k) { if (t[k] === undefined) t[k] = n[k]; });
      /* 옛 데이터의 반복에 붙은 '언제까지'는 버린다 — 대부분 '있던 일에 반복을 켜서 남은 것'이라 반복 끝으로 옮기면 반복이 지난 날에 끝나 사라짐 (6호 재확인 새 문제) */
      if (t.repeat && t.due) t.due = null;
      /* 중요도 4단계 → '중요' 하나(3): 옛 보통 이상은 중요, 낮음은 표시 없음 (색 검증 조수 10-31) */

  }

    var ids = {}; d.lists.forEach(function (l) { ids[l.id] = 1; });
    d.tasks.forEach(function (t) { if (t.listId && !ids[t.listId]) t.listId = null; });
  }

  /* 글자 크기 = 배율 숫자(0.85 ~ 1.4) — 끌어서 부드럽게 맞추는 막대 (사용자 10-31 '뚜둑 말고 선형적으로').
     옛 데이터 · 미리보기의 sm · md · lg · xl 글자도 그대로 읽는다. 1.4 = 60대 기준 (점검원 1호 10번) */
  var TEXT_SCALE = { sm: 0.9, md: 1, lg: 1.15, xl: 1.4 };
  var SCALE_MIN = 0.85, SCALE_MAX = 1.4;
  function scale(v) {

    empty: empty, newTask: newTask, newList: newList, migrate: migrate, defaultSettings: defaultSettings };
})();

    var t = App.i18n.t, out = [], cut = false, repLast = 0;
    var start = U.ymd(new Date(now - 86400000)), end = U.addDays(U.ymd(new Date(now)), HORIZON_DAYS);
    Q.live(d).forEach(function (task) {
      if (task.remind == null) return;
      var base = task.date || (!task.repeat && task.due) || null;
      if (!base) return;
      var hm = task.time || MORNING, days = [];
      if (task.repeat) {
        for (var s = start; s <= end; s = U.addDays(s, 1)) if (Q.occurs(task, s)) days.push(s);
        if (!task.repeat.until || task.repeat.until > end) cut = true;   /* 60일 뒤에도 이어지는 반복 */
      } else if (!task.done.once) days.push(base);
      days.forEach(function (day) {
        var key = T.keyFor(task, day);
        if (T.isDone(task, key)) return;
        var at = U.at(day, hm) - task.remind * 60000;
        if (at <= now) return;
        out.push({ id: task.id + '|' + key, taskId: task.id, key: key, at: at, title: task.title, body: body(task, day, at) });
        if (task.repeat && at > repLast) repLast = at;

    });
    out.sort(function (a, b) { return a.at - b.at; });

  function body(task, day, at) {

    if (!task.time && !task.date) return task.remind ? t('notif.dueTomorrow') : t('notif.dueToday');   /* 언제까지만 있는 일 */
    if (!task.time) return task.remind ? t('notif.dayBefore') : t('notif.today');
    if (!task.remind) return t('notif.now', { time: I.time(task.time) });
    /* 알림이 그 전날에 울리면 '내일 오후 3:00' — '하루 전'이 오늘 3시로 읽히지 않게 (5호 2번). 자정 넘는 '1시간 전'도 같음 */
    var gap = day && at ? U.diffDays(U.ymd(new Date(at)), day) : 0;
    if (gap === 1) return t('notif.tomorrowAt', { time: I.time(task.time) });
    if (gap > 1) return t('notif.dateAt', { date: I.dateNoWeek(day), time: I.time(task.time) });
    return t('notif.before', { time: I.time(task.time), before: label(task.remind, true) });
  }

  var OPTIONS = [0, 5, 10, 30, 60, 1440];
  var OPTIONS_NO_TIME = [0, 1440];  /* 시간 없는 날: 그날 아침 9시 · 전날 아침 9시 */
  function label(min, hasTime) {
    var t = App.i18n.t;
    if (min == null) return t('remind.off');
    if (hasTime === false) return min === 0 ? t('remind.morning') : t('remind.dayBeforeMorning');
    if (min === 0) return t('remind.atTime');
    if (min < 60) return t('remind.minBefore', { n: min });
    if (min < 1440) return t('remind.hourBefore', { n: min / 60 });
    return t('remind.dayBefore', { n: min / 1440 });
  }

  return { upcoming: upcoming, OPTIONS: OPTIONS, OPTIONS_NO_TIME: OPTIONS_NO_TIME, label: label };
})();

<script>

<script>

<script>

   나중에: 아이폰 앱(위젯) = platformIOS · 동기화 = 이 결과를 감싸는 platformSync · 푸시 = notify만 바꿔 끼움 (기획/나중에 붙일 것.md) */

<script>
/* 상태 한 곳 — 모든 바꾸기는 commit()을 거친다: 바꾸기 → 저장(곧) → 알림 · 위젯 갱신(곧) → 'change' 알림.
   되돌리기는 바꾸기 직전 모습을 한 칸 기억한다(지우기 · 옮기기 · 불러오기). */
App.store = (function () {
  'use strict';
  var P = App.platform, M = App.model, T = App.tasks, Q = App.query, Rm = App.reminders, U = App.util;
  var data = M.empty(), undoSnap = null;

  function load() {
    var raw = P.storage.load(), d = null;
    try { d = raw ? JSON.parse(raw) : null; } catch (e) { d = null; }
    if (raw && !d) {                                     /* 깨진 저장 → 지난번 시작 때 사본으로 */
      try { d = JSON.parse(P.storage.loadBackup() || 'null'); } catch (e2) { d = null; }
    } else if (raw && !keeping(d)) P.storage.saveBackup(raw);   /* 시작할 때마다 사본 한 벌 — 단 불러오기 · 처음으로 한 뒤 7일은 그 전 모습을 지킴 (6호 6번) */
    data = M.migrate(d);
    P.storage.persist();
    drainInbox();
    sideEffects();
  }

  function persist() { P.storage.save(JSON.stringify(data)); }
  var persistSoon = U.debounce(persist, 250);
  function sideEffects() {

    try { P.widget.publish(Q.widgetSnapshot(data)); } catch (e) { console.error(e); }

  function exportText() { return JSON.stringify({ app: 'todo02', exportedAt: new Date().toISOString(), data: data }); }
  function readImport(text) {
    var o = JSON.parse(text), d = o && o.data ? o.data : o;

  }
  /* 불러오기: 할 일 · 목록 · '끝낸 일 보이기' 같은 쓰는 방식은 파일 것으로, 이 기기의 보기 설정(글자 크기 · 테마 · 진동 · 안내 닫음)은 지금 것 유지 (점검원 1호 17번) */
  var DEVICE_KEYS = ['textSize', 'theme', 'fill', 'seenNews', 'qaKeep', 'haptic', 'installTipClosed', 'onboarded', 'installHintShown', 'lastExport'];
  /* 통째로 바꾸기 전 모습은 사본 칸에 두고 7일 동안 덮어쓰지 않는다 → 설정 '바꾸기 전으로 되돌리기' (5초 띠를 놓쳐도 · 6호 6번) */

  function replaceAll(d, opts) {

    data = M.migrate(d);
    DEVICE_KEYS.forEach(function (k) { if (keep[k] !== undefined) data.settings[k] = keep[k]; });
    data.settings.keepBackupUntil = opts && opts.noKeep ? 0 : U.now() + KEEP_DAYS * 86400000;
    flush(); App.bus.emit('change', {});
  }
  /* 사본 칸(바꾸기 전 모습)으로 되돌리기. 지금 모습은 다시 사본 칸으로 가서 바로 뒤에는 되돌릴 수 있음 */

    if (!d || !Array.isArray(d.tasks)) return false;
    replaceAll(d, { noKeep: true });
    return true;
  }

  /* 처음 상태로 (시험판 설정의 '처음 상태로 되돌리기') — 지금 모습은 사본 칸에 남겨 바로 되돌릴 수 있게 */
  function resetAll() {
    var before = JSON.stringify(data);
    P.storage.saveBackup(before); undoSnap = before;
    data = M.empty();

    flush(); App.bus.emit('change', { reset: true });
  }

  return {
    get data() { return data; },
    load: load, commit: commit, undo: undo, flush: flush, resume: resume, resetAll: resetAll,
    exportText: exportText, readImport: readImport, replaceAll: replaceAll, revertBackup: revertBackup, keeping: function () { return keeping(data); }

})();

</script>
<script>
/* 화면 조각 만들기 도구 — h('div.card', { onclick: fn, 'aria-label': '…' }, 자식들…) */
App.dom = (function () {
  'use strict';
  function h(sel) {
    var parts = sel.split('.'), el = document.createElement(parts[0] || 'div');
    if (parts.length > 1) el.className = parts.slice(1).join(' ');
    var i = 1, attrs = arguments[1];
    if (attrs && typeof attrs === 'object' && !(attrs instanceof Node) && !Array.isArray(attrs)) {
      i = 2;
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'class') el.className += (el.className ? ' ' : '') + v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'html') el.innerHTML = v;      /* 아이콘 SVG 같은 우리 글자만 — 사용자 글자는 text로 */
        else if (k === 'style' && typeof v === 'object') Object.keys(v).forEach(function (p) { if (p.slice(0, 2) === '--') el.style.setProperty(p, v[p]); else el.style[p] = v[p]; });
        else if (k === 'value') el.value = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      });
    }
    for (; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  function autosize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  return { h: h, clear: clear, add: add, autosize: autosize };

  /* 묶음(제목 + 카드) */

  /* 하루 묶기 — 오늘 화면 · 캘린더 고른 날이 같이 쓴다: 그날만의 일(이름표 없이 맨 위) → '반복'(끝낸 수/전체).

     이름표: 일정 묶음은 시각 열이 말하니 이름 없음, '할 일'은 일정 묶음도 있을 때만(한쪽뿐이면 이름 없음 — 줄 몇 개에 이름표는 조잡) */
  function dayGroups(items, o) {
    o = o || {};
    var timed = items.filter(function (it) { return it.task.time; }),
        loose = items.filter(function (it) { return !it.task.time && !it.task.repeat; }),
        rep = items.filter(function (it) { return it.task.repeat && !it.task.time; });
    var firstLabel = o.onceLabel || '';   /* 목록 화면: 맨 앞 묶음에 '오늘' */
    /* (되돌림) 반복 묶음에서 끝낸 것을 아래로 내리던 것은 뺐다 — 설정 '끝낸 일: 그 자리에'와 어긋나고, 체크한 자리에 다음 줄이 올라와 손이 느린 사람이 잘못 누름 (3호 5번).

    /* 머리에 '3/8' 같은 분수는 두지 않는다 — 끝낸 것이 아래로 초록으로 모이는 모양이 이미 진행을 보여 줌(사용자 10-31 '너무 이과적이면 거부감').

  /* ── 방금 체크한 줄 잠시 그 자리에 ('아래로' 기본) ──
     체크하면 hold에 넣고, 손을 3초 쉬면(누르는 중 · 화면 내리는 중 · 창이 열린 중 · 끄는 중이면 미룸) 한꺼번에 스르르 가라앉힌다.
     화면을 옮기거나 앱을 다시 열면 바로 정리 (app.js release). 여러 개를 연달아 체크하면 시계를 다시 시작해 마지막에 한 번만 움직임 (순서 조수) */
  var hold = {}, settleTimer = null, SETTLE_MS = 3000;
  function isHeld(it) { return !!hold[it.task.id + '|' + it.key]; }
  function settleSoon() { clearTimeout(settleTimer); settleTimer = setTimeout(settle, SETTLE_MS); }
  function release() { clearTimeout(settleTimer); settleTimer = null; hold = {}; }
  function settle() {
    settleTimer = null;

    var focusK = document.activeElement && document.activeElement.closest && document.activeElement.closest('.task-wrap');
    focusK = focusK && focusK.getAttribute('data-k');

    /* 화면 읽기 프로그램 · 키보드: 다시 그린 뒤 같은 줄에 초점을 돌려놓음 (맨 위로 튀지 않게) */
    if (focusK) { var w = document.querySelector('#main .task-wrap[data-k="' + focusK + '"]'); var f = w && w.querySelector(focusCheck ? '.check' : '.task-body'); if (f) try { f.focus({ preventScroll: true }); } catch (e) {} }
  }

  document.addEventListener('pointerup', function () { pressing = false; if (settleTimer) settleSoon(); }, true);
  document.addEventListener('pointercancel', function () { pressing = false; }, true);
  window.addEventListener('scroll', function () { if (settleTimer) settleSoon(); }, { passive: true });

  /* 바꾸고 바로 그 자리에서 다시 그리며, 움직인 줄은 미끄러지고 새로 나타난 줄은 스르르 (지우기 · 되돌리기 · 숨기기 · 가라앉기 · 메뉴로 옮기기) */
  function animate(fn) { flip(function () { fn(); App.render.now(); }); }
  /* 화면을 다시 그리기 전 · 뒤 자리를 비교해 움직인 줄만 부드럽게 */
  function flip(fn) {
    var before = {};
    Array.prototype.forEach.call(document.querySelectorAll('#main .task-wrap[data-k]'), function (el) { before[el.getAttribute('data-k')] = el.getBoundingClientRect().top; });
    var had = Object.keys(before).length > 0;

    var moved = [];
    Array.prototype.forEach.call(document.querySelectorAll('#main .task-wrap[data-k]'), function (el) {
      var b = before[el.getAttribute('data-k')];

    setTimeout(function () { moved.forEach(function (el) { el.classList.remove('is-flip'); }); }, 420);
  }

  /* 그날 건너뛴 반복 — 흐린 한 줄 '{이름} 건너뜀 · 다시 넣기' (되돌리기 띠를 놓쳐도 되살릴 수 있게 · 4호 2번) */
  function skipped(day) {

</script>
<script>
/* 오늘 (첫 화면) — 오늘 날짜 · 오늘 한 비율 · [지난 일 · 오늘 · 언제든]. 지난 일은 빨간색 없이, 한 번에 오늘로. */
App.screens = App.screens || {};
App.screens.today = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, Q = App.query, S = App.store, ic = App.icons.svg;
  var showDone = false, lateState = { open: false };

  /* 오늘 한 만큼 — 고리 그림 대신 사람 말 한 줄 ("3개 중 1개 했어요", 끝낸 수만 초록) · AI 티 진단 10-31 */
  function progress(done, total, allDone) {
    if (!total && !done) return null;
    if (allDone) return h('p.progress.is-full', t('today.allDoneN', { n: total }));
    if (!done) return h('p.progress', t('today.planned', { n: total }));   /* 아침: "15개 중 0개 했어요" 대신 "오늘 할 일 15개" — 빈칸 실패감 없이 (정체성 설계 10-31) */
    /* 분모 없이 '한 것'만: "3개 했어요" — 15개 중 몇 개라는 계산기 인상 대신 진전만 (사용자 10-31 '너무 이과적이면 거부감') */
    var parts = t('today.progressText').split('{done}');
    return h('p.progress', parts[0], h('b.num', String(done)), parts[1] || '');
  }

  /* 그날 칸 색 단계 — 캘린더 칠하기와 같은 셈(Q.dayStats: 그날 자리의 일 + 그날 끝낸 다른 날 일 · 80% 이상 = 거의 다).
     밀린 일을 오늘 몰아서 끝내도 오늘 네모가 물든다 (5호 1번) */
  function markLevel(day) {
    var s = Q.dayStats(S.data, day);

  }

  function installTip(d) {

    if (!info.isIOS || info.standalone || d.settings.installTipClosed) return null;

      h('span', { html: ic('share', 22), style: { color: 'var(--accent-ink)' } }),
      h('div.banner-body', h('b', t('install.title')), h('br'), t('install.text')),

    var todayAllDone = total > 0 && v.today.every(Q.done);

    var screen = h('div.screen');

    screen.appendChild(h('header.page-head.is-top',
      h('div.head-main',
        h('h1.title', I.dateNoWeek(today), h('span.title-sub', I.weekday(U.dow(today)))),
        progressRow(doneN, total, todayAllDone)),
      h('div.head-actions', h('button.icon-btn', { type: 'button', 'aria-label': t('search.title'), html: ic('search', 22), onclick: App.screens.lists.search }))));

    var tip = installTip(d); if (tip) screen.appendChild(tip);

    if (!all.length) {

    /* 지난 일은 머리말 바로 아래 접힌 회색 한 줄 — 반복 8줄 아래에 묻혀 '앱을 못 믿겠다'가 되지 않게 (빨강 · 펼침 없이 · UI 채점 6차 ①) */
    /* 새벽 4시 전에는 어제 일을 접지 않고 '어제' 묶음으로 펼쳐 둔다 — 자정을 넘겨 정리하던 일이 0시에 접힌 '지난 일' 속으로 사라지지 않게 (6호 2번).

      screen.appendChild(h('button.show-done', { type: 'button', onclick: function () { showDone = !showDone; App.render(); } },

     왼쪽 '오늘 한 일': 끝낸 것을 끝낸 시각 순서로 — 그날의 한 장 (다꾸 '다시 보는 시간' · 진전 원리).
     오른쪽 '남은 일 내일로'(저녁 6시부터): 못 끝낸 일을 '언제 할지' 정해 머리에서 내려놓기. 반복은 옮기지 않음(놓친 반복은 쌓지 않음).
     근거: 정체성 설계 10-31 · 기획서 10절 */

  }

      var done = doneLog(c.day), left = c.left;
      /* 창 머리 = 그날 칸 색 네모 + 날짜 — '그날 칸이 이만큼 찼다'를 숫자 없이 (UI 채점 3 ④) */
      body.appendChild(h('div.close-head', h('span.day-mark' + markLevel(c.day), { 'aria-hidden': 'true' }), I.dateNoWeek(c.day), h('span.title-sub', I.weekday(U.dow(c.day)))));
      body.appendChild(done.length ? h('div.done-log', done.map(function (it) {
        var at = new Date(it.task.done[it.key]);
        return h('div.done-log-row', h('span.done-log-time.num', I.time(U.hm(at.getHours(), at.getMinutes()))), h('span.done-log-dot'), h('span.done-log-title', it.task.title));
      })) : h('p.day-empty', t('today.noneDoneYet')));

        draw(body);
      }

      body.appendChild(h('div.card', left.map(function (it) {
        return h('div.left-row', h('span.left-title', it.task.title),

})();

</script>
<script>
/* 캘린더 — 달 보기. 칸마다 점 하나(다 함 · 일부 함 · 아직). 날을 누르면 그날 목록 · 그날에 바로 추가.
   캘린더 앱과의 차이: 지난 날에 '내가 한 것'이 남아 보인다. */

  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, Q = App.query, S = App.store, ic = App.icons.svg;
  var st = null, lastSwipe = 0;

  /* 자정이 지났을 때: '오늘'을 보고 있었으면 새 오늘로, 다른 달 · 다른 날을 보고 있었으면 그대로 둔다 (1호 25번 재확인) */

  function stateFor(y, m) { var first = y + '-' + U.pad(m + 1) + '-01'; return { y: y, m: m, sel: U.monthKey(U.today()) === U.monthKey(first) ? U.today() : first }; }
  function shift(s, n) { var y = s.y, m = s.m + n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } return stateFor(y, m); }

  /* ── 달 넘기기 (사용자 10-31 22:5x '진짜 넘어가는 듯 부드럽게 · 둔하거나 렉 먹은 것처럼 말고 · 하단도 자연스럽게' → 모션 점검원 설계) ──

     다 넘어가면 그 자리에서 다시 그린다 — 같은 모양이라 바꿔 끼움이 보이지 않음. 6줄 고정이라 달마다 높이가 같아 아래 목록이 튀지 않음.
     아래 고른 날 목록은 옆으로 밀지 않고(높이가 달라 무거움) 투명도만: 넘김이 정해지면 0.12초 흐려지고, 다시 그린 뒤 0.2초 살짝 올라오며 나타남 */

    var old = track.querySelector('.cal-grid.is-ghost[data-side="' + side + '"]'); if (old) old.parentNode.removeChild(old);
    var g = gridOf(s); g.classList.add('is-ghost'); g.setAttribute('data-side', side); g.setAttribute('aria-hidden', 'true');
    g.style.left = side > 0 ? 'calc(100% + ' + GAP + 'px)' : 'calc(-100% - ' + GAP + 'px)';
    track.appendChild(g);
  }
  function go(track, dir, next, from) {
    var W = track.offsetWidth + GAP, to = -dir * W, dist = Math.abs(to - (from || 0));
    var ms = reduceMq && reduceMq.matches ? 0 : Math.round(Math.max(160, Math.min(280, dist / W * 300)));
    anim = { next: next };
    var panel = document.querySelector('.screen-cal .day-panel'); if (panel) panel.classList.add('is-leaving');
    var title = document.querySelector('.screen-cal .page-head .title'); if (title) { title.textContent = I.monthTitle(next.y, next.m); title.classList.remove('is-swap'); void title.offsetWidth; title.classList.add('is-swap'); }
    track.style.transition = ms ? 'transform ' + ms + 'ms cubic-bezier(.25,.8,.25,1)' : 'none';

  /* 키보드: ←→ 하루 · ↑↓ 한 주 · PageUp/PageDown 한 달. 칸은 고른 날 하나만 Tab으로 들어옴(나머지는 화살표) — Tab 42번 누르지 않게 (5호 11번) */

    var add =h('button.add-line', { type: 'button', onclick: function () { App.quickadd.open({ date: st.sel }); } },
      h('span', { html: ic('plus', 20) }), /* "내일 할 일 추가" · "11월 5일에 할 일 추가" — 오늘 · 내일 · 어제 · 모레에는 '에'를 붙이지 않음 (점검원 2호 8번) */

<script>
/* 목록 — 내 목록들(집 · 회사 · 운동처럼 사용자가 만듦) + 목록 하나를 따로 보는 화면. */
App.screens.lists = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, T = App.tasks, Q = App.query, S = App.store, P = App.pickers, ic = App.icons.svg, M = App.model;

  /* stay = 예시 칩으로 만들 때: 목록 탭에 머문다(남은 예시를 이어서 누를 수 있게) · 띠의 '열기'로 들어감 (7호 5번) */
  function create(name, stay) {
    /* '새 목록'으로 직접 만든 사람은 쓰는 법을 안 것 → 예시는 조용히 닫는다 (사용자 10-31 '셋 다 추가하기 전에는 안 없어지는 게 어색') */
    var l = S.commit(function (d) { var x = T.addList(d, name); if (!stay) d.settings.listSuggestOff = true; return x; });
    if (!stay) { App.go('list', l.id); return; }
    App.platform.haptic.tap();
    App.toast.show(t('lists.made', { name: name }), { action: t('notif.open'), onAction: function () { App.go('list', l.id); } });
  }

  function overview(main) {
    var d = S.data, lists = d.lists.filter(T.alive).sort(function (a, b) { return a.order - b.order; });
    var screen = h('div.screen');
    screen.appendChild(h('header.page-head', h('h1.title', t('nav.lists')),
      h('div.head-actions', h('button.icon-btn', { type: 'button', 'aria-label': t('search.title'), html: ic('search', 22), onclick: search }))));

    /* '새 목록'은 늘 맨 위 한자리 — 목록이 늘어도 만드는 단추가 아래로 밀려 자리가 바뀌지 않게 (사용자 10-31) */
    var rows = [h('button.prop.list-row.is-add', { type: 'button', onclick: function () {
      P.text({ title: t('list.new'), placeholder: t('list.namePh'), onDone: create });
    } }, h('span.prop-icon', { html: ic('plus', 20) }), h('span.prop-label', t('list.new')))];
    lists.forEach(function (l) {
      var n = Q.remaining(d, l.id);
      var row = h('button.prop.list-row', { type: 'button', onclick: function () { if (Date.now() < row._held) return; App.go('list', l.id); } },
        App.listMark(l), h('span.prop-label', l.name),
        h('span.prop-value.num', n ? t('lists.left', { n: n }) : ''), h('span.prop-chev', { html: ic('chevR', 18) }));
      /* 꾹 누르기(노트북은 오른쪽 클릭) = 그 목록의 '…' 창 — 들어가지 않고 색 · 표시 · 이름 · 지우기 (꾹 누르기 자리 조수 10-31 · 할 일 줄과 같은 손짓) */
      App.row.longPress(row, function () { row._held = Date.now() + 700; more(l); });
      rows.push(row);
    });
    screen.appendChild(h('div.card', rows));

    var names = lists.map(function (l) { return l.name; });
    var sugg = t('lists.suggest').split(',').filter(function (s) { return names.indexOf(s) < 0; });
    /* 예시 목록: 하나를 눌러 만들어도 나머지는 그대로 남는다 — 눌렀더니 다 사라져 '어디 갔지' 하던 것 (사용자 10-31).
       목록을 한 번이라도 지운 사람에게는 더 보이지 않는다 — 일부러 안 쓰기로 한 사람을 재촉하지 않게 (4호 10번) */
    if (!S.data.settings.listSuggestOff && sugg.length) {
      screen.appendChild(h('section.section.mt-l',
        /* 오른쪽 작은 × = 예시 닫기(되돌리기 띠) — 셋을 다 만들지 않아도 치울 수 있게 */
        h('div.section-head', h('span.section-label', t('lists.suggestLabel')),
          h('button.section-action.suggest-x', { type: 'button', 'aria-label': t('lists.suggestHide'), html: ic('x', 16), onclick: function () {
            S.commit(function (dd) { dd.settings.listSuggestOff = true; }, { undo: true });
            App.toast.show(t('lists.suggestHidden'), { action: t('common.undo'), onAction: S.undo });
          } })),
        h('div.chips.wrap', sugg.map(function (s) { return h('button.chip', { type: 'button', onclick: function () { create(s, true); } }, h('span', { html: ic('plus', 16) }), s); })),
        h('p.hint', t('lists.hint'))));
    }
    main.appendChild(screen);
  }

  /* 찾기 — 제목 · 메모 · 세부 할 일 (끝낸 일 포함). "그 보고서 언제 했지?"를 달력 넘기지 않고 (점검원 1호 13번) */
  function search() {
    var input = h('input.field.search-input', { type: 'search', placeholder: t('search.ph'), enterkeyhint: 'search', 'aria-label': t('search.title') });
    var box = h('div.search-results'), off = null;
    function draw() {
      App.dom.clear(box);
      var q = input.value.trim(); if (!q) return;
      var items = Q.search(S.data, q);
      box.appendChild(items.length ? h('div.card', items.map(function (it) { return App.row.render(it, { showDay: true }); })) : h('p.day-empty', t('search.none')));
    }
    var s = App.sheet.open({ title: t('search.title'), focus: input, content: function (body) { body.appendChild(input); body.appendChild(box); },
      onClose: function () { if (off) off(); } });
    input.addEventListener('input', App.util.debounce(draw, 120));
    off = App.bus.on('change', function () { if (!s.closed) draw(); });
  }

  function more(l) {
    var s = App.sheet.open({ title: l.name, content: function (body) {
      body.appendChild(P.opt(t('list.rename'), null, false, function () {
        s.close(true);
        P.text({ title: t('list.rename'), value: l.name, onDone: function (v) { S.commit(function (d) { T.updateList(d, l.id, { name: v }); }); } });
      }));
      body.appendChild(h('p.pick-label', { text: t('list.color') }));
      body.appendChild(h('div.swatches', M.LIST_COLORS.map(function (c) {
        return h('button.swatch.bg-' + c + (c === l.color ? '.is-on' : ''), { type: 'button', 'aria-label': t('color.' + c), 'aria-pressed': c === l.color ? 'true' : 'false',
          html: c === l.color ? ic('check', 18) : '', onclick: function () { s.close(true); S.commit(function (d) { T.updateList(d, l.id, { color: c }); }); } });
      })));
      /* 표시 — 색 점 대신 이모지 하나 (나만의 표시 · 커스텀 범위 조수 10-31). 기본은 색 점, 원하는 사람만 이 창에서 고름 */
      /* 무난하게 많이 쓰는 구분용만 12개 — 너무 많으면 고르기가 일이 됨 (사용자 10-31 '튀지 않고 모나지 않게 · 난잡하지 않게') */
      var EMO = ['🏠', '💼', '💪', '📚', '🛒', '✈️', '💊', '💄', '🐶', '💰', '💕', '⭐'];
      function setEmoji(v) { s.close(true); S.commit(function (d) { T.updateList(d, l.id, { emoji: v || null, photo: null }); }); }
      body.appendChild(h('p.pick-label', { text: t('list.mark') }));
      body.appendChild(h('div.emoji-row', [h('button.emoji-opt' + (!l.emoji && !l.photo ? '.is-on' : ''), { type: 'button', 'aria-label': t('list.markDot'), onclick: function () { setEmoji(null); } }, h('span.list-dot.c-' + l.color)),
        /* 사진 — 앨범에서 한 장 → 동그랗게 맞추기 (예: 연인과의 약속 목록에 그 사람 얼굴). 맞춘 사진은 '내 사진'으로 남아 다른 목록에도 바로 고름 */
        h('button.emoji-opt.is-photo', { type: 'button', 'aria-label': t('list.markPhoto'), onclick: function () {
          s.close(true);
          App.platform.files.pickImage && App.platform.files.pickImage().then(function (src) {
            if (!src) return;
            App.photoCrop(src, function (out) {
              S.commit(function (d) {
                T.updateList(d, l.id, { photo: out, emoji: null });
                /* 내 사진: 새것이 앞, 많아야 6장 — 끝없이 늘지 않게 (사용자 10-31 '미친 듯이 늘어나는 구조 말고') */
                d.settings.myPhotos = [out].concat((d.settings.myPhotos || []).filter(function (p) { return p !== out; })).slice(0, 6);
              });
            });
          });
        } }, h('span', { html: ic('camera', 18) }))]
        /* 내 사진 칸 — 누르면 이 목록 표시로 · 꾹 누르면 '내 사진에서 빼기'(이미 쓰는 목록은 그대로) */
        .concat((S.data.settings.myPhotos || []).map(function (p) {
          var b = h('button.emoji-opt.is-mine' + (l.photo === p ? '.is-on' : ''), { type: 'button', 'aria-label': t('list.myPhoto'), onclick: function () {
            if (Date.now() < b._held) return;
            s.close(true); S.commit(function (d) { T.updateList(d, l.id, { photo: p, emoji: null }); });
          } }, h('img.list-photo', { src: p, alt: '' }));
          App.row.longPress(b, function () {
            b._held = Date.now() + 600;
            P.confirm({ title: t('list.myPhotoDelQ'), text: t('list.myPhotoDelText'), ok: t('list.myPhotoDel'), onOk: function () {
              S.commit(function (d) { d.settings.myPhotos = (d.settings.myPhotos || []).filter(function (x) { return x !== p; }); }, { undo: true });
              App.toast.show(t('list.myPhotoDeleted'), { action: t('common.undo'), onAction: S.undo });
            } });
          });
          return b;
        }))
        .concat(EMO.map(function (e) { return h('button.emoji-opt' + (l.emoji === e && !l.photo ? '.is-on' : ''), { type: 'button', onclick: function () { setEmoji(e); } }, e); }))
        .concat(h('button.emoji-opt.is-type', { type: 'button', 'aria-label': t('list.markType'), onclick: function () {
          s.close(true);
          P.text({ title: t('list.markType'), placeholder: '🌷', value: l.emoji && EMO.indexOf(l.emoji) < 0 ? l.emoji : '', onDone: function (v) {
            /* 글자 하나(이모지 하나)만 — 여러 글자를 넣어도 첫 글자만 표시로 */
            var first = window.Intl && Intl.Segmenter ? (new Intl.Segmenter().segment(v)[Symbol.iterator]().next().value || {}).segment : Array.from(v)[0];
            S.commit(function (d) { T.updateList(d, l.id, { emoji: first || null, photo: null }); });
          } });
        } }, h('span', { html: ic('plus', 16) })))));
      /* 맨 아래 흐린 지우기 — 할 일 줄 메뉴와 같은 모양(menu-delete · 휴지통 아이콘) */
      body.appendChild(h('button.menu-delete', { type: 'button', onclick: function () {
        s.close(true);
        P.confirm({ title: t('list.deleteQ', { name: l.name }), text: t('list.deleteText'), ok: t('list.delete'), onOk: function () {
          S.commit(function (d) { T.removeList(d, l.id); d.settings.listSuggestOff = true; }, { undo: true });
          App.go('lists');
          App.toast.show(t('list.deleted'), { action: t('common.undo'), onAction: S.undo });
        } });
      } }, h('span', { html: ic('trash', 18) }), t('list.delete')));
    } });
  }

  /* 목록 화면 머리의 표시 — 사진이면 프로필처럼 크게(56px) · 누르면 크게 보기 (사용자 10-31 22:5x '얼굴 넣어 봤는데 만족될 정도로 사이즈가 안 나옴 ·
     다 같이 키우면 할머니 폰 · 카톡 프로필 누르면 확대되듯'). 목록 줄 · 할 일 줄의 작은 표시는 그대로라 화면 균형은 그대로 */
  function listHeadMark(l) {
    if (!l.photo) return App.listMark(l, '.lg');
    var img = App.listMark(l, '.lg.is-head');
    return h('button.list-head-photo', { type: 'button', 'aria-label': t('photo.view'), onclick: function (e) { App.photoView(l.photo, e.currentTarget.querySelector('img')); } }, img);   /* 누른 그때 살아 있는 사진 자리에서 커짐 */
  }

  function single(main, id) {
    var d = S.data, l = T.list(d, id);
    if (!l) { App.go('lists'); return; }
    var v = Q.listView(d, id), st = d.settings, screen = h('div.screen');
    screen.appendChild(h('header.page-head',
      h('div',
        h('button.back-btn', { type: 'button', onclick: function () { App.go('lists'); } }, h('span', { html: ic('chevL', 18) }), t('nav.lists')),
        h('h1.title.list-title', listHeadMark(l), l.name)),
      h('div.head-actions', h('button.icon-btn', { type: 'button', 'aria-label': t('list.more'), html: ic('more', 22), onclick: function () { more(l); } }))));

    var any = v.overdue.length + v.today.length + v.anytime.length + v.upcoming.length + v.history.length;
    if (!any) {
      screen.appendChild(h('div.empty', h('div.empty-mark', { html: ic('lists', 28), style: { color: 'var(--c-' + l.color + ')' } }),
        h('p.empty-title', t('list.emptyTitle')), h('p.empty-text', t('list.emptyText'))));
      main.appendChild(screen); return;
    }
    /* 오늘 화면과 같은 배치: 지난 일(머리 바로 아래 접힌 한 줄) → 오늘(그날만의 일 → 반복 묶음) → 다가오는 일 → 언제든 · 숨기기 모드면 '끝낸 일 보기' (점검원 1호 14번 · 3호 12번) */
    var o = { hideList: true }, hidden = 0;
    lateStates[id] = lateStates[id] || { open: false };
    function part(items, late) { var r = Q.visible(late ? Q.sortLate(items) : Q.sort(items, st, App.row.isHeld), st, !!showDoneFor[id]); hidden += r.hidden; return r.items; }
    /* 빈 묶음은 section이 null을 돌려준다 → 붙이지 않음 (배치 점검에서 잡힌 오류 · 10-31) */
    function add(x) { if (x) screen.appendChild(x); }
    add(App.row.lateFold(part(v.overdue, true), lateStates[id], o));
    App.row.dayGroups(part(v.today), Object.assign({ all: v.today, onceLabel: t('sec.today') }, o)).forEach(add);
    add(App.row.section(t('sec.upcoming'), v.upcoming, Object.assign({ showDay: true }, o)));   /* 다가오는 일 = 날짜 순(끌기 없음) */
    add(App.row.section(t('sec.anytime'), part(v.anytime), Object.assign({ manual: true }, o)));
    if (hidden || (showDoneFor[id] && st.doneMode === 'hide')) {
      screen.appendChild(h('button.show-done', { type: 'button', onclick: function () { showDoneFor[id] = !showDoneFor[id]; App.render(); } },
        showDoneFor[id] ? t('done.hide') : t('done.show', { n: hidden })));
    }
    if (v.history.length) {
      var open = !!showHistory[id];
      screen.appendChild(h('button.show-done', { type: 'button', onclick: function () { showHistory[id] = !open; App.render(); } },
        open ? t('done.hide') : t('list.history', { n: v.history.length })));
      if (open) add(App.row.section(t('sec.history'), v.history.slice(0, 100), Object.assign({ showDay: true }, o)));
    }
    main.appendChild(screen);
  }

  return { overview: overview, single: single, search: search, more: more };
})();

</script>
<script>
/* 할 일 자세히 — 고치면 바로 저장(저장 단추 없음). 세부 할 일 · 날짜 · 시간 · 알림 · 반복 · 언제까지 · 중요도 · 목록 · 메모 · 지우기.
   비어 있는 칸은 흐린 '추가'로만 보이고, 넣은 칸만 진하게 — 기본값으로 화면을 채우지 않는다. */
App.detail = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, S = App.store, P = App.pickers, ic = App.icons.svg;

  function open(id, key) {
    var task = T.find(S.data, id); if (!task) return;
    /* 체크 열쇠는 그릴 때마다 다시 정한다 (창 안에서 반복을 켜고 끄면 열쇠가 'once' ↔ 날짜로 바뀜) */
    var day = key && key !== 'once' ? key : U.today();
    key = T.keyFor(task, day);
    var props = h('div.card.props'), subsBox = h('div.subs-edit'), headBox = h('div');
    var title = h('textarea.detail-title', { rows: 1, 'aria-label': t('detail.titleLabel'), enterkeyhint: 'done', maxlength: 300 });
    title.value = task.title;
    var note = h('textarea.field.note', { rows: 3, placeholder: t('prop.notePh'), 'aria-label': t('prop.note') });
    note.value = task.note || '';

    function cur() { return T.find(S.data, id); }
    function set(patch) { S.commit(function (d) { T.update(d, id, patch); }); draw(); }
    /* 줄 끝 ×로 뺄 때는 되돌리기 띠 — 줄을 누르려다 ×를 누른 사람이 소리 없이 값을 잃지 않게 (6호 5번) */
    function clear(patch, label) {
      S.commit(function (d) { T.update(d, id, patch); }, { undo: true }); draw();
      App.toast.show(t('detail.cleared', { what: label }), { action: t('common.undo'), onAction: function () { S.undo(); draw(); } });
    }

    var sheet = App.sheet.open({ className: 'detail-sheet', title: '', content: function (body) {
      body.appendChild(headBox);
      body.appendChild(h('section.detail-block', h('div.block-label', t('prop.subtasks')), subsBox));
      body.appendChild(props);
      body.appendChild(h('section.detail-block', h('div.block-label', t('prop.note')), note));
      body.appendChild(h('button.delete-btn', { type: 'button', onclick: remove }, h('span', { html: ic('trash', 18) }), t('detail.delete')));
    } });

    /* 글은 치는 동안 0.5초마다 저장 — 칸에서 안 나가고 앱을 닫아도 잃지 않게 (점검원 1호 3번) */
    function saveTitle() {
      var v = title.value.replace(/\s+/g, ' ').trim();
      if (v && cur() && v !== cur().title) S.commit(function (d) { T.update(d, id, { title: v }); }, { keepUndo: true });
    }
    function saveNote() { if (cur() && note.value !== (cur().note || '')) S.commit(function (d) { T.update(d, id, { note: note.value }); }, { keepUndo: true }); }
    var titleSoon = U.debounce(saveTitle, 500), noteSoon = U.debounce(saveNote, 500);
    title.addEventListener('input', function () { App.dom.autosize(title); titleSoon(); });
    title.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); title.blur(); } });
    title.addEventListener('blur', function () { if (!title.value.trim() && cur()) title.value = cur().title; saveTitle(); });
    note.addEventListener('blur', saveNote);
    note.addEventListener('input', function () { App.dom.autosize(note); noteSoon(); });

    function drawHead() {
      var tk = cur(), done = T.isDone(tk, key);
      var check = h('button.check.lg' + (done ? '.is-on' : ''), { type: 'button', role: 'checkbox', 'aria-checked': done ? 'true' : 'false', 'aria-label': t('detail.check'), html: App.icons.CHECK });
      check.addEventListener('click', function () {
        var will = !check.classList.contains('is-on');
        check.classList.toggle('is-on', will); if (will) App.platform.haptic.success(); else App.platform.haptic.tap();
        setTimeout(function () { S.commit(function (d) { T.toggle(d, id, key); }); draw(); }, 200);
      });
      App.dom.clear(headBox);
      headBox.appendChild(h('div.detail-head' + (done ? '.is-done' : ''), check, title));
      if (tk.repeat) {
        headBox.appendChild(h('div.occ-line',
          h('span', { html: ic('repeat', 15) }), h('span', t('detail.occurrence', { date: I.dateShort(key) })),
          done ? null : h('button.text-btn.sm', { type: 'button', onclick: function () {   /* 끝낸 회차는 건너뛰기 없음 (4호 2번) */
            S.commit(function (d) { T.skip(d, id, key); }, { undo: true });
            sheet.close();
            App.toast.show(t('detail.skipped', { date: I.dateNoWeek(key) }), { action: t('common.undo'), onAction: S.undo });
          } }, t('detail.skip'))));
      }
      requestAnimationFrame(function () { App.dom.autosize(title); App.dom.autosize(note); });
    }

    function drawSubs() {
      var tk = cur();
      App.dom.clear(subsBox);
      tk.subtasks.forEach(function (s) {
        var on = T.isSubDone(tk, key, s.id);
        var c = h('button.check.sm' + (on ? '.is-on' : ''), { type: 'button', role: 'checkbox', 'aria-checked': on ? 'true' : 'false', 'aria-label': s.title, html: App.icons.CHECK });
        var input = h('input.sub-input', { type: 'text', value: s.title, enterkeyhint: 'done', 'aria-label': t('prop.subtasks') });
        c.addEventListener('click', function () {
          var will = !c.classList.contains('is-on'); c.classList.toggle('is-on', will); App.platform.haptic.tap();
          setTimeout(function () {
            var r = S.commit(function (d) { return T.toggleSub(d, id, s.id, key); }, { undo: true });
            if (r && r.parentDone) App.toast.show(t('row.allSubsDone'), { action: t('common.undo'), onAction: function () { S.undo(); draw(); } });
            draw();
          }, 180);
        });
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); input.blur(); } });
        var renameSoon = U.debounce(function () { var v = input.value.trim(); if (v && v !== s.title) S.commit(function (d) { T.renameSub(d, id, s.id, v); }, { keepUndo: true }); }, 500);
        input.addEventListener('input', renameSoon);
        input.addEventListener('blur', function () {
          var v = input.value.trim();
          if (!v) { removeSub(s); return; }

<script>
/* 빠른 추가 — + 한 번 → 입력 칸이 바로 열림 → 적고 엔터 → 창이 닫히고 띠 '추가했어요 · … [하나 더]' (10-31 사용자: 넣은 뒤 창이 남아 어색).

  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, S = App.store, P = App.pickers, ic = App.icons.svg;

    var send = h('button.qa-send', { type: 'button', disabled: true }, t('qa.add'));  /* '→' 대신 글자 '추가' — 채팅 입력창처럼 안 보이게 */

    var keep = h('button.qa-keep', { type: 'button', role: 'switch', onmousedown: function (e) { e.preventDefault(); }, onclick: function () {

    } }, h('span.qa-keep-box', { html: App.icons.CHECK }), t('qa.keep'));
    function paintKeep() { var on = !!S.data.settings.qaKeep; keep.classList.toggle('is-on', on); keep.setAttribute('aria-checked', on ? 'true' : 'false'); }
    paintKeep();

    var flagBtn = h('button.qa-flag', { type: 'button', onmousedown: function (e) { e.preventDefault(); }, onclick: function () {
