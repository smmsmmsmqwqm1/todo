      if (key === 'date' && m.linkTime) restore('time');   /* 날짜를 다시 켜면 같이 꺼졌던 시간도 (7호 재확인) */
    }

    var opener = {};   /* 칩 열쇠 → 고르기 창 여는 함수 (다시 켤 때 이어서 열기) */
    function chip(key, tokType, icon, label, value, onClick) {
      var tok = man[key] === undefined && parsed.tokens.filter(function (tk) { return tk.type === tokType; })[0];
      var lead = key === 'listId' && value ? App.listMark(T.list(S.data, val('listId'))) : h('span', { html: ic(icon, 16) });  /* 목록은 화면 어디서나 같은 표시(색 점 · 이모지) */
      /* 켜진 칩은 모두 ×로 끌 수 있고, 끈 칩을 다시 누르면 방금 값이 그대로 돌아온다(이 할 일을 쓰는 동안) — 사용자 10-31 '모든 항목마다 x · 다시 켜면 전에 넣은 값 유지' */
      var x = value ? h('span.x', { role: 'button', 'aria-label': tok ? t('qa.ignore', { text: tok.text }) : t('detail.clear', { what: label.toLowerCase() }), html: ic('x', 14), onclick: function (e) {
          e.stopPropagation();
          off(key);
          /* 날짜를 빼면 시간도 같이 — 시간만 남으면 저장할 때 '오늘'이 다시 붙어, 칩에 보인 것과 다르게 저장됨 (7호 2번 · 날짜 창 '날짜 빼기'와 같은 규칙).
             시간을 글로 적었으면('3시') 그 낱말은 글에서 잠시 빼 둔다 — 이름에 '3시'가 섞여 저장되지 않게 (7호 재확인 새 1) */
          if (key === 'date' && val('time')) {
            off('time'); mem.date.linkTime = true;
            var mt = mem.time;
            if (mt && mt.text && input.value.indexOf(mt.text) >= 0) { mt.cut = mt.text; input.value = input.value.replace(mt.text, '').replace(/\s{2,}/g, ' ').trim(); }
          }
          draw(); refocus();
        } }) : null;
      var click = onClick;
      if (!value && mem[key]) click = function () {   /* 다시 켜기 = 기억해 둔 값으로 되살리고, 고르기 창도 그 값으로 바로 열어 바꿀 수 있게 (7호 6번) */
        restore(key);
        draw();
        if (opener[key]) opener[key](); else refocus();
      };
      opener[key] = onClick;
      var el = h('button.chip' + (tok ? '.is-parsed' : value ? (key === 'priority' ? '.is-flag' : '.is-on') : '')   /* 켠 '중요' 칩은 화면 어디서나 같은 빨간 깃발 색 */ + (!value && mem[key] ? '.is-mem' : ''), { type: 'button', onclick: click }, lead, value || label, x);
      el._set = !!value;
      return el;
    }

    /* '모레' · '금요일'처럼 말로 된 날은 날짜를 덧붙여 맞게 잡혔는지 보이게 ("다음 주 월요일" → "모레 · 11월 2일") */
    function dayLabel(s) {
      var r = I.relDay(s), n = U.diffDays(U.today(), s);
      return (r === I.dateShort(s) || (n >= -1 && n <= 1)) ? r : r + ' · ' + I.dateNoWeek(s);  /* 오늘 · 내일 · 어제는 그대로 */
    }

    function draw() {
      parsed = App.parse.run(input.value, S.data.lists.filter(T.alive), ignore);
      send.disabled = !(parsed.title || input.value.trim());
      tip.hidden = !!input.value.trim();

      var date = val('date'), time = val('time'), rep = val('repeat'), list = val('listId'), prio = val('priority'), due = val('due');
      var l = list && T.list(S.data, list);
      var all = [
        chip('date', 'date', 'calendar', t('prop.date'), date ? (rep ? t('qa.from', { date: I.dateShort(date) }) : dayLabel(date)) : null, function () { P.date({ value: date, onPick: function (v) { man.date = v; if (!v) man.time = null; draw(); refocus(); } }); }),
        chip('time', 'time', 'clock', t('prop.time'), time ? I.time(time) : null, function () { P.time({ value: time, onPick: function (v) { man.time = v; draw(); refocus(); } }); }),
        chip('repeat', 'repeat', 'repeat', t('prop.repeat'), rep ? App.repeat.describe(rep, date || U.today()) : null, function () { P.repeat({ value: rep, anchor: date || U.today(), onPick: function (v) { man.repeat = v; draw(); refocus(); }, onClose: refocus }); }),
        chip('listId', 'list', 'folder', t('prop.list'), l ? l.name : null, function () { P.list({ value: list, onPick: function (v) { man.listId = v; draw(); refocus(); } }); }),
        /* 반복과 같이 적은 '까지'는 반복 끝나는 날 — 칩 이름도 그렇게 (6호 재확인 1번) */
        /* 값이 있어도 반복이면 '반복 · 11월 10일까지'로 — 그날 반복이 끝난다는 게 보이게 (6호 재확인 2차) */
        chip('due', 'due', 'target', rep ? t('prop.repeatUntil') : t('prop.due'), due ? (rep ? t('prop.repeat') + ' · ' : '') + t('due.untilShort', { date: I.relDayIn(due) }) : null, function () { P.date({ title: rep ? t('prop.repeatUntil') : t('prop.due'), value: due, onPick: function (v) { man.due = v; draw(); refocus(); } }); })
      ];
      flagBtn.classList.toggle('is-on', !!prio); flagBtn.setAttribute('aria-pressed', prio ? 'true' : 'false');
      App.dom.clear(chips);
      all.filter(function (c) { return c._set; }).concat(all.filter(function (c) { return !c._set; })).forEach(function (c) { chips.appendChild(c); });

      /* 새벽 확인 한 줄: 새벽에 '내일'이라 적으면 몇 일로 잡히는지 알려 준다 */
      var hr = new Date().getHours();
      if (hr < 4 && parsed.dateKind === 'rel' && (parsed.date || parsed.due)) {
        hint.hidden = false; hint.textContent = t('qa.nightHint', { date: I.dateShort(parsed.date || parsed.due) });
      } else if (man.date === undefined && nextDay()) {
        hint.hidden = false; hint.textContent = t('qa.nextDayHint', { date: I.dateShort(U.addDays(U.today(), 1)) });
      } else hint.hidden = true;
    }

    /* 위에 다른 창(반복 고르기의 요일 줄처럼 열린 채 값을 넘기는 창)이 떠 있으면 입력 칸으로 가지 않는다 — 키보드가 그 창을 덮지 않게 (7호 1번) */
    function keepOpen() { return !!S.data.settings.qaKeep; }   /* '이어서 쓰기'를 켠 사람만 창이 열린 채 다음 줄 */
    function refocus() { if (!sheet.closed && App.sheet.count <= 1) try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); } }

    function submit() {
      draw();
      var title = parsed.title || input.value.trim();
      if (!title) { refocus(); return; }
      var f = { title: title, date: val('date'), time: val('time'), repeat: val('repeat'), listId: val('listId'), priority: val('priority') || 0, due: val('due') };
      var task = S.commit(function (d) { return T.add(d, f); });
      if (task.time) App.ensureNotify();
      App.platform.haptic.tap();
      var bits = [task.title];
      if (task.date) bits.push(I.relDay(task.date) + (task.time ? ' ' + I.time(task.time) : ''));
      var tl = task.listId && task.listId !== preset.listId && T.list(S.data, task.listId);
      if (tl) bits.push(tl.name);   /* 다른 목록에 들어갔으면 어디인지 — 지금 화면에 안 보여도 '잘 들어갔다'를 알게 */
      /* 하나 넣으면 창을 닫는다 — 넣은 뒤 눈은 '잘 들어갔나' 목록으로 가는데 창이 가리던 것 (사용자 10-31).
         띠의 '하나 더'로 같은 미리 채움(오늘 · 고른 날 · 그 목록)으로 바로 다시 열고, 새로 넣은 줄은 잠깐 은은하게 빛나 눈이 찾게 한다 */
      if (!keepOpen()) {
        sheet.close();
        App.toast.show(t('qa.added', { what: bits.join(' · ') }), { action: t('qa.more'), onAction: function () { open(preset); } });
        App.row.flash(task.id);
        return;
      }
      /* 이어서 쓰기 켬: 창은 열린 채, 고른 칩(날짜 · 목록 · 중요 등)은 그대로 — '그 세팅으로' 계속 (사용자 10-31). 글에서 알아들은 것만 비움 */
      last.hidden = false; last.textContent = t('qa.added', { what: bits.join(' · ') });
      input.value = ''; ignore = []; mem = {};
      draw(); refocus();
    }

    input.addEventListener('input', draw);
    /* 여러 줄을 붙여 넣으면 줄마다 할 일 하나 (메모장 목록을 한 번에 옮기기 · Todoist 사례) */
    input.addEventListener('paste', function (e) {
      var text = (e.clipboardData || window.clipboardData || { getData: function () { return ''; } }).getData('text');
      var lines = String(text || '').split(/\r?\n/).map(function (s) { return s.replace(/^\s*([-*•·]|\d+[.)])\s*/, '').trim(); }).filter(Boolean);
      if (lines.length < 2) return;
      e.preventDefault();
      var lists = S.data.lists.filter(T.alive);
      var base = App.util.now();
      S.commit(function (d) {
        lines.forEach(function (line, i) {
          var p = App.parse.run(line, lists, []);
          /* 칩으로 고른 목록 · 중요는 줄마다 같이 (한 줄 넣기와 같은 규칙 · 일관성 점검원) */
          /* order: 붙여 넣은 차례 그대로 위 → 아래 (큰 값이 위 · 같은 1ms 안이라 값이 같아지지 않게 조금씩 작게) */
          T.add(d, { order: base - i * 0.01, title: p.title || line, date: p.date || (preset.soft && p.due && !p.repeat ? null : preset.date) || null, time: p.time, repeat: p.repeat, listId: p.listId || val('listId') || null, due: p.due, priority: val('priority') || 0 });
        });
      }, { undo: true });
      App.toast.show(t('qa.pastedN', { n: lines.length }), { action: t('common.undo'), onAction: S.undo });
      if (!keepOpen()) { sheet.close(); return; }   /* 한 줄 넣기와 같이 닫힘(이어서 쓰기면 열린 채) */
      last.hidden = false; last.textContent = t('qa.pastedN', { n: lines.length });
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); } });
    send.addEventListener('click', submit);
    send.addEventListener('pointerdown', function (e) { e.preventDefault(); });  /* 눌러도 입력 칸 포커스 유지 → 키보드가 내려갔다 올라오지 않음 */
    send.addEventListener('mousedown', function (e) { e.preventDefault(); });
    draw();
  }

  return { open: open };
})();

</script>
<script>
/* 설정 — 끝낸 일 보이기 · 테마 · 한 주 시작 · 진동 · 알림 상태 · 옮기기(백업) · 정보. 처음엔 열 필요가 없게 기본값을 잡아 둔다. */
App.screens.settings = (function () {
  'use strict';

    }));
  }
  function setting(k, v) { S.commit(function (d) { d.settings[k] = v; }); }

  function block(label, body, note, plain) {
    return h('section.section', h('div.section-head', h('span.section-label', label)), plain ? h('div.seg-wrap', body) : h('div.card.set-card', body), note ? h('p.prop-note', { text: note }) : null);
  }
  /* 고르기 줄(세그먼트)은 카드로 한 번 더 감싸지 않는다 — 테두리 두 겹 방지 (오푸스 조수 1차) */
  function choice(label, body, note) { return block(label, body, note, true); }

  function notifyBlock() {
    var N = App.platform.notify, s = N.status(), rows = [];

    var text = t('notify.status.' + s), sub = t('notify.sub.' + s);
    if (sub === 'notify.sub.' + s) sub = null;  /* 보조 줄이 없는 상태 */
    rows.push(h('div.set-row', h('span.prop-icon', { html: ic('bell', 20) }), h('span.prop-label', text, sub ? h('span.prop-sub', sub) : null),
      s === 'default' ? h('button.text-btn', { type: 'button', onclick: function () { N.request().then(function () { App.render(); }); } }, t('notify.turnOn')) : null));
    if (App.platform.name === 'android' && s === 'granted' && N.exactOk && !N.exactOk()) {

        h('button.text-btn', { type: 'button', onclick: function () { N.openExact(); } }, t('notify.openSettings'))));
    }
    if (App.platform.name === 'android') {
      rows.push(h('button.prop', { type: 'button', onclick: function () { N.openBattery(); } }, h('span.prop-icon', { html: ic('sparkle', 20) }), h('span.prop-label', t('notify.battery')), h('span.prop-chev', { html: ic('chevR', 18) })));
    }
    return block(t('set.notify'), rows, N.kind === 'foreground' ? t('notify.foregroundNote') : null);
  }

  function backupBlock() {
    var F = App.platform.files;
    return block(t('set.backup'), [
      h('button.prop', { type: 'button', onclick: function () {
        var name = 'todo-backup-' + App.util.today() + '.json';
        Promise.resolve(F.exportFile(name, S.exportText())).then(function (ok) {
          if (ok !== true) return;   /* 성공이 확실할 때만 적음 — 안드로이드는 아직 결과를 안 돌려줘서 적지 않음(거짓 안심 방지 · 4호 재확인 · 나중에 붙일 것) */
          S.commit(function (d) { d.settings.lastExport = App.util.today(); }, { keepUndo: true });
        });
      } }, h('span.prop-icon', { html: ic('share', 20) }),
        /* 마지막으로 내보낸 날을 조용히 한 줄 — 기기만 바꾸면 기록이 통째로 사라질 수 있어서 (4호 9번 · 재촉 알림은 없음) */
        h('span.prop-label', t('backup.export'), S.data.settings.lastExport ? h('span.prop-sub', t('backup.last', { date: I.dateNoWeek(S.data.settings.lastExport) })) : null),
        h('span.prop-chev', { html: ic('chevR', 18) })),
      h('button.prop', { type: 'button', onclick: function () {
        F.importFile().then(function (text) {
          if (!text) return;
          var d;
          try { d = S.readImport(text); } catch (e) { App.toast.show(t('backup.bad')); return; }
          App.pickers.confirm({ title: t('backup.confirmTitle'), text: t('backup.confirmText', { n: d.tasks.filter(function (x) { return !x.deletedAt; }).length }), ok: t('backup.replace'), onOk: function () {
            S.replaceAll(d);
            App.toast.show(t('backup.done'), { action: t('common.undo'), onAction: S.undo });
          } });
        });
      } }, h('span.prop-icon', { html: ic('download', 20) }), h('span.prop-label', t('backup.import')), h('span.prop-chev', { html: ic('chevR', 18) })),
      /* 파일 불러오기 · 처음 상태로 한 뒤 7일 동안만 보이는 줄 — 5초 띠를 놓쳐도 그 전 할 일로 (6호 6번) */
      S.keeping() ? h('button.prop', { type: 'button', onclick: function () {
        App.pickers.confirm({ title: t('backup.revertQ'), text: t('backup.revertText'), ok: t('backup.revertOk'), onOk: function () {
          if (S.revertBackup()) App.toast.show(t('backup.reverted'), { action: t('common.undo'), onAction: S.undo });
          else App.toast.show(t('backup.bad'));
        } });
      } }, h('span.prop-icon', { html: ic('repeat', 20) }),
        h('span.prop-label', t('backup.revert'), h('span.prop-sub', t('backup.revertSub', { date: I.dateNoWeek(App.util.ymd(new Date(S.data.settings.keepBackupUntil))) }))),
        h('span.prop-chev', { html: ic('chevR', 18) })) : null
    /* 아이폰 사파리 탭에서 쓰는 중이면 '오래 안 열면 지워질 수 있음'도 — 설치 안내 띠를 닫아도 여기 남음 (5호 3번) */
    ], App.platform.info.isIOS && !App.platform.info.standalone ? t('backup.note') + ' ' + t('backup.safari') : t('backup.note'));
  }

  function trash() {
    var s = App.sheet.open({ title: t('trash.row'), content: function (body) {
      function draw() {
        App.dom.clear(body);
        var gone = S.data.tasks.filter(function (x) { return x.deletedAt; }).sort(function (a, b) { return b.deletedAt - a.deletedAt; });
        /* 지운 목록도 30일 동안 — 되살리면 안에 있던 할 일이 다시 그 목록으로 (6호 6번) */

        if (!gone.length && !goneLists.length) { body.appendChild(h('p.day-empty', t('trash.empty'))); return; }

          var days = Math.max(0, 30 - Math.floor((App.util.now() - l.deletedAt) / 86400000));
          return h('div.set-row',
            h('span.prop-label', t('trash.listRow', { name: l.name }), h('span.prop-sub', t('trash.left', { n: days }))),
            h('button.text-btn', { type: 'button', onclick: function () {
              S.commit(function (d) { App.tasks.restoreList(d, l.id); });

        }).concat(gone.map(function (x) {
          var days = Math.max(0, 30 - Math.floor((App.util.now() - x.deletedAt) / 86400000));
          return h('div.set-row',
            h('span.prop-label', x.title || t('row.untitled'), h('span.prop-sub', t('trash.left', { n: days }))),
            h('button.text-btn', { type: 'button', onclick: function () {
              S.commit(function (d) { App.tasks.restore(d, x.id); });
              App.toast.show(t('trash.restored')); draw();
            } }, t('trash.restore')));
        }))));

    return s;
  }

  /* 설정은 두 층: 첫 화면 = 묶음 줄(지금 값 요약 · ›) → 눌러 들어가서 바꾼다 (사용자 10-31 '죄다 펼쳐져 있는 느낌 · 헤더가 상위 개념이 되게').
     묶음 = 보기(글자 · 화면 색 · 채우는 색 · 끝낸 일 · 한 주 시작 · 진동) / 알림 / 기록 지키기(백업 · 옮기기) + 최근 지운 할 일 · 시험판.
     '끝낸 일'은 고를 줄이 하나뿐이라 따로 한 장을 쓰면 한 번 더 들어가야 해서 '보기'로 합침 (일관성 점검원 10-31) */
  var GROUPS = ['look', 'notify', 'records'];

  function groupRow(key, icon, label, sum) {
    return h('button.prop.set-group', { type: 'button', onclick: function () { App.go('set', key); } },
      h('span.prop-icon', { html: ic(icon, 20) }), h('span.prop-label', label),
      h('span.prop-value', sum || ''), h('span.prop-chev', { html: ic('chevR', 18) }));
  }

  function lookPage(screen, st) {
    screen.appendChild(h('section.section', App.pickers.sizeSlider({ value: st.textSize, onPick: function (v) { setting('textSize', v); } })));
    screen.appendChild(choice(t('set.theme'),

    screen.appendChild(accentBlock(st));

    screen.appendChild(choice(t('set.week'),
      seg([[0, I.weekdayLong(0)], [1, I.weekdayLong(1)]], st.weekStart, function (v) { setting('weekStart', v); }, t('set.week'))));
    /* 진동을 낼 수 없는 기기(아이폰 사파리 · 웹앱 = navigator.vibrate 없음)에서는 이 줄을 보이지 않는다 — 켜도 아무 일 없는 설정 (3호 8번) */
    if (App.platform.name !== 'web' || navigator.vibrate) screen.appendChild(choice(t('set.haptic'),
      seg([[true, t('common.on')], [false, t('common.off')]], st.haptic, function (v) { setting('haptic', v); }, t('set.haptic'))));
  }

  /* 주 색 — 견본 동그라미 4개 + 작은 예시(안 한 줄 · 끝낸 줄 · '오늘' · + 단추). 누르면 앱 전체가 0.3초 스르르 바뀜(화면 색과 같은 방식).
     사용자 10-31 22:4x "귤색 말고 겹치지 않는 선택지 몇 개 · 바꾸면 어떻게 보이는지 간단한 예시와 함께 · 미친 듯이 방대하게는 아니고".
     자유 색 고르기(색상환)는 넣지 않음 — 대비가 깨지고 찝찝한 색이 나옴 (주 색 조수 F) */
  function accentBlock(st) {

    var ring = h('span.check', { 'aria-hidden': 'true', html: App.icons.CHECK }), filled = h('span.check', { 'aria-hidden': 'true', html: App.icons.CHECK });

      h('div.task', ring, h('div.task-body', h('div.task-title', t('accent.sample1')))),
      h('div.task.is-done', filled, h('div.task-body', h('div.task-title', t('accent.sample2')))));
    var sw = h('div.accent-row', { role: 'radiogroup', 'aria-label': t('set.accent') }, App.model.ACCENTS.map(function (a) {
      return h('button.accent-swatch.sw-' + a + (a === cur ? '.is-on' : ''), { type: 'button', role: 'radio', 'aria-checked': a === cur ? 'true' : 'false', 'aria-label': t('accent.' + a),
        onclick: function () { if (a !== cur) setting('accent', a); } },

    return block(t('set.accent'), h('div.accent-pick', sample, sw), null, true);
  }

  function donePage(screen, st) {
    screen.appendChild(choice(t('set.done'),
      seg([['bottom', t('set.done.bottom')], ['keep', t('set.done.keep')], ['hide', t('set.done.hide')]], st.doneMode, function (v) { setting('doneMode', v); }, t('set.done')),
      t('set.done.note.' + st.doneMode)));
  }

  function notifyShort() {

    if (['granted', 'default', 'denied', 'needs-install', 'unsupported'].indexOf(s) < 0) s = 'unsupported';

  }

  function gone() { return S.data.tasks.filter(function (x) { return x.deletedAt; }).concat(S.data.lists.filter(function (l) { return l.deletedAt; })); }
  function trashRow() {
    var n = gone().length;
    /* 최근 지운 할 일 — 지운 뒤 30일 동안 되살릴 수 있음 (점검원 1호 6번) */
    return h('button.prop', { type: 'button', onclick: trash }, h('span.prop-icon', { html: ic('trash', 20) }),
      h('span.prop-label', t('trash.row'), h('span.prop-sub', t('trash.sub'))),
      h('span.prop-value.num', n ? t('trash.count', { n: n }) : ''), h('span.prop-chev', { html: ic('chevR', 18) }));
  }

  /* 묶음 안 화면 — 위에 '‹ 설정' (목록 하나 보기 화면과 같은 모양) */
  function page(main, key) {
    var st = S.data.settings, screen = h('div.screen.screen-settings');
    var title = { look: t('set.look'), notify: t('set.notify'), records: t('set.records') }[key];
    screen.appendChild(h('header.page-head', h('div',
      h('button.back-btn', { type: 'button', onclick: function () { App.back(); } }, h('span', { html: ic('chevL', 18) }), t('nav.settings')),
      h('h1.title', title))));
    if (key === 'look') lookPage(screen, st);
    else if (key === 'notify') screen.appendChild(notifyBlock());
    else screen.appendChild(backupBlock());   /* 최근 지운 할 일은 설정 첫 화면에 한 번만 (7호 참고 — 두 곳에 있던 것) */
    main.appendChild(screen);
  }

  function render(main, key) {
    if (key === 'done') key = 'look';   /* 옛 주소(끝낸 일 묶음)는 보기로 */
    if (key && GROUPS.indexOf(key) >= 0) { page(main, key); return; }
    var st = S.data.settings, M = App.model;
    var screen = h('div.screen.screen-settings');
    screen.appendChild(h('header.page-head', h('div', h('h1.title', t('nav.settings')))));

    screen.appendChild(h('div.card.set-groups',
      groupRow('look', 'sun', t('set.look'), t('set.lookSum', { size: Math.round(M.scale(st.textSize) * 100) + '%', theme: t('set.theme.' + st.theme) })),
      groupRow('notify', 'bell', t('set.notify'), notifyShort()),
      groupRow('records', 'share', t('set.records'), st.lastExport ? t('backup.lastShort', { date: I.dateNoWeek(st.lastExport) }) : '')));
    screen.appendChild(h('div.card.set-groups.mt-l', trashRow()));
    /* 시험판 전용: 처음 깐 사람처럼 다시 시작 (출시 판에서는 빼거나 '모든 할 일 지우기'로 바꿈 — 기획/나중에 붙일 것.md) */
    screen.appendChild(h('div.mt-l', block(t('set.trial'), [
      h('button.prop.danger-row', { type: 'button', onclick: function () {
        App.pickers.confirm({ title: t('reset.title'), text: t('reset.text'), ok: t('reset.ok'), onOk: function () {

        } });
      } }, h('span.prop-icon', { html: ic('repeat', 20) }), h('span.prop-label', t('reset.row'), h('span.prop-sub', t('reset.sub'))))
    ])));
    screen.appendChild(h('p.app-info', t('set.version', { v: window.APP_VERSION || 'dev' })));
    main.appendChild(screen);
  }

  return { render: render };
})();

</script>
<script>
/* 첫 실행 — 두 장, '다음'으로 넘김: ① 글자 크기(끌어서 맞추는 막대 · 앱 전체가 손가락을 따라 바로 커짐) ② 화면 색(누르면 바로 바뀜).
   사용자 10-31: "체크 표시 어쩌구는 튜토리얼에 필요도 없을 것 같고 … 글자 크기랑 화면 색만 설정하게 … 새 시작 싱그럽게" ·
   "'다음'으로 넘겨서 하는 구조" → 미리보기 할 일 · 기능 소개 문장은 뺐다(사용자가 적지도 않은 내용이 보이는 거부감).
   묻지 않는 것: 목록 · 이름 · 첫 할 일 · 한 주 시작 · 끝낸 일 방식 · 알림 권한(시간을 처음 넣을 때 물음) — 설정에 다 있다.
   어느 장에서든 '건너뛰기' = 지금까지 고른 것만 두고 끝(안 고른 것은 기본값). 다시 보려면 설정의 '처음 상태로 되돌리기'(시험판). */
App.onboarding = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, S = App.store;
  var el = null, step = 0, dir = 0;   /* dir = 넘긴 쪽(1 다음 · -1 이전) — 장이 그쪽에서 밀려 들어옴 */
  var STEPS = 2;

  function setting(k, v) { S.commit(function (d) { d.settings[k] = v; }, { keepUndo: true }); }

  function choices(opts, cur, onPick, label) {
    return h('div.ob-choices', { role: 'radiogroup', 'aria-label': label }, opts.map(function (o) {
      return h('button.ob-choice' + (o[0] === cur ? '.is-on' : ''), { type: 'button', role: 'radio', 'aria-checked': o[0] === cur ? 'true' : 'false', onclick: function () { onPick(o[0]); } },
        o[2] || null, h('span.ob-choice-label', o[1]));
    }));
  }

  /* ① 글자 크기 — 아래 글이 앱의 진짜 글자라, 막대를 끄는 대로 이 글 · 단추까지 함께 커진다 */
  function sizeStep() {
    var today = U.today();
    return [
      h('h1.ob-title', t('ob.hello')),
      h('p.ob-text', t('ob.sizeText')),
      h('div.ob-sizecard', { 'aria-hidden': 'true' },
        h('div.ob-sizecard-day', I.dateNoWeek(today), h('span.title-sub', I.weekday(U.dow(today)))),
        h('p.ob-sizecard-line', t('ob.sizeSample'))),
      App.pickers.sizeSlider({ value: S.data.settings.textSize, onPick: function (v) { setting('textSize', v); } })
    ];
  }

  /* ② 화면 색 — 누르면 이 화면부터 바로 그 색 */
  function themeStep() {
    return [
      h('h1.ob-title', t('ob.themeTitle')),
      h('p.ob-text', t('ob.themeText')),
      choices([['light', t('set.theme.light'), h('span.ob-swatch.is-light')], ['graphite', t('set.theme.graphite'), h('span.ob-swatch.is-graphite')],
               ['dark', t('set.theme.dark'), h('span.ob-swatch.is-dark')]],
        S.data.settings.theme, function (v) { setting('theme', v); draw(); }, t('ob.themeLabel'))
    ];
  }

  function panel() {
    var last = step === STEPS - 1;
    var dots = h('div.ob-steps', { 'aria-label': t('ob.step', { total: STEPS, n: step + 1 }) });
    for (var i = 0; i < STEPS; i++) dots.appendChild(h('i' + (i === step ? '.is-on' : '')));
    return h('div.ob-panel',
      h('div.ob-top',
        step ? h('button.text-btn.ob-prev', { type: 'button', onclick: function () { go(-1); } }, t('ob.prev')) : h('span'),
        h('button.text-btn.ob-skip', { type: 'button', onclick: finish }, t('ob.skip'))),
      h('div.ob-body' + (dir > 0 ? '.is-fwd' : dir < 0 ? '.is-back' : ''), step ? themeStep() : sizeStep()),
      h('div.ob-bottom',
        dots,
        last ? h('p.ob-later', t('ob.later')) : null,
        h('button.btn.primary.ob-next', { type: 'button', onclick: last ? finish : function () { go(1); } }, last ? t('ob.start') : t('ob.next'))));
  }

  function go(n) { step = Math.max(0, Math.min(STEPS - 1, step + n)); dir = n; draw(); dir = 0; var b = el && el.querySelector('.ob-next'); if (b) try { b.focus({ preventScroll: true }); } catch (e) {} }
  function draw() { var y = el.scrollTop; App.dom.clear(el); el.appendChild(panel()); el.scrollTop = dir ? 0 : y; }

  /* 시작하기 · 건너뛰기 = 지금까지 고른 것은 그대로 두고 끝내기 (안 고른 것은 이미 기본값 · 확인 창 없음) */
  function finish() {
    S.commit(function (d) { d.settings.onboarded = true; }, { keepUndo: true });
    close();
  }
  function close() {
    if (!el) return;
    var x = el; el = null;
    x.classList.add('is-out');
    setTimeout(function () { x.remove(); }, 260);
  }

  /* o.instant: 앱을 처음 켤 때는 서서히 띄우지 않고 처음부터 덮은 채로 — 뒤의 빈 오늘 화면이 한순간 비치지 않게 */
  function open(o) {
    if (el) return;
    step = 0; dir = 0;
    el = h('div.onboarding' + (o && o.instant ? '.is-instant' : ''), { role: 'dialog', 'aria-modal': 'true', 'aria-label': t('ob.label') });
    document.getElementById('layer').appendChild(el);
    draw();
  }

  return { open: open, close: close, get isOpen() { return !!el; } };
})();

</script>
<script>
/* 시작 · 길 찾기 · 큰 틀(아래 탭 / 왼쪽 메뉴 / + 단추) · 테마 · 날 바뀜 · 앱 돌아옴. 화면 그리기는 screens/*가 맡는다. */
(function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, S = App.store, Q = App.query, T = App.tasks, ic = App.icons.svg;
  var route = { name: 'today', arg: null }, stack = [];
  /* 브라우저 '뒤로' 기록은 주소창이 있는 일반 브라우저에서만 쓴다. 홈 화면 웹앱 · 안드로이드 · 다른 페이지 안(미리보기)에서는
     앱 자체 기록(stack)만 쓴다 — 안에 끼워진 페이지에서는 기록이 바깥과 엇갈려 화면이 한 박자 늦게 바뀌는 일이 있었다(10-31 점검). */
  var useHistory = (function () { try { return window.top === window && App.platform.name === 'web' && !App.platform.info.standalone; } catch (e) { return false; } })();
  var main = document.getElementById('main'), tabbar = document.getElementById('tabbar'), sidebar = document.getElementById('sidebar'), fab = document.getElementById('fab');

  /* 진동 설정을 기기 어댑터 앞에서 한 번에 거른다 */
  ['tap', 'success'].forEach(function (k) { var f = App.platform.haptic[k]; App.platform.haptic[k] = function () { if (S.data.settings.haptic) f(); }; });

  /* ── 길 찾기 ── */
  function hashOf(r) { return '#/' + r.name + (r.arg ? '/' + r.arg : ''); }
  function fromHash() {
    var p = (location.hash || '').replace(/^#\/?/, '').split('/');
    var name = ['today', 'calendar', 'lists', 'list', 'settings', 'set'].indexOf(p[0]) >= 0 ? p[0] : 'today';
    return { name: name, arg: p[1] || null };
  }
  App.go = function (name, arg) {
    if (route.name === name && route.arg === (arg || null)) { window.scrollTo(0, 0); return; }
    if (['today', 'calendar', 'lists', 'settings'].indexOf(name) >= 0 && !useHistory) stack = []; else stack.push(Object.assign({}, route, { y: window.scrollY }));  /* 탭 이동은 쌓지 않음: 뒤로 = 오늘 · 돌아올 때 보던 자리로 (모션 점검원) */
    route = { name: name, arg: arg || null };
    if (name === 'list' || name === 'set') navDir = 1;   /* 안으로 들어가는 화면만 옆에서 밀려 들어옴 (탭 이동은 그대로 바뀜) */
    if (useHistory) try { history.pushState(route, '', hashOf(route)); } catch (e) {}
    App.render(true);
  };
  var navDir = 0, restoreY = 0;   /* 뒤로 왔을 때 돌려놓을 스크롤 — 목록 · 설정 묶음에서 나오면 맨 위로 튀던 것 */
  /* 뒤로: 창이 열려 있으면 창부터 → 온 길을 거슬러 → 없으면 오늘로 → 오늘이면 앱 밖으로(안드로이드) */
  App.back = function () {
    if (App.onboarding.isOpen) return true;   /* 첫 실행 안내 중에는 뒤로 단추로 빠지지 않음 (건너뛰기 단추가 있음) */
    if (App.photoView && App.photoView.close()) return true;   /* 크게 본 사진부터 닫기 */
    if (App.sheet.closeTop()) return true;
    if (stack.length) {
      if (useHistory) { history.back(); return true; }
      if (route.name === 'list' || route.name === 'set') navDir = -1;
      route = stack.pop(); restoreY = route.y || 0; App.render(true); return true;
    }
    if (route.name === 'today') return false;
    if (route.name === 'list' || route.name === 'set') navDir = -1;
    route = route.name === 'list' ? { name: 'lists', arg: null } : route.name === 'set' ? { name: 'settings', arg: null } : { name: 'today', arg: null };
    if (useHistory) try { history.replaceState(route, '', hashOf(route)); } catch (e) {}
    App.render(true);
    return true;
  };
  window.onBack = App.back;  /* 안드로이드 뒤로 단추 */
  window.addEventListener('popstate', function (e) {
    if (!useHistory) return;
    var was = stack.pop(); restoreY = was && was.y || 0;
    if (App.sheet.count) App.sheet.closeAll();
    if (route.name === 'list' || route.name === 'set') navDir = -1;
    route = e.state && e.state.name ? e.state : fromHash();
    App.render(true);
  });

  /* ── 그리기 (한 프레임에 한 번으로 모음) ── */
  var queued = 0;
  App.render = function (top) {
    if (top) { if (queued) cancelAnimationFrame(queued); queued = 0; draw(true); return; }
    if (queued) return;
    queued = requestAnimationFrame(function () { queued = 0; draw(false); });
  };
  /* 그 자리에서 바로 (스크롤 유지) — 앞뒤 자리를 재는 부드러운 이동(flip)용. 기다리던 그리기는 취소해 같은 화면을 두 번 그리지 않음(움직이던 줄이 뚝 끝나지 않게) */
  App.render.now = function () { if (queued) cancelAnimationFrame(queued); queued = 0; draw(false); };   /* 그 자리에서 바로 (스크롤 유지) — 가라앉기 애니메이션이 앞뒤 자리를 재려고 */
  function draw(top) {
    /* 달이 미끄러지는 0.3초 동안 온 다시 그리기는 미룸 — 끝나면 달력이 그 자리에서 한 번 그림(띠가 중간에 사라지지 않게 · 모션 점검원) */
    if (!top && route.name === 'calendar' && App.screens.calendar.animating && App.screens.calendar.animating()) return;
    if (top) App.row.release();   /* 화면을 옮기면 방금 체크해 둔 줄도 정리된 자리로 */
    var y = window.scrollY;
    App.dom.clear(main);
    var r = route;
    if (r.name === 'calendar') App.screens.calendar.render(main);
    else if (r.name === 'lists') App.screens.lists.overview(main);
    else if (r.name === 'list') App.screens.lists.single(main, r.arg);
    else if (r.name === 'settings' || r.name === 'set') App.screens.settings.render(main, r.name === 'set' ? r.arg : null);   /* set = 설정 묶음 안 화면 */
    else App.screens.today.render(main);
    if (top && navDir && main.firstChild) {
      var sc = main.firstChild;
      sc.classList.add(navDir > 0 ? 'is-in-fwd' : 'is-in-back');
      sc.addEventListener('animationend', function () { sc.classList.remove('is-in-fwd', 'is-in-back'); }, { once: true });
    }
    navDir = 0;
    drawNav();
    fab.classList.toggle('is-hidden', r.name === 'settings' || r.name === 'set');  /* 넓은 화면의 떠 있는 + (휴대폰은 아래 탭 가운데 +) */
    window.scrollTo(0, top ? restoreY : y); restoreY = 0;
  }

  function navItem(cls, name, icon, label, count, arg) {
    var on = route.name === name && (arg === undefined || route.arg === arg) || (name === 'lists' && route.name === 'list' && cls === 'tab') || (name === 'settings' && route.name === 'set');
    return h('button.' + cls, { type: 'button', 'aria-current': on ? 'page' : null, onclick: function () { App.go(name, arg); } },
      h('span', { html: ic(icon, cls === 'tab' ? 24 : 20) }), h('span.nav-label', label), count ? h('span.nav-count.num', String(count)) : null);
  }
  function drawNav() {
    App.dom.clear(tabbar);
    /* 휴대폰 아래 탭: 오늘 · 캘린더 · (+) · 목록 · 설정 — + 가 탭 가운데에 있어 내용을 가리지 않는다 (오푸스 조수 2차) */
    tabbar.appendChild(navItem('tab', 'today', 'today', t('nav.today')));
    tabbar.appendChild(navItem('tab', 'calendar', 'calendar', t('nav.calendar')));
    tabbar.appendChild(h('button.tab-add', { type: 'button', 'aria-label': t('qa.add'), html: ic('plus', 26), onclick: quickAdd }));
    tabbar.appendChild(navItem('tab', 'lists', 'lists', t('nav.lists')));
    tabbar.appendChild(navItem('tab', 'settings', 'gear', t('nav.settings')));

    if (!window.matchMedia('(min-width: 768px) and (min-height: 560px)').matches) { App.dom.clear(sidebar); return; }
    App.dom.clear(sidebar);
    var d = S.data;
    sidebar.appendChild(h('div.side-brand', t('app.name')));
    sidebar.appendChild(h('button.side-add', { type: 'button', onclick: quickAdd }, h('span.side-add-plus', { html: ic('plus', 18) }), t('qa.addTask'), h('kbd.side-kbd', 'N')));
    sidebar.appendChild(navItem('side-item', 'today', 'today', t('nav.today')));  /* 쌓인 숫자 압박 없게 — 오늘에는 개수를 안 붙임 */
    sidebar.appendChild(navItem('side-item', 'calendar', 'calendar', t('nav.calendar')));
    sidebar.appendChild(navItem('side-item', 'lists', 'lists', t('nav.lists')));
    sidebar.appendChild(h('button.side-item', { type: 'button', onclick: App.screens.lists.search },   /* 넓은 화면 찾기 + 단축키 / (2호 10번) */
      h('span', { html: ic('search', 20) }), h('span.nav-label', t('search.title')), h('kbd.side-kbd', '/')));
    var lists = d.lists.filter(T.alive);
    if (lists.length) {
      sidebar.appendChild(h('div.side-label', t('nav.myLists')));
      lists.forEach(function (l) {
        var on = route.name === 'list' && route.arg === l.id;
        var it = h('button.side-item.side-list', { type: 'button', 'aria-current': on ? 'page' : null, onclick: function () { if (Date.now() < it._held) return; App.go('list', l.id); } },
          App.listMark(l), h('span.nav-label', l.name), h('span.nav-count.num', String(Q.remaining(d, l.id) || '')));
        App.row.longPress(it, function () { it._held = Date.now() + 700; App.screens.lists.more(l); });   /* 오른쪽 클릭 · 꾹 = 목록 '…' 창 (목록 첫 화면과 같은 손짓) */
        sidebar.appendChild(it);
      });
    }
    sidebar.appendChild(h('div.side-spacer'));
    sidebar.appendChild(navItem('side-item', 'settings', 'gear', t('nav.settings')));
  }

  /* + 단추: 지금 보는 곳에 맞춰 미리 채운다 (캘린더 = 고른 날 · 목록 = 그 목록) */
  function quickAdd() {
    var preset = {};
    if (route.name === 'today') { preset.date = U.today(); preset.soft = true; }   /* 오늘 화면에서 적으면 '오늘' (칩 ×로 빼면 날짜 없는 일 · 글에 '언제까지'가 있으면 안 붙음 · 점검원 1호 8번) */
    if (route.name === 'calendar') preset.date = App.screens.calendar.selected;
    if (route.name === 'list') preset.listId = route.arg;
    App.quickadd.open(preset);
  }
  fab.innerHTML = ic('plus', 28);
  fab.addEventListener('click', quickAdd);
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (App.onboarding.isOpen || App.sheet.count || tag === 'input' || tag === 'textarea') return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); App.screens.lists.search(); return; }   /* 찾기: Ctrl/⌘+K 또는 / */
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); App.screens.lists.search(); return; }
    if (e.key === 'n' || e.key === '+' || e.key === 'ㅜ') { e.preventDefault(); quickAdd(); }
  });

  /* 앱 어디서나 꾹 누르기 · 오른쪽 클릭에 브라우저 메뉴(이미지 저장 · 복사 · 링크 열기)가 뜨지 않게 — 입력 칸만 예외 (사용자 10-31 '후진 앱 같아').
     할 일 줄 · 목록 줄 · 달력 칸의 꾹 누르기는 각자 자기 메뉴를 연다 */
  document.addEventListener('contextmenu', function (e) { if (!(e.target.closest && e.target.closest('input, textarea, [contenteditable="true"]'))) e.preventDefault(); });

  /* ── 테마 ── */
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  /* 글자 배율을 화면에 — 막대를 끄는 동안에도 저장 없이 이것만 불러 바로 커지고 작아진다 */
  App.applyScale = function (v) {
    document.documentElement.style.setProperty('--text-scale', App.model.scale(v));
    document.documentElement.setAttribute('data-text', App.model.sizeBand(v));   /* 글자 크기별 배치(빠른 추가 칩 줄바꿈 등) */
  };
  var themeNow = null, themeTimer = null;
  var THEME_BG = { light: '#F2F2EF', graphite: '#2B2B2D', dark: '#121314' };   /* 위 · 아래 막대 색 = 바탕색 (tokens.css --bg와 같게) */
  function lookKey() {
    var s = S.data.settings.theme; if (THEME_BG[s] === undefined) s = mq.matches ? 'dark' : 'light';
    return s + '/' + (App.model.ACCENTS.indexOf(S.data.settings.accent) >= 0 ? S.data.settings.accent : 'tangerine');
  }
  function applyTheme() {
    /* 화면 색 세 가지: 밝게 · 그라파이트 · 어둡게 (사용자 10-31 — '기기 따라'는 뺌. 옛 'system'은 지금 기기 색으로 읽음) */
    var s = S.data.settings.theme, root = document.documentElement;
    if (THEME_BG[s] === undefined) s = mq.matches ? 'dark' : 'light';
    var dark = s !== 'light';
    /* 색이 바뀔 때는 뚝 끊지 않고 0.3초 동안 스르르 (처음 켤 때는 바로) — css .theme-anim */
    /* 주 색(체크 · 주요 단추 · '오늘' 글씨): 귤색(기본) · 파랑 · 초록 · 보라 — 사용자 10-31 22:4x '귤색 말고도 선택지' (주 색 조수 · 대비 12조합 메인이 잼) */
    var accent = App.model.ACCENTS.indexOf(S.data.settings.accent) >= 0 ? S.data.settings.accent : 'tangerine';
    var next = s + '/' + accent;
    if (themeNow && themeNow !== next) {
      root.classList.add('theme-anim'); clearTimeout(themeTimer);
      themeTimer = setTimeout(function () { root.classList.remove('theme-anim'); }, 420);
    }
    themeNow = next;
    root.setAttribute('data-theme', s);
    if (accent === 'tangerine') root.removeAttribute('data-accent'); else root.setAttribute('data-accent', accent);
    root.removeAttribute('data-fill');   /* 옛 '채우는 색'은 뺌(10-31) */
    App.applyScale(S.data.settings.textSize);
    /* 다음에 켤 때 첫 그림부터 이 색 · 크기 · 주 색으로 — index.html 머리의 짧은 스크립트가 읽는다(어두운 테마인데 밝게 번쩍이지 않게) */
    try { localStorage.setItem('todo02:look', s + '|' + App.model.scale(S.data.settings.textSize) + '|' + accent); } catch (e) {}
    App.platform.setBars(THEME_BG[s], dark);
  }
  if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);

  /* ── 업데이트 뒤 처음 열 때 한 번만 '새 판' 안내 (재료 '첫 실행 · 시작 화면' 1절) ──
     바뀐 것 3~4줄 + 마지막 줄 '할 일 기록은 그대로예요', [확인] 한 번. 처음 깐 사람에게는 띄우지 않는다(이번 판을 이미 본 것으로).
     새 판을 낼 때: NEWS_ID를 올리고 lang의 news.lines를 그 판의 말로 바꾼다 */
  var NEWS_ID = '2026-11-02';
  function whatsNew() {
    var st = S.data.settings;
    if (!st.onboarded) { if (st.seenNews !== NEWS_ID) S.commit(function (d) { d.settings.seenNews = NEWS_ID; }, { keepUndo: true }); return; }
    if (st.seenNews === NEWS_ID) return;
    var lines = t('news.lines').split('|');
    var s = App.sheet.open({ title: t('news.title'), onClose: seen, content: function (body) {
      body.appendChild(h('ul.news-list', lines.map(function (x) { return h('li', x); })));
      body.appendChild(h('p.news-keep', t('news.keep')));
      body.appendChild(h('button.btn.primary.block.mt', { type: 'button', onclick: function () { s.close(); } }, t('common.ok')));
    } });
    function seen() { S.commit(function (d) { d.settings.seenNews = NEWS_ID; }, { keepUndo: true }); }
  }

  /* ── 알림 권한: 시간을 처음 넣는 그 순간(손가락으로 누른 때)에만 묻는다 ── */
  var hinted = false, askedExact = false;
  App.ensureNotify = function () {
    var N = App.platform.notify, s = N.status();
    if (s === 'default') { N.request().then(function () { S.flush(); App.render(); }); return; }
    if (s === 'needs-install' && !hinted && !S.data.settings.installHintShown) {   /* 한 번만 (껐다 켜도 다시 안 뜸 · 점검원 1호 29번) */
      hinted = true; S.commit(function (d) { d.settings.installHintShown = true; }, { keepUndo: true });
      App.toast.show(t('notify.needsInstallToast'), { duration: 4500 }); return;
    }
    if (App.platform.name === 'android' && s === 'granted' && N.exactOk && !N.exactOk() && !askedExact) {
      askedExact = true;
      App.pickers.confirm({ title: t('notify.exactTitle'), text: t('notify.exactText'), ok: t('notify.openSettings'), cancel: t('common.later'), onOk: function () { N.openExact(); } });
    }
  };

  /* 알림을 눌러 앱을 열었을 때 (안드로이드) */
  App.openTask = function (id, key) { if (T.find(S.data, id)) App.detail.open(id, key); };

  /* ── 시작 ── */
  S.load();
  applyTheme();
  route = useHistory ? fromHash() : { name: 'today', arg: null };
  if (useHistory) try { history.replaceState(route, '', hashOf(route)); } catch (e) {}
  /* 처음 켜면 첫 실행 화면을 처음부터 덮은 채로 그린다 — 빈 오늘 화면이 한순간 비치지 않게 (첫 실행 설계 10-31) */
  if (!S.data.settings.onboarded) App.onboarding.open({ instant: true });
  App.render(true);
  whatsNew();
  if (window.__openTask) { App.openTask(window.__openTask.id, window.__openTask.key); window.__openTask = null; }

  App.bus.on('change', function (o) {
    /* 화면 색 · 주 색이 바뀌면: 먼저 새 내용을 옛 색으로 그린 뒤 다음 프레임에 색을 바꿔, 내용과 바탕이 함께 0.3초 스르르 (내용은 뚝 · 바탕만 스르르이던 것 · 모션 점검원) */
    if (themeNow && themeNow !== lookKey() && !(o && o.reset)) { App.render.now(); requestAnimationFrame(applyTheme); setTimeout(applyTheme, 150); }   /* 다음 프레임이 늦게 와도(화면이 바쁠 때) 0.15초 안에는 반드시 바뀜 — 두 번째는 같은 값이라 아무 일 없음 */
    else { applyTheme(); App.render(); }
    if (o && o.reset) { route = { name: 'today', arg: null }; stack = []; App.sheet.closeAll(); App.onboarding.open(); }
    else if (App.onboarding.isOpen && S.data.settings.onboarded) App.onboarding.close();  /* 초기화를 되돌렸을 때 */
  });
  /* 앱을 보는 중에 온 알림(아이폰 웹앱) — '열기'로 바로 그 할 일로, 10초 (4호 8번) */
  App.bus.on('reminder', function (r) { if (!document.hidden) App.toast.show(t('notif.inApp', { title: r.title }), { duration: 10000, action: r.taskId ? t('notif.open') : null, onAction: function () { App.openTask(r.taskId, r.key); } }); });
  App.bus.on('undo-expired', function () { App.toast.hide(); });
  App.bus.on('storage-error', function () { App.toast.show(t('error.storage'), { duration: 5000 }); });

  /* 앱이 뒤로 갈 때 저장 · 돌아오면 위젯/알림 쪽지 반영 + 날짜가 바뀌었으면 다시 그림 */
  /* 앱이 뒤로 갈 때: 쓰고 있던 칸을 먼저 저장(blur) → 저장 (점검원 1호 3번) */
  function saveNow() { var a = document.activeElement; if (a && /INPUT|TEXTAREA/.test(a.tagName)) a.blur(); S.flush(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) { saveNow(); App.row.release(); App.render(); } });   /* 앱을 다시 열면 체크해 둔 줄은 정리된 자리에 */
  window.addEventListener('pagehide', saveNow);
  window.onPauseApp = saveNow;
  document.documentElement.lang = I.lang;   /* 화면 읽기 프로그램이 기기 언어로 읽게 */
  tabbar.setAttribute('aria-label', t('nav.menu')); sidebar.setAttribute('aria-label', t('nav.menu')); fab.setAttribute('aria-label', t('qa.addTask'));
  var day = U.today();
  function newDay() { if (day !== U.today()) { App.screens.calendar.dayChanged(day); day = U.today(); } }
  App.platform.onResume(function () { S.resume(); newDay(); App.render(); });
  (function midnight() {
    var n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
    setTimeout(function () { newDay(); S.resume(); App.render(); midnight(); }, next - n);
  })();
  window.addEventListener('resize', U.debounce(function () { App.render(); }, 150));

  /* 아래로 넘기는 동안 + 단추를 살짝 숨겨 줄 끝을 가리지 않게, 위로 올리면 다시 */
  var lastY = 0;
  window.addEventListener('scroll', function () {
    var y = window.scrollY, down = y > lastY + 4, up = y < lastY - 4;
    if (down && y > 80) fab.classList.add('is-tucked'); else if (up || y < 80) fab.classList.remove('is-tucked');
    if (down || up) lastY = y;
  }, { passive: true });
})();

</script>
</body>
</html>
