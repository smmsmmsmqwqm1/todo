<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 검색 엔진에 안 나오게 (공개 저장소라도 링크를 받은 사람만 찾게 · 사용자 10-31) -->
<meta name="robots" content="noindex, nofollow">
<!-- 확대 막기: 안드로이드 크롬 · 웹뷰는 maximum-scale · user-scalable을 따른다. 아이폰 사파리는 iOS 10부터 이것만으로는 두 손가락 확대를 막지 않아(접근성) web.js의 gesturestart로 막는다. 글자를 키우고 싶으면 앱 설정 '글자 크기'(최대 1.4배) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ToDo"><!-- 임시 이름 (사용자 10-31: 지금은 ToDo 예명) -->
<meta name="format-detection" content="telephone=no">
<title>ToDo</title>
<script>/* 첫 그림부터 지난번 색 · 글자 크기로 — 켤 때 번쩍임 없게 (app.js applyTheme이 저장) */
try { var l = (localStorage.getItem('todo02:look') || 'graphite').split('|'); if (l[0]) {   /* 처음 켜는 사람도 첫 그림부터 기본 색(그라파이트) */ document.documentElement.setAttribute('data-theme', l[0]); document.documentElement.style.background = l[0] === 'dark' ? '#121314' : l[0] === 'graphite' ? '#2B2B2D' : '#F2F2EF'; } if (l[1]) document.documentElement.style.setProperty('--text-scale', l[1]); if (l[2] && l[2] !== 'tangerine' && /^(blue|green|violet)$/.test(l[2])) document.documentElement.setAttribute('data-accent', l[2]); } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<!-- 화면 모양: 토큰(색 · 간격) → 바탕 → 부품 → 화면 -->
<style>
/* 색 · 간격 · 둥글기 · 그림자 — 화면 코드는 이 이름만 쓴다. 값의 근거 = 디자인/색과 글꼴.md */
:root {
  /* 10-31 'AI 티' 진단 반영: 크림 바탕 + 테라코타(클로드 색과 같은 짝) → 중립 바탕 + 귤색. 회베이지 겹을 2겹으로 */
  --bg: #F2F2EF;             /* F7 → F2: 흰 카드가 바탕 위에 한 겹 떠 보이게 (8호 4번 · 미리 알림 수준 대비 1.12) */
  --surface: #FFFFFF;
  --surface-2: #EFEFEC;
  --press: #E8E8E4;
  --line: #E8E8E4;
  --ink: #191C20;
  --ink-2: #626870;          /* 바탕 위 5.24 */
  --ink-3: #8B9097;          /* 체크 동그라미 테두리 · 흐린 글 — 흰 바탕 위 3.2 (점검원 1호 9번: 햇빛 아래 안 보임) */
  --ink-3t: #6A6F76;         /* 뜻이 있는 작은 흐린 글(빈 날 안내 · 도움말 · 개수) — 바탕 위 4.5 이상 (새 눈 5호 7번) */
  --on-accent: #FFFFFF;

  /* 글자 대비(10-31 다시 잼): 작은 글자 4.5 이상 · 아이콘 3 이상 */
  --accent: #F2622E;         /* 귤색 — 면 · 아이콘 (흰 아이콘 3.2) */
  --accent-strong: #C2410C;  /* 흰 글자가 올라가는 단추 (5.18) — 글자색(ink)과 한 값: '오늘' 글씨와 단추가 미세하게 달라 실수처럼 보이던 것 (주 색 조수 D) */
  --accent-ink: #C2410C;     /* 주 색 글자 (바탕 위 4.83) */
  --accent-soft: #FFF0E8;

  /* 끝낸 일 = 앱의 귤색으로 '내 색이 채워짐' — 초록이 글자 · 동그라미 · 줄 바탕 · 달력 칸을 다 덮어 어두운 화면에서 으스스하던 것을 바꿈 (사용자 10-31).
     애플 미리 알림 · Things처럼 색은 체크 동그라미와 달력 칸에만, 끝낸 글자는 조용한 회색 */
  --done: #F2622E;
  --done-ink: #C2410C;
  --done-soft: #FFF0E8;
  --toast-action: #FFB4A3;   /* 어두운 띠 위 '되돌리기' 글자 — 주 색을 따라감 */

  /* '중요' 깃발 하나 — 색은 목록이 쓰고(어느 칸의 일인가), 중요는 깃발 모양 + 이 빨강 하나로만 (옛 중요도 3색이 목록 회색 · 청록 · 보라와 똑같던 문제 · 색 검증 조수 10-31) */
  --flag: #D93A3F;   /* 흰 카드 위 4.6 */
  --sun: #A85852;    /* 일요일 숫자 — 종이 플래너처럼 부드러운 붉은 기 (깃발보다 연하게) */

  --c-orange: #F2622E; --c-yellow: #E3B52C; --c-green: #2FA36B; --c-teal: #1E9EA6;
  --c-blue: #4C8DF6;   --c-violet: #8B6CE0; --c-pink: #E5679A;  --c-gray: #8A9097;

  --scrim: rgba(0, 0, 0, .18);  /* 뒤 화면이 '흐려지기'보다 '살짝 물러나는' 정도 */
  --shadow-float: 0 8px 24px rgba(30, 33, 36, .10), 0 2px 6px rgba(30, 33, 36, .06);
  --shadow-sheet: 0 -8px 32px rgba(30, 33, 36, .12);

  --r-card: 14px;
  --r-sheet: 24px;
  --r-field: 10px;
  --r-pill: 999px;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;

  --fs-title: 1.75rem;
  --fs-head: 1.25rem;
  --fs-body: 1.0625rem;
  --fs-sub: 0.875rem;
  --fs-small: 0.8125rem;   /* 13px — 시간 · '언제까지'가 이 크기라 상용 앱 부제 수준으로 (UI 채점 6차 ⑤) */

  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --fast: 120ms;
  --mid: 240ms;
  /* 손짓 뒤 '마저 가기'(js/ui/motion.js settle) — 끄는 동안은 손가락을 그대로 따라가고, 놓으면 손가락 속도를 이어받아 감속.
     누르기(속도 없음) = --m-settle(끝까지 갈 때) · 놓기 = 손가락 속도에 맞춘 시간을 min ~ max 안으로 (사용자 11-01 '휙 말고 인간적 · 서서히 인지될 정도') */
  --m-settle: 340ms;
  --m-settle-min: 200ms;
  --m-settle-max: 420ms;
  --t-cal-fade: 160ms;   /* 캘린더 줄이 벌어지기 시작할 때 점 → 일정 글자로 바뀌는 시간 */

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #121314;
  --surface: #1C1D1F;
  --surface-2: #26282B;
  --press: #2E3134;
  --line: #2F3236;
  --ink: #EEEFF0;
  --ink-2: #A3A8AE;
  --ink-3: #80858B;
  --ink-3t: #80858B;
  --on-accent: #2A1510;      /* 어둡게: 밝은 주황 위에는 어두운 글자 · 아이콘 (7.21) */

  --accent: #FF8A55;
  --accent-strong: #FF8A55;
  --accent-ink: #FF9B6E;
  --accent-soft: var(--surface-2);   /* 어두운 바탕에 귤색을 옅게 섞으면 밤색이 됨 → 중립 회색 + 귤색 테두리 · 글자로 (처음 요구 '짙은 브라운 · 찝찝한 색 배제' · 원문 점검 10-31) */

  --done: #FF8A55;
  --done-ink: #FFA27A;
  --done-soft: var(--surface-2);

  --flag: #FF5A63;   /* 귤색(주 색)과 갈리게 더 차가운 빨강 (점검원 10호 4번) */
  --sun: #C99892;    /* 일요일은 채도를 낮춰 깃발 · 주 색과 떨어지게 */

  --c-orange: #FF8467; --c-yellow: #EBC650; --c-green: #4CC38A; --c-teal: #3CC0C8;
  --c-blue: #6FA4FF;   --c-violet: #A58BF0; --c-pink: #F383B0;  --c-gray: #9AA0A7;

  --scrim: rgba(0, 0, 0, .55);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, .45);
  --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}


/* 그라파이트 — 너무 밝지도(흰 종이) 너무 어둡지도(먹색) 않은 가운데. 연필심 같은 차분한 회색 바탕 + 한 겹 밝은 카드 + 따뜻한 미색 글자.
   흰색 · 먹색이 서로 정반대라, 그 사이에서 눈이 편한 세 번째 결 (사용자 10-31 '그라파이트 · 고급지게 · 감각적으로') */
:root[data-theme="graphite"] {
  /* 파랑기를 뺀 중립 회색(애플 다크의 '높인 겹' 결) — 따뜻한 미색 글자 · 귤색과 온도가 맞게 (8호 1번: 옛 #2C2E33은 개발 도구 회색) */
  --bg: #2B2B2D;
  --surface: #363638;
  --surface-2: #414143;
  --press: #48484B;
  --line: #3F3F42;
  --ink: #F2F0EB;            /* 따뜻한 미색 — 새하얀 글자가 회색 바탕에서 번쩍이지 않게 */
  --ink-2: #C2C3C7;          /* 바탕 위 7.9 */
  --ink-3: #9A9DA3;          /* 카드 위 4.5 */
  --ink-3t: #9A9DA3;
  --on-accent: #2A1510;

  --accent: #FF9466;
  --accent-strong: #FF9466;
  --accent-ink: #FFAD88;
  --accent-soft: var(--surface-2);   /* 회색에 귤색을 섞으면 밤색 → 중립 회색 + 귤색 테두리 · 글자로 (원문 점검 10-31) */

  --done: #FF9466;
  --done-ink: #FFB291;
  --done-soft: var(--surface-2);

  --flag: #FF5E68;
  --sun: #CFA19C;

  --c-orange: #FF8F74; --c-yellow: #EECB5C; --c-green: #5CCB95; --c-teal: #4CC7CE;
  --c-blue: #7DADFF;   --c-violet: #B19AF3; --c-pink: #F58FB8;  --c-gray: #A6ABB1;

  --scrim: rgba(10, 11, 13, .5);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, .32), 0 2px 6px rgba(0, 0, 0, .18);
  --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

/* 주 색 고르기 (설정 › 보기 · 사용자 10-31 22:4x '귤색 말고도 겹치지 않는 선택지 몇 개') — 귤색(기본 · 위 값) · 파랑 · 초록 · 보라.
   주 색 = 체크 동그라미 · 주요 단추 · '오늘' 글씨 · 고른 날 — 하나의 개념이라 체크도 같이 바뀐다 (주 색 조수 C).
   면(accent) / 글자 · 단추(ink = strong) 두 단계. 빨강 · 분홍은 깃발 · 일요일과, 노랑은 흰 체크 대비로, 네이비 · 먹 · 모카는 사용자가 이미 거절해서 뺌.
   대비(메인이 잰 값 10-31): 체크 표시 ≥ 4.45 · 글자 ≥ 4.76 — 12조합 모두 기준(체크 3 · 글자 4.5) 넘음 */
:root[data-accent="blue"]   { --accent: #3B6EE0; --accent-strong: #2F5FD0; --accent-ink: #2F5FD0; --accent-soft: #EEF2FF; --on-accent: #FFFFFF; }
:root[data-accent="green"]  { --accent: #13875F; --accent-strong: #0F7A55; --accent-ink: #0F7A55; --accent-soft: #E7F5EE; --on-accent: #FFFFFF; }
:root[data-accent="violet"] { --accent: #7A52D6; --accent-strong: #6E45CC; --accent-ink: #6E45CC; --accent-soft: #F2EEFF; --on-accent: #FFFFFF; }
:root[data-theme="dark"][data-accent="blue"]       { --accent: #5B8CFF; --accent-strong: #5B8CFF; --accent-ink: #8FB0FF; --on-accent: #0B1530; --accent-soft: var(--surface-2); }
:root[data-theme="dark"][data-accent="green"]      { --accent: #2FB67E; --accent-strong: #2FB67E; --accent-ink: #5CD39C; --on-accent: #06231A; --accent-soft: var(--surface-2); }
:root[data-theme="dark"][data-accent="violet"]     { --accent: #9A7BFF; --accent-strong: #9A7BFF; --accent-ink: #B9A3FF; --on-accent: #1A1033; --accent-soft: var(--surface-2); }
:root[data-theme="graphite"][data-accent="blue"]   { --accent: #6E9BFF; --accent-strong: #6E9BFF; --accent-ink: #9DBBFF; --on-accent: #0B1530; --accent-soft: var(--surface-2); }
:root[data-theme="graphite"][data-accent="green"]  { --accent: #3DC28A; --accent-strong: #3DC28A; --accent-ink: #6FDCA8; --on-accent: #06231A; --accent-soft: var(--surface-2); }
:root[data-theme="graphite"][data-accent="violet"] { --accent: #A68BFF; --accent-strong: #A68BFF; --accent-ink: #BFA9FF; --on-accent: #1A1033; --accent-soft: var(--surface-2); }
/* 끝낸 일(체크) = 주 색 그대로 */
:root[data-accent="blue"] { --toast-action: #AFC6FF; } :root[data-accent="green"] { --toast-action: #8FE0B9; } :root[data-accent="violet"] { --toast-action: #CDBBFF; }
:root[data-accent] { --done: var(--accent); --done-ink: var(--accent-ink); --done-soft: var(--accent-soft); }
</style>
<style>
/* 바탕 · 큰 배치(휴대폰 = 아래 탭 / 넓은 화면 = 왼쪽 메뉴) */
*, *::before, *::after { box-sizing: border-box; }
/* 두 번 톡 확대 막기 — touch-action은 물려받지 않아 모든 요소에 둔다(클래스에 따로 정한 pan-y · none이 이김). 확대 없이 빠른 탭 · 스크롤만 (사용자 10-31 '앱이 확대 축소되면 말이 안 됨') */
* { touch-action: manipulation; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; font-size: calc(16px * var(--text-scale, 1)); } /* 글자 크기 설정 = 이 한 줄 (모든 글자가 rem) */
html, body { margin: 0; height: 100%; }
html.is-scroll-lock, html.is-scroll-lock body { overflow: hidden; overscroll-behavior: none; }
html.is-scroll-lock .screen-cal :is(.cal-card, .page-head) { touch-action: none; }   /* iOS 15 이하는 위 줄을 무시해 위 창을 끌면 화면 전체가 튕김 — 위 창은 브라우저 스크롤에 넘기지 않음(달 넘기기는 포인터로 그대로) (4차 4) */   /* 캘린더 크게 보기 = 화면을 꽉 채운 고정 화면 — 위아래로 끌어도 달력이 움직이지 않음 (사용자 11-01) */
html { scrollbar-gutter: stable; }   /* PC 좁은 창: 크게 보기 ↔ 작게에서 스크롤바가 생겼다 없어지며 달력 폭이 흔들리지 않게 (휴대폰은 겹쳐 뜨는 스크롤바라 영향 없음 · 모션 점검원 2차 ⑤) */
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--fs-body)/1.42 var(--font);
  word-break: keep-all;
  /* break-word: 칸을 넘칠 때만 낱말 안에서 끊음. anywhere는 '가장 좁은 폭'까지 한 글자로 만들어, 옆 글이 긴 줄에서 제목이 한 글자씩 세로로 쌓였음
     (11-01 영어 아이폰 '반복 지우기' 창 'E n d r e p e a t' 세로 오류). 줄어드는 칸이 꼭 끊겨야 하는 곳만 칸마다 anywhere + min-width: 0 */
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
  /* 앱처럼: 글자를 꾹 눌러도 '선택(복사) 상태'로 열리지 않게 — 웹 페이지 티 (사용자 10-31 22:5x 안드로이드 APK '문구 꾹 누르니 포커스(복사 가능한 상태)로 열려 버려 · 너무 후진 앱 같아').
     글을 쓰는 칸(입력 · 메모)만 선택 · 붙여넣기 가능 */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
img { -webkit-user-drag: none; user-drag: none; }   /* 목록 사진 등을 꾹 눌러 끌면 '이미지 끌기'가 되던 것 */
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
input, textarea { -webkit-appearance: none; appearance: none; }
/* 아이폰은 글자가 16px보다 작은 입력 칸을 누르면 화면을 저절로 확대한다 → 입력 칸 글자는 늘 16px 이상(글자 크기 '작게'에서도). 클래스로 크기를 정한 칸도 max(16px, …)로 */
input, textarea, select { font-size: max(16px, 1rem); }
svg { display: block; flex: none; }
[hidden] { display: none !important; }

.check path { stroke: var(--on-done, var(--on-accent)); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 260ms var(--ease) 60ms; }
.check:active { transform: scale(.88); }
/* '중요' = 제목 끝 작은 깃발 하나 (8호 2번 — 빨간 글자가 메타 줄 맨 앞에서 소리치던 것) */
.title-flag { display: inline-flex; vertical-align: -1px; margin-left: 6px; color: var(--flag); }
.task.is-done .title-flag { color: var(--ink-3); }
/* 둘째 줄이 아이콘 하나뿐이면 제목 끝으로(row.js meta → inline) — 매일 반복 · 종 · 메모 표시 */
.title-icons { display: inline-flex; gap: 5px; vertical-align: -1px; margin-left: 6px; color: var(--ink-3); }
.title-icons .meta { display: inline-flex; padding: 0; background: none; }
.meta-bell { color: var(--ink-2); }
.is-done > .check, .check.is-on { background: var(--done); border-color: var(--done); }
.is-done > .check path, .check.is-on path { stroke-dashoffset: 0; }
.is-checking > .check { animation: pop 360ms var(--ease); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }   /* 1.18 → 1.08 (모션 점검원) */
.check.sm { width: calc(20px * var(--text-scale, 1)); height: calc(20px * var(--text-scale, 1)); border-width: 1.8px; }
.check.sm svg { width: 12px; height: 12px; }
.check.lg { width: 30px; height: 30px; }

/* 세부 할 일 (목록에서 펼침) */
.subs { padding: 0 14px 10px 54px; background: inherit; }
.sub { display: flex; align-items: center; gap: 10px; min-height: 38px; }
.sub-title { flex: 1; min-width: 0; font-size: 0.9688rem; color: var(--ink); overflow-wrap: anywhere; }
.sub.is-done .sub-title { color: var(--ink-2); }

/* 작은 표 */
.badge { display: inline-flex; align-items: center; font-size: var(--fs-small); font-weight: 500; color: var(--ink-2); } /* 회색 상자 없이 글자만 · 한 줄 안 글자 크기 하나로 (8호 3번) */
.badge.is-soon { color: var(--ink); font-weight: 650; }   /* 오늘 · 내일까지 = 진한 글자 — 귤색은 '채움'에만 (8호 3번) */

/* 칩 */
/* 반복 고르기의 '매주 [요일]' 줄 — 일곱 칸이 한 줄에, 좁으면 줄바꿈 */
.week-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 4px; }
.week-label { color: var(--ink-2); font-size: var(--fs-small); }
.week-days { display: flex; gap: 6px; flex-wrap: wrap; }
.week-day { min-width: 40px; justify-content: center; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 14px; border-radius: var(--r-pill);
  background: var(--surface-2); color: var(--ink-2);
  font-size: 0.9062rem; font-weight: 600; white-space: nowrap;
  transition: background var(--fast), color var(--fast), transform var(--fast) var(--ease);
}
.chip:active { transform: scale(.95); }
.chip.is-on { background: var(--accent-soft); color: var(--accent-ink); }
.chip.is-parsed { background: var(--accent-soft); color: var(--accent-ink); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 45%, transparent); }
.chip .x { margin-right: -6px; opacity: .7; }
.qa-chips .chip { max-width: 100%; min-width: 0; }   /* 줄바꿈 칩 줄에서 긴 반복 설명 · 목록 이름이 창 밖으로 넘치지 않게 — 글만 말줄임, ×는 남김 */
.chip-t { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .x, .chip > :first-child:not(.chip-t) { flex: none; }
.remind-at.is-off { opacity: .5; }
.pick-alert.is-off { opacity: .55; }
/* 확인 창 · 고르기 창 아래 단추: 긴 영어('Erase and start over')가 옆 단추 위로 넘치지 않게 두 줄 허용 */
.pick-actions .btn { white-space: normal; height: auto; min-height: 52px; line-height: 1.25; padding-top: 8px; padding-bottom: 8px; }
@media (max-width: 360px) { .seg.seg button { font-size: 0.8125rem; } }   /* 뒤쪽 .seg button보다 실제로 우선하게(.seg 두 번) */   /* 좁은 폰: 'Graphite' · 'English'가 낱말 중간에서 끊기지 않게 글자를 조금 줄임 */
.chip.is-mem { border: 1.5px dashed var(--line); padding: 0 12.5px; }   /* ×로 끈 칩 = 누르면 방금 값이 돌아옴 — 칩엔 원래 테두리가 없어 '점선'만 바꾸면 안 보였음(새 눈 점검원 1호 10번) · 테두리만큼 안쪽을 줄여 폭이 그대로 */

/* 단추 */
.btn { height: 52px; padding: 0 20px; border-radius: 14px; font-weight: 700; font-size: 1.0312rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform var(--fast) var(--ease), background var(--fast); white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent-strong); color: var(--on-accent); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.danger-text { color: var(--ink-2); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.text-btn { font-weight: 650; color: var(--accent-ink); padding: 8px 10px; border-radius: 10px; }
.text-btn:active { background: var(--accent-soft); }

/* 입력 */
.field { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: var(--r-field); background: var(--surface-2); border: 1.5px solid transparent; font-size: max(16px, 1.0312rem); transition: border-color var(--fast); }
.field:focus { border-color: var(--accent); background: var(--surface); }
textarea.field { resize: none; line-height: 1.45; }
.field::placeholder { color: var(--ink-3); }

/* 설정 · 속성 줄 */
.prop { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 12px 0 16px; text-align: left; background: var(--surface); transition: background var(--fast); }
.prop:active { background: var(--press); }
.prop-icon { color: var(--ink-2); }
/* 이름 칸 · 값 칸 모두 min-width 0 + 값은 줄의 55%까지 — 긴 값(영어 '매 2주 월 · 수 · 금')이 이름 칸을 한 낱말 폭으로 찌그러뜨려 보조 줄이 세로로 쌓이던 것,
   띄어쓰기 없는 긴 이름이 오른쪽 ×·›·'되살리기'를 밀어내던 것 (11-01 화면 깨짐 점검) */
.prop-label { flex: 1; font-size: 1rem; padding: 10px 0; }   /* 이름 칸은 가장 긴 낱말 폭을 지킴 — 값 칸이 양보 (재판정: min-width 0이면 'Repeat starts'가 다시 세로로) */
/* 사용자가 쓴 긴 이름이 들어가는 줄(지운 항목 · 목록 · 알림 설정)만 줄어들고 낱말 안에서도 끊김 */
.set-row .prop-label, .list-row .prop-label { min-width: 0; overflow-wrap: anywhere; }
.set-row .prop-label { flex: 1 1 10rem; }   /* 시작 폭이 있어야 좁을 때 단추가 실제로 아래 줄로 내려감 (화면 조수 3차) */
/* 자세히 창 속성 줄: 이름 · 값을 한 글 칸(prop-text)에 묶어 그 안에서만 줄을 바꿈 — 한 줄에 안 들어가면 값이 이름 아래 줄로(오른쪽 붙임).
   아이콘 · › · 스위치는 칸 밖이라 늘 첫 줄 (긴 알림 요약 · 날짜 + ‹ › 줄에서 값이 70px에 갇혀 낱말 중간에서 끊기던 것 · 화면 조수 4차: 줄 전체를 접으면 아이콘이 혼자 남음) */
.prop-text { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; }
.prop-text > .prop-label { flex: 1 1 auto; }
.prop-text > .prop-value:not(.is-empty) { flex: 0 1 auto; max-width: none; margin-left: auto; padding-bottom: 8px; }   /* 짧은 값('내일')은 한 줄, 긴 값만 아래 줄로 (화면 조수 최종 참고 1) */
.prop-text > .prop-value.is-empty { align-self: center; margin-left: auto; }
.set-row { flex-wrap: wrap; }   /* 오른쪽 단추('설정 열기' 등)가 길면 이름 아래 줄로 */
.set-row > .text-btn { margin-left: auto; }
.prop-sub { display: block; margin-top: 2px; font-size: 0.8438rem; color: var(--ink-2); }
.prop-value { min-width: 0; max-width: 55%; font-size: 0.9375rem; color: var(--ink-2); text-align: right; overflow-wrap: anywhere; }
.prop-value.is-empty { color: var(--ink-3); display: grid; place-items: center; }
.prop.is-set .prop-icon { color: var(--accent-ink); }
.prop.is-set .prop-value { color: var(--ink); font-weight: 600; }
.prop-clear { width: 32px; height: 32px; margin-right: -4px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); }
.prop-clear:active { background: var(--surface-2); }
.prop-chev { color: var(--ink-3); }
.prop-note { padding: 8px 16px 0; font-size: var(--fs-small); color: var(--ink-2); }

/* 고르기 단추 묶음 */
.seg { display: flex; padding: 3px; gap: 3px; border-radius: 12px; background: var(--surface-2); }
/* 글자를 '아주 크게'로 키워도 칸을 넘치지 않게: 높이는 글자와 같이 늘고, 넘치면 낱말 단위로 두 줄 (1호 10번 재확인) */
.seg button { flex: 1 1 0; min-width: 0; min-height: 2.375rem; padding: 4px 6px; border-radius: 9px; font-size: 0.9062rem; line-height: 1.2; font-weight: 650; color: var(--ink-2); transition: background var(--fast), color var(--fast); word-break: keep-all; overflow-wrap: anywhere; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* 선택 목록 (고르기 창 안) */
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 16px; text-align: left; border-radius: 12px; transition: background var(--fast); }
.opt:active { background: var(--press); }
.opt-text { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 2px; padding: 8px 0; }
.opt-label { flex: 1 1 auto; min-width: 0; font-size: 1.0312rem; }
.opt-sub { min-width: 0; margin-left: auto; font-size: 0.875rem; color: var(--ink-2); text-align: right; }
/* 설명 줄(지우기 갈래 등): 제목 아래 왼쪽 정렬로 */
.opt.is-desc { padding-top: 4px; padding-bottom: 4px; }
.opt.is-desc .opt-text { flex-direction: column; align-items: flex-start; }
.opt.is-desc .opt-sub { margin-left: 0; text-align: left; line-height: 1.35; }
.opt .tick { color: var(--accent-ink); }
.opt.is-off { opacity: .42; }   /* 알림 2개를 다 고른 뒤 나머지 칸 */
.opt-pair { display: flex; align-items: center; gap: 8px; }
.opt-pair > .opt { flex: 1 1 auto; min-width: 0; }
.opt-pair.is-off, .opt-pair > .opt.is-off + .remind-at { opacity: .42; }
.remind-at { flex: none; margin-right: 8px; min-height: 36px; padding: 4px 12px; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.pick-alert { margin: 0 0 14px; border-radius: var(--r-card); background: var(--surface-2); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }   /* 화면 읽기만 읽는 글 */
/* 알림 목록 · 알림 정하기 (pickers.js remind · alertPick) */
.alert-row > .opt { flex: 1 1 auto; min-width: 0; }
.alert-row.is-past > .opt { opacity: .55; }
.alert-x { flex: none; color: var(--ink-3); }
.pick-chips .chip.is-off { opacity: .4; }
.alert-date { width: 100%; margin-bottom: 8px; border-radius: var(--r-card); background: var(--surface-2); }
.alert-date .prop-value { color: var(--ink); font-weight: 600; }
.alert-msg:empty { display: none; }
.alert-msg { color: var(--flag); font-weight: 600; }
/* 날짜 고르기 위 요약('11월 3일 ~ 7일 · 5일') + 하루를 막 골랐을 때 안내 한 줄 */
.pick-sum { display: flex; flex-direction: column; gap: 2px; margin: 0 4px 12px; min-height: 2.6em; }
.pick-sum strong { font-size: 1.0625rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pick-oneday { align-self: flex-start; margin: 2px -8px 0; }   /* 기간 → '○일 하루만' 글자 단추 (요약 아래 왼쪽) */
.pick-hint { font-size: 0.8125rem; color: var(--ink-3t); }

/* 하루 · 기간 = 알약 모양: 시작 · 끝(하루면 그 날) = 진한 동그라미, 사이 = 같은 높이의 옅은 띠 (사용자 11-01).
   띠는 주(줄)마다 한 덩어리(.mini-band · pickers.js monthGrid) — 칸마다 그리면 칸 경계마다 세로줄이 보였음(사용자 11-01 '조잡 · 쭉 네모나게').
   기간 첫날 · 끝날 쪽은 동그라미 바깥 반원과 꼭 겹치게 안으로 들이고 둥글게, 다음 줄로 이어지는 쪽은 줄 끝까지 반듯하게 */
.mini-grid { container-type: inline-size; }   /* 칸 폭 = 100cqw / 7 */
.mini-day { position: relative; border-radius: 0; background: none; }
.mini-day .md-n { position: relative; z-index: 1; width: min(40px, 100%); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; transition: background var(--fast); }
.mini-day:active { background: none; }
.mini-day:active .md-n { background: var(--press); }
.mini-day.is-sel .md-n { background: var(--accent); color: var(--on-accent); font-weight: 750; }
.mini-band { --md: min(40px, 100cqw / 7); --inset: calc((100cqw / 7 - var(--md)) / 2);
  align-self: center; height: var(--md); max-height: 46px; background: color-mix(in srgb, var(--accent) 16%, transparent); pointer-events: none; }
.mini-band.is-from { margin-left: var(--inset); border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
.mini-band.is-to { margin-right: var(--inset); border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
:root:is([data-theme="dark"], [data-theme="graphite"]) .mini-band { background: color-mix(in srgb, var(--accent) 24%, transparent); }
.mini-day.is-off { opacity: .35; }

/* 안드로이드 시간 휠 — 칸마다 스크롤 스냅, 가운데 띠가 고른 값 (한 칸 40px · 5칸 보임) */
.wheel { position: relative; display: flex; justify-content: center; gap: 4px; height: 200px; margin-top: 4px; border-radius: var(--r-card); background: var(--surface-2); overflow: hidden; }
.wheel::before { content: ''; position: absolute; left: 10px; right: 10px; top: 80px; height: 40px; border-radius: 10px; background: var(--surface); pointer-events: none; }
.wheel::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(var(--surface-2), transparent 34%, transparent 66%, var(--surface-2)); }
.wheel-col { position: relative; z-index: 1; flex: 0 1 84px; min-width: 0; height: 200px; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; touch-action: pan-y; }
.wheel-col::-webkit-scrollbar { display: none; }
.wheel-list { padding: 80px 0; }
.wheel-item { height: 40px; display: grid; place-items: center; scroll-snap-align: center; font-size: 1.25rem; font-variant-numeric: tabular-nums; color: var(--ink-3); cursor: pointer; }
.wheel-item.is-on { color: var(--ink); font-weight: 650; }
.wheel-col:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }

/* 휴지통에 끌어 놓기 — 줄이 들리면 + 자리에 휴지통(+와 같은 모양에서 돌며 바뀜) · 손가락이 들어가면 커지고 빨강 + '놓으면 지워요' */
.trash-drop { position: fixed; z-index: 90; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity 160ms var(--ease); }
.trash-drop.is-on { opacity: 1; }
.trash-ball { width: 52px; height: 44px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); box-shadow: var(--shadow-float); transform: scale(.7) rotate(-45deg); transition: transform 220ms var(--ease), background 140ms, color 140ms; }
.trash-drop.is-on .trash-ball { transform: none; }
.trash-drop.is-armed .trash-ball { background: var(--flag); color: #fff; transform: scale(1.15); }
.trash-label { position: absolute; left: 50%; bottom: calc(100% + 12px); transform: translate(-50%, 4px); white-space: nowrap; font-size: 0.8125rem; font-weight: 650; color: var(--ink); background: var(--surface); padding: 6px 12px; border-radius: 999px; box-shadow: var(--shadow-float); opacity: 0; transition: opacity 140ms, transform 140ms; }
.trash-drop.is-armed .trash-label { opacity: 1; transform: translate(-50%, 0); }
html.is-holding .tab-add { transform: rotate(45deg) scale(.6); opacity: 0; transition: transform 200ms var(--ease), opacity 160ms; }
html.is-holding .tabbar .tab { opacity: .45; transition: opacity 160ms; }
.task-wrap.is-free { position: relative; z-index: 30; }
/* 순서를 못 바꾸는 줄을 휴지통 쪽으로 끌 때 카드 밖으로 나가도 잘리지 않게 — 그 카드만 잠시 넘침을 허용하고 첫 · 끝 줄 모서리는 줄이 직접 둥글게 */
.card:has(> .task-wrap.is-free) { overflow: visible; }
.card:has(> .task-wrap.is-free) > .task-wrap:first-child .task { border-top-left-radius: var(--r-card); border-top-right-radius: var(--r-card); }
.card:has(> .task-wrap.is-free) > .task-wrap:last-child .task { border-bottom-left-radius: var(--r-card); border-bottom-right-radius: var(--r-card); }
.task-wrap.is-free .task, .task-wrap.is-lifted .task { box-shadow: var(--shadow-float); }
.task-wrap.is-trash { opacity: .6; }
.task-wrap.is-trash .task { transform: scale(.94); transition: transform 160ms var(--ease); }
@media (prefers-reduced-motion: reduce) { .trash-ball { transition: none; } }
/* 세부 할 일 줄도 같은 손짓(reorder.js) — 목록에서 펼친 줄(.sub) · 자세히 창 줄(.sub-edit) */
:is(.sub, .sub-edit)[data-drag] { position: relative; background: var(--surface); border-radius: 10px; }
:is(.sub, .sub-edit).is-lifted { background: var(--surface-2); box-shadow: var(--shadow-float); z-index: 3; transition: background 160ms var(--ease); }
:is(.sub, .sub-edit).is-dragging { z-index: 4; }
:is(.sub, .sub-edit).is-shifting { transition: transform 180ms var(--ease); }
:is(.sub, .sub-edit).is-settling { transition: transform 160ms var(--ease); }
:is(.sub, .sub-edit).is-free { z-index: 30; }
:is(.sub, .sub-edit).is-trash { opacity: .6; transform-origin: center; }
.card:has(.sub.is-free), .card:has(.sub.is-lifted) { overflow: visible; }
.sub-edit.is-lifted + .sub-edit, .sub-edit + .sub-edit.is-lifted { border-top-color: transparent; }
@media (prefers-reduced-motion: reduce) { :is(.sub, .sub-edit).is-shifting, :is(.sub, .sub-edit).is-settling { transition: none; } }

.side-item[aria-current="page"] { background: var(--surface-2); color: var(--ink); font-weight: 700; border-radius: 8px; }
.side-item .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count { font-size: 0.8125rem; color: var(--ink-3); font-weight: 600; }
.side-label { font-size: 0.7812rem; font-weight: 700; color: var(--ink-3); padding: 20px 12px 6px; }
.side-list { font-weight: 550; }
.side-spacer { flex: 1; min-height: 16px; }

/* 공통 작은 것 */
.show-done { display: block; margin: -8px auto 22px; padding: 10px 16px; border-radius: var(--r-pill); font-size: 0.9062rem; font-weight: 650; color: var(--ink-2); background: var(--surface-2); }
.show-done:active { transform: scale(.97); }
.back-btn { display: inline-flex; align-items: center; gap: 2px; margin: 0 0 6px -6px; padding: 6px 8px 6px 4px; border-radius: 10px; font-size: var(--fs-sub); font-weight: 650; color: var(--ink-2); }
.back-btn:active { background: var(--press); }
.list-title { display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }

/* 목록 */
.list-row .prop-label { font-weight: 600; }
.list-row.is-add .prop-label, .list-row.is-add .prop-icon { color: var(--accent-ink); }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin: 6px 0 4px; }
.swatch { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; color: #fff; transition: transform var(--fast) var(--ease); }
.swatch:active { transform: scale(.9); }
.swatch.is-on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink-3); }

/* 고르기 창 */
.pick-chips { margin: 0 0 14px; padding: 2px 0; flex-wrap: wrap; overflow: visible; }   /* 날짜 · 시간 · 알림 창 빠른 칩도 줄바꿈('주말 11월 7일~8일'이 잘리던 것 · 새 눈 3호 5번) */   /* 오른쪽 끝을 흐리게 — 칩이 뚝 잘려 '더 있음'이 안 보이던 것 (1호 2차 사진 · 빠른 추가 칩 줄과 같게) */
@media (min-width: 768px) and (min-height: 560px) { .pick-chips { flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; } }
html[data-text="lg"] .pick-chips, html[data-text="xl"] .pick-chips { flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; }
.chip-sub { font-weight: 500; opacity: .75; }
.pick-label { display: block; font-size: var(--fs-sub); font-weight: 700; color: var(--ink-2); margin: 14px 4px 8px; }
.pick-actions { display: flex; gap: 10px; margin-top: 16px; }
.pick-actions .btn { flex: 1; }
.time-input { font-size: 1.25rem; font-weight: 600; text-align: center; min-height: 56px; }
.time-input::-webkit-date-and-time-value { text-align: center; }   /* 아이폰은 칸의 text-align을 안 따라 시각이 왼쪽에 붙던 것 */
.confirm-text { margin: 0 0 4px; color: var(--ink-2); font-size: 0.9688rem; line-height: 1.5; }
.opt-add .opt-label, .opt-add span { color: var(--accent-ink); }
.text-btn.sm { font-size: 0.875rem; padding: 4px 8px; }

.mini-cal { background: var(--surface); border-radius: var(--r-card); padding: 6px 8px 10px; }
.mini-head { display: flex; align-items: center; justify-content: space-between; }
.mini-title { font-weight: 700; font-size: 1rem; }
.mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; }   /* 가로 틈 0 — 기간 띠가 칸마다 끊기지 않게 */
.mini-dow { text-align: center; font-size: 0.75rem; color: var(--ink-3); padding: 4px 0; font-weight: 600; }
.mini-day { aspect-ratio: 1; max-height: 46px; font-size: 0.9688rem; font-weight: 550; display: grid; place-items: center; font-variant-numeric: tabular-nums; }   /* 동그라미 · 띠 모양은 components.css '알약 모양' */
.mini-day.is-past { color: var(--ink-3); }
.mini-day.is-today { color: var(--accent-ink); font-weight: 800; }

.rep-every { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rep-every > span { font-weight: 650; }
.num-input { width: 72px; text-align: center; font-weight: 700; }
.rep-every .seg { flex: 1; min-width: 200px; }
.dow-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
.dow { aspect-ratio: 1; max-height: 48px; border-radius: 50%; background: var(--surface-2); font-weight: 700; color: var(--ink-2); }
.dow.is-on { background: var(--accent); color: var(--on-accent); }
.rep-preview { margin: 16px 4px 0; font-weight: 700; color: var(--accent-ink); }

/* 캘린더 */
/* 달력은 카드에 담지 않고 바탕 위에 바로 (각진 표 · AI 티 진단 10-31) */
.cal-card { touch-action: pan-y; }
/* 달력 = 요일 줄 + 주(줄) 6개. 줄 사이 2px · 칸끼리 가로 틈 없음(띠가 칸 사이에서 끊기지 않게). minmax(0) — 칸 속 긴 제목이 열을 밀어 넓히지 않게 */
.cal-grid { display: flex; flex-direction: column; row-gap: 2px; }
.cal-dows, .cal-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-cell { min-width: 0; }   /* 칸은 자르지 않음(둥근 모서리가 바닥 꼬리선을 잘라 칸마다 끊겨 보이던 것) — 넘치는 글은 제목 줄 안에서만 자름 */
.cal-dow { text-align: center; font-size: 0.75rem; font-weight: 600; color: var(--ink-2); padding: 6px 0 8px; }
.cal-cell { position: relative; height: calc(46px * var(--text-scale, 1)); /* 낮은 칸: 고른 날 목록이 더 보이게 (UI 채점 6차 ⑥) */ display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(3px * var(--text-scale, 1)); border-radius: 10px; transition: background var(--fast); }
.cal-cell:active { background: var(--press); }
/* 숫자 30px + 틈 3 + 표식 자리 11 = 44 → 50px 칸 위아래 3px씩 (깃발이 칸 바닥에 붙어 낮아 보이던 것 · 사용자 11-01 아이폰 캡처 · 중요 표시 조수 치수) */
.cal-num { width: min(calc(30px * max(.9, var(--text-scale, 1))), 100%); height: auto; aspect-ratio: 1; flex: none;   /* 큰 글자 · 좁은 폰에서 칸 폭(320px이면 40px)을 넘지 않게 */ display: grid; place-items: center; font-size: 0.9688rem; font-weight: 600; border-radius: 50%; }
/* 지난 날을 흐리게 하면 '지나간 · 버린 날' 느낌 → 색은 그대로, 무게만 살짝 낮춤. 흐린 색은 앞뒤 달 날짜에만 (플래너 감성 조수) */
.cal-cell.is-past .cal-num { color: var(--ink); font-weight: 500; }
/* 종이 플래너 문법: 일요일만 부드러운 붉은 기 (토요일은 색 없음 — 색 = 목록 규칙 5와 겹치지 않게) */
.cal-dow.is-sun, .cal-cell.is-sun:not(.is-today):not(.is-other) .cal-num { color: var(--sun); }
/* ── 칸 표현: 한 가지 말 — 점 = 일 하나 · 점에서 그어지는 꼬리 = 이어지는 기간 (사용자 10-31 '공이 주우욱 그어지는 연출 · 더럽지 않게' + 미감 조수) ──
   작은 보기 = 가운데 점/깃발 + 바닥에 가는 꼬리선(기간) · 크게 보기 = 목록 색 점 + 제목(꼬리표) + 같은 색 옅은 띠(기간, 첫날 · 주 첫 칸에만 제목).
   색은 작은 표식에만, 글자는 잉크 회색. 칸 바탕은 칠하지 않음(규칙 3) */
.cal-peeks, .cal-lanes { display: flex; width: 100%; min-width: 0; flex-direction: column; }
/* 주마다 겹 둘(calendar.js grid): 점 겹 · 미리보기 겹 — 칸(숫자) 위 같은 7열에 겹쳐 둠(누르기는 칸이 받음). 칸 높이와 상관없이 숫자 바로 아래(--cal-mark-top)에서 시작 */
.cal-week { position: relative; }
.cal-wdots, .cal-wpeek { position: absolute; left: 0; right: 0; top: var(--cal-mark-top, 36px); display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); pointer-events: none; }
/* 점 겹은 칸 맨 위부터(숫자 밑 · DOM 앞) — 고른 날 상자도 여기(작은 칸 크기) · 점은 숫자 바로 아래 */
.cal-wdots { top: 0; }
.cal-wdots > .cal-dots { position: relative; padding-top: var(--cal-mark-top, 36px); }
.cal-wdots > .cal-dots.is-sel::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: var(--cal-cell-h, 48px); border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); z-index: -1; }
.cal-wpeek { display: none; bottom: 0; overflow: hidden; }   /* 큰 칸보다 긴 꼬리표는 칸 안에서 잘림(작은 폰 · 최소 64px 칸) */
.cal-wcol { display: flex; flex-direction: column; gap: 3px; min-width: 0; min-height: 0; overflow: hidden; }
.cal-wcol.is-other { opacity: .4; }
.cal-peeks { overflow: hidden; }
.cal-peeks { gap: calc(1px * var(--text-scale, 1)); padding: 0 4px; }
.cal-peek { display: flex; align-items: center; gap: 3px; min-width: 0; height: calc(14px * var(--text-scale, 1)); font-size: 0.6563rem; font-weight: 500; line-height: 1; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-align: left; }
/* 제목 칸은 늘 칸 오른쪽 끝까지(flex 1) + 흐림은 그 끝 14px에만 — 짧은 제목은 끝에 닿지 않아 처음부터 또렷, 긴 제목만 처음 그려질 때부터 흐림.
   (옛: 그린 뒤 재서 흐림을 덧씌움 → 첫 장면엔 흐림이 없다가 생기는 깜빡임 · 사용자 10-31) */
.pk-t { flex: 1 1 auto; min-width: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent); }
.cal-lane-t { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent); }
.pk-dot { flex: none; width: 5px; height: 5px; margin: 0 2px; border-radius: 50%; background: var(--c); }   /* 표식 칸 = 9px 고정(점 5 + 양옆 2) — 점 · 깃발 · 이모지 어느 것이든 제목 첫 글자가 한 세로줄에 (사용자 10-31 '글자 시작 위치가 달라 어색') */
.pk-dot.is-done { opacity: .4; }   /* 끝낸 일 = 같은 점을 흐리게 — 속 빈 고리는 앱에서 '안 한 일(빈 동그라미)'의 뜻이라 거꾸로 읽힘 · 지난 날이 빈 고리투성이면 다그치는 느낌 */
.pk-flag { flex: none; width: 9px; display: grid; place-items: center; color: var(--flag); }
.pk-flag svg { width: 9px; height: 9px; stroke-width: 2.4; }
.pk-flag svg path:last-child { fill: currentColor; }
.pk-emoji { flex: none; width: 9px; display: grid; place-items: center; font-size: 9px; line-height: 1; overflow: visible; }
.cal-peek.is-done { color: var(--ink-3); }
.cal-more { font-size: 0.625rem; font-weight: 600; color: var(--ink-3); text-align: left; padding-left: 8px; height: calc(13px * var(--text-scale, 1)); line-height: calc(13px * var(--text-scale, 1)); }
/* 기간 띠(크게 보기 · 넓은 화면) — 목록 색을 옅게 섞은 띠, 첫날은 점이 앞에 서고 마지막 날은 둥글게 닫힘 */
.cal-lanes { gap: 1px; }
.cal-lane { position: relative; display: flex; align-items: center; height: calc(13px * var(--text-scale, 1)); background: color-mix(in srgb, var(--c) 20%, transparent); min-width: 0; overflow: hidden; }
.cal-lane.is-empty { background: none; }
.cal-lane.is-start { margin-left: 1px; border-radius: 7px 0 0 7px; padding-left: 12px; }
.cal-lane.is-start::before { content: ''; position: absolute; left: 5px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--c); }   /* 꼬리의 머리 = 점 (꼬리표 점과 같은 말) */
.cal-lane.is-end { margin-right: 4px; border-radius: 0 7px 7px 0; }
.cal-lane-t { padding-left: 3px; font-size: 0.625rem; font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.cal-lane:not(.is-start) .cal-lane-t { padding-left: 16px; }
/* 띠 제목은 그 주 안 이어지는 칸까지 넓게 — 뒤 칸 띠 위에 얹힘(z-index) */
.cal-lane { overflow: visible; }
.cal-lane-t { position: absolute; z-index: 2; top: 0; bottom: 0; display: flex; align-items: center; left: 12px; width: calc(var(--run, 1) * 100% - 16px); padding-left: 3px; }
.cal-lane:not(.is-start) .cal-lane-t { left: 0; width: calc(var(--run, 1) * 100% - 4px); }
.list-row.is-lifted, .list-row.is-dragging { background: var(--surface-2); }   /* 주 첫 칸에 다시 쓰는 제목도 꼬리표 제목과 같은 세로줄 */
/* 작은 보기(아래 목록이 올라온 상태)는 기간 선 없이 점 · 중요 표시만 (사용자 10-31). 기간은 크게 보기의 띠 · 고른 날 목록 '이어지는 일'(11월 3일~7일 · n일째)에서 */
.cal-cell { height: calc(50px * var(--text-scale, 1)); }
/* 어두운 두 화면에선 띠를 조금 더 진하게(20% → 28%) — 칙칙하게 가라앉던 것 */
:root:is([data-theme="dark"], [data-theme="graphite"]) .cal-lane:not(.is-empty) { background: color-mix(in srgb, var(--c) 28%, transparent); }
@media (min-width: 1100px) {
  .screen-cal { --cal-cell-h: 104px; --cal-num-top: 6px; }
  .cal-peek { height: 16px; font-size: 0.75rem; }
  .cal-lane { height: 15px; }
  .cal-lane-t { font-size: 0.6875rem; }
  .screen-cal .cal-wpeek { display: grid; }
  .screen-cal .cal-wdots { display: none; }   /* 넓은 화면은 꼬리표 줄 앞 표식이 말함 — 숫자 아래 자리까지 두면 '중요'를 두 번 말함 (중요 표시 조수 재판정) */
  .cal-grab { display: none !important; }
}

/* 달 넘기기 — 격자 띠(지금 달 + 옆 달 유령)를 손가락 따라 옆으로. 카드 밖은 잘라 냄 */
.cal-card { overflow: hidden; padding: 2px; margin: -2px; }
.cal-track { position: relative; }
.cal-grid.is-ghost { position: absolute; top: 0; width: 100%; pointer-events: none; }
.page-head .title.is-swap { animation: title-swap 220ms var(--ease); }
@keyframes title-swap { from { opacity: .15; } }
.day-panel.is-leaving { opacity: 0; transition: opacity 120ms var(--ease); }
.day-panel.is-enter { animation: panel-in 220ms var(--ease); }
@keyframes panel-in { from { opacity: 0; transform: translateY(6px); } }

/* 달력 크게 보기 — 손잡이를 끌어 내리면 목록이 내려가고 칸이 화면 끝까지 커지며 제목이 보임 */
.cal-grab { display: flex; justify-content: center; width: 100%; padding: 9px 0 6px; touch-action: none; cursor: grab; }
.cal-grab-bar { width: 38px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink-3) 55%, transparent); transition: width var(--mid) var(--ease), background var(--fast); }
.cal-grab:active .cal-grab-bar { width: 46px; background: var(--ink-3); }
/* 큰 칸의 숫자 높이 = 작은 칸(50px 가운데 정렬: 숫자 + 틈 + 표식 자리)에서 숫자가 놓이는 높이와 같게 — 누르는 순간 큰 배치로 바뀌어도 숫자 · 고른 날 상자가 1px도 안 움직이게 (모션 점검원 2차 ④) */
/* 칸 치수 한곳: 작은 칸 48px(옛 50 — 반반에서 아래 목록이 더 보이게 · 사용자 11-01 '너무 적게 보임') · 숫자는 칸 위에서 --cal-num-top(작은 · 큰 칸 같음 → 바뀌어도 숫자가 1px도 안 움직임) · 점/글자 겹은 숫자 바로 아래 */
.screen-cal { --cal-cell-h: calc(48px * var(--text-scale, 1)); --cal-num-top: max(0px, calc((var(--cal-cell-h) - (30px * max(.9, var(--text-scale, 1)) + 3px * var(--text-scale, 1) + 11px * var(--text-scale, 1))) / 2)); --cal-mark-top: calc(var(--cal-num-top) + 30px * max(.9, var(--text-scale, 1)) + 3px * var(--text-scale, 1)); }
.screen-cal .cal-cell { height: var(--cal-cell-h); justify-content: flex-start; padding-top: var(--cal-num-top); }
.screen-cal.is-big .cal-cell { height: var(--cal-big-h, 96px); }
/* 큰 보기도 숫자 크기는 작은 보기와 같게(30px · 배율) — 전환 중 · 끝에 오늘 동그라미가 2px 커지며 튀지 않게 (모션 점검원) */
.screen-cal.is-big .cal-wpeek { display: grid; }
.screen-cal.is-big .cal-wdots { display: none; }   /* 크게 보기는 꼬리표 점 · 깃발이 같은 말을 함 — 숫자 아래 점/깃발을 또 두면 '중요'를 두 번 말함 */
/* 전체 목록 = 고른 날의 주 한 줄만 (요일 줄 아래) · 아래 창이 그 바로 밑까지 */
.screen-cal.is-list .cal-week:not(.has-sel) { display: none; }
.screen-cal.is-big .cal-cell.is-sel:not(.is-today) { background: none; box-shadow: none; }   /* 큰 보기엔 '고른 날' 상자 없음(누르면 그날로 내려감) */
.screen-cal.is-big .day-panel { display: none; }
/* 위 창 · 아래 창(휴대폰 작게 보기 · calendar.js sizePanes): 달력은 제자리, 그날 목록만 제 안에서 스크롤 — 높이는 손잡이 아래 ~ 아래 탭 윗변 (사용자 11-01) */
.screen-cal.is-panes .day-panel { height: var(--cal-pane-h, 50vh); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.screen-cal.is-panes .day-panel::-webkit-scrollbar { display: none; }
/* 아래 창 머리(날짜) = 창의 손잡이: 스크롤해도 위에 붙어 있고, 잡고 위아래로 끌면 세 단 사이를 옮김(calendar.js headDrag) */
.screen-cal.is-panes .day-head { position: sticky; top: 0; z-index: 2; background: var(--bg); touch-action: none; cursor: grab; }
/* 휴대폰: 줄 · 겹은 처음부터 늘 따로 그림 판(레이어) — 전환을 시작 · 끝낼 때 판이 생겼다 없어지며 아이폰 글자 굵기가 한 번 깜빡이던 것 (모션 점검원 A-3) */
@media (max-width: 1099px) {
  .screen-cal .cal-grid:not(.is-ghost) > .cal-week { background: var(--bg); box-shadow: 0 -2px 0 var(--bg); will-change: transform; }   /* 바탕 = 아래 줄이 위 줄의 넘친 글자를 덮음 · 그림자 = 줄 사이 2px 틈도 가림 */
  .screen-cal .cal-grid:not(.is-ghost) > .cal-week > :is(.cal-wdots, .cal-wpeek) { will-change: transform, opacity; }
}
/* ── 세 단 사이(is-morph · calendar.js beginMorph · apply) — 큰 달력 배치 위에서 줄 6개 · 손잡이 · 아래 창을 transform으로 옮김 ──
   점 겹 · 글자 겹은 둘 다 보이게 두고 진하기 · 위치를 JS가 손가락에 비례해 줌(문턱 · 전환 없음 → 손이 떨려도 번쩍이지 않음) */
.screen-cal.is-morph :is(.cal-wdots, .cal-wpeek) { display: grid; }
.screen-cal.is-morph .cal-dows { position: relative; z-index: 5; background: var(--bg); box-shadow: 0 -2px 0 var(--bg); }   /* 전체 목록 쪽: 고른 주 위의 줄들이 요일 줄 밑으로 숨음 */
.screen-cal.is-morph .cal-grab { position: relative; z-index: 3; background: var(--bg); will-change: transform; }
.screen-cal.is-morph .cal-grab::after { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 100vh; background: var(--bg); pointer-events: none; }   /* 손잡이 아래 = 아직 안 드러난 아래 줄들을 가림 */
.screen-cal.is-morph .day-panel { display: block; position: relative; z-index: 4; background: var(--bg); will-change: transform, opacity; }
/* 고른 날 상자: 휴대폰은 점 겹 안(위 .cal-wdots .is-sel — 전환 때 점과 같이 옅어짐) · 넓은 화면(점 겹 없음)은 칸 자체 */
@media (min-width: 1100px) { .cal-cell.is-sel { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); } }
.cal-cell.is-sel.is-today { background: none; box-shadow: none; }   /* 오늘 동그라미가 이미 표시 — 상자를 겹치지 않음 */
.cal-cell.is-sel .cal-num { font-weight: 700; }
.cal-cell.is-other .cal-num { color: var(--ink-3); font-weight: 500; }   /* 앞뒤 달 날짜는 흐리게 */
/* 오늘 = 옅은 주 색 면 + 진한 글자 (사용자 11-01 '너무 쨍하고 숫자가 잘 안 보임 · 다른 달에서 보면 거의 안 보임').
   밝게: 주 색 14%를 바탕에 섞은 면 + 주 색 글자를 잉크와 8:2로 (대비 5.1~5.7) · 어두운 두 화면: 중립 면 + 주 색 고리 1.5px + 주 색 글자 (5.0~7.6 — 귤색을 회색에 섞으면 밤색이라 고리로).
   앞뒤 달 칸의 오늘은 면만 반으로 — 글자는 그대로라 오히려 더 또렷 (옛: 흐린 숫자색이 오늘 숫자를 덮던 선택자 순서 문제) */
.cal-cell.is-today .cal-num, .cal-cell.is-today.is-other .cal-num { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: color-mix(in srgb, var(--accent-ink) 80%, var(--ink)); font-weight: 700; }
.cal-cell.is-today.is-other .cal-num { background: color-mix(in srgb, var(--accent) 7%, var(--bg)); }
:root:is([data-theme="dark"], [data-theme="graphite"]) .cal-cell.is-today .cal-num { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 85%, transparent); color: var(--accent-ink); }
:root:is([data-theme="dark"], [data-theme="graphite"]) .cal-cell.is-today.is-other .cal-num { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 45%, transparent); }

/* 표식 자리 = 높이 11px 고정(위에 붙임) — 점 · 깃발 · 중요 표시 어느 것이든 숫자가 위아래로 튀지 않게.
   점 = 그날 따로 정한 일이 있음 (매일 같은 잦은 반복은 세지 않음 · 한 일 · 못 한 일을 칸에 칠하지 않음 — 사용자 10-31) */
.cal-dots { display: flex; align-items: flex-start; justify-content: center; gap: 3px; height: calc(11px * var(--text-scale, 1)); overflow: visible; }
.cal-dot { width: calc(5px * var(--text-scale, 1)); height: calc(5px * var(--text-scale, 1)); margin-top: calc(1.5px * var(--text-scale, 1)); border-radius: 50%; background: var(--ink-3); }

/* ── 중요 표시 (설정 › 보기 › 중요 표시 · 사용자 11-01 '깃발이 해낸 느낌일 수도 · 5개 이상 골라 보게 · 기본은 깃발') ──
   한 칸 = 표식 하나 · 중요가 일반 점보다 먼저 · 같은 자리(11px)에 놓임. 색 --imp = 깃발 빨강을 바탕에 15% 섞어 덜 쨍하게.
   ① 깃발 ② 빨간 점(회색 점보다 1px 큼) ③ 두른 점(꽉 찬 점 + 옅은 테 — 빈 고리는 '안 한 일'이라 안 씀) ④ 밑줄(펜으로 그은 짧은 줄) ⑤ 형광펜(옅은 띠) ⑥ 별 */
:root { --imp: color-mix(in srgb, var(--flag) 85%, var(--bg)); }
.cal-imp { display: inline-flex; align-items: flex-start; gap: 1px; color: var(--flag); height: calc(11px * var(--text-scale, 1)); }
.cal-imp svg { width: calc(11px * var(--text-scale, 1)); height: calc(11px * var(--text-scale, 1)); stroke-width: 2.4; }
.cal-imp.is-star svg { width: calc(10px * var(--text-scale, 1)); height: calc(10px * var(--text-scale, 1)); }
.cal-imp.is-star { color: #B87A0E; }
:root:is([data-theme="dark"], [data-theme="graphite"]) .cal-imp.is-star { color: var(--c-yellow); }
.cal-imp-n { font-size: calc(9.5px * var(--text-scale, 1)); font-weight: 700; line-height: 1; margin-top: calc(.5px * var(--text-scale, 1)); }
.cal-imp-shape { display: block; flex: none; background: var(--imp); }
.cal-imp.is-rose .cal-imp-shape { width: calc(6px * var(--text-scale, 1)); height: calc(6px * var(--text-scale, 1)); margin-top: calc(1px * var(--text-scale, 1)); border-radius: 50%; }
.cal-imp.is-halo .cal-imp-shape { width: calc(5px * var(--text-scale, 1)); height: calc(5px * var(--text-scale, 1)); margin: calc(1.5px * var(--text-scale, 1)) 2px 0; border-radius: 50%; box-shadow: 0 0 0 calc(2px * var(--text-scale, 1)) color-mix(in srgb, var(--imp) 26%, transparent); }
.cal-imp.is-underline .cal-imp-shape { width: calc(12px * var(--text-scale, 1)); height: calc(2px * var(--text-scale, 1)); margin-top: calc(3px * var(--text-scale, 1)); border-radius: 1px; }
.cal-imp.is-highlight .cal-imp-shape { width: calc(18px * var(--text-scale, 1)); height: calc(5px * var(--text-scale, 1)); margin-top: calc(1.5px * var(--text-scale, 1)); border-radius: 2.5px; background: color-mix(in srgb, var(--imp) 32%, transparent); }
:root:is([data-theme="dark"], [data-theme="graphite"]) .cal-imp.is-highlight .cal-imp-shape { background: color-mix(in srgb, var(--imp) 44%, transparent); }
.cal-imp:not(.is-flag):not(.is-star) .cal-imp-n { color: var(--ink-2); }
.cal-cell.is-other .cal-imp { opacity: .5; }
/* 크게 보기 줄 앞 · 목록 줄 제목 끝 — 같은 표시를 작게 */
.pk-imp { flex: none; width: 9px; display: grid; place-items: center; }
.pk-imp i { display: block; background: var(--imp); }
.pk-imp.is-rose i { width: 5px; height: 5px; border-radius: 50%; }
.pk-imp.is-halo i { width: 4px; height: 4px; border-radius: 50%; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--imp) 30%, transparent); }
.pk-imp.is-underline i { width: 7px; height: 2px; border-radius: 1px; }
.pk-imp.is-highlight i { width: 9px; height: 5px; border-radius: 2px; background: color-mix(in srgb, var(--imp) 40%, transparent); }
.pk-imp.is-star { color: #B87A0E; } :root:is([data-theme="dark"], [data-theme="graphite"]) .pk-imp.is-star { color: var(--c-yellow); }
.pk-imp.is-star svg { width: 9px; height: 9px; }
.title-imp { display: inline-grid; vertical-align: middle; margin-left: 7px; transform: scale(1.35); }
.title-flag.is-star { color: #B87A0E; } :root:is([data-theme="dark"], [data-theme="graphite"]) .title-flag.is-star { color: var(--c-yellow); }

/* 하루 닫기 — 맨 아래 조용한 한 줄 */
.day-close { display: flex; justify-content: center; margin: 4px 0 8px; }
.day-close-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; color: var(--done-ink); font-weight: 650; font-size: 0.9375rem; background: color-mix(in srgb, var(--done-soft) 70%, transparent); }
.day-close-btn:active { transform: scale(.97); }
/* 오늘 한 일 — 끝낸 시각 순서로 한 장 (세로 줄 하나로 이어진 하루) */
.close-head { display: flex; align-items: center; gap: 10px; font-size: 1.125rem; font-weight: 750; margin: 2px 2px 8px; }
.close-head .day-mark { width: 22px; height: 22px; border-radius: 6px; }
.done-log { position: relative; padding: 4px 0 4px; }
.done-log-row { display: grid; grid-template-columns: 4.6rem 14px 1fr; align-items: baseline; gap: 8px; padding: 9px 2px; }
.done-log-time { color: var(--ink-3t); font-size: var(--fs-small); text-align: right; white-space: nowrap; }
.done-log-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); justify-self: center; align-self: center; }
.done-log-title { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.left-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; }
.left-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.missed-fold { margin: 6px 0 0; padding: 8px 4px; display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.day-groups > .section:first-child { margin-top: 0; }
.day-panel { margin-top: 8px; }   /* 위 손잡이가 간격을 냄 */
/* 고른 날 = 다이어리 한 장: 큰 날짜 숫자 + 옆에 두 줄(관계말 · 월 / 요일) + 아래 가는 선 (호보니치 · 미도리 결 · 플래너 감성 조수 10-31) */
.day-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.day-title { display: flex; align-items: flex-end; gap: 10px; margin: 0; font-weight: 400; }
.day-big { font-size: 2.5rem; font-weight: 700; letter-spacing: -.03em; line-height: .9; color: var(--ink); font-variant-numeric: tabular-nums; }
.day-sub { display: flex; flex-direction: column; gap: 2px; padding-bottom: 2px; }
.day-sub-1 { font-size: 0.8125rem; color: var(--ink-2); font-weight: 500; }
.day-sub-2 { font-size: 0.9375rem; color: var(--ink-2); font-weight: 600; }
.day-big.is-sun { color: var(--sun); }
.day-count { font-size: var(--fs-sub); color: var(--done-ink); font-weight: 700; white-space: nowrap; }
.day-empty { margin: 0; padding: 22px 16px; text-align: center; color: var(--ink-3t); background: var(--surface); border-radius: var(--r-card); font-size: 0.9375rem; }
.day-empty p { margin: 0; }
.day-empty .day-empty-hint { margin-top: 4px; font-size: 0.8125rem; color: var(--ink-2); }   /* 흐린 글자 + 투명도가 겹쳐 60대에게 안 보이던 것 (1호 2차 새 4) */
.add-line { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 14px; color: var(--accent-ink); font-weight: 650; font-size: 0.9688rem; }
.add-line:active { background: var(--accent-soft); }
@media (min-width: 1100px) {
  .screen-cal { max-width: 1100px; }
  .cal-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .day-panel { margin-top: 0; position: sticky; top: 20px; }
}

/* 자세히 */
.detail-sheet .sheet-head { min-height: 36px; padding-bottom: 0; }
.detail-head { display: flex; align-items: flex-start; gap: 12px; padding: 0 0 10px; }
.detail-head .check { margin-top: 2px; }
.detail-title { flex: 1; border: 0; background: none; padding: 0; resize: none; overflow: hidden; font-size: 1.3125rem; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; }
.detail-head.is-done .detail-title { color: var(--ink-2); }
.occ-line { display: flex; align-items: center; gap: 6px; margin: -2px 0 12px 42px; font-size: 0.875rem; color: var(--ink-2); }
.occ-line .text-btn { margin-left: auto; }
.detail-block { margin: 14px 0; }
.block-label { font-size: var(--fs-sub); font-weight: 700; color: var(--ink-2); padding: 0 4px 6px; }
.subs-edit { background: var(--surface); border-radius: var(--r-card); padding: 4px 6px 4px 14px; }
.sub-edit { display: flex; align-items: center; gap: 10px; min-height: 46px; }
.sub-edit + .sub-edit { border-top: 1px solid var(--line); }
.sub-edit .prop-clear { opacity: .45; } .sub-edit:focus-within .prop-clear { opacity: 1; }   /* 지우기 ×는 흐리게, 그 줄을 고칠 때만 또렷하게 (UI 채점 6차 ⑦) */
.sub-input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; font-size: max(16px, 1rem); }
.sub-input::placeholder { color: var(--ink-3); }
.sub-edit.is-done .sub-input { color: var(--ink-2); }
.sub-plus { width: 20px; display: grid; place-items: center; color: var(--ink-3); }
.props { margin-top: 14px; }
.prop-wrap { display: flex; align-items: center; background: var(--surface); }
.prop-wrap .prop { flex: 1; min-width: 0; }
.prop-wrap .prop-clear { margin-right: 8px; }
/* 하루 앞 · 뒤 ‹ › : 값 옆에 작게, 회색 면 하나로 묶어 '단추 둘'로 보이지 않게 */
.prop-step { display: flex; flex: none; margin-right: 4px; border-radius: 10px; background: var(--surface-2); }
.step-btn { width: 34px; height: 32px; display: grid; place-items: center; color: var(--ink-2); border-radius: 10px; }
.step-btn:active { background: var(--press); }
.step-btn:disabled { opacity: .35; }
.note { min-height: 84px; background: var(--surface); border-color: transparent; }
.note:focus { box-shadow: inset 0 0 0 1.5px var(--accent); border-color: transparent; }
.delete-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin: 18px 0 4px; padding: 14px; border-radius: 14px; color: var(--ink-2); font-weight: 650; font-size: 0.9375rem; }
.delete-btn:active { background: var(--press); }

/* 빠른 추가 */
.qa-sheet .sheet-head { min-height: 32px; padding-bottom: 2px; }
.qa-sheet .sheet-title { font-size: 0.9375rem; color: var(--ink-2); font-weight: 700; }
/* 빠른 추가 맨 위 '중요' — 꾹 누르기 메뉴 깃발 단추와 같은 말 · 같은 모양(빨간 테두리 + 깃발 톡) */
/* 창 머리 줄(닫기 × 와 같은 줄)에 — 따로 한 줄을 차지해 위가 휑하던 것. 목록 이름이 있으면 이름 → 중요 → ×, 없으면 중요가 왼쪽 */
.qa-sheet .sheet-title:empty { display: none; }
.qa-sheet .sheet-head .qa-flag { margin-right: auto; }
.qa-flag { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 11px; border-radius: var(--r-pill); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); font-size: var(--fs-sub); font-weight: 600; transition: box-shadow var(--fast), color var(--fast); }
.qa-flag .flag-ico { display: grid; color: var(--ink-3); transition: color var(--fast); }
.qa-flag:active { background: var(--press); }
.qa-flag.is-on { color: var(--flag); box-shadow: inset 0 0 0 1.5px var(--flag); }
.qa-flag.is-on .flag-ico { color: var(--flag); animation: flag-pop 320ms var(--ease); }
.qa-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 6px 6px 6px 16px; box-shadow: inset 0 0 0 1px var(--line); }
.qa-input { flex: 1; min-width: 0; border: 0; background: none; font-size: max(16px, 1.0938rem); min-height: 44px; padding: 0; }
.qa-input::placeholder { color: var(--ink-3); }
.qa-input:focus-visible, .sub-input:focus-visible, .detail-title:focus-visible, .field:focus-visible { outline: none; } /* 칸 테두리가 이미 포커스를 보여 줌 */
.qa-tip { margin: 10px 4px 0; font-size: 0.8438rem; color: var(--ink-2); }
.qa-send { flex: none; height: 40px; padding: 0 16px; border-radius: 10px; font-size: 0.9375rem; font-weight: 700; background: var(--accent-strong); color: var(--on-accent); transition: background var(--fast), transform var(--fast) var(--ease); }
.qa-send:active { transform: scale(.95); }
.qa-send[disabled] { background: var(--surface-2); color: var(--ink-3); }
.qa-tokens { margin-top: 10px; }
.qa-chips { margin: 12px 0 0; padding: 2px 0; flex-wrap: wrap; overflow: visible; }   /* 모든 글자 크기에서 줄바꿈 — 옆으로 밀어야 보이던 '반복 · 목록' 칩을 60대가 못 찾던 것 (새 눈 3호 5번) */
@media (min-width: 768px) and (min-height: 560px) { .qa-chips { flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; } } /* 넓은 화면은 칩 줄바꿈 (마우스로 옆 넘기기 불편) */
html[data-text="lg"] .qa-chips, html[data-text="xl"] .qa-chips { flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; } /* 글자 크게 이상은 휴대폰도 줄바꿈 — 뒤쪽 칩이 화면 밖에 숨지 않게 (2호 13번) */
@media (hover: hover) { .side-add:hover { background: var(--accent); } }
.occ-line .text-btn { color: var(--ink-2); }
.screen-settings .seg-wrap { margin: 0 0 4px; }

/* 주 색 고르기 — 위: 작은 예시(지금 고른 색으로 바로 그려짐) · 아래: 견본 4개(그 화면 색에서 실제로 보일 값) */
:root { --sw-tangerine: #F2622E; --sw-blue: #3B6EE0; --sw-green: #13875F; --sw-violet: #7A52D6; }
:root[data-theme="dark"] { --sw-tangerine: #FF8A55; --sw-blue: #5B8CFF; --sw-green: #2FB67E; --sw-violet: #9A7BFF; }
:root[data-theme="graphite"] { --sw-tangerine: #FF9466; --sw-blue: #6E9BFF; --sw-green: #3DC28A; --sw-violet: #A68BFF; }
.accent-pick { background: var(--surface); border-radius: var(--r-card); padding: 14px 14px 12px; display: grid; gap: 14px; }
.accent-sample { border-radius: 12px; background: var(--bg); padding: 10px 4px 4px; }
.accent-sample-head { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 6px 12px; }
.accent-sample-today { font-size: var(--fs-sub); font-weight: 700; color: var(--accent-ink); }
.accent-sample-plus { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.accent-sample .task { background: none; padding: 7px 10px 7px 12px; pointer-events: none; }
.accent-sample .task + .task { border-top: 1px solid var(--line); }
.accent-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.accent-swatch { min-width: 0; text-align: center; overflow-wrap: anywhere; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0 4px; border-radius: 12px; color: var(--ink-2); font-size: var(--fs-small); font-weight: 500; }

<script>window.APP_VERSION = "0.1.0 \u00b7 e9a9f153";</script>
<script>
/* 날짜 · id · 작은 도구. 날짜는 늘 'YYYY-MM-DD' 글자(기기 시간대 기준)로 다룬다. */
window.App = window.App || {};
App.util = (function () {
  'use strict';
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  /* '지금' — 평소엔 기기 시계. 자동 시험(소스/시험/)이 날짜를 옮겨 1년을 돌려 볼 때만 setNow로 바꾼다 */
  var fixedNow = null;
  function now() { return fixedNow != null ? fixedNow : Date.now(); }
  function setNow(ms) { fixedNow = ms; }

  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return ymd(new Date(now())); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); } /* b - a */
  function dow(s) { return parse(s).getDay(); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function addMonths(s, n) {
    var d = parse(s), day = d.getDate();
    var t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    t.setDate(Math.min(day, daysInMonth(t.getFullYear(), t.getMonth())));
    return ymd(t);
  }
  function monthKey(s) { return s.slice(0, 7); }
  function startOfWeek(s, weekStart) { var k = (dow(s) - weekStart + 7) % 7; return addDays(s, -k); }

  function hm(h, m) { return pad(h) + ':' + pad(m); }
  function toMin(t) { var p = t.split(':'); return (+p[0]) * 60 + (+p[1]); }
  /* 날짜 + 시간 → 기기 시각(ms) */
  function at(dateStr, timeStr) { var d = parse(dateStr); var m = toMin(timeStr || '00:00'); d.setHours(Math.floor(m / 60), m % 60, 0, 0); return d.getTime(); }

  var seq = 0;
  function uid() { seq = (seq + 1) % 1296; return Date.now().toString(36) + seq.toString(36) + Math.random().toString(36).slice(2, 7); }

  function debounce(fn, ms) { var t; return function () { var a = arguments, self = this; clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms); }; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  return { now: now, setNow: setNow, pad: pad, ymd: ymd, parse: parse, today: today, addDays: addDays, diffDays: diffDays, dow: dow,
    daysInMonth: daysInMonth, addMonths: addMonths, monthKey: monthKey, startOfWeek: startOfWeek,
    hm: hm, toMin: toMin, at: at, uid: uid, debounce: debounce, clone: clone };
})();

</script>

    { type: 'date', re: '(다음 ?주|담주|next week)(까지|에)?', fn: function (m) { return dateTok(weekOf(1, 1), m[2]); } },
    { type: 'date', re: '(다음 ?달|next month)(까지|에)?', fn: function (m) { var t = U.parse(U.today()); return dateTok(U.ymd(new Date(t.getFullYear(), t.getMonth() + 1, 1)), m[2]); } },
    /* "1일 1팩 · 1일 1식 · 1일 2잔"처럼 뒤에 '숫자 + 횟수 · 양 낱말'이 오면 날짜가 아니라 횟수 (3호 7번).
       "15일 3시 미용실 · 5일 10:00"처럼 뒤에 시간이 오는 것은 막지 않는다 (3호 재확인) */
    /* '30일 챌린지' · '3일차' · '5일째' · '3일간' · '7일 동안'은 날짜가 아니라 기간 (5호 9번). '15일 차 정비'(띄어 씀 = 자동차)는 날짜 그대로 */
    /* '부터' = 시작 날(할 날) — "11월 1일부터 5일까지 매일 약" → 1일 시작 · 매일 · 5일에 반복 끝 (사용자 10-31 '언제부터 언제까지') */
    { type: 'date', re: '(\\d{1,2})일(까지|부터|에)?(?!차|째|간|\\s*(?:챌린지|동안|다이어트|플랭크|금주|금연|습관|완성|프로그램))(?!\\s*\\d+\\s*(?:팩|식|끼|개|번|회|잔|컵|병|알|정|포|장|권|쪽|명|세트|시간|리터|km|키로|kg))', fn: function (m) { var d = dayOnly(+m[1]); return d ? dateTok(d, m[2]) : null; } },

    /* 시간 */
    { type: 'time', re: '(오전|오후|아침|낮|저녁|밤|새벽)? ?(\\d{1,2})시(?: ?(\\d{1,2})분| ?(반))?(?:에|까지)?', fn: function (m) { var h = hour(m[2], m[1]), mi = m[4] ? 30 : +(m[3] || 0); return okTime(h, mi) ? { time: U.hm(h, mi), ampmGuess: !m[1] && +m[2] >= 7 && +m[2] <= 11 } : null; } },   /* 오전 · 오후 없이 7~11시 = 짐작(빠른 추가가 지난 시각이면 오후로) */
    { type: 'time', re: '(?:at )?(\\d{1,2})(?::(\\d{2}))? ?(am|pm|a\\.m\\.|p\\.m\\.)', fn: function (m) { var h = hour(m[1], m[3][0].toLowerCase() === 'a' ? 'am' : 'pm'), mi = +(m[2] || 0); return okTime(h, mi) ? { time: U.hm(h, mi) } : null; } },
    /* "3:30 치과" = 오후 3시 반 — '3시'와 같은 규칙(1~6시는 오후). "03:30"처럼 0을 붙이면 적은 그대로 (4호 3번) */
    { type: 'time', re: '(?:at )?([01]?\\d|2[0-3]):([0-5]\\d)(?:에|까지)?', fn: function (m) { var hh = +m[1]; if (m[1].length === 1 && hh >= 1 && hh <= 6) hh += 12; return { time: U.hm(hh, +m[2]) }; } },
    { type: 'time', re: '정오|noon', fn: function () { return { time: '12:00' }; } }
  ];

  function dateTok(s, word, kind) {
    if (!s) return null;
    var w = (word || '').toLowerCase();
    if (w === 'on ') w = '';
    var isDue = /까지|by|due/.test(w);
    var r = isDue ? { due: s } : { date: s };
    if (kind) r.kind = kind;
    return r;
  }

  var COMPILED = RULES.map(function (r) { return { type: r.type, fn: r.fn, re: new RegExp(B + '(?:' + r.re + ')' + E, 'gi') }; });

  function run(text, lists, ignore) {
    ignore = ignore || [];
    var res = { title: text, date: null, time: null, due: null, repeat: null, listId: null, tokens: [] };
    var used = [];
    function free(a, b) { return used.every(function (u) { return b <= u[0] || a >= u[1]; }); }
    var lower = text.toLowerCase();
    /* 쓰는 사람이 뺀 조각(ignore = 뺀 글자들) 안에 들어가는 것은 다시 잡지 않는다 ("매주 월수금"을 빼면 "매주"도 안 잡음) */
    function ignored(a, b) {
      return ignore.some(function (ig) {
        for (var i = lower.indexOf(ig); i >= 0; i = lower.indexOf(ig, i + 1)) if (a >= i && b <= i + ig.length) return true;
        return false;
      });
    }
    function take(type, a, b, label, apply) {
      var word = text.slice(a, b);
      if (ignored(a, b)) return false;
      used.push([a, b]);
      res.tokens.push({ type: type, text: word, start: a, end: b });
      apply();
      return true;
    }
    var got = { repeat: 0, date: 0, due: 0, time: 0 };

    COMPILED.forEach(function (rule) {
      rule.re.lastIndex = 0;
      var m;
      while ((m = rule.re.exec(text))) {
        var a = m.index + m[1].length, b = m.index + m[0].length;
        if (b === m.index) { rule.re.lastIndex++; continue; }
        if (!free(a, b)) continue;
        var sub = [m[0].slice(m[1].length)].concat(m.slice(2));
        var r = rule.fn(sub);
        if (!r) continue;
        var slot = r.repeat ? 'repeat' : r.due ? 'due' : r.date ? 'date' : 'time';
        if (got[slot]) continue;
        var ok = take(slot, a, b, null, function () {
          if (r.repeat) { res.repeat = r.repeat; if (r.date && !res.date) res.date = r.date; }
          if (r.date && !r.repeat) { res.date = r.date; if (r.kind) res.dateKind = r.kind; }
          if (r.due) { res.due = r.due; if (r.kind) res.dateKind = r.kind; }
          if (r.time) { res.time = r.time; res.ampmGuess = !!r.ampmGuess; }
        });
        if (ok) got[slot] = 1;
      }
    });

    /* #목록이름 */
    if (lists && lists.length) {
      var re = /(^|\s)#(\S+)/g, mm;
      while ((mm = re.exec(text))) {
        var name = mm[2].toLowerCase(), hit = null;
        lists.forEach(function (l) { if (!hit && l.name.toLowerCase().replace(/\s/g, '') === name) hit = l; });
        if (hit && !res.listId) {
          var a2 = mm.index + mm[1].length;
          take('list', a2, a2 + mm[2].length + 1, null, function () { res.listId = hit.id; });
        }
      }
    }

    /* 제목 = 잡은 조각을 뺀 나머지 */
    used.sort(function (x, y) { return y[0] - x[0]; });
    var title = text;
    used.forEach(function (u) { title = title.slice(0, u[0]) + ' ' + title.slice(u[1]); });
    res.title = title.replace(/\s+/g, ' ').trim();
    res.tokens.sort(function (x, y) { return x.start - y.start; });
    return res;
  }

  return { run: run };
})();

</script>
<script>
/* 앞으로 울릴 알림 목록 계산 — 기기 어댑터(notify.schedule)에 그대로 넘긴다.
   기기는 할 일 규칙을 몰라도 된다: '언제 · 무슨 글'만 받는다. 형식을 바꾸면 기기 쪽(android Alarms.java · 나중의 푸시 서버)도 같이 본다.
   - 알림은 할 일마다 최대 3개(T.MAX_ALERTS · task.alerts · 사용자 11-01 '여러 개 · 기본은 없음'):
     { before: 분 } = 시간 기준 몇 분 전(0 = 정시) · { days: n, at: 'HH:MM' } = 할 날(없으면 언제까지)의 n일 전 그 시각.
   - 앞으로 60일 · 최대 1000개. 목록이 거기서 끊기면 마지막에 '앱을 한 번 열어 주세요' 알림을 하나 더 넣는다(소리 없이 끊기지 않게 · 점검원 1호 4번). */
App.reminders = (function () {
  'use strict';
  var U = App.util, T = App.tasks, Q = App.query;
  var HORIZON_DAYS = 60, MAX = 1000, MAX_ALERTS = T.MAX_ALERTS, DEFAULT_AT = '09:00';

  function alertAt(task, day, a) {
    if (a.before != null) return task.time ? U.at(day, task.time) - a.before * 60000 : null;
    if (a.at) return U.at(U.addDays(day, -(a.days || 0)), a.at);
    return null;
  }

  function upcoming(d, now) {
    now = now || U.now();
    var t = App.i18n.t, out = [], cut = false, repLast = 0;
    var start = U.ymd(new Date(now - 86400000)), end = U.addDays(U.ymd(new Date(now)), HORIZON_DAYS + 7);
    Q.live(d).forEach(function (task) {
      var alerts = Array.isArray(task.alerts) ? task.alerts : [];
      if (!alerts.length) return;
      var base = task.date || (!task.repeat && task.due) || null;
      if (!base) return;
      var days = [];
      if (task.repeat) {
        for (var s = start; s <= end; s = U.addDays(s, 1)) if (Q.occurs(task, s)) days.push(s);
        if (!task.repeat.until || task.repeat.until > end) cut = true;   /* 60일 뒤에도 이어지는 반복 */
      } else if (!task.done.once) days.push(base);
      days.forEach(function (day) {
        var key = T.keyFor(task, day);
        if (T.isDone(task, key)) return;
        alerts.forEach(function (a, i) {
          var at = alertAt(task, day, a);
          if (at == null || at <= now || at > now + HORIZON_DAYS * 86400000) return;
          out.push({ id: task.id + '|' + key + '|' + i, taskId: task.id, key: key, at: at, title: task.title, body: body(task, day, at) });
          if (task.repeat && at > repLast) repLast = at;
        });
      });
    });
    out.sort(function (a, b) { return a.at - b.at; });
    /* '앱을 열어 주세요'는 목록이 끊기는 자리 바로 뒤에: 반복이 60일에서 끊기면 마지막 반복 알림 뒤(멀리 있는 한 번짜리 알림에 밀리지 않게 · 1호 4번 재확인),
       1000개에서 끊기면 1000번째 뒤 — 둘 중 이른 쪽 */
    /* 60일 안에 알림이 하나도 없는 반복(매년 등)도 끊기는 자리에 '앱을 열어 주세요' (알림 조수 재판정 5번) */
    var keepAt = cut ? (repLast || U.at(U.addDays(U.ymd(new Date(now)), HORIZON_DAYS), DEFAULT_AT)) + 60000 : Infinity;
    if (out.length > MAX) { out = out.slice(0, MAX); keepAt = Math.min(keepAt, out[MAX - 1].at + 60000); }
    if (keepAt < Infinity && keepAt > now) {
      out.push({ id: 'keepalive', taskId: '', key: '', at: keepAt, title: t('notif.keepTitle'), body: t('notif.keepBody') });
      out.sort(function (a, b) { return a.at - b.at; });
    }
    return out;
  }

  /* 알림 글: 시간이 있으면 '오후 3:00'(그 전날 울리면 '내일 오후 3:00'), 시간 없으면 '오늘 · 내일 · 11월 5일' 할 일 */
  function body(task, day, at) {
    var t = App.i18n.t, I = App.i18n;
    var gap = U.diffDays(U.ymd(new Date(at)), day);
    if (task.time) {
      if (gap === 0) return t('notif.at', { time: I.time(task.time) });
      if (gap === 1) return t('notif.tomorrowAt', { time: I.time(task.time) });
      return t('notif.dateAt', { date: I.dateNoWeek(day), time: I.time(task.time) });
    }
    var due = !task.date && task.due;
    if (gap === 0) return due ? t('notif.dueToday') : t('notif.today');
    if (gap === 1) return due ? t('notif.dueTomorrow') : t('notif.tomorrow');
    return due ? t('notif.dueOn', { date: I.dateNoWeek(day) }) : t('notif.on', { date: I.dateNoWeek(day) });
  }

  /* 고르기 창의 칸 — 시간 있음: 정시 · 10분 · 30분 · 1시간 · 하루 전 / 시간 없음: 그날 · 전날 (시각은 사람이 바꿈 · 기본 오전 9시) */
  var BEFORE = [0, 10, 30, 60, 1440];
  function label(a) {
    var t = App.i18n.t, I = App.i18n;
    if (a.before != null) {
      var m = a.before;
      if (m === 0) return t('remind.atTime');
      if (m < 60) return t('remind.minBefore', { n: m });
      if (m < 1440 && m % 60 === 0) return t('remind.hourBefore', { n: m / 60 });
      if (m < 1440) return t('remind.minBefore', { n: m });
      return t('remind.dayBefore', { n: Math.round(m / 1440) });
    }
    var tm = I.time(a.at || DEFAULT_AT);
    if (!a.days) return t('remind.onDayAt', { time: tm });
    if (a.days === 1) return t('remind.dayBeforeAt', { time: tm });
    return t('remind.daysBeforeAt', { n: a.days, time: tm });
  }
  /* ── 알림 정하기 창(날짜 + 시각 → 확인)이 쓰는 셈 (사용자 11-01 '일반 알림 설정처럼 날짜 · 시각을 고르고 확인' · 알림 조수) ──
     저장 모양은 그대로: 고른 날짜 · 시각 → { days: 할 날 − 고른 날, at } — 할 날을 옮기면 같은 간격으로 따라감(애플 미리 알림처럼 할 일에 붙음) · 옮겨 담을 옛 데이터 없음 */
  function baseDay(task) {
    var b = task.date || (!task.repeat && task.due) || null;
    if (b && task.repeat) { var n = App.repeat.next(task.repeat, b, U.today()); if (n) b = n; }   /* 반복 = 다음 회차 기준으로 보여 줌 */
    return b;
  }
  /* 알림 하나 → 실제 날짜 · 시각(창에 채울 값) */
  function pickOf(task, a) {
    var b = baseDay(task); if (!b) return null;
    if (a.before != null) { var at = alertAt(task, b, a); if (at == null) return null; var dd = new Date(at); return { date: U.ymd(dd), time: U.hm(dd.getHours(), dd.getMinutes()) }; }
    return { date: U.addDays(b, -(a.days || 0)), time: a.at || DEFAULT_AT };
  }
  function fromPick(task, ymd, hhmm) { var b = baseDay(task); return { days: Math.max(0, U.diffDays(ymd, b)), at: hhmm }; }
  /* 반복하는 일은 '지남'이 없음(다음 회차에 울림 · 알림 조수 검토 1) — 한 번짜리만 */
  function isPast(task, a, now) { if (task.repeat) return false; var b = baseDay(task); if (!b) return false; var at = alertAt(task, b, a); return at != null && at <= (now || U.now()); }
  /* 목록 글: 한 번짜리 일 = 실제 날짜 · 시각('11월 4일 (화) 오후 8:00'), 반복 = 회차마다 같은 간격('전날 오후 8:00') · '몇 분 전'은 그대로 */
  function labelFor(task, a) {
    if (a.before != null || !task || task.repeat) return label(a);
    var p = pickOf(task, a); if (!p) return label(a);
    return App.i18n.t('remind.absAt', { date: App.i18n.dateShort(p.date), time: App.i18n.time(p.time) });
  }
  function summary(alerts, task) { return (alerts || []).map(function (a) { return labelFor(task, a) + (task && isPast(task, a) ? ' (' + App.i18n.t('remind.pastShort') + ')' : ''); }).join(' · '); }   /* 지난 알림은 '(지남)' — 울릴 것처럼 보이지 않게 (검토 5) */

  return { upcoming: upcoming, BEFORE: BEFORE, MAX_ALERTS: MAX_ALERTS, DEFAULT_AT: DEFAULT_AT, label: label, labelFor: labelFor, summary: summary, alertAt: alertAt,
    baseDay: baseDay, pickOf: pickOf, fromPick: fromPick, isPast: isPast };
})();

</script>
<script>
/* 시험판 예시 데이터 — 설정 › 시험판에서 '처음 상태' · '적당히 바쁜 사람' · '일정 많은 바쁜 사람' 셋 중 하나로 바로 바꿔 보기 + 스토어 소개 사진.
   사용자 10-31 밤: "일정 좀 차 있는 바쁜 사람 · 적당히 차 있는 사람 두 개 옵션도 추가해서 총 세 개로".
   사용자 11-01 05:4x: "예시 문구들 너무 딱딱하고 AI스러운 거 말고 시간대별 진짜 사람이 할 만한 내용이나 디테일 … '오 진짜 저렇게 쓸 만한데'" →
   예시 데이터 조수 설계(11-01): 한 사람 — 29세 화장품 회사 온라인 마케터 4년차 · 서울 혼자 삶 · 평일 9:30~18:30 · 화 · 목 저녁 필라테스 · 주말 집안일 · 친구 · 러닝.
   '바쁜 사람' = 같은 사람의 신제품 출시 + 자격증(SQLD) 시험이 겹친 달(목록 · 반복이 같아 차이가 '양'으로만 보임).
   지키는 것: 회의 · 약속은 요일에 맞춰(다음 주 월요일 W 기준 · 주말에 회의가 떨어지지 않게) · 오늘 할 일은 평일 · 토 · 일 세 벌 ·
   '이미 체크'는 지금 시각보다 앞선 일만 · 끝낸 시각은 그 일 시각 근처 · 안 한 일은 급하지 않은 것만(다그치는 느낌 없게) ·
   제목은 앞 글자로 구별되게(크게 보기 칸엔 2~3글자만 보임) · 실제 상표 · 영화 제목 없음. 출시 판에서는 시험판 묶음과 함께 뺀다 */
App.samples = (function () {
  'use strict';
  var U = App.util, T = App.tasks;

  function build(d, busy) {
    var today = U.today(), nowMs = U.now(), nowD = new Date(nowMs), nowHM = U.hm(nowD.getHours(), nowD.getMinutes());
    var dow = U.dow(today), weekend = dow === 0 || dow === 6;
    var W = U.addDays(today, ((8 - dow) % 7) || 7);              /* 다음 주 월요일 (오늘이 월요일이면 7일 뒤) */
    function wd(n) { return U.addDays(W, n); }                     /* W 기준 n일 뒤 (0 = 월, 2 = 수, 5 = 토 …) */
    var month = new Date(nowMs).getMonth(), cold = month >= 9 || month <= 2;   /* 계절 말: 10~3월 코트 · 패딩, 그 밖 셔츠 · 원피스 */
    d.settings.onboarded = true;
    var L = { work: T.addList(d, '회사', 'blue'), home: T.addList(d, '집', 'green'), gym: T.addList(d, '운동', 'violet'), meet: T.addList(d, '약속', 'pink') };
    function lid(k) { return k ? L[k].id : null; }
    function at(day, hm) { var p = U.parse(day); if (hm) p.setHours(+hm.slice(0, 2), +hm.slice(3)); else p.setHours(13, 0); return p.getTime(); }
    function passed(hm) { return !!hm && hm <= nowHM; }          /* 오늘: 시각이 지난 일만 체크된 채로 */
    function add(title, day, time, list, o) {
      o = o || {};
      var t = T.add(d, { title: title, date: day || null, time: time || null, listId: lid(list), priority: o.flag ? 3 : 0, due: o.due || null, repeat: o.repeat || null });
      if (o.note) t.note = o.note;
      if (o.subs) { t.subtasks = o.subs.map(function (s, i) { return { id: 's' + d.tasks.length + '_' + i, title: s[0] }; }); t.subDone.once = t.subtasks.filter(function (s, i) { return o.subs[i][1]; }).map(function (s) { return s.id; }); }
      if (o.done) t.done.once = o.done;
      return t;
    }

    /* ── 반복 ── */
    var start = U.addDays(today, -40);
    var sat0 = U.addDays(today, (6 - dow + 7) % 7);               /* 이번 주 토요일(오늘이 토요일이면 오늘) */
    var reps = [
      add('영양제', start, '08:00', null, { repeat: { freq: 'day', every: 1, days: [] } }),
      add('가계부', start, null, null, { repeat: { freq: 'day', every: 1, days: [] } }),
      add('몬스테라 물', U.addDays(today, -42), null, 'home', { repeat: { freq: 'day', every: 5, days: [] } }),   /* 오늘엔 안 걸리게(-42 = 5의 배수 + 2) */
      add('필라테스', start, '20:00', 'gym', { repeat: { freq: 'week', every: 1, days: [2, 4] } }),
      add('분리수거', start, null, 'home', { repeat: { freq: 'week', every: 1, days: [3] } }),
      add('이불 빨래', U.addDays(sat0, -42), null, 'home', { repeat: { freq: 'week', every: 2, days: [6] } }),
      add('월세 이체', (function () { var p = U.parse(today); p.setDate(25); p.setMonth(p.getMonth() - 1); return U.ymd(p); })(), null, 'home', { repeat: { freq: 'month', every: 1, days: [] } })
    ];
    if (busy) reps.push(
      add('전화영어', start, '07:30', null, { repeat: { freq: 'week', every: 1, days: [1, 3, 5] } }),
      add('광고 성과 체크', start, '09:40', 'work', { repeat: { freq: 'week', every: 1, days: [1, 2, 3, 4, 5] } }),
      add('주간보고 올리기', start, '16:00', 'work', { repeat: { freq: 'week', every: 1, days: [5] } }),
      add('SQLD 공부', start, '22:00', null, { repeat: { freq: 'day', every: 1, days: [] } }));
    /* 지난 날: 반복은 대부분 체크(가끔 빠짐) — 끝낸 시각은 그 일 시각 근처 */
    var r = busy ? 11 : 7; function rnd() { r = (r * 1103515245 + 12345) % 2147483648; return r / 2147483648; }
    reps.forEach(function (t) { for (var i = 1; i <= 40; i++) { var s = U.addDays(today, -i); if (App.query.occurs(t, s) && rnd() < .85) t.done[s] = at(s, t.time) + Math.floor(rnd() * 20) * 6e4; } });
    /* 오늘: 시각이 지난 반복만 체크 · 토요일 이불 빨래는 오전이 지나면 */
    reps.forEach(function (t) { if (!App.query.occurs(t, today)) return; if (passed(t.time) || (t.title === '이불 빨래' && nowHM >= '10:30')) t.done[today] = at(today, t.time || '10:30'); });

    if (!weekend) {
      todayItem('팀 회의', '10:00', 'work', { check: true });
      todayItem('우체국 등기 보내기', '12:40', null, { check: true });

    add('여행 짐 싸기', wd(10), '21:30', 'home', { subs: [['충전기', 0], ['고데기', 0], ['상비약', 0], ['렌즈', 0], ['우산', 0]] });
    add('연차', wd(11), null, 'work');
