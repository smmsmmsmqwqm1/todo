    if (busy) {
      add('판교 광고주 미팅', wd(1), '14:00', 'work');
      add('런칭 리허설', wd(3), '16:00', 'work');
      add('대학 동기 모임', wd(4), '19:30', 'meet');
      add('SQLD 시험', wd(5), '10:00', null);
      add('팀 워크숍', wd(16), null, 'work', { due: wd(17) });
      add('사촌 돌잔치', wd(20), '12:00', 'meet');
    }

    /* ── 지난 25일: 평일 · 주말 일감 (같은 일은 5일 안에 겹치지 않게 · 안 한 일은 급하지 않은 것만) ── */
    var weekday = [['팀 회의', '10:00', 'work'], ['광고 소재 넘기기', null, 'work'], ['거래처 메일 회신', null, 'work'], ['촬영 일정 잡기', null, 'work'], ['인플루언서 리스트 정리', null, 'work'],
      ['법카 영수증 정리', null, 'work'], ['성수 외부 미팅', '15:00', 'work'], ['상세페이지 문구 검수', null, 'work'], ['다이소 건전지', null, 'home'], ['세탁소 맡기기', null, 'home'],
      ['은행 OTP 재발급', '12:30', null], ['피부과', '19:00', null], ['수진이랑 저녁', '19:30', 'meet'], ['렌즈 주문', null, null], ['택배 반품 보내기', null, null], ['도서관 책 반납', null, null, 1]];
    var weekendPool = [['장보기', null, 'home'], ['냉장고 정리', null, 'home'], ['욕실 청소', null, 'home', 1], ['창틀 청소', null, 'home', 1], ['한강 러닝 5km', '08:30', 'gym'],
      ['인왕산 등산', '09:00', 'gym'], ['은지랑 영화', '19:20', 'meet'], ['혜린이 생일 선물', null, null], ['엄마랑 통화', null, null], ['사진 정리', null, null, 1]];
    if (busy) weekday = weekday.concat([['광고주 보고 메일', null, 'work'], ['소재 A/B 결과 정리', null, 'work'], ['야근 택시 영수증', null, 'work'], ['SQLD 기출 1회', null, null]]);
    var lastUsed = {};
    for (var k = 1; k <= 25; k++) {
      var day = U.addDays(today, -k), we = U.dow(day) === 0 || U.dow(day) === 6, pool = we ? weekendPool : weekday;
      var n = busy ? 1 + Math.floor(rnd() * 4) : Math.floor(rnd() * 3);   /* 바쁜 사람 하루 1~4개 · 적당한 사람 0~2개(비는 날도 있게) */
      for (var j = 0, tries = 0; j < n && tries < 20; tries++) {
        var px = pool[Math.floor(rnd() * pool.length)];
        if (lastUsed[px[0]] != null && lastUsed[px[0]] - k < 5) continue;
        lastUsed[px[0]] = k; j++;
        var undone = px[3] && rnd() < .7;                             /* '안 함' 표시가 붙은 것만 가끔 그대로 둠 */
        add(px[0], day, px[1], px[2], undone ? {} : { done: at(day, px[1]) + Math.floor(rnd() * 40) * 6e4 });
      }
    }
    return d;
  }

  return { moderate: function (d) { return build(d, false); }, busy: function (d) { return build(d, true); } };
})();

<script>

    }
  };
};

   자바는 할 일 규칙을 모른다. 받는 것: 데이터 글 · 울릴 알림 목록 · 위젯 요약. 주는 것: 위젯 · 알림에서 누른 '끝냄' 쪽지. */

            if (!nd.length) { cur = null; emptied = true; o.onPick(null); draw(body); return; }

  /* 목록 표시 하나 — 사진(동그랗게 자른 것) > 이모지 > 색 점 (화면 어디서나 같은 표시 · '나만의 표시') */
  App.listMark = function (l, cls) {

  };

  /* 사진 동그랗게 맞추기 — 카톡 프로필 사진처럼: 손가락으로 끌어 옮기고, 두 손가락 · 막대로 키우고, 동그라미 안이 그대로 저장된다.

  App.photoCrop = function (src, onDone) {

    var zoom = h('input.size-range.crop-zoom', { type: 'range', min: 1, max: 4, step: 0.01, value: 1, 'aria-label': t('photo.zoom') });

    var s = App.sheet.open({ title: t('photo.title'), content: function (body) {
      body.appendChild(stage);
      body.appendChild(h('div.size-row.crop-row', h('span.size-ga.is-sm', { html: ic('search', 14) }), zoom, h('span.size-ga.is-lg', { html: ic('search', 20) })));
      body.appendChild(h('p.crop-hint', t('photo.hint')));
      body.appendChild(h('div.pick-actions',
        h('button.btn.soft', { type: 'button', onclick: function () { s.close(true); } }, t('common.cancel')),
        h('button.btn.primary', { type: 'button', onclick: done }, t('common.done'))));
    } });

      var dw = img.naturalWidth * base * st.z, dh = img.naturalHeight * base * st.z;
      var mx = Math.max(0, (dw - S) / 2), my = Math.max(0, (dh - S) / 2);   /* 동그라미(=무대) 안이 늘 사진으로 차게 */

    img.src = src;

      if (ids.length >= 2) {
        var a = pts[ids[0]], b = pts[ids[1]], dist = Math.hypot(a.x - b.x, a.y - b.y);

  /* 사진 크게 보기 — 카톡 프로필 사진처럼 작은 동그라미를 누르면 그 자리에서 커지며 화면 가운데로 (사용자 10-31 22:5x).
     작은 동그라미 자리 → 가운데 큰 동그라미로 0.32초 · 아무 데나 누르거나 뒤로 단추 · 아래로 쓸면 원래 자리로 돌아가며 닫힘 */

  }

})();

</script>
<script>
/* 할 일 줄 누르기 · 끌어서 순서 바꾸기 (사용자 10-31 22:3x '위아래 옮기기는 필수' → 순서 조수).
   손가락: 꾹(0.48초) → 줄이 살짝 들림(진동) → 그대로 떼면 빠른 메뉴 / 들린 채 움직이면 끌기 — 아이폰 미리 알림의 '꾹 → 메뉴 또는 끌기'와 같은 손짓.
   마우스: 눌러 끌기 · 오른쪽 클릭 = 메뉴. 키보드: Alt+↑ / Alt+↓.
   끌 수 있는 것 = 같은 카드 안의 [data-drag] 줄끼리만(손 순서 묶음 · 가라앉은 끝낸 줄 · 시간 정한 줄은 빠짐).
   놓으면 o.onDrop(그 카드의 새 차례 id 배열, 옮긴 id). 손잡이 아이콘은 달지 않는다(줄마다 달면 조잡 · 휴대폰 앱들의 정석) */
App.reorder = (function () {
  'use strict';
  var HOLD = 480, MOVE_CANCEL = 8, SLOP = 10, MOUSE_SLOP = 5;
  var swallowUntil = 0, drag = null;

  /* 손을 뗀 직후 따라오는 누르기(click)를 삼킴 — 메뉴가 뜬 누름 · 끌기 뒤에 자세히 창이 또 열리지 않게 */
  function swallow(ms) { swallowUntil = Date.now() + (ms || 450); }
  function busy() { return Date.now() < swallowUntil || !!drag; }
  function dragging() { return !!drag; }

  /* ── 휴지통에 끌어 놓아 지우기 (사용자 11-01 '꾹 누른 끌기 상태에서 지울 수 있게 · 실수로 지워질 만큼 쉽지는 않게' → 지우기 조수 안) ──
     줄이 들리면 아래 가운데 + 자리가 휴지통으로 바뀐다(+가 돌며 사라지고 그 자리에 휴지통). 손가락이 휴지통 둘레에 들어가면 진동 + 휴지통이 커지고 '놓으면 지워요',
     거기서 떼면 지움(되돌리기 띠) · 벗어나면 원래대로. 순서를 못 바꾸는 줄(시간 정한 일 · 지난 날)도 휴지통 쪽으로는 끌 수 있다.
     화면 읽기 프로그램은 빠른 메뉴의 '지우기' · Delete 키를 쓴다(휴지통은 aria-hidden) */
  var trash = null, ARM_R = 72, ARM_MOVE = 24;
  function trashEl() {
    if (trash) return trash;
    trash = App.dom.h('div.trash-drop', { 'aria-hidden': 'true' },
      App.dom.h('span.trash-label', App.i18n.t('drop.release')),
      App.dom.h('span.trash-ball', { html: App.icons.svg('trash', 24) }));
    document.body.appendChild(trash);
    return trash;
  }
  function showTrash() {
    var el = trashEl(), add = document.querySelector('.tabbar .tab-add'), r = add && add.offsetParent ? add.getBoundingClientRect() : null;
    el.querySelector('.trash-label').textContent = App.i18n.t('drop.release');
    if (r) { el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = (r.top + r.height / 2) + 'px'; }
    else { el.style.left = '50%'; el.style.top = (window.innerHeight - 72) + 'px'; }   /* 넓은 화면(아래 탭 없음) = 아래 가운데 */
    el.classList.remove('is-armed');
    document.documentElement.classList.add('is-holding');
    el.classList.add('is-on');
  }
  function hideTrash() { if (!trash) return; trash.classList.remove('is-on', 'is-armed'); document.documentElement.classList.remove('is-holding'); }
  function overTrash(x, y) {
    if (!trash || !trash.classList.contains('is-on')) return false;
    var b = trash.querySelector('.trash-ball').getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    return Math.hypot(x - cx, y - cy) < ARM_R;
  }
  function trashTop() { if (!trash || !trash.classList.contains('is-on')) return Infinity; var b = trash.querySelector('.trash-ball').getBoundingClientRect(); return b.top - ARM_R / 2; }
  /* 휴지통 칸에 들어가고 나올 때 */
  function arm(on, wrap) {
    if (!trash || trash.classList.contains('is-armed') === on) return;
    trash.classList.toggle('is-armed', on);
    if (wrap) wrap.classList.toggle('is-trash', on);
    App.platform.haptic.tap();
  }

  function groupOf(card) { return card ? Array.prototype.filter.call(card.children, function (c) { return c.hasAttribute('data-drag'); }) : []; }
  function idsOf(g) { return g.map(function (w) { return w.getAttribute('data-drag'); }); }

  function bind(el, wrap, o) {
    var timer = null, x0 = 0, y0 = 0, lifted = false, touching = false, mouse = false, pid = null, free = false, armed = false;
    function canDrag() { return wrap.hasAttribute('data-drag') && groupOf(wrap.parentNode).length > 1; }
    function clearTimer() { clearTimeout(timer); timer = null; }
    function lift() {
      timer = null; lifted = true;
      wrap.classList.add('is-lifted');
      App.platform.haptic.tap();
      try { el.setPointerCapture(pid); } catch (e) {}
      if (o.onDelete) showTrash();
    }
    function drop() { lifted = false; free = false; armed = false; wrap.classList.remove('is-lifted', 'is-trash', 'is-free'); wrap.style.transform = ''; hideTrash(); }
    function menu() { swallow(); if (!o.onMenu) return; if (o.onMenu() === false && o.onTap) o.onTap(); }   /* 메뉴가 없는 줄(세부 할 일) = 들었다 놓으면 제자리 */   /* false = 열 메뉴가 없음(끝낸 반복 회차) → 자세히 창 */
    /* 손가락이 휴지통 둘레에 있나 — 들린 뒤 24px 넘게 움직였을 때만(그냥 꾹 눌렀다 떼는 손이 휴지통 위였어도 지워지지 않게) */
    function track(e) {
      if (!o.onDelete) return;
      var far = Math.hypot(e.clientX - x0, e.clientY - y0) > ARM_MOVE;
      var on = far && overTrash(e.clientX, e.clientY);
      if (on !== armed) { armed = on; arm(on, wrap); if (drag && drag.wrap === wrap) { drag.armed = on; layout(); } }
    }
    /* 휴지통에 놓음 — 메뉴 · 자세히 창으로 가는 길을 타지 않고, 뒤따르는 누르기를 먼저 삼킨 뒤 지움 */
    function trashIt() {
      swallow(900);
      if (drag && drag.wrap === wrap) cancel();
      drop();
      App.platform.haptic.success();
      o.onDelete();
    }

    el.addEventListener('pointerdown', function (e) {
      pid = e.pointerId; x0 = e.clientX; y0 = e.clientY;
      /* 마우스도 꾹(0.48초) 누르면 손가락과 같이 들림 → 떼면 메뉴 (PC에서 꾹 눌렀다 떼면 자세히 창이 열리던 것 · 사용자 10-31). 눌러서 바로 움직이면 끌기 */
      /* 누르는 순간부터 이 줄이 마우스를 붙잡음 — 아주 빠르게 휙 끌어 첫 움직임이 다른 줄 위에서 나도 이 줄이 받게 */
      if (e.pointerType === 'mouse') { if (e.button === 0) { mouse = true; try { el.setPointerCapture(pid); } catch (er) {} clearTimer(); timer = setTimeout(lift, HOLD); } return; }
      touching = true; clearTimer(); timer = setTimeout(lift, HOLD);
    });
    el.addEventListener('pointermove', function (e) {
      var dx = Math.abs(e.clientX - x0), dy = Math.abs(e.clientY - y0);
      if (drag && drag.el === el) { move(e.clientY); track(e); return; }
      if (free) { wrap.style.transform = 'translate3d(' + (e.clientX - x0) + 'px,' + (e.clientY - y0) + 'px,0)'; track(e); return; }
      if (mouse) {
        /* 끌기 기준은 '처음 누른 자리'(y0) — 움직인 뒤 자리로 잡으면 빠르게 끌 때 움직인 거리가 0이 되어 안 옮겨지던 것 */
        if (dy > MOUSE_SLOP && dy > dx && canDrag()) { clearTimer(); try { el.setPointerCapture(pid); } catch (er) {} wrap.classList.add('is-lifted'); lifted = true; if (o.onDelete) showTrash(); start(el, wrap, o, y0); move(e.clientY); }
        else if (lifted && (dx > SLOP || dy > SLOP)) goFree();
        else if (timer && (dx > MOVE_CANCEL || dy > MOVE_CANCEL)) clearTimer();
        return;
      }
      if (timer && (dx > MOVE_CANCEL || dy > MOVE_CANCEL)) clearTimer();   /* 꾹 전에 움직이면 = 화면 내리기 */
      else if (lifted && dy > SLOP && canDrag()) { start(el, wrap, o, y0); move(e.clientY); track(e); }
      else if (lifted && (dx > SLOP || dy > SLOP)) { goFree(); track(e); }
    });
    /* 순서를 못 바꾸는 줄(또는 옆으로 민 줄) = 손가락을 그대로 따라오기만 — 다른 줄은 비켜서지 않음. 휴지통에 놓을 때만 뜻이 있음 */
    function goFree() { if (!o.onDelete) return; free = true; wrap.classList.add('is-free'); }
    /* 들린 뒤에는 화면이 같이 밀리지 않게 (아이폰 사파리 · 안드로이드 웹뷰는 수동이 아닌 touchmove에서만 막을 수 있음) */
    el.addEventListener('touchmove', function (e) { if (lifted || (drag && drag.el === el)) e.preventDefault(); }, { passive: false });
    function up() {
      clearTimer();
      if (armed && o.onDelete) trashIt();
      else if (drag && drag.el === el) { end(); lifted = false; hideTrash(); }
      else if (free) { swallow(); drop(); }   /* 휴지통 밖에 놓음 = 아무 일 없이 제자리 */
      else if (lifted) { drop(); menu(); }
      touching = false; mouse = false;
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', function () { clearTimer(); if (drag && drag.el === el) cancel(); drop(); lifted = false; touching = false; mouse = false; });
    /* 오른쪽 클릭 · 메뉴 키는 바로 메뉴. 안드로이드 길게 누르기도 contextmenu를 보내지만 그때는 위의 꾹 누르기가 맡음 */
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); if (touching || drag) return; clearTimer(); menu(); });
    el.addEventListener('keydown', function (e) {
      /* 키보드: 줄을 고른 채 Delete = 지우기(되돌리기 띠) — 휴지통 끌기와 같은 결과 */
      if ((e.key === 'Delete' || e.key === 'Backspace') && o.onDelete && !e.altKey) { e.preventDefault(); o.onDelete(); return; }   /* 맥 키보드는 Delete 키가 없어 ⌫도 */
      if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') || !canDrag()) return;
      e.preventDefault(); step(wrap, e.key === 'ArrowUp' ? -1 : 1, o);
    });
  }

  /* 손을 뗀 직후 따라오는 누르기는 앱 어디에서든 삼킨다 — 휴지통 · 아래 탭 위에서 손을 떼면 그 누르기가 + · 탭 · 달력 칸으로 가던 길 (지우기 조수 ③).
     열린 창(메뉴 · 고르기) 안의 누르기는 그대로 */
  document.addEventListener('click', function (e) {
    if (busy() && !(e.target.closest && e.target.closest('.sheet, .toast'))) { e.preventDefault(); e.stopPropagation(); }   /* 띠의 '되돌리기'는 손 뗀 자리 위가 아니라 바로 눌러도 됨 */
  }, true);
  /* 들린 동안 줄이 다시 그려져 화면에서 빠지면(자정 · 다른 탭 저장 등) 그 줄은 손 뗌을 못 받는다 → 문서가 받아서 남은 끌기 · 휴지통 · 숨긴 +를 치움
     (끌기 상태가 남으면 모든 누르기가 삼켜지고 +가 숨은 채로 남던 길 · 지우기 조수 재판정 2번) */
  function sweepNow() {
    if (drag && !document.body.contains(drag.wrap)) cancel();
    if (!drag && trash && trash.classList.contains('is-on') && !document.querySelector('[data-drag].is-lifted, .task-wrap.is-lifted')) hideTrash();   /* 할 일 줄 · 세부 할 일 줄 모두 */
  }
  function sweep() { setTimeout(sweepNow, 0); }
  document.addEventListener('pointerup', sweep, true);
  document.addEventListener('pointercancel', sweep, true);
  /* 아이폰은 빠진 줄의 손 뗌이 문서까지 안 올 수 있음 → 다음에 새로 누르는 순간에도 바로 정리 (새 누름은 0.48초 전이라 들린 줄이 있을 수 없어 안전 · 지우기 조수 2차) */
  document.addEventListener('pointerdown', sweepNow, true);

  /* 끌기 — 들린 줄은 손가락을 따라가고, 지나친 줄들은 한 칸씩 비켜선다. 화면 끝에 닿으면 저절로 내림 */
  /* 줄을 담은 가장 가까운 세로 스크롤 칸(캘린더 아래 창 · 자세히 창 안) — 없으면 화면 전체. 끄는 동안 저절로 내리기 · 자리 계산이 그 칸을 따름 */
  function scrollerOf(el) {
    for (var n = el.parentElement; n && n !== document.body && n !== document.documentElement; n = n.parentElement) {
      if (n.scrollHeight > n.clientHeight + 1 && /(auto|scroll)/.test(getComputedStyle(n).overflowY)) return n;
    }
    return null;
  }
  function scrollY(sc) { return sc ? sc.scrollTop : window.scrollY; }
  function start(el, wrap, o, y) {
    var g = groupOf(wrap.parentNode), idx = g.indexOf(wrap);
    if (idx < 0) return;
    var r = g.map(function (w) { return w.getBoundingClientRect(); }), sc = scrollerOf(wrap);
    drag = { el: el, wrap: wrap, o: o, g: g, idx: idx, r: r, y0: y, y: y, sc: sc, sy0: scrollY(sc), target: idx, dy: 0,
      lo: r[0].top - r[idx].top, hi: r[g.length - 1].bottom - r[idx].bottom };
    wrap.classList.add('is-dragging');
    g.forEach(function (w) { if (w !== wrap) w.classList.add('is-shifting'); });
    document.documentElement.classList.add('is-reordering');
    drag.raf = requestAnimationFrame(tick);
  }
  function move(y) { if (!drag) return; drag.y = y; layout(); }
  function layout() {
    var d = drag, r = d.r, i = d.idx, H = r[i].height;
    var dy = Math.max(d.lo, Math.min(d.hi, d.y - d.y0 + (scrollY(d.sc) - d.sy0)));
    d.dy = dy;
    d.wrap.style.transform = 'translateY(' + dy + 'px)';
    /* 위로 끌 땐 끄는 줄의 윗변, 아래로 끌 땐 아랫변이 이웃 줄 가운데를 넘으면 자리 바꿈 — 가운데 기준은 줄 높이가 다르면 맨 끝까지 끌어도 못 넘던 것 */
    var top = r[i].top + dy, bot = top + H, target = i, j;
    if (!d.armed) {   /* 휴지통 위에 있는 동안은 다른 줄이 제자리로 — 놓으면 순서가 아니라 지우기 */
      for (j = i + 1; j < r.length; j++) if (dy > 0 && bot > r[j].top + r[j].height / 2) target = j;
      for (j = i - 1; j >= 0; j--) if (dy < 0 && top < r[j].top + r[j].height / 2) target = j;
    }
    d.g.forEach(function (w, k) {
      if (k === i) return;
      var s = k > i && k <= target ? -H : k < i && k >= target ? H : 0;
      w.style.transform = s ? 'translateY(' + s + 'px)' : '';
    });
    d.target = target;
  }
  function tick() {
    if (!drag) return;
    var y = drag.y, top = 76, bot = window.innerHeight - 112;
    if (drag.sc) { var sr = drag.sc.getBoundingClientRect(); top = Math.max(top, sr.top + 40); bot = Math.min(bot, sr.bottom - 40); }   /* 칸 안 스크롤이면 그 칸의 위아래 끝 */
    /* 아래로 저절로 내리기는 휴지통 칸 위에서는 멈춤 — 휴지통으로 가는 손이 목록을 끌어내리지 않게 */
    var v = y < top ? -(top - y) * 0.3 : (y > bot && !drag.armed && y < trashTop()) ? (y - bot) * 0.3 : 0;
    v = Math.max(-16, Math.min(16, v));
    if ((v < 0 && drag.dy > drag.lo) || (v > 0 && drag.dy < drag.hi)) { if (drag.sc) drag.sc.scrollTop += v; else window.scrollBy(0, v); layout(); }
    drag.raf = requestAnimationFrame(tick);
  }
  function clean(d) {
    cancelAnimationFrame(d.raf);
    d.g.forEach(function (w) { w.style.transform = ''; w.classList.remove('is-shifting', 'is-dragging', 'is-lifted', 'is-settling'); });
    document.documentElement.classList.remove('is-reordering');
  }
  function end() {
    var d = drag; if (!d) return;
    cancelAnimationFrame(d.raf);
    var i = d.idx, t = d.target, off = 0, k;
    if (t > i) for (k = i + 1; k <= t; k++) off += d.r[k].height;
    else for (k = t; k < i; k++) off -= d.r[k].height;
    d.wrap.classList.add('is-settling');
    d.wrap.style.transform = 'translateY(' + off + 'px)';
    swallow(600);
    setTimeout(function () {
      drag = null;
      if (t !== i) {
        var ids = idsOf(d.g), id = ids.splice(i, 1)[0];
        ids.splice(t, 0, id);
        App.platform.haptic.tap();
        d.o.onDrop(ids, id);
        App.render.now();   /* 새 순서를 먼저 그리고 나서 옛 줄을 정리 — 옛 순서가 한 프레임 비치지 않게 (모션 점검원) */
      }
      clean(d);
    }, 170);
  }
  function cancel() { var d = drag; if (!d) return; drag = null; clean(d); }

  /* 한 칸 · 맨 위로 — 빠른 메뉴 단추와 Alt+↑/↓ (끌기를 쓸 수 없는 사람 · 화면 읽기 프로그램 · 순서 조수 F-7). dir: -1 위 · 1 아래 · 'top' */
  function step(wrap, dir, o) {
    var g = groupOf(wrap && wrap.parentNode), i = g.indexOf(wrap); if (i < 0) return false;
    var j = dir === 'top' ? 0 : i + dir; if (j < 0 || j >= g.length || j === i) return false;
    var ids = idsOf(g), id = ids.splice(i, 1)[0];
    ids.splice(j, 0, id);
    o.onDrop(ids, id);
    return true;
  }
  /* 메뉴가 연 동안 화면이 다시 그려졌을 수 있어 그때그때 살아 있는 줄을 찾는다 */
  function liveWrap(k) { return document.querySelector('#main .task-wrap[data-k="' + k + '"]'); }
  function place(k) {
    var w = liveWrap(k), g = groupOf(w && w.parentNode), i = g.indexOf(w);
    return { canDrag: !!w && w.hasAttribute('data-drag') && g.length > 1, first: i === 0, last: i === g.length - 1, wrap: w };
  }

  return { bind: bind, busy: busy, dragging: dragging, swallow: swallow, step: step, place: place };
})();

</script>
<script>
/* 손짓 움직임 공용 틀 — 끌기 속도 재기 + 손을 놓은 뒤 '그 속도를 이어받아' 마저 가기 (사용자 11-01 '휙 말고 인간적 · 렉 절대 없게 · 네이버 · 구글급 · 다른 데서도 쓸 수 있는 정석 구조').
   - tracker(): 최근 80ms 표본으로 손가락 속도(px/ms). 마지막 움직임이 떼기보다 100ms 넘게 앞서면(멈췄다 뗌) 0.
   - settle(o): o.from → o.to 를 rAF로. 첫 기울기가 손가락 속도와 같도록 시간을 정함(ease-out cubic의 첫 속도 = 3 × 거리 / 시간) —
     손을 놓는 순간 손가락보다 빨리 튀어 나가던 '휙'을 없앰. 시간은 토큰 --m-settle-min ~ --m-settle-max, 속도가 없을 때(누르기) --m-settle.

     반복이 그날 일정을 묻지 않게 (TickTick 습관 · Things 묶음 사례 · 디자인 조수 5차). 끝낸 반복도 그 자리에 초록으로 남음(접지 않음) */
  /* 하루 = [일정: 시간 정한 일(반복 포함) · 시간 순 · 왼쪽 시각 열] → [할 일: 시간 없는 일 · 손 순서] → [반복: 시간 없는 반복 · 손 순서].
     규칙 한 문장: "시간 정한 일은 시간 순, 나머지는 내가 놓은 순서" (사용자 10-31 22:3x '시간 있는 애 없는 애 섞여 나열 느낌' → 순서 조수).
     이름표: 일정 묶음은 시각 열이 말하니 이름 없음, '할 일'은 일정 묶음도 있을 때만(한쪽뿐이면 이름 없음 — 줄 몇 개에 이름표는 조잡) */
  function dayGroups(items, o) {
    o = o || {};
    var timed = items.filter(function (it) { return it.task.time; }),
        loose = items.filter(function (it) { return !it.task.time && !it.task.repeat; }),
        rep = items.filter(function (it) { return it.task.repeat && !it.task.time; });
    var firstLabel = o.onceLabel || '';   /* 목록 화면: 맨 앞 묶음에 '오늘' */
    /* (되돌림) 반복 묶음에서 끝낸 것을 아래로 내리던 것은 뺐다 — 설정 '끝낸 일: 그 자리에'와 어긋나고, 체크한 자리에 다음 줄이 올라와 손이 느린 사람이 잘못 누름 (3호 5번).
       아래로 모으고 싶으면 설정 '아래로' (query.sort가 처리) */
    /* 머리에 '3/8' 같은 분수는 두지 않는다 — 끝낸 것이 아래로 초록으로 모이는 모양이 이미 진행을 보여 줌(사용자 10-31 '너무 이과적이면 거부감').
       다 했을 때만 '반복 · 다 했어요'. 다 했는지는 거르기 전 목록(o.all)으로 본다(숨기기 모드 · 2호 재확인) */
    var repAll = (o.all || items).filter(function (it) { return it.task.repeat && !it.task.time; });   /* 묶음에 있는 것(시간 없는 반복)만으로 '다 했어요' 판정 */
    var allDone = repAll.length && repAll.every(function (it) { return T.isDone(it.task, it.key); });
    var looseLabel = timed.length ? t('sec.todo') : firstLabel;
    return [
      section(firstLabel, timed, Object.assign({}, o, { dayView: true, timeCol: true })),
      section(looseLabel, loose, Object.assign({}, o, { dayView: true, manual: !o.fixed })),
      section(allDone ? t('sec.repeat') + ' · ' + t('sec.repeatAllDone') : t('sec.repeat'), rep, Object.assign({}, o, { inRepeat: true, hideList: true, manual: !o.fixed }))
    ].filter(Boolean);
  }

  /* ── 방금 체크한 줄 잠시 그 자리에 ('아래로' 기본) ──
     체크하면 hold에 넣고, 손을 3초 쉬면(누르는 중 · 화면 내리는 중 · 창이 열린 중 · 끄는 중이면 미룸) 한꺼번에 스르르 가라앉힌다.
     화면을 옮기거나 앱을 다시 열면 바로 정리 (app.js release). 여러 개를 연달아 체크하면 시계를 다시 시작해 마지막에 한 번만 움직임 (순서 조수) */
  var hold = {}, settleTimer = null, SETTLE_MS = 3000;
  function isHeld(it) { return !!hold[it.task.id + '|' + it.key]; }
  function settleSoon() { clearTimeout(settleTimer); settleTimer = setTimeout(settle, SETTLE_MS); }
  function release() { clearTimeout(settleTimer); settleTimer = null; hold = {}; }
  function settle() {
    settleTimer = null;
    if (!Object.keys(hold).length) return;
    if (document.hidden || App.sheet.count || App.reorder.dragging() || pressing) { settleSoon(); return; }
    var focusK = document.activeElement && document.activeElement.closest && document.activeElement.closest('.task-wrap');
    focusK = focusK && focusK.getAttribute('data-k');
    var focusCheck = focusK && document.activeElement.classList.contains('check');
    flip(function () { hold = {}; App.render.now(); });
    /* 화면 읽기 프로그램 · 키보드: 다시 그린 뒤 같은 줄에 초점을 돌려놓음 (맨 위로 튀지 않게) */
    if (focusK) { var w = document.querySelector('#main .task-wrap[data-k="' + focusK + '"]'); var f = w && w.querySelector(focusCheck ? '.check' : '.task-body'); if (f) try { f.focus({ preventScroll: true }); } catch (e) {} }
  }
  var pressing = false;
  document.addEventListener('pointerdown', function () { pressing = true; if (settleTimer) settleSoon(); }, true);
  document.addEventListener('pointerup', function () { pressing = false; if (settleTimer) settleSoon(); }, true);
  document.addEventListener('pointercancel', function () { pressing = false; }, true);
  window.addEventListener('scroll', function () { if (settleTimer) settleSoon(); }, { passive: true });

  /* 바꾸고 바로 그 자리에서 다시 그리며, 움직인 줄은 미끄러지고 새로 나타난 줄은 스르르 (지우기 · 되돌리기 · 숨기기 · 가라앉기 · 메뉴로 옮기기) */
  function animate(fn) { flip(function () { fn(); App.render.now(); }); }
  /* 화면을 다시 그리기 전 · 뒤 자리를 비교해 움직인 줄만 부드럽게 */
  function flip(fn) {
    var before = {};
    Array.prototype.forEach.call(document.querySelectorAll('#main .task-wrap[data-k]'), function (el) { before[el.getAttribute('data-k')] = el.getBoundingClientRect().top; });
    var had = Object.keys(before).length > 0;
    fn();
    var moved = [];
    Array.prototype.forEach.call(document.querySelectorAll('#main .task-wrap[data-k]'), function (el) {
      var b = before[el.getAttribute('data-k')];
      if (b == null) { if (had) el.classList.add('is-appear'); return; }   /* 되돌리기로 돌아온 줄 */
      var dy = b - el.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) { el.style.transform = 'translateY(' + dy + 'px)'; moved.push(el); }
    });
    if (!moved.length) return;
    void moved[0].offsetHeight;
    moved.forEach(function (el) { el.classList.add('is-flip'); el.style.transform = ''; });
    setTimeout(function () { moved.forEach(function (el) { el.classList.remove('is-flip'); }); }, 420);
  }

  /* 끌어 놓기 · 메뉴 옮기기 → 순서 저장 (한 할 일 = 한 순서 값 → 그 일이 나오는 모든 날이 같이 바뀜) */
  function dropOrder(ids, id) {
    S.commit(function (d) {
      T.reorder(d, ids, id);
      if (!d.settings.dragLearned) d.settings.dragLearned = true;
    }, { undo: true });
  }

  /* 지난 일 — 오늘 화면 · 목록 화면이 같이 쓰는 접힌 한 줄 (맨 아래 · 빨간색 없음 · 한 번에 오늘로).
     숫자는 '안 끝낸 것'만, 언제까지가 지난 일이 있으면 보조 글로 알려 줌 (점검원 1호 14 · 16번) */
  function lateFold(items, state, o) {
    if (!items.length) return null;
    var open = items.filter(function (it) { return !T.isDone(it.task, it.key); });
    if (!open.length && !state.open) return null;   /* 지난 일을 다 끝냈으면 띠를 거둠 — '아직 남았나?' 하고 또 펼쳐 보게 하던 것 (새 눈 3호 6번 · 끝낸 것은 '오늘 한 일'에 있음) */
    /* '언제까지 지남 n' 보조 글은 뺐다(숫자 줄이기 · 10-31) — 펼치면 줄마다 '지남' 표시가 이미 있음 */
    return h('section.section.late-sec',
      h('div.section-head',
        h('button.fold-btn', { type: 'button', 'aria-expanded': state.open ? 'true' : 'false', onclick: function () { state.open = !state.open; state.turn = true; App.render(); } },
          /* 접혀 있을 때는 '지난 일'만 — 매일 아침 쌓인 개수가 먼저 보이면 다그침 (감성 검토 10-31). 개수는 펼치면 단추에 */
          h('span.section-label', t('sec.overdue')),
          /* 다시 그려도 꺾쇠가 도는 게 보이게: 방금 누른 경우에만 돌기 효과 한 번 (모션 점검원) */
          h('span.fold-chev' + (state.open ? '.is-open' : '') + (state.turn ? (state.open ? '.turn-open' : '.turn-close') : ''), { html: ic('chevD', 16) })),
        /* '다 오늘로 옮기기'는 펼쳤을 때만 — 접힌 채 맨 위에 늘 떠 있으면 아침마다 재촉처럼 느껴짐 (사용자 10-31 '혼내듯 압박 X') */
        open.length && state.open ? h('button.section-action.is-quiet', { type: 'button', onclick: function () {
          S.commit(function (d) { T.moveToDay(d, open.map(function (it) { return it.task.id; }), U.today()); }, { undo: true });
          App.toast.show(t('today.movedAll', { n: open.length }), { action: t('common.undo'), onAction: S.undo });
        } }, t('today.moveAllN', { n: open.length })) : null),
      state.open ? h('div.card' + (state.turn ? '.is-unfold' : ''), items.map(function (it) { return render(it, Object.assign({ late: true }, o || {})); })) : null,
      (state.turn = false) || null,
      /* 오래 쌓인 지난 일은 '날짜 빼고 언제든으로'도 — 다 오늘로 옮기면 오늘 화면이 넘칠 때 (4호 7번 · 되돌리기 있음) */
      state.open && open.length > 1 ? h('div.late-more', h('button.text-btn.sm', { type: 'button', onclick: function () {
        S.commit(function (d) { T.clearDates(d, open.map(function (it) { return it.task.id; })); }, { undo: true });
        App.toast.show(t('today.clearedN', { n: open.length }), { action: t('common.undo'), onAction: S.undo });
      } }, t('today.clearAll'))) : null);
  }

  /* 그날 건너뛴 반복 — 흐린 한 줄 '{이름} 건너뜀 · 다시 넣기' (되돌리기 띠를 놓쳐도 되살릴 수 있게 · 4호 2번) */
  function skipped(day) {
    var list = S.data.tasks.filter(function (k) { return !k.deletedAt && k.repeat && k.skip[day]; });
    if (!list.length) return null;
    return h('div.skipped', list.map(function (k) {
      return h('div.skipped-row', h('span.skipped-title', t('row.skippedOn', { title: k.title })),
        h('button.text-btn.sm', { type: 'button', onclick: function () { S.commit(function (d) { T.unskip(d, k.id, day); }); } }, t('row.unskip')));
    }));
  }

  /* 방금 넣은 할 일을 잠깐 은은하게 — 빠른 추가 창이 닫힌 뒤 눈이 '어디 들어갔지'를 찾게 (사용자 10-31). 화면 밖이면 보이는 자리로 살짝 끌어옴 */
  var flashId = null, flashTimer = null;
  function flash(id) {
    flashId = id; clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { flashId = null; }, 1600);
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      var el = document.querySelector('.task[data-id="' + id + '"]');
      if (el && el.scrollIntoView) try { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    }); });
  }

  return { flash: flash, render: render, section: section, dayGroups: dayGroups, dueBadge: dueBadge, lateFold: lateFold, skipped: skipped, longPress: longPress,
    isHeld: isHeld, release: release, animate: animate, removeTask: removeTask, bindSub: bindSub, removeSub: removeSub, impMark: impMark, MARKS: MARKS, markStyle: markStyle };   /* longPress = 앱 어디서나 같은 꾹 누르기(0.48초 · 오른쪽 클릭) */
})();

</script>
<script>
/* 오늘 (첫 화면) — 오늘 날짜 · 오늘 한 비율 · [지난 일 · 오늘 · 언제든]. 지난 일은 빨간색 없이, 한 번에 오늘로. */
App.screens = App.screens || {};
App.screens.today = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, Q = App.query, S = App.store, ic = App.icons.svg;
  var showDone = false, lateState = { open: false }, anyOpen = false;

  /* 오늘 한 만큼 — 고리 그림 대신 사람 말 한 줄 ("3개 중 1개 했어요", 끝낸 수만 초록) · AI 티 진단 10-31 */
  function progress(done, total, allDone) {
    if (!total && !done) return null;
    if (allDone) return h('p.progress.is-full', t('today.allDoneN', { n: total }));
    if (!done) return h('p.progress', t('today.planned', { n: total }));   /* 아침: "15개 중 0개 했어요" 대신 "오늘 할 일 15개" — 빈칸 실패감 없이 (정체성 설계 10-31) */
    /* 분모 없이 '한 것'만: "3개 했어요" — 15개 중 몇 개라는 계산기 인상 대신 진전만 (사용자 10-31 '너무 이과적이면 거부감') */
    var parts = t('today.progressText').split('{done}');
    return h('p.progress', parts[0], h('b.num', String(done)), parts[1] || '');
  }

  /* 머리말 한 줄 = 문장만. 옛 '오늘 칸 색 네모'는 달력을 칠하지 않게 된 뒤(규칙 3 정정) 늘 빈 네모로 남아
     안 누른 체크 칸처럼 읽혀 뺐다 (점검원 9호 6번) */
  /* 10-31 밤 정정(사용자 '오늘 정리하기 버튼이 왜 있는지 모르겠다'): 맨 아래 '하루 닫기' 단추를 뺐다.
     '남은 일 내일로'는 다음 날 '지난 일 · 다 오늘로'와 꾹 메뉴 '내일'이 이미 하는 일이라 겹침. 남길 값어치가 있는 '오늘 한 일 한 장'은
     이미 있는 '3개 했어요'를 누르면 열리게(한 일이 있을 때만 · 작은 › 로 누를 수 있다는 걸 보임) */
  function progressRow(done, total, allDone) {
    var p = progress(done, total, allDone); if (!p) return null;
    if (!done) return h('div.progress-row', p);
    return h('button.progress-row.is-tap', { type: 'button', 'aria-label': t('today.doneTodayTitle'), onclick: closeSheet }, p, h('span.progress-chev', { html: ic('chevR', 14), 'aria-hidden': 'true' }));
  }

  function installTip(d) {
    var info = App.platform.info;
    if (!info.isIOS || info.standalone || d.settings.installTipClosed) return null;
    return h('div.banner',
      h('span', { html: ic('share', 22), style: { color: 'var(--accent-ink)' } }),
      h('div.banner-body', h('b', t('install.title')), h('br'), t('install.text')),
      h('button.icon-btn', { type: 'button', 'aria-label': t('common.close'), html: ic('x', 18), onclick: function () { S.commit(function (dd) { dd.settings.installTipClosed = true; }); } }));
  }

  function render(main) {
    var d = S.data, v = Q.todayView(d), st = d.settings, today = U.today();
    var all = v.overdue.concat(v.today, v.anytime);
    /* '했어요' = 오늘 끝낸 것 전부(지난 일 · 언제든 · 앞날 일 미리 포함) — '오늘 한 일' 창 · 오늘 네모와 같은 셈 (3호 10번 · 5호 1번).
       '다 했어요'는 오늘 칸을 다 끝냈을 때 */
    var doneN = doneLog(today).length, total = v.today.length;
    var todayAllDone = total > 0 && v.today.every(Q.done);

    var screen = h('div.screen');
    /* 머리: 작은 머리말 없이 "10월 31일 토" — 요일은 보조 색 (아래 탭이 이미 '오늘'을 말함) */
    /* 오른쪽 위 돋보기: 휴대폰에서 찾기가 목록 탭에만 숨어 있지 않게 (점검원 2호 10번) */
    screen.appendChild(h('header.page-head.is-top',
      h('div.head-main',
        h('h1.title', I.dateNoWeek(today), h('span.title-sub', I.weekday(U.dow(today)))),
        progressRow(doneN, total, todayAllDone)),
      h('div.head-actions', h('button.icon-btn', { type: 'button', 'aria-label': t('search.title'), html: ic('search', 22), onclick: App.screens.lists.search }))));

    var tip = installTip(d); if (tip) screen.appendChild(tip);

    if (!all.length) {
      screen.appendChild(h('div.empty',
        h('div.empty-mark', { html: ic('plus', 30) }),   /* 아무것도 없을 땐 '+' — 체크 그림은 '다 했어요'와 같아 헷갈렸음 (새 눈 점검원 2호 15번) */
        h('p.empty-title', t('today.emptyTitle')), h('p.empty-text', t('today.emptyText'))));
      main.appendChild(screen);
      return;
    }

    var hiddenTotal = 0;
    function part(items, late) { var r = Q.visible(late ? Q.sortLate(items) : Q.sort(items, st, App.row.isHeld), st, showDone); hiddenTotal += r.hidden; return r.items; }

    /* 시간 없는 일은 손 순서(새로 적은 일 = 맨 위 · 방금 적은 '은행 서류'가 묻히지 않게 · 1호 8번) · 지난 일은 날짜 순 */
    var late = part(v.overdue, true), now = part(v.today), anytime = part(v.anytime);
    if (!late.length && !now.length && !anytime.length) {
      screen.appendChild(h('div.empty',
        h('div.empty-mark', { html: ic('check', 30) }),
        h('p.empty-title', hiddenTotal ? t('today.hiddenTitle') : t('today.allDoneTitle')), h('p.empty-text', t('today.allDoneText'))));   /* 숨기기로 다 감춰졌으면 머리말('다 했어요')과 같은 말을 되풀이하지 않음 (점검원 10호 5번) */
    }
    /* 순서: (새벽 4시 전이면 '어제') → 지난 일(머리말 아래 접힌 띠) → 오늘 그날만의 일(시간 순) → 반복 → 언제든 → 하루 닫기 */
    /* 지난 일은 머리말 바로 아래 접힌 회색 한 줄 — 반복 8줄 아래에 묻혀 '앱을 못 믿겠다'가 되지 않게 (빨강 · 펼침 없이 · UI 채점 6차 ①) */
    /* 새벽 4시 전에는 어제 일을 접지 않고 '어제' 묶음으로 펼쳐 둔다 — 자정을 넘겨 정리하던 일이 0시에 접힌 '지난 일' 속으로 사라지지 않게 (6호 2번).
       하루 경계는 바꾸지 않는다(자정 = 새 날짜). 정리 창도 같은 4시 기준('어제 정리하기') */
    if (new Date(U.now()).getHours() < 4) {
      var yd = U.addDays(today, -1);
      var isY = function (it) { return it.task.date === yd || (!it.task.date && it.task.due === yd); };
      late = late.filter(function (it) { return !isY(it); });
      /* 어제 칸 전체(끝낸 일 · 어제 반복 포함) — 0시에 반복 · 끝낸 일만 빠져 화면이 반쯤 바뀌지 않게 (6호 재확인 2번). 체크는 어제 회차에 */

      /* 할 일 줄과 같은 손짓: 꾹 → 들림 → 떼면 목록 '…' 창 · 움직이면 끌어서 목록 순서 바꾸기 (점검원 9호 7번 '목록 순서를 바꿀 길이 없음') */
      App.reorder.bind(row, row, { onMenu: function () { more(l); }, onTap: function () { App.go('list', l.id); }, onDrop: function (ids) {
        S.commit(function (dd) { ids.forEach(function (id, i) { T.updateList(dd, id, { order: i }); }); }, { undo: true });
      } });
      rows.push(row);
    });
    screen.appendChild(h('div.card', rows));

    var names = lists.map(function (l) { return l.name; });
    var sugg = t('lists.suggest').split(',').filter(function (s) { return names.indexOf(s) < 0; });
    /* 예시 목록: 하나를 눌러 만들어도 나머지는 그대로 남는다 — 눌렀더니 다 사라져 '어디 갔지' 하던 것 (사용자 10-31).
       목록을 한 번이라도 지운 사람에게는 더 보이지 않는다 — 일부러 안 쓰기로 한 사람을 재촉하지 않게 (4호 10번) */
    if (!S.data.settings.listSuggestOff && sugg.length) {
      screen.appendChild(h('section.section.mt-l',
        /* 오른쪽 작은 × = 예시 닫기(되돌리기 띠) — 셋을 다 만들지 않아도 치울 수 있게 */
        h('div.section-head', h('span.section-label', t('lists.suggestLabel')),
          h('button.section-action.suggest-x', { type: 'button', 'aria-label': t('lists.suggestHide'), html: ic('x', 16), onclick: function () {
            S.commit(function (dd) { dd.settings.listSuggestOff = true; }, { undo: true });
            App.toast.show(t('lists.suggestHidden'), { action: t('common.undo'), onAction: S.undo });
          } })),
        h('div.chips.wrap', sugg.map(function (s) { return h('button.chip', { type: 'button', onclick: function () { create(s, true); } }, h('span', { html: ic('plus', 16) }), s); })),
        h('p.hint', t('lists.hint'))));
    }
    main.appendChild(screen);
  }

  /* 찾기 — 제목 · 메모 · 세부 할 일 (끝낸 일 포함). "그 보고서 언제 했지?"를 달력 넘기지 않고 (점검원 1호 13번) */
  function search() {
    var input = h('input.field.search-input', { type: 'search', placeholder: t('search.ph'), enterkeyhint: 'search', 'aria-label': t('search.title') });
    var box = h('div.search-results'), off = null;
    function draw() {
      App.dom.clear(box);
      var q = input.value.trim(); if (!q) return;
      var items = Q.search(S.data, q);
      box.appendChild(items.length ? h('div.card', items.map(function (it) { return App.row.render(it, { showDay: true }); })) : h('p.day-empty', t('search.none')));
    }
    var s = App.sheet.open({ title: t('search.title'), focus: input, content: function (body) { body.appendChild(input); body.appendChild(box); },
      onClose: function () { if (off) off(); } });
    input.addEventListener('input', App.util.debounce(draw, 120));
    off = App.bus.on('change', function () { if (!s.closed) draw(); });
  }

  function more(l) {
    var s = App.sheet.open({ title: l.name, content: function (body) {
      body.appendChild(P.opt(t('list.rename'), null, false, function () {
        s.close(true);
        P.text({ title: t('list.rename'), value: l.name, onDone: function (v) { S.commit(function (d) { T.updateList(d, l.id, { name: v }); }); } });
      }));
      body.appendChild(h('p.pick-label', { text: t('list.color') }));
      var acc = S.data.settings.accent;   /* 주 색(체크 색)과 같은 계열의 목록 색은 흐리게 + 한 줄 알림 — 막지는 않음 (점검원 9호 5번 · 선택지 점검원 1번 · 규칙 5) */
      body.appendChild(h('div.swatches', M.LIST_COLORS.map(function (c) {
        return h('button.swatch.bg-' + c + (c === l.color ? '.is-on' : '') + (c === acc ? '.is-accent' : ''), { type: 'button', 'aria-label': t('color.' + c), 'aria-pressed': c === l.color ? 'true' : 'false',
          /* 창을 닫지 않고 그 자리에서 바뀜 — 색을 몇 개 비교하거나 색 · 표시를 같이 바꿀 때 매번 다시 열던 것 (새 눈 3호 4번 · 설정 '주 색'과 같은 동작) */
          html: c === l.color ? ic('check', 18) : '', onclick: function (e) {
            var me = e.currentTarget; S.commit(function (d) { T.updateList(d, l.id, { color: c }); }); App.platform.haptic.tap();
            [].forEach.call(me.parentNode.children, function (b) { var on = b === me; b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.innerHTML = on ? ic('check', 18) : ''; });
            var dot = body.querySelector('.emoji-opt .list-dot'); if (dot) dot.className = 'list-dot c-' + c;
          } });
      })));
      if (M.LIST_COLORS.indexOf(acc) >= 0) body.appendChild(h('p.pick-note', t('list.accentSame', { color: t('color.' + acc) })));
      /* 표시 — 색 점 대신 이모지 하나 (나만의 표시 · 커스텀 범위 조수 10-31). 기본은 색 점, 원하는 사람만 이 창에서 고름 */
      /* 무난하게 많이 쓰는 구분용만 12개 — 너무 많으면 고르기가 일이 됨 (사용자 10-31 '튀지 않고 모나지 않게 · 난잡하지 않게') */
      /* ⭐ → 📝: 별은 '중요(깃발)'와 뜻이 겹침 (선택지 점검원 10-31 · 규칙 5) */
      var EMO = ['🏠', '💼', '💪', '📚', '🛒', '✈️', '💊', '💄', '🐶', '💰', '💕', '📝'];
      /* 표시도 그 자리에서 바뀜(창 안 닫음) — 누른 단추에 '고름' 표시만 옮김 (새 눈 3호 4번) */
      function setEmoji(v, me) {
        S.commit(function (d) { T.updateList(d, l.id, { emoji: v || null, photo: null }); }); App.platform.haptic.tap();
        [].forEach.call(body.querySelectorAll('.emoji-opt'), function (b) { b.classList.toggle('is-on', b === me); });
      }
      body.appendChild(h('p.pick-label', { text: t('list.mark') }));
      body.appendChild(h('div.emoji-row', [h('button.emoji-opt' + (!l.emoji && !l.photo ? '.is-on' : ''), { type: 'button', 'aria-label': t('list.markDot'), onclick: function (ev) { setEmoji(null, ev.currentTarget); } }, h('span.list-dot.c-' + l.color)),
        /* 사진 — 앨범에서 한 장 → 동그랗게 맞추기 (예: 연인과의 약속 목록에 그 사람 얼굴). 맞춘 사진은 '내 사진'으로 남아 다른 목록에도 바로 고름 */
        h('button.emoji-opt.is-photo', { type: 'button', 'aria-label': t('list.markPhoto'), onclick: function () {
          s.close(true);
          App.platform.files.pickImage && App.platform.files.pickImage().then(function (src) {
            if (!src) return;
            App.photoCrop(src, function (out) {
              S.commit(function (d) {
                T.updateList(d, l.id, { photo: out, emoji: null });
                /* 내 사진: 새것이 앞, 많아야 6장 — 끝없이 늘지 않게 (사용자 10-31 '미친 듯이 늘어나는 구조 말고') */
                d.settings.myPhotos = [out].concat((d.settings.myPhotos || []).filter(function (p) { return p !== out; })).slice(0, 6);
              });
            });
          });
        } }, h('span', { html: ic('camera', 18) }))]
        /* 내 사진 칸 — 누르면 이 목록 표시로 · 꾹 누르면 '내 사진에서 빼기'(이미 쓰는 목록은 그대로) */
        .concat((S.data.settings.myPhotos || []).map(function (p) {
          var b = h('button.emoji-opt.is-mine' + (l.photo === p ? '.is-on' : ''), { type: 'button', 'aria-label': t('list.myPhoto'), onclick: function () {
            if (Date.now() < b._held) return;
            S.commit(function (d) { T.updateList(d, l.id, { photo: p, emoji: null }); }); App.platform.haptic.tap();
            [].forEach.call(body.querySelectorAll('.emoji-opt'), function (x) { x.classList.toggle('is-on', x === b); });   /* 그 자리에서 바뀜 (3호 4번) */
          } }, h('img.list-photo', { src: p, alt: '' }));
          App.row.longPress(b, function () {
            b._held = Date.now() + 600;
            P.confirm({ title: t('list.myPhotoDelQ'), text: t('list.myPhotoDelText'), ok: t('list.myPhotoDel'), onOk: function () {
              S.commit(function (d) { d.settings.myPhotos = (d.settings.myPhotos || []).filter(function (x) { return x !== p; }); }, { undo: true });
              App.toast.show(t('list.myPhotoDeleted'), { action: t('common.undo'), onAction: S.undo });
            } });
          });
          return b;
        }))));
      /* 이모지는 따로 한 줄 — 색 · 사진 · 이모지가 한 줄에 최대 21칸 몰려 조잡하던 것 (선택지 점검원) */
      body.appendChild(h('div.emoji-row', [].concat(EMO.map(function (e) { return h('button.emoji-opt' + (l.emoji === e && !l.photo ? '.is-on' : ''), { type: 'button', onclick: function (ev) { setEmoji(e, ev.currentTarget); } }, e); }))
        .concat(h('button.emoji-opt.is-type', { type: 'button', 'aria-label': t('list.markType'), onclick: function () {
          s.close(true);
          P.text({ title: t('list.markType'), placeholder: '🌷', value: l.emoji && EMO.indexOf(l.emoji) < 0 ? l.emoji : '', onDone: function (v) {
            /* 글자 하나(이모지 하나)만 — 여러 글자를 넣어도 첫 글자만 표시로 */
            var first = window.Intl && Intl.Segmenter ? (new Intl.Segmenter().segment(v)[Symbol.iterator]().next().value || {}).segment : Array.from(v)[0];
            S.commit(function (d) { T.updateList(d, l.id, { emoji: first || null, photo: null }); });
          } });
        } }, h('span', { html: ic('plus', 16) })))));
      /* 맨 아래 흐린 지우기 — 할 일 줄 메뉴와 같은 모양(menu-delete · 휴지통 아이콘) */
      body.appendChild(h('button.menu-delete', { type: 'button', onclick: function () {
        s.close(true);
        P.confirm({ title: t('list.deleteQ', { name: l.name }), text: t('list.deleteText'), ok: t('list.delete'), onOk: function () {
          S.commit(function (d) { T.removeList(d, l.id); d.settings.listSuggestOff = true; }, { undo: true });
          App.go('lists');
          App.toast.show(t('list.deleted'), { action: t('common.undo'), onAction: S.undo });
        } });
      } }, h('span', { html: ic('trash', 18) }), t('list.delete')));
    } });
  }

  /* 목록 화면 머리의 표시 — 사진이면 프로필처럼 크게(56px) · 누르면 크게 보기 (사용자 10-31 22:5x '얼굴 넣어 봤는데 만족될 정도로 사이즈가 안 나옴 ·
     다 같이 키우면 할머니 폰 · 카톡 프로필 누르면 확대되듯'). 목록 줄 · 할 일 줄의 작은 표시는 그대로라 화면 균형은 그대로 */
  function listHeadMark(l) {
    if (!l.photo) return App.listMark(l, '.lg');
    var img = App.listMark(l, '.lg.is-head');
    return h('button.list-head-photo', { type: 'button', 'aria-label': t('photo.view'), onclick: function (e) { App.photoView(l.photo, e.currentTarget.querySelector('img')); } }, img);   /* 누른 그때 살아 있는 사진 자리에서 커짐 */
  }

  function single(main, id) {
    var d = S.data, l = T.list(d, id);
    if (!l) { App.go('lists'); return; }
    var v = Q.listView(d, id), st = d.settings, screen = h('div.screen');
    screen.appendChild(h('header.page-head',
      h('div',
        h('button.back-btn', { type: 'button', onclick: function () { App.go('lists'); } }, h('span', { html: ic('chevL', 18) }), t('nav.lists')),
        h('h1.title.list-title', listHeadMark(l), l.name)),
      h('div.head-actions', h('button.icon-btn', { type: 'button', 'aria-label': t('list.more'), html: ic('more', 22), onclick: function () { more(l); } }))));

    var any = v.overdue.length + v.today.length + v.anytime.length + v.upcoming.length + v.history.length;
    if (!any) {
      screen.appendChild(h('div.empty', (l.photo || l.emoji ? h('div.empty-mark', App.listMark(l, '.lg')) : h('div.empty-mark', { html: ic('lists', 28), style: { color: 'var(--c-' + l.color + ')' } })),
        h('p.empty-title', t('list.emptyTitle')), h('p.empty-text', t('list.emptyText'))));
      main.appendChild(screen); return;
    }
    /* 오늘 화면과 같은 배치: 지난 일(머리 바로 아래 접힌 한 줄) → 오늘(그날만의 일 → 반복 묶음) → 다가오는 일 → 언제든 · 숨기기 모드면 '끝낸 일 보기' (점검원 1호 14번 · 3호 12번) */
    var o = { hideList: true }, hidden = 0;
    lateStates[id] = lateStates[id] || { open: false };
    function part(items, late) { var r = Q.visible(late ? Q.sortLate(items) : Q.sort(items, st, App.row.isHeld), st, !!showDoneFor[id]); hidden += r.hidden; return r.items; }
    /* 빈 묶음은 section이 null을 돌려준다 → 붙이지 않음 (배치 점검에서 잡힌 오류 · 10-31) */
    function add(x) { if (x) screen.appendChild(x); }
    add(App.row.lateFold(part(v.overdue, true), lateStates[id], o));
    App.row.dayGroups(part(v.today), Object.assign({ all: v.today, onceLabel: t('sec.today') }, o)).forEach(add);
    add(App.row.section(t('sec.upcoming'), v.upcoming, Object.assign({ showDay: true }, o)));   /* 다가오는 일 = 날짜 순(끌기 없음) */
    add(App.row.section(t('sec.anytime'), part(v.anytime), Object.assign({ manual: true }, o)));
    if (hidden || (showDoneFor[id] && st.doneMode === 'hide')) {
      screen.appendChild(h('button.show-done', { type: 'button', onclick: function () { showDoneFor[id] = !showDoneFor[id]; App.render(); } },
        showDoneFor[id] ? t('done.hide') : t('done.show', { n: hidden })));
    }
    if (v.history.length) {
      var open = !!showHistory[id];
      screen.appendChild(h('button.show-done', { type: 'button', onclick: function () { showHistory[id] = !open; App.render(); } },
        open ? t('list.historyHide') : t('list.history', { n: v.history.length })));
      /* 100개씩 보여 주고 '더 보기' — 1년 기록이 100개에서 말없이 잘리던 것 (새 눈 3호 3번) */
      var lim = typeof showHistory[id] === 'number' ? showHistory[id] : 100;
      if (open) {
        add(App.row.section(t('sec.history'), v.history.slice(0, lim), Object.assign({ showDay: true }, o)));
        if (v.history.length > lim) screen.appendChild(h('button.show-done', { type: 'button', onclick: function () { showHistory[id] = lim + 100; App.render(); } }, t('list.historyMore', { n: Math.min(100, v.history.length - lim) })));
      }
    }
    main.appendChild(screen);
  }

  return { overview: overview, single: single, search: search, more: more };
})();

</script>
<script>
/* 할 일 자세히 — 고치면 바로 저장(저장 단추 없음). 세부 할 일 · 날짜 · 시간 · 알림 · 반복 · 언제까지 · 중요도 · 목록 · 메모 · 지우기.
   비어 있는 칸은 흐린 '추가'로만 보이고, 넣은 칸만 진하게 — 기본값으로 화면을 채우지 않는다. */
App.detail = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, S = App.store, P = App.pickers, ic = App.icons.svg;

  function open(id, key) {
    var task = T.find(S.data, id); if (!task) return;
    /* 체크 열쇠는 그릴 때마다 다시 정한다 (창 안에서 반복을 켜고 끄면 열쇠가 'once' ↔ 날짜로 바뀜) */
    var day = key && key !== 'once' ? key : U.today();
    key = T.keyFor(task, day);
    var props = h('div.card.props'), subsBox = h('div.subs-edit'), headBox = h('div');
    var title = h('textarea.detail-title', { rows: 1, 'aria-label': t('detail.titleLabel'), enterkeyhint: 'done', maxlength: 300 });
    title.value = task.title;
    var note = h('textarea.field.note', { rows: 3, placeholder: t('prop.notePh'), 'aria-label': t('prop.note') });
    note.value = task.note || '';

    function cur() { return T.find(S.data, id); }
    function set(patch) { S.commit(function (d) { T.update(d, id, patch); }); draw(); }
    /* '날짜를 뺐어요' · '시간을 뺐어요' — 받침에 맞는 을/를 (1호 2차: 조사 없이 '날짜 뺐어요'가 툭 끊겨 읽힘) */
    function objOf(w) {
      if (I.lang !== 'ko' || !w) return w;
      var c = w.charCodeAt(w.length - 1);
      return c < 0xAC00 || c > 0xD7A3 ? w + '을(를)' : w + ((c - 0xAC00) % 28 ? '을' : '를');
    }
    /* 줄 끝 ×로 뺄 때는 되돌리기 띠 — 줄을 누르려다 ×를 누른 사람이 소리 없이 값을 잃지 않게 (6호 5번) */
    function clear(patch, label) {
      S.commit(function (d) { T.update(d, id, patch); }, { undo: true }); draw();
      App.toast.show(t('detail.cleared', { what: objOf(label) }), { action: t('common.undo'), onAction: function () { S.undo(); draw(); } });
    }

    var sheet = App.sheet.open({ className: 'detail-sheet', title: '', content: function (body) {
      body.appendChild(headBox);
      /* 세부 할 일이 없으면 날짜 · 시간 아래로 — 대부분의 일엔 세부가 없는데 빈 입력 칸이 날짜보다 먼저 보이던 것 (새 눈 점검원 1호 5번).
         자리는 창을 열 때 한 번만 정함(쓰는 도중 첫 세부를 넣었다고 묶음이 위로 뛰지 않게) */
      var subsSec = h('section.detail-block', h('div.block-label', t('prop.subtasks')), subsBox);
      if (task.subtasks && task.subtasks.length) { body.appendChild(subsSec); body.appendChild(props); }
      else { body.appendChild(props); body.appendChild(subsSec); }
      body.appendChild(h('section.detail-block', h('div.block-label', t('prop.note')), note));
      body.appendChild(h('button.delete-btn', { type: 'button', onclick: remove }, h('span', { html: ic('trash', 18) }), t('detail.delete')));
    } });

    /* 글은 치는 동안 0.5초마다 저장 — 칸에서 안 나가고 앱을 닫아도 잃지 않게 (점검원 1호 3번) */
    function saveTitle() {
      var v = title.value.replace(/\s+/g, ' ').trim();
      if (v && cur() && v !== cur().title) S.commit(function (d) { T.update(d, id, { title: v }); }, { keepUndo: true, carry: true });
    }
    function saveNote() { if (cur() && note.value !== (cur().note || '')) S.commit(function (d) { T.update(d, id, { note: note.value }); }, { keepUndo: true, carry: true }); }
    var titleSoon = U.debounce(saveTitle, 500), noteSoon = U.debounce(saveNote, 500);
    title.addEventListener('input', function () { App.dom.autosize(title); titleSoon(); });
    title.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); title.blur(); } });
    title.addEventListener('blur', function () { if (!title.value.trim() && cur()) title.value = cur().title; saveTitle(); });
    note.addEventListener('blur', saveNote);
    note.addEventListener('input', function () { App.dom.autosize(note); noteSoon(); });

    function drawHead() {
      var tk = cur(), done = T.isDone(tk, key);
      var check = h('button.check.lg' + (done ? '.is-on' : ''), { type: 'button', role: 'checkbox', 'aria-checked': done ? 'true' : 'false', 'aria-label': t('detail.check'), html: App.icons.CHECK });
      check.addEventListener('click', function () {
        var will = !check.classList.contains('is-on');
        check.classList.toggle('is-on', will); if (will) App.platform.haptic.success(); else App.platform.haptic.tap();
        setTimeout(function () { S.commit(function (d) { T.toggle(d, id, key); }); draw(); }, 200);

      }
      /* '중요' = 켜기/끄기 스위치 한 줄 — › 가 붙어 다른 창이 열릴 것처럼 보이던 것 (점검원 9호 13번). 누르면 바로 바뀜 · 깃발 빨강 */

          onclick: function () { set({ priority: fOn ? 0 : 3 }); App.platform.haptic.tap(); } },
        h('span.prop-icon', { html: ic('flag', 20) }), h('span.prop-label', t('prio.on')), h('span.mini-switch', { 'aria-hidden': 'true' }))));
      var l = tk.listId && T.list(d, tk.listId);

    }

    function draw() {
      if (!cur() || cur().deletedAt) { sheet.close(true); return; }
      if (cur().repeat && !App.query.showsOn(cur(), day)) day = App.repeat.next(cur().repeat, cur().date, U.today()) || day;
      key = T.keyFor(cur(), day);
      drawHead(); drawSubs(); drawProps();
    }

    function hasPast(tk) { return T.hasPast(tk, U.today()); }
    function turnOff() {
      var r = null;
      S.commit(function (d) { r = T.turnOffRepeat(d, id, U.today()); }, { undo: true });
      draw();

    }
    /* 지우기: 앱 어디서나 같은 한 흐름(App.row.removeTask) — 반복이면 '반복 그만하기(기록 남김) / 기록까지 지우기' (점검원 1호 2번).
       지우면 이 창을 닫고, 반복 그만하기면 창을 그대로 두고 다시 그림 */
    function remove() {
      var tk = cur(); if (!tk) return;
      App.row.removeTask(tk, key, { onDeleted: function () { sheet.close(true); }, onEnded: draw });
    }

    draw();
  }

  return { open: open };
})();

</script>
<script>
/* 빠른 추가 — + 한 번 → 입력 칸이 바로 열림 → 적고 엔터 → 창이 닫히고 띠 '추가했어요 · … [하나 더]' (10-31 사용자: 넣은 뒤 창이 남아 어색).
   '이어서 쓰기'를 켜 둔 사람만 창이 열린 채 같은 칩 세팅으로 다음 할 일.
   "내일 3시 병원"처럼 적으면 날짜 · 시간이 칩으로 잡히고, 칩의 ×로 바로 뺄 수 있다. 칩을 누르면 직접 고를 수도 있다. */
App.quickadd = (function () {
  'use strict';
  var h = App.dom.h, I = App.i18n, t = I.t, U = App.util, T = App.tasks, S = App.store, P = App.pickers, ic = App.icons.svg;

  /* 적다 만 글 — 바깥 누르기 · 아래로 끌기 · 뒤로 · Esc로 닫아도 사라지지 않고 다음 +에 그대로 (새 눈 점검원 1호 1번 · 헛수고 없게).
     넣으면 · 칸을 비우고 닫으면 지움. 한 시간이 지나면 버림(어제 적다 만 글이 오늘 불쑥 나오지 않게) */
  var draft = null;
  function open(preset) {
    preset = preset || {};
    if (draft && Date.now() - draft.at >= 36e5) draft = null;
    if (draft) { preset = draft.preset; if (preset.soft && preset.date && preset.date !== U.today()) preset = Object.assign({}, preset, { date: U.today() }); }   /* 자정을 넘겨 다시 열면 '오늘'(미리 채운 날)은 새 오늘로 — 어제 날짜로 들어가 바로 '지난 일'이 되지 않게 (1호 3차) */   /* 적던 곳(그날 · 그 목록) 그대로 — 다른 화면의 +로 열어도 글과 미리 채움이 따로 놀지 않게 (1호 2차 새 3) */
    var ignore = [], man = {}, mem = {}, parsed = null, sent = false;   /* mem = ×로 끈 칩의 값(다시 켜면 돌아옴) */
    var input = h('input.qa-input', { type: 'text', placeholder: t('qa.placeholder'), enterkeyhint: 'send', autocomplete: 'off', 'aria-label': t('qa.placeholder'), maxlength: 300 });
    var send = h('button.qa-send', { type: 'button', disabled: true }, t('qa.add'));  /* '→' 대신 글자 '추가' — 채팅 입력창처럼 안 보이게 */
    var chips = h('div.chips.qa-chips');
    var hint = h('p.qa-hint', { hidden: true });
    var tip = h('p.qa-tip', t('qa.tip'));  /* 비어 있을 때만: 날짜 · 시간은 그냥 적어도 된다는 것을 알려 줌 */
    var last = h('p.qa-last', { hidden: true });
    /* 이어서 쓰기 — 작은 켜기 하나(기본 꺼짐 · 켜면 기억). 장 보기 목록처럼 여러 개를 연달아 넣을 때만 */
    var keep = h('button.qa-keep', { type: 'button', role: 'switch', onmousedown: function (e) { e.preventDefault(); }, onclick: function () {
      var v = !S.data.settings.qaKeep;   /* 값을 바깥에서 정해 넘김 — carry로 두 번 돌아도 같은 값(뒤집기를 두 번 하면 반대가 되던 것 · 새 눈 8호 7번) */
      S.commit(function (d) { d.settings.qaKeep = v; }, { keepUndo: true, carry: true }); paintKeep(); refocus();
    } }, h('span.qa-keep-box', { html: App.icons.CHECK }), t('qa.keep'));
    function paintKeep() { var on = !!S.data.settings.qaKeep; keep.classList.toggle('is-on', on); keep.setAttribute('aria-checked', on ? 'true' : 'false'); }
    paintKeep();
    /* '중요' = 입력 칸 위 따로 한 줄(사용자 10-31 22:5x '뒤쪽 칩 끝에 있으면 있는 줄 모르는 사람도 · 위에 따로 빼 두는 게 낫지 않을까').
       꾹 누르기 메뉴의 깃발 단추와 같은 모양 · 같은 동작(누르면 바로 켜고 끔 · 깃발이 톡) — 하나의 개념 = 하나의 표현 */
    var flagBtn = h('button.qa-flag', { type: 'button', onmousedown: function (e) { e.preventDefault(); }, onclick: function () {
      man.priority = val('priority') ? 0 : 3; App.platform.haptic.tap(); draw(); refocus();
    } }, h('span.flag-ico', { html: ic('flag', 18) }), h('span', t('prio.on')));

    var sheet = App.sheet.open({ className: 'qa-sheet', head: flagBtn, title: preset.listId ? (T.list(S.data, preset.listId) || {}).name : '', focus: input, content: function (body) {
      body.appendChild(h('div.qa-row', input, send));
      body.appendChild(tip);
      body.appendChild(chips);
      body.appendChild(hint);
      body.appendChild(h('div.qa-foot', last, keep));
    }, onClose: function () {
      draft = !sent && input.value.trim() ? { text: input.value, man: JSON.parse(JSON.stringify(man)), ignore: ignore.slice(), preset: preset, at: Date.now() } : null;
    } });
    if (draft) { input.value = draft.text; man = draft.man; ignore = draft.ignore; }
    draft = null;

    /* 저녁에 '밤 12시 · 새벽 2시'처럼 날짜 없이 이미 지난 새벽 시각을 적으면 내일로 — 오늘 00:00(지난 시각 · 알림 안 울림)이 되지 않게 (6호 9번).
       캘린더에서 고른 날(soft 아님)이나 글에 날짜가 있으면 건드리지 않음 */
    function nextDay() {
      if (!parsed || !parsed.time || parsed.date || parsed.due || parsed.repeat || man.time !== undefined) return false;
      if (preset.date && (!preset.soft || preset.date !== U.today())) return false;
      var n = new Date(U.now()), now = U.hm(n.getHours(), n.getMinutes());
      return parsed.time < '06:00' && parsed.time <= now;
    }

    /* 저녁에 '8시 영화'처럼 오전 · 오후 없이 7~11시를 적었는데 오늘 그 시각(오전)이 이미 지났으면 오후로 — 지난 시각으로 잡혀 알림이 안 울리던 것 (점검원 10호 2번).
       날짜가 오늘(또는 날짜 없음)일 때만 · 칩에 '오후 8:00'으로 보여 바로 고칠 수 있음 */
    function pmTime() {
      if (!parsed || !parsed.time || !parsed.ampmGuess || man.time !== undefined) return null;
      if (man.repeat !== undefined ? man.repeat : parsed.repeat) return null;   /* 반복은 다음 회차가 내일 · 다음 주라 '지난 시각' 걱정이 없음 — 밤에 '매일 7시 기상'이 오후 7시가 되던 것 (새 눈 9호 · nextDay와 같은 규칙) */
      var day0 = parsed.date || preset.date || null;
      if (day0 && day0 !== U.today()) return null;
      var n = new Date(U.now()), now = U.hm(n.getHours(), n.getMinutes()), hh = +parsed.time.slice(0, 2);
      return parsed.time <= now && hh + 12 <= 23 ? U.hm(hh + 12, +parsed.time.slice(3)) : null;
    }
    function val(k) {
      if (man[k] !== undefined) return man[k];
      if (k === 'time' && pmTime()) return pmTime();
      if (parsed && parsed[k] != null && parsed[k] !== 0) return parsed[k];
      /* 글에 '금요일까지'가 있으면 오늘 화면이 미리 채운 '오늘'은 쓰지 않는다 — 날짜(오늘)가 잡히면 내일부터 '지난 일'로 가 버림 (1호 8번 재확인).
         캘린더에서 사용자가 직접 고른 날(soft 아님)은 남긴다 */
      if (k === 'date' && preset.soft && parsed && parsed.due && !parsed.repeat) return null;
      if (k === 'date' && nextDay()) return U.addDays(U.today(), 1);
      return preset[k] != null ? preset[k] : (k === 'priority' ? 0 : null);
    }

    /* 칩 한 줄: 넣은 것(직접 고름 · 글에서 알아들음)이 앞, 빈 것이 뒤.
       글에서 알아들은 칩 · 미리 채운 칩(오늘 화면의 '오늘' · 캘린더의 그날)에는 ×가 붙어 한 번에 뺄 수 있다 */
    /* 칩 하나 끄기 — 값(또는 글에서 알아들은 낱말)을 기억해 두고 비운다 */
    function off(key) {
      var v = val(key);
      if (!v) return;
      var tok = man[key] === undefined && parsed.tokens.filter(function (tk) { return tk.type === (key === 'listId' ? 'list' : key); })[0];
      mem[key] = { v: v, ig: tok ? tok.text.toLowerCase() : null, text: tok ? tok.text : null };
      if (tok) ignore.push(tok.text.toLowerCase()); else man[key] = key === 'priority' ? 0 : null;
    }
    /* 끈 칩 되살리기 — 글에서 빼 둔 낱말이면 글 앞에 다시 넣는다 */
    function restore(key) {
      var m = mem[key]; if (!m) return; delete mem[key];
      if (m.cut) { input.value = (m.cut + ' ' + input.value).trim(); ignore = ignore.filter(function (s) { return s !== m.ig; }); delete man[key]; }
      else if (m.ig) { ignore = ignore.filter(function (s) { return s !== m.ig; }); delete man[key]; }
      else if (m.v == null) delete man[key];   /* 기억한 값이 비어 있으면(언제까지만 있던 날짜 칩) 손 값을 지워 글 속 날짜를 다시 알아듣게 (날짜 범위 검토 5) */
      else man[key] = m.v;
      if (key === 'date' && m.linkTime) restore('time');   /* 날짜를 다시 켜면 같이 꺼졌던 시간도 (7호 재확인) */
      if (key === 'date' && m.linkDue) restore('due');
    }

    var opener = {};   /* 칩 열쇠 → 고르기 창 여는 함수 (다시 켤 때 이어서 열기) */
    function chip(key, tokType, icon, label, value, onClick) {
      var tok = man[key] === undefined && parsed.tokens.filter(function (tk) { return tk.type === tokType; })[0];
      var lead = key === 'listId' && value ? App.listMark(T.list(S.data, val('listId'))) : h('span', { html: ic(icon, 16) });  /* 목록은 화면 어디서나 같은 표시(색 점 · 이모지) */
      /* 켜진 칩은 모두 ×로 끌 수 있고, 끈 칩을 다시 누르면 방금 값이 그대로 돌아온다(이 할 일을 쓰는 동안) — 사용자 10-31 '모든 항목마다 x · 다시 켜면 전에 넣은 값 유지' */
      var x = value ? h('span.x', { role: 'button', 'aria-label': tok ? t('qa.ignore', { text: tok.text }) : t('detail.clear', { what: label.toLowerCase() }), html: ic('x', 14), onclick: function (e) {
          e.stopPropagation();
          var dueToo = key === 'date' && !val('repeat') && val('due');   /* 날짜 칩이 기간(~까지)까지 보이므로 ×는 둘 다 끔 · 다시 켜면 둘 다 */
          off(key);
          if (dueToo) { off('due'); (mem.date || (mem.date = { v: null })).linkDue = true; }
          /* 날짜를 빼면 시간도 같이 — 시간만 남으면 저장할 때 '오늘'이 다시 붙어, 칩에 보인 것과 다르게 저장됨 (7호 2번 · 날짜 창 '날짜 빼기'와 같은 규칙).
             시간을 글로 적었으면('3시') 그 낱말은 글에서 잠시 빼 둔다 — 이름에 '3시'가 섞여 저장되지 않게 (7호 재확인 새 1) */
          if (key === 'date' && val('time')) {
            off('time'); (mem.date || (mem.date = { v: null })).linkTime = true;
            var mt = mem.time;
            if (mt && mt.text && input.value.indexOf(mt.text) >= 0) { mt.cut = mt.text; input.value = input.value.replace(mt.text, '').replace(/\s{2,}/g, ' ').trim(); }
          }
          draw(); refocus();
        } }) : null;
      var click = onClick;
      if (!value && mem[key]) click = function () {   /* 다시 켜기 = 기억해 둔 값으로 되살리고, 고르기 창도 그 값으로 바로 열어 바꿀 수 있게 (7호 6번) */
        restore(key);
        draw();
        if (opener[key]) opener[key](); else refocus();
      };
      opener[key] = onClick;
      var el = h('button.chip' + (tok ? '.is-parsed' : value ? (key === 'priority' ? '.is-flag' : '.is-on') : '')   /* 켠 '중요' 칩은 화면 어디서나 같은 빨간 깃발 색 */ + (!value && mem[key] ? '.is-mem' : ''), { type: 'button', onclick: click }, lead, h('span.chip-t', value || label), x);
      el._set = !!value;
      return el;
    }

    /* '모레' · '금요일'처럼 말로 된 날은 날짜를 덧붙여 맞게 잡혔는지 보이게 ("다음 주 월요일" → "모레 · 11월 2일") */
    function dayLabel(s) {
      var r = I.relDay(s), n = U.diffDays(U.today(), s);
      return (r === I.dateShort(s) || (n >= -1 && n <= 1)) ? r : r + ' · ' + I.dateNoWeek(s);  /* 오늘 · 내일 · 어제는 그대로 */
    }

    /* 날짜 칩 글: 하루 '내일' · 기간 '11월 3일~7일' · 언제까지만 '금요일까지' */
    function dateChip(date, due) {
      if (date && due && due > date) {
        var a = U.parse(date), b = U.parse(due), same = a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
        return t('pick.rangeChip', { from: I.dateNoWeek(date), to: same ? t('pick.dayOnly', { d: b.getDate() }) : I.dateNoWeek(due) });
      }
      if (date) return dayLabel(date);
      return due ? t('due.untilShort', { date: I.relDayIn(due) }) : null;
    }

    function draw() {
      parsed = App.parse.run(input.value, S.data.lists.filter(T.alive), ignore);
      send.disabled = !(parsed.title || input.value.trim());
      tip.hidden = !!input.value.trim();

      var date = val('date'), time = val('time'), rep = val('repeat'), list = val('listId'), prio = val('priority'), due = val('due');
      var alertOn = !!(time && man.alerts && man.alerts.length);
      var l = list && T.list(S.data, list);
      var all = [
        /* 날짜 칩 하나로 하루 또는 기간(반복이 아닐 때) — 하루 누르고 다른 날 누르면 거기까지 (사용자 11-01 '언제까지를 따로 누르는 게 불편 · 알약 모양') */
        chip('date', 'date', 'calendar', t('prop.date'), rep ? (date ? t('qa.from', { date: I.dateShort(date) }) : null) : dateChip(date, due), function () {
          if (rep) { P.date({ value: date, onPick: function (v) { man.date = v; if (!v) man.time = null; draw(); refocus(); } }); return; }
          P.date({ range: true, value: date, end: due, onPick: function (a, b) { man.date = a; man.due = b; if (!a) { man.time = null; man.due = null; } draw(); refocus(); } });
        }),
        /* 시간 칩 → 고르기 창 아래 '이 시간에 알림'(기본 꺼짐) — 켜면 칩 아이콘이 종으로 */
        chip('time', 'time', alertOn ? 'bell' : 'clock', t('prop.time'), time ? I.time(time) : null, function () { P.time({ value: time, alert: alertOn, onPick: function (v, on) { man.time = v; man.alerts = v && on ? [{ before: 0 }] : []; draw(); refocus(); } }); }),
        chip('repeat', 'repeat', 'repeat', t('prop.repeat'), rep ? App.repeat.describe(rep, date || U.today()) : null, function () { P.repeat({ value: rep, anchor: date || U.today(), onPick: function (v) { man.repeat = v; draw(); refocus(); }, onClose: refocus }); }),
        chip('listId', 'list', 'folder', t('prop.list'), l ? l.name : null, function () { P.list({ value: list, onPick: function (v) { man.listId = v; draw(); refocus(); } }); }),
        /* 반복과 같이 적은 '까지'는 반복 끝나는 날 — 칩 이름도 그렇게 (6호 재확인 1번) */
        /* 값이 있어도 반복이면 '반복 · 11월 10일까지'로 — 그날 반복이 끝난다는 게 보이게 (6호 재확인 2차) */
        /* '언제까지'는 값이 있거나 반복일 때만 칩으로 — 빈 칩 다섯 개가 첫인상을 '설정 많음'으로 만들던 것 · 글로 '금요일까지'라고 쓰면 그대로 잡힘 (선택지 점검원 6번) */
        /* 반복일 때만 따로: '반복 끝나는 날'(반복이 아니면 날짜 칩 하나가 기간까지 맡음) */
        rep && chip('due', 'due', 'target', t('prop.repeatUntil'), due ? t('prop.repeat') + ' · ' + t('due.untilShort', { date: I.relDayIn(due) }) : null, function () { P.date({ title: t('prop.repeatUntil'), value: due, onPick: function (v) { man.due = v; draw(); refocus(); } }); })
      ];
      flagBtn.classList.toggle('is-on', !!prio); flagBtn.setAttribute('aria-pressed', prio ? 'true' : 'false');
      App.dom.clear(chips);
      all = all.filter(Boolean);   /* 안 보이는 칩(빈 '언제까지')은 빼고 */
      all.filter(function (c) { return c._set; }).concat(all.filter(function (c) { return !c._set; })).forEach(function (c) { chips.appendChild(c); });

      /* 새벽 확인 한 줄: 새벽에 '내일'이라 적으면 몇 일로 잡히는지 알려 준다 */
      var hr = new Date(U.now()).getHours();   /* 앱 시계(U.now)로 — 다른 곳과 같게 */
      if (hr < 4 && parsed.dateKind === 'rel' && (parsed.date || parsed.due)) {
        hint.hidden = false; hint.textContent = t('qa.nightHint', { date: I.dateShort(parsed.date || parsed.due) });
      } else if (man.date === undefined && nextDay()) {
        hint.hidden = false; hint.textContent = t('qa.nextDayHint', { date: I.dateShort(U.addDays(U.today(), 1)) });
      } else hint.hidden = true;
    }

    /* 위에 다른 창(반복 고르기의 요일 줄처럼 열린 채 값을 넘기는 창)이 떠 있으면 입력 칸으로 가지 않는다 — 키보드가 그 창을 덮지 않게 (7호 1번) */
    function keepOpen() { return !!S.data.settings.qaKeep; }   /* '이어서 쓰기'를 켠 사람만 창이 열린 채 다음 줄 */
    function refocus() { if (!sheet.closed && App.sheet.count <= 1) try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); } }

    function submit() {
      draw();
      var title = parsed.title || input.value.trim();
      if (!title) { refocus(); return; }
      var f = { title: title, date: val('date'), time: val('time'), repeat: val('repeat'), listId: val('listId'), priority: val('priority') || 0, due: val('due'),
        alerts: val('time') && man.alerts ? man.alerts.slice() : [] };
      var task = S.commit(function (d) { return T.add(d, f); }, { undo: true });   /* 하나 넣기도 되돌리기 가능 — 여러 줄 붙여 넣기와 같게 (점검원 9호 9번) */
      var off = task.alerts.length && App.ensureNotify({ quiet: true }) === 'denied';
      App.platform.haptic.tap();
      var bits = [task.title];
      if (task.date) bits.push(I.relDay(task.date) + (task.time ? ' ' + I.time(task.time) : ''));
      var tl = task.listId && task.listId !== preset.listId && T.list(S.data, task.listId);
      if (tl) bits.push(tl.name);   /* 다른 목록에 들어갔으면 어디인지 — 지금 화면에 안 보여도 '잘 들어갔다'를 알게 */
      if (off) bits.push(t('notify.status.denied'));   /* 알림을 꺼 뒀으면 같은 띠에 — 다음 띠가 덮어 못 보던 것 (4호 재확인) */
      /* 하나 넣으면 창을 닫는다 — 넣은 뒤 눈은 '잘 들어갔나' 목록으로 가는데 창이 가리던 것 (사용자 10-31).
         띠의 '하나 더'로 같은 미리 채움(오늘 · 고른 날 · 그 목록)으로 바로 다시 열고, 새로 넣은 줄은 잠깐 은은하게 빛나 눈이 찾게 한다 */
      if (!keepOpen()) {
        sent = true; sheet.close();
        App.toast.show(task.untilDropped ? t('qa.untilDropped') : t('qa.added', { what: bits.join(' · ') }), { action: t('qa.more'), onAction: function () { open(preset); }, action2: t('common.undo'), onAction2: S.undo });
        App.row.flash(task.id);
        return;
      }
      /* 이어서 쓰기 켬: 창은 열린 채, 고른 칩(날짜 · 목록 · 중요 등)은 그대로 — '그 세팅으로' 계속 (사용자 10-31). 글에서 알아들은 것만 비움 */
      /* 이어서 쓰기 켬: 창 아래 한 줄 + '되돌리기' — 띠가 없어 방금 넣은 걸 되돌릴 곳이 없던 것 (점검원 9호 재확인) */
      last.hidden = false; App.dom.clear(last);
      last.appendChild(document.createTextNode(task.untilDropped ? t('qa.untilDropped') : t('qa.added', { what: bits.join(' · ') }) + ' '));
      last.appendChild(h('button.text-btn.sm', { type: 'button', onmousedown: function (e) { e.preventDefault(); }, onclick: function () { S.undo(); last.hidden = true; refocus(); } }, t('common.undo')));
      input.value = ''; ignore = []; mem = {};
      draw(); refocus();
    }

    input.addEventListener('input', draw);
    /* 여러 줄을 붙여 넣으면 줄마다 할 일 하나 (메모장 목록을 한 번에 옮기기 · Todoist 사례) */
    input.addEventListener('paste', function (e) {
      var text = (e.clipboardData || window.clipboardData || { getData: function () { return ''; } }).getData('text');
      var lines = String(text || '').split(/\r?\n/).map(function (s) { return s.replace(/^\s*([-*•·]|\d+[.)])\s*/, '').trim(); }).filter(Boolean);
      if (lines.length < 2) return;
      e.preventDefault();
      var lists = S.data.lists.filter(T.alive);
      var base = App.util.now(), dropped = false;
      S.commit(function (d) {
        lines.forEach(function (line, i) {
          var p = App.parse.run(line, lists, []);
          /* 칩으로 고른 목록 · 중요는 줄마다 같이 (한 줄 넣기와 같은 규칙 · 일관성 점검원) */
          /* order: 붙여 넣은 차례 그대로 위 → 아래 (큰 값이 위 · 같은 1ms 안이라 값이 같아지지 않게 조금씩 작게) */
          var made = T.add(d, { order: base - i * 0.01, title: p.title || line, date: p.date || (preset.soft && p.due && !p.repeat ? null : preset.date) || null, time: p.time, repeat: p.repeat, listId: p.listId || val('listId') || null, due: p.due, priority: val('priority') || 0 }); if (made.untilDropped) dropped = true;
        });
      }, { undo: true });
      App.toast.show(t('qa.pastedN', { n: lines.length }) + (dropped ? ' · ' + t('qa.untilDropped') : ''), { action: t('common.undo'), onAction: S.undo });   /* 끝나는 날이 빠진 줄이 있으면 같이 알림 */
      if (!keepOpen()) { sent = true; sheet.close(); return; }   /* 한 줄 넣기와 같이 닫힘(이어서 쓰기면 열린 채) */
      last.hidden = false; last.textContent = t('qa.pastedN', { n: lines.length });
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); } });
    send.addEventListener('click', submit);
    send.addEventListener('pointerdown', function (e) { e.preventDefault(); });  /* 눌러도 입력 칸 포커스 유지 → 키보드가 내려갔다 올라오지 않음 */
    send.addEventListener('mousedown', function (e) { e.preventDefault(); });
    draw();
  }

  return { open: open };
})();

</script>
<script>
/* 설정 — 끝낸 일 보이기 · 테마 · 한 주 시작 · 진동 · 알림 상태 · 옮기기(백업) · 정보. 처음엔 열 필요가 없게 기본값을 잡아 둔다. */

    }

      h('button.prop', { type: 'button', onclick: function () {
        var name = 'todo-backup-' + App.util.today() + '.json';

          if (ok !== true) return;   /* 성공이 확실할 때만 적음 — 안드로이드는 아직 결과를 안 돌려줘서 적지 않음(거짓 안심 방지 · 4호 재확인 · 나중에 붙일 것) */
          S.commit(function (d) { d.settings.lastExport = App.util.today(); }, { keepUndo: true, carry: true });
        });
      } }, h('span.prop-icon', { html: ic('share', 20) }),
        /* 마지막으로 내보낸 날을 조용히 한 줄 — 기기만 바꾸면 기록이 통째로 사라질 수 있어서 (4호 9번 · 재촉 알림은 없음) */
        h('span.prop-label', t('backup.export'), S.data.settings.lastExport ? h('span.prop-sub', t('backup.last', { date: I.dateNoWeek(S.data.settings.lastExport) })) : null),

          App.pickers.confirm({ title: t('backup.confirmTitle'), text: t('backup.confirmText', { n: d.tasks.filter(function (x) { return !x.deletedAt; }).length }), ok: t('backup.replace'), onOk: function () {
            if (!S.replaceAll(d)) return;   /* 못 바꿨으면(저장소 꽉 참) '불러왔어요' · 되돌리기를 보이지 않음 */

        h('span.prop-chev', { html: ic('chevR', 18) })) : null,
      /* 7일 지키는 중에 두 번 바꿨으면 그 사이 기록은 남긴 기록 칸에만 있음 — 여기서도 고를 수 있게 (6호 2번 · 시험 상태면 시험판 화면에 있음) */
      keptRow()
    /* 아이폰 사파리 탭에서 쓰는 중이면 '오래 안 열면 지워질 수 있음'도 — 설치 안내 띠를 닫아도 여기 남음 (5호 3번) */
    ], App.platform.info.isIOS && !App.platform.info.standalone ? t('backup.note') + ' ' + t('backup.safari') : App.platform.info.macSafari ? t('backup.note') + ' ' + t('backup.safariMac') : t('backup.note'));
  }

  var GROUPS = ['look', 'notify', 'records', 'trial'];

  /* 주 색 — 견본 동그라미 4개 + 작은 예시(안 한 줄 · 끝낸 줄 · '오늘' · + 단추). 누르면 앱 전체가 0.3초 스르르 바뀜(화면 색과 같은 방식).
     사용자 10-31 22:4x "귤색 말고 겹치지 않는 선택지 몇 개 · 바꾸면 어떻게 보이는지 간단한 예시와 함께 · 미친 듯이 방대하게는 아니고".
     자유 색 고르기(색상환)는 넣지 않음 — 대비가 깨지고 찝찝한 색이 나옴 (주 색 조수 F) */
  function accentBlock(st) {

<script>
