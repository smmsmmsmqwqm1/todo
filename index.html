    var next = s + '/' + accent;
    if (themeNow && themeNow !== next) {
      root.classList.add('theme-anim'); clearTimeout(themeTimer);
      themeTimer = setTimeout(function () { root.classList.remove('theme-anim'); }, 420);
    }
    themeNow = next;
    root.setAttribute('data-theme', s);
    root.style.background = THEME_BG[s];   /* 맨 바깥 바탕도 지금 화면 색으로 — 켤 때 색만 남아 화면 끝을 넘겨 끌면 밝은 바탕이 비치던 것 (사용자 10-31 폰 캡처) */
    if (accent === 'tangerine') root.removeAttribute('data-accent'); else root.setAttribute('data-accent', accent);
    root.removeAttribute('data-fill');   /* 옛 '채우는 색'은 뺌(10-31) */
    App.applyScale(S.data.settings.textSize);
    /* 다음에 켤 때 첫 그림부터 이 색 · 크기 · 주 색으로 — index.html 머리의 짧은 스크립트가 읽는다(어두운 테마인데 밝게 번쩍이지 않게) */
    try { localStorage.setItem('todo02:look', s + '|' + App.model.scale(S.data.settings.textSize) + '|' + accent); } catch (e) {}
    App.platform.setBars(THEME_BG[s], dark);
  }
  if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);

  /* ── 업데이트 뒤 처음 열 때 한 번만 '새 판' 안내 (재료 '첫 실행 · 시작 화면' 1절) ──
     바뀐 것 3~4줄 + 마지막 줄 '할 일 기록은 그대로예요', [확인] 한 번. 처음 깐 사람에게는 띄우지 않는다(이번 판을 이미 본 것으로).
     새 판을 낼 때: NEWS_ID를 올리고 lang의 news.lines를 그 판의 말로 바꾼다 */
  var NEWS_ID = '2026-11-03';   /* 11-01 새벽 판: 기간 · 알림 · 세 단 캘린더 · 적던 글 남김 */
  function whatsNew() {
    var st = S.data.settings;
    if (!st.onboarded) { if (st.seenNews !== NEWS_ID) S.commit(function (d) { d.settings.seenNews = NEWS_ID; }, { keepUndo: true, carry: true }); return; }
    if (st.seenNews === NEWS_ID) return;
    var lines = t('news.lines').split('|');
    var s = App.sheet.open({ title: t('news.title'), onClose: seen, content: function (body) {
      body.appendChild(h('ul.news-list', lines.map(function (x) { return h('li', x); })));
      body.appendChild(h('p.news-keep', t('news.keep')));
      body.appendChild(h('button.btn.primary.block.mt', { type: 'button', onclick: function () { s.close(); } }, t('common.ok')));
    } });
    function seen() { S.commit(function (d) { d.settings.seenNews = NEWS_ID; }, { keepUndo: true, carry: true }); }
  }

  /* ── 알림 권한: 시간을 처음 넣는 그 순간(손가락으로 누른 때)에만 묻는다 ── */
  var hinted = false, askedExact = false;
  /* 꺼 둔(허용 안 함) 사람이 알림을 맞추면 그 자리에서 '울리지 않아요' — 맞춰 놓고 끝내 못 받는 일이 없게 (새 눈 4호 1번) */
  function deniedToast() {
    var N = App.platform.notify;
    App.toast.show(t(N.openSettings ? 'notify.deniedToast' : 'notify.deniedToastWeb'), N.openSettings ? { duration: 6000, action: t('notify.openSettings'), onAction: function () { N.openSettings(); } } : { duration: 6000 });
  }
  /* o.quiet = 꺼짐 띠를 띄우지 않고 상태만 돌려줌(빠른 추가는 '추가했어요' 띠에 붙여 말함 — 띠가 띠를 덮어 못 보던 것 · 4호 재확인) */
  App.ensureNotify = function (o) {
    var N = App.platform.notify, s = N.status();
    /* 막 물은 권한 창에서 허용하지 않으면 그 자리에서 말함 (안드로이드 13+는 처음 거절 뒤에도 '아직 안 물음'으로 남음 · 4호 재확인) */
    if (s === 'default') { N.request().then(function (r) { S.flush(); App.render(); if (r !== 'granted' && N.status() !== 'granted') deniedToast(); }); return s; }
    if (s === 'denied') { if (!(o && o.quiet)) deniedToast(); return s; }
    if (s === 'needs-install' && !hinted && !S.data.settings.installHintShown) {   /* 한 번만 (껐다 켜도 다시 안 뜸 · 점검원 1호 29번) */
      hinted = true; S.commit(function (d) { d.settings.installHintShown = true; }, { keepUndo: true, carry: true });
      App.toast.show(t('notify.needsInstallToast'), { duration: 4500 }); return s;
    }
    if (App.platform.name === 'android' && s === 'granted' && N.exactOk && !N.exactOk() && !askedExact) {
      askedExact = true;
      App.pickers.confirm({ title: t('notify.exactTitle'), text: t('notify.exactText'), ok: t('notify.openSettings'), cancel: t('common.later'), onOk: function () { N.openExact(); } });
    }
    return s;
  };

  /* 알림을 눌러 앱을 열었을 때 (안드로이드) */
  App.openTask = function (id, key) { if (T.find(S.data, id)) App.detail.open(id, key); };

  /* ── 시작 ── */
  App.bus.on('storage-error', function () { App.toast.show(t('error.storage'), { duration: 5000 }); });   /* 켤 때 나는 저장 실패도 알리도록 load보다 먼저 (11-01 점검) */
  try {
    S.load();
    I.setLang(S.data.settings.lang);
    applyTheme();
    if (S.rescued) setTimeout(function () { App.toast.show(t('rescue.toast'), { duration: 8000 }); }, 600);
    /* 같은 브라우저의 다른 탭이 저장하면 이 탭도 새 글로 (낡은 데이터로 덮지 않게 · 웹만) */
    window.addEventListener('storage', function (e) { if (e.key === 'todo02:data' && e.newValue) S.external(e.newValue); });
    route = useHistory ? fromHash() : { name: 'today', arg: null };
    if (useHistory) try { history.replaceState(route, '', hashOf(route)); } catch (e) {}
    /* 처음 켜면 첫 실행 화면을 처음부터 덮은 채로 그린다 — 빈 오늘 화면이 한순간 비치지 않게 (첫 실행 설계 10-31) */
    if (!S.data.settings.onboarded) App.onboarding.open({ instant: true });
    App.render(true);
    if (S.afterStart()) App.render.now();   /* 알림의 '끝냄' 쪽지는 시작이 무사히 끝난 뒤에 반영(비상 화면이면 쪽지를 남겨 둠 · 새 눈 8호 6번) · 반영했으면 첫 화면도 바로 '끝냄'으로 */
    whatsNew();
    if (window.__openTask) { App.openTask(window.__openTask.id, window.__openTask.key); window.__openTask = null; }
  } catch (err) {
    /* 시작 그리기가 터지면 빈 화면 대신 '할 일은 그대로 · 파일로 내보내기' 한 장 — 저장된 글을 그대로 내보냄(고치지 않음) (새 눈 5호 재확인) */
    console.error(err);
    /* ★ 저장을 잠그고 이 아래(다시 그리기 · 돌아옴 · 자정 · 내릴 때 저장)를 아예 걸지 않는다 — 읽다 터진 빈 데이터가 저장된 할 일을 덮지 않게 (5호 2차 재확인) */
    S.lock(); App.render = function () {}; App.render.now = function () {};
    App.openTask = function () {};   /* 알림으로 연 할 일도 비상 화면 위에 열지 않음 (8호 6번) */
    App.quickadd.open = function () {};   /* 비상 화면에서는 빠른 추가(N 키 · + 단추)도 열지 않음 — 적어도 저장되지 않으므로 */
    try { if (App.onboarding.isOpen) App.onboarding.close(); } catch (e) {}   /* 첫 실행 안내가 비상 화면을 덮지 않게 */
    [tabbar, sidebar, fab].forEach(function (el) { if (el) el.hidden = true; });
    App.dom.clear(main);
    var cantRead = /unreadable/.test(String(err && err.message));   /* 저장 파일을 못 읽은 경우 — 내보낼 글이 없으니 단추 대신 '다시 켜 보세요 · 지우지 않았어요' (7호 2차 재확인) */
    main.appendChild(h('div.day-empty', { style: { margin: '24px 16px' } }, h('p', t(cantRead ? 'error.startNoExport' : 'error.start')),
      cantRead ? null : h('button.btn.primary.mt', { type: 'button', onclick: function () { var raw = null; try { raw = App.platform.storage.load(); } catch (e) { raw = null; } if (raw) App.platform.files.exportFile('todo-backup-' + U.today() + '.json', raw); else App.toast.show(t('error.startNoExport')); } }, t('error.startExport'))));
    return;
  }

  App.bus.on('change', function (o) {
    if (I.setLang(S.data.settings.lang)) { tabbar.setAttribute('aria-label', t('nav.menu')); sidebar.setAttribute('aria-label', t('nav.menu')); fab.setAttribute('aria-label', t('qa.addTask')); }   /* 언어를 바꾸면 다음 그림부터 그 언어로 */
    /* 화면 색 · 주 색이 바뀌면: 먼저 새 내용을 옛 색으로 그린 뒤 다음 프레임에 색을 바꿔, 내용과 바탕이 함께 0.3초 스르르 (내용은 뚝 · 바탕만 스르르이던 것 · 모션 점검원) */
    if (themeNow && themeNow !== lookKey() && !(o && o.reset)) { App.render.now(); requestAnimationFrame(applyTheme); setTimeout(applyTheme, 150); }   /* 다음 프레임이 늦게 와도(화면이 바쁠 때) 0.15초 안에는 반드시 바뀜 — 두 번째는 같은 값이라 아무 일 없음 */
    else { applyTheme(); App.render(); }
    if (o && o.reset) { route = { name: 'today', arg: null }; stack = []; App.sheet.closeAll(); App.onboarding.open(); }
    else if (App.onboarding.isOpen && S.data.settings.onboarded) App.onboarding.close();  /* 초기화를 되돌렸을 때 */
  });
  /* 앱을 보는 중에 온 알림(아이폰 웹앱) — '열기'로 바로 그 할 일로, 10초 (4호 8번) */
  App.bus.on('reminder', function (r) { if (!document.hidden) App.toast.show(t('notif.inApp', { title: r.title }), { duration: 10000, action: r.taskId ? t('notif.open') : null, onAction: function () { App.openTask(r.taskId, r.key); } }); });
  App.bus.on('undo-expired', function () { App.toast.hide(); });

  /* 앱이 뒤로 갈 때 저장 · 돌아오면 위젯/알림 쪽지 반영 + 날짜가 바뀌었으면 다시 그림 */
  /* 앱이 뒤로 갈 때: 쓰고 있던 칸을 먼저 저장(blur) → 저장 (점검원 1호 3번) */
  function saveNow() { var a = document.activeElement; if (a && /INPUT|TEXTAREA/.test(a.tagName)) a.blur(); S.flush(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) { saveNow(); App.row.release(); App.render(); } });   /* 앱을 다시 열면 체크해 둔 줄은 정리된 자리에 */
  window.addEventListener('pagehide', saveNow);
  window.onPauseApp = saveNow;
  document.documentElement.lang = I.lang;   /* 화면 읽기 프로그램이 기기 언어로 읽게 */
  tabbar.setAttribute('aria-label', t('nav.menu')); sidebar.setAttribute('aria-label', t('nav.menu')); fab.setAttribute('aria-label', t('qa.addTask'));
  var day = U.today();
  function newDay() { if (day !== U.today()) { App.screens.calendar.dayChanged(day); day = U.today(); } }
  App.platform.onResume(function () { S.resume(); newDay(); App.render(); });
  (function midnight() {
    var n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
    setTimeout(function () { newDay(); S.resume(); App.render(); midnight(); }, next - n);
  })();
  var sizeRender = U.debounce(function () { App.render(); }, 150);
  window.addEventListener('resize', function () { if (App.viewport.check()) sizeRender(); });   /* 키보드가 뜨고 질 때는 다시 그리지 않음(위 App.viewport) — 기준은 이벤트마다 바로 갱신 */

  /* 아래로 넘기는 동안 + 단추를 살짝 숨겨 줄 끝을 가리지 않게, 위로 올리면 다시 */
  var lastY = 0;
  window.addEventListener('scroll', function () {
    var y = window.scrollY, down = y > lastY + 4, up = y < lastY - 4;
    if (down && y > 80) fab.classList.add('is-tucked'); else if (up || y < 80) fab.classList.remove('is-tucked');
    if (down || up) lastY = y;
  }, { passive: true });
})();

</script>
</body>
